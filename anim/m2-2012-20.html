<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·20 拆块放缩证明不等式</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改 AW.init 区域（STEPS 与 result） -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：拆块',
    cls: 'key',
    body: '<p>要证：$$x\\ln\\frac{1+x}{1-x}+\\cos x\\ge 1+\\frac{x^2}{2}\\qquad(-1<x<1).$$左边两块性质迥异：对数块与三角块。若整块构造辅助函数求导，一阶导数会同时含 $\\dfrac{2x}{1-x^2}$ 与 $\\sin x$，符号难统一。<b>拆块放缩</b>：各自用标准不等式，再相加。</p>' },
  { title: '引理一：余弦放缩',
    cls: 'good',
    body: '<p>令 $h(x)=\\cos x-1+\\dfrac{x^2}{2}$，则 $h\'(x)=x-\\sin x\\ge 0$（$x\\ge0$，因 $\\sin x\\le x$），且 $h$ 为偶函数、$h(0)=0$。故 $h(x)\\ge0$ 对一切实数成立：$$\\cos x\\ge 1-\\frac{x^2}{2}.$$</p>' },
  { title: '引理二：对数放缩（先取 $x\\ge0$）',
    cls: 'good',
    body: '<p>令 $\\varphi(x)=\\ln\\dfrac{1+x}{1-x}-2x$：$$\\varphi\'(x)=\\frac{1}{1+x}+\\frac{1}{1-x}-2=\\frac{2}{1-x^2}-2=\\frac{2x^2}{1-x^2}\\ge0,\\quad \\varphi(0)=0.$$故 $\\ln\\dfrac{1+x}{1-x}\\ge 2x$；两边乘<b>非负</b>的 $x$：$$x\\ln\\frac{1+x}{1-x}\\ge 2x^2\\qquad(0\\le x<1).$$</p>' },
  { title: '偶性补刀：延拓到 $x<0$',
    cls: 'good',
    body: '<p>$x$ 与 $\\ln\\dfrac{1+x}{1-x}$ 都是奇函数，乘积 $x\\ln\\dfrac{1+x}{1-x}$ 是偶函数；$2x^2$ 也是偶函数。于是引理二自动延拓：对一切 $-1<x<1$ 都有 $$x\\ln\\frac{1+x}{1-x}\\ge 2x^2.$$</p>' },
  { title: '相加收尾',
    cls: 'good',
    body: '<p>两式相加：$$x\\ln\\frac{1+x}{1-x}+\\cos x\\ge 2x^2+\\Big(1-\\frac{x^2}{2}\\Big)=1+\\frac{3x^2}{2}\\ge 1+\\frac{x^2}{2},$$末步因 $\\dfrac{3x^2}{2}\\ge\\dfrac{x^2}{2}$。两处放缩的等号都要求 $x=0$，此时左右两边同为 $1$。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>证毕：对一切 $-1<x<1$，$$x\\ln\\frac{1+x}{1-x}+\\cos x\\ge 1+\\frac{x^2}{2},$$等号当且仅当 $x=0$。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '证明 $x\\ln\\dfrac{1+x}{1-x}+\\cos x\\ge 1+\\dfrac{x^2}{2}$',
  subtitle: '考点：不等式证明 · 拆块放缩 · 偶性延拓',
  intro: '点击「▶ 播放」逐步展开推理链。',
  /* 引擎默认 render 已包含：safeHtml 防 (-1<x<1) 类裸 < 吞内容 + 舞台 KaTeX 渲染，
   * 此处不再自定义 render（自定义会绕过引擎的转义注入）。 */
  snaps: snaps,
  result: {
    big: '不等式成立，等号仅 $x=0$',
    html: '记忆锚点：<b>拆块——对数块放到 $2x^2$（引理二），余弦块放到 $1-\\dfrac{x^2}{2}$（引理一），相加得 $1+\\dfrac{3x^2}{2}$ 仍绰绰有余</b>。负半轴靠偶函数性质补上，别只证一半。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
