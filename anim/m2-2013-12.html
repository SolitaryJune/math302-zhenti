<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：参数方程求法线（2013 年第 12 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '框架与化简',
    body: '<p>参数曲线 $x=\\arctan t$，$y=\\ln\\sqrt{1+t^2}$。切线斜率 $\\frac{\\mathrm dy}{\\mathrm dx}=\\frac{\\mathrm dy/\\mathrm dt}{\\mathrm dx/\\mathrm dt}$，法线斜率取负倒数。先把 $y$ 化简：</p>' +
          '<p>$$y=\\frac12\\ln(1+t^2).$$</p>' },
  { cls: '', title: '分别求导',
    body: '<p>$$\\frac{\\mathrm dx}{\\mathrm dt}=\\frac1{1+t^2},\\qquad\\frac{\\mathrm dy}{\\mathrm dt}=\\frac12\\cdot\\frac{2t}{1+t^2}=\\frac t{1+t^2}.$$</p>' },
  { cls: 'key', title: '相除得切线斜率',
    body: '<p>$$\\frac{\\mathrm dy}{\\mathrm dx}=\\frac{t/(1+t^2)}{1/(1+t^2)}=t.$$</p>' +
          '<p>$1+t^2$ 约得干干净净，斜率就是 $t$。</p>' },
  { cls: '', title: 't=1 的点与斜率',
    body: '<p>点：$x_0=\\arctan1=\\dfrac\\pi4$，$y_0=\\dfrac12\\ln2=\\ln\\sqrt2$。切线斜率 $k=1$，法线斜率</p>' +
          '<p>$$-\\frac1k=-1.$$</p>' },
  { cls: 'good', title: '点斜式写出法线',
    body: '<p>$$y-\\ln\\sqrt2=-\\Big(x-\\frac\\pi4\\Big)\\;\\Longleftrightarrow\\;x+y-\\frac\\pi4-\\ln\\sqrt2=0.$$</p>' +
          '<p>写成 $y+x-\\frac\\pi4-\\ln\\sqrt2=0$ 亦等价。</p>' },
];

AW.init({
  title: '$t=1$ 处的法线方程逐步推导',
  subtitle: '考点：参数方程求导 · 方法：斜率相除 → 负倒数 → 点斜式',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示推导。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一行'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'框架', log:'先拆根号化简 y，再按斜率相除框架走' },
    { cls:'step',  tag:'求导', log:'x、y 分别对 t 求导' },
    { cls:'shift', tag:'相除', log:'分母分子约掉 1+t 平方，斜率就是 t' },
    { cls:'step',  tag:'代入', log:'t=1 给出点和斜率，法线斜率取负倒数' },
    { cls:'done',  tag:'完成', log:'点斜式整理成一般式，收工', done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$x+y-\\dfrac\\pi4-\\ln\\sqrt2=0$',
    html: '记忆锚点：<b>法线斜率 $=-\\frac1k$</b>（别漏负号）；$\\ln\\sqrt{1+t^2}$ 先写成 $\\frac12\\ln(1+t^2)$ 再求导；$\\arctan1=\\frac\\pi4$、$\\frac12\\ln2=\\ln\\sqrt2$ 是常用值。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
