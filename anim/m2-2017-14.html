<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2017·14 由特征向量定参数 a</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>第一步：回到定义</b>。$\\xi=(1,1,2)^{\\mathrm T}$ 是 $A$ 的特征向量，按定义存在 $\\lambda$ 使 $$A\\xi=\\lambda\\xi.$$ 未知量有两个：$\\lambda$ 与 $a$。策略：先用<b>不含 $a$ 的行</b>定 $\\lambda$，再代回含 $a$ 的行。</p>",
  "<p><b>第二步：算 $A\\xi$</b>$$A\\xi=\\begin{pmatrix}4&1&-2\\\\1&2&a\\\\3&1&-1\\end{pmatrix}\\begin{pmatrix}1\\\\1\\\\2\\end{pmatrix}=\\begin{pmatrix}4+1-4\\\\1+2+2a\\\\3+1-2\\end{pmatrix}=\\begin{pmatrix}1\\\\3+2a\\\\2\\end{pmatrix}.$$</p>",
  "<p><b>第三步：第 1 行定 $\\lambda$</b>。$\\lambda\\xi=(\\lambda,\\lambda,2\\lambda)^{\\mathrm T}$，第 1 分量不含 $a$：$$1=\\lambda\\cdot1\\ \\Longrightarrow\\ \\lambda=1.$$</p>",
  "<p><b>第四步：第 3 行自检</b>。$\\lambda\\xi$ 第 3 分量是 $\\lambda\\cdot2=2$，与 $A\\xi$ 的第 3 分量 $2$ 吻合 ✓——交叉验证 $\\lambda=1$ 没取错。</p>",
  "<p><b>第五步：第 2 行解 $a$</b>$$3+2a=\\lambda\\cdot1=1\\ \\Longrightarrow\\ 2a=-2\\ \\Longrightarrow\\ a=-1.$$</p>",
  "<p><b>第六步：回代验证</b>。取 $a=-1$：$A\\xi=(1,1,2)^{\\mathrm T}=1\\cdot\\xi$，三行同时成立，$\\xi$ 确为 $A$ 属于 $\\lambda=1$ 的特征向量。答案 $a=-1$。</p>"
];

AW.init({
  title: '$A=\\begin{pmatrix}4&1&-2\\\\1&2&a\\\\3&1&-1\\end{pmatrix}$ 有特征向量 $(1,1,2)^{\\mathrm T}$，求 $a$',
  subtitle: '考点：特征值与特征向量的定义 · 方法：Aξ=λξ 逐分量比较，先定 λ 再解 a',
  counterLabel: '已执行',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'定义',   log:'Aξ = λξ，两个未知数 λ 和 a；先攻不含 a 的行', show:1, count:0 },
    { cls:'step',  tag:'算 Aξ',  log:'Aξ = (1, 3+2a, 2)ᵀ，第 2 行带着参数 a', show:2, count:1 },
    { cls:'ok',    tag:'定 λ',   log:'第 1 行：1 = λ·1，λ = 1', show:3, count:2 },
    { cls:'step',  tag:'自检',   log:'第 3 行：2 = λ·2 = 2，与 λ=1 自洽', show:4, count:3 },
    { cls:'done',  tag:'解 a',   log:'第 2 行：3+2a = 1，解得 a = −1', show:5, count:4, done:true },
    { cls:'step',  tag:'验证',   log:'回代 Aξ=(1,1,2)ᵀ=1·ξ，三行同时成立', show:6, count:5, done:true },
  ],

  result: {
    big: '$a=-1$',
    html: '记忆锚点：<b>特征向量问题回到定义 $A\\xi=\\lambda\\xi$</b>；含参矩阵先用不含参的分量定 $\\lambda$，再解含参分量，最后回代验证三行同时成立。注意第 3 分量比的是 $2\\lambda$ 不是 $\\lambda$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
