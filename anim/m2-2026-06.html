<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：变限积分的反函数求导</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$f(x)=\\displaystyle\\int_1^{x^3}\\frac{\\mathrm e^t}{1+t^2}\\,dt$ 的反函数 $g$：求 $g(0)$ 与 $g\'(0)$',
  subtitle: "考点：变限积分求导 · 链式法则 · 反函数求导（先定位点再取倒数）",
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示完整流程。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$f(x)=\\displaystyle\\int_1^{x^3}\\frac{\\mathrm e^t}{1+t^2}dt$，$g$ 是反函数。反函数问题两步走：<b>先定位点，再取倒数</b>。',
      '<b>定位点</b>：上限 $x^3$ 在 $x=1$ 时等于下限 $1$，故 $f(1)=0$，即 $y=0$ 对应 $x=1$：$$g(0)=1.$$（C、D 写成 $g(1)=0$，把 $g$ 的自变量与函数值弄反了。）',
      '<b>变限求导 + 链式</b>：上限是 $x^3$，别漏内层导数 $3x^2$ $$f\'(x)=\\frac{\\mathrm e^{x^3}}{1+(x^3)^2}\\cdot 3x^2=\\frac{3x^2\\mathrm e^{x^3}}{1+x^6}$$',
      '<b>代入 $x=1$</b>：$$f\'(1)=\\frac{3\\mathrm e}{2}$$',
      '<b>反函数求导</b>：$g\'(y_0)=\\dfrac{1}{f\'(x_0)}$（$y_0=f(x_0)$），在 $y=0$ 处 $$g\'(0)=\\frac{1}{f\'(1)}=\\frac{2}{3\\mathrm e}$$',
      '<b>排错</b>：A 的 $\\dfrac{3\\mathrm e}{2}$ 是 $f\'(1)$，忘了取倒数；C、D 的定位点写反。只有 B 两处都对。',
      '<b>结论</b>：$$g(0)=1,\\qquad g\'(0)=\\frac{2}{3\\mathrm e}\\qquad\\Longrightarrow\\qquad \\text{选 B}$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'反函数问题两步走：先定位点，再取倒数', count:0 },
    { cls:'ok',    tag:'定位点', log:'x=1 时上限=下限，f(1)=0，所以 g(0)=1（不是 g(1)=0）', count:1 },
    { cls:'shift', tag:'求导',   log:'变限求导别漏链式：上限 x³ 的内层导数 3x²', count:2 },
    { cls:'step',  tag:'代值',   log:'代入 x=1：f′(1) = 3e/2', count:3 },
    { cls:'ok',    tag:'取倒数', log:'反函数导数取倒数：g′(0) = 1/f′(1) = 2/(3e)', count:4 },
    { cls:'miss',  tag:'排错',   log:'A 忘取倒数；C、D 把 g 的自变量和函数值弄反', count:5 },
    { cls:'done',  tag:'完成',   log:'结论：g(0)=1，g′(0)=2/(3e)，选 B', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: "$g(0)=1,\\qquad g'(0)=\\dfrac{2}{3\\mathrm e}$（选 B）",
    html: '记忆锚点：<b>反函数两步走——先定位点（$f(1)=0\\Rightarrow g(0)=1$），再取倒数（$g\'(0)=1/f\'(1)$）</b>。易错：上限 $x^3$ 的链式漏乘 $3x^2$；把 $g(0)$ 写成 $g(1)$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
