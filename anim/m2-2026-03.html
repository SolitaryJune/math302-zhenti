<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：隐函数求 z_x − z_y</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '隐函数 $x-az=\\mathrm e^{y+az}$：求 $\\dfrac{\\partial z}{\\partial x}-\\dfrac{\\partial z}{\\partial y}$',
  subtitle: '考点：隐函数求偏导 · 方法：记 $E=\\mathrm e^{y+az}=x-az$ 整体替换',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示两个偏导的完整推导。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$z=z(x,y)$ 由 $x-az=\\mathrm e^{y+az}$ 确定。记 $E=\\mathrm e^{y+az}$，由原方程 $E=x-az$，求导后整体替换，化简极干净。',
      '<b>对 $x$ 求偏导</b>（$y$ 不动）：左边 $1-az_x$，右边 $\\mathrm e^{y+az}\\cdot az_x=E\\,az_x$ $$1-az_x=E\\,az_x\\ \\Longrightarrow\\ z_x=\\frac{1}{a(1+E)}$$',
      '<b>对 $y$ 求偏导</b>（$x$ 不动）：右边是 $E(1+az_y)$（内层 $y+az$ 整体求导） $$-az_y=E(1+az_y)\\ \\Longrightarrow\\ z_y=\\frac{-E}{a(1+E)}$$',
      '<b>相减</b>：分子恰好凑出公因子 $$z_x-z_y=\\frac{1}{a(1+E)}+\\frac{E}{a(1+E)}=\\frac{1+E}{a(1+E)}=\\frac1a$$',
      '<b>辨析含加号的选项</b>：$z_x+z_y=\\dfrac{1-E}{a(1+E)}$ 含 $E$、不是常数 $\\Rightarrow$ B、D 不对；C 把 $\\dfrac1a$ 的符号取反了。',
      '<b>结论</b>：$$\\frac{\\partial z}{\\partial x}-\\frac{\\partial z}{\\partial y}=\\frac1a\\qquad\\Longrightarrow\\qquad \\text{选 A}$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'记 E = e^(y+az) = x−az，求导后整体替换', count:0 },
    { cls:'step',  tag:'求 z_x', log:'对 x 求导：1 − a·z_x = E·a·z_x，解出 z_x', count:1 },
    { cls:'shift', tag:'求 z_y', log:'对 y 求导：内层多出一项 a·z_y，解出带负号的 z_y', count:2 },
    { cls:'ok',    tag:'相减',   log:'分子恰好凑成 1+E，约分得常数 1/a', count:3 },
    { cls:'miss',  tag:'辨析',   log:'带加号的组合不是常数；C 是符号取反的错误', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：z_x − z_y = 1/a，选 A', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$z_x-z_y=\\dfrac1a$（选 A）',
    html: '记忆锚点：<b>用原方程把 $\\mathrm e^{y+az}$ 整体换成 $x-az$，两个偏导就共享分母 $a(1+E)$，相减自动约分</b>。易错：对 $y$ 求导漏掉内层的 $az_y$，或者把差值符号取反（C）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
