<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：辨认黎曼和——区域、步长、面积元</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：三件事定黎曼和',
    cls: 'key',
    body: '<p>$D=[0,1]\\times[0,1]$ 是<b>整张正方形</b>，不是三角形。判断选项看三件事：<b>样本点落在哪块区域、步长多大、面积元与步长是否自洽</b>。样本点 $\\dfrac{i}{2n}$ 的步长是 $\\dfrac{1}{2n}$，真面积元 $\\dfrac{1}{4n^2}$，写 $\\dfrac1{n^2}$ 相当于放大 $4$ 倍。</p>' },
  { title: '对称性给出一半',
    cls: 'key',
    body: '<p>$f(x,y)=f(y,x)$：对角线 $y=x$ 把正方形分成 $T:\\ y\\le x$ 与 $T\':\\ y\\ge x$ 两块，其上积分相等 $$\\iint_T f=\\frac12\\iint_D f.$$</p>' },
  { title: 'A 错：圈成了反对角线',
    cls: 'bad',
    body: '<p>$j\\ge n+1-i$ 即 $i+j\\ge n+1$，样本点落在<b>反对角线 $x+y=1$ 上方</b>的三角形——跟对称轴 $y=x$ 无关。步长 $\\dfrac1n$ 虽自洽，系数 $2$ 补不回区域选错（取 $f=x+y$ 得 $\\dfrac43\\ne1$）。</p>' },
  { title: 'B 错：满网格多折半',
    cls: 'bad',
    body: '<p>$\\dfrac1{n^2}$ 配 $n\\times n$ 满网格是<b>整张正方形</b>的黎曼和，再乘 $\\dfrac12$ 得 $\\dfrac12\\iint_D f$——多除了 $2$（取 $f=x+y$ 得 $\\dfrac12\\ne1$）。</p>' },
  { title: 'C 错：区域与面积元双错',
    cls: 'bad',
    body: '<p>$i+j\\le 2n+1$ 仍是反对角线一侧；样本点步长 $\\dfrac{1}{2n}$，面积元应为 $\\dfrac{1}{4n^2}$，写成 $\\dfrac1{n^2}$ 整体放大 $4$ 倍（取 $f=x+y$ 得 $\\dfrac83\\ne1$）。</p>' },
  { title: 'D 对：区域对、面积元补回',
    cls: 'good',
    body: '<p>$1\\le j\\le i\\le 2n$ 即 $y\\le x$，恰是 $T$；$\\dfrac1{n^2}=4\\cdot\\dfrac{1}{4n^2}$，故 $$\\frac12\\cdot4\\iint_T f=2\\iint_T f=\\iint_D f.$$<b>成立</b>。</p>' },
  { title: '代特例验算',
    cls: 'good',
    body: '<p>取 $f=x+y$（连续且对称），真值 $\\iint_D(x+y)=1$。四个选项分别收敛到 $$\\text{A}=\\dfrac43,\\quad \\text{B}=\\dfrac12,\\quad \\text{C}=\\dfrac83,\\quad \\text{D}=1.$$ 只有 D 吻合。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>样本点的分母定步长，面积元必须是步长的平方；对称条件 $f(x,y)=f(y,x)$ 只对主对角线 $y=x$ 两侧好用</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '辨认黎曼和：$\\iint_D f$ 等于哪个极限（$f(x,y)=f(y,x)$）',
  subtitle: '考点：二重积分定义 · 黎曼和的区域 / 步长 / 面积元 · 对称性',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐项还原四个选项的区域与面积元。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：<b>D 的三件事全对——区域 $y\\le x$（主对角线下三角）、步长 $\\dfrac{1}{2n}$、$\\dfrac1{n^2}=4\\times$真面积元，$\\dfrac12\\times4\\iint_T f=\\iint_D f$</b>。验算利器：代对称函数 $f=x+y$，真值 $1$，只有 D 给 $1$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
