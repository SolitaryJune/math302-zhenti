<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>m2-2025-18 · 泰勒反解证可导，求 f′(0)</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '由极限反解 $f$ 的展开 · 证明 $f$ 在 $x=0$ 可导并求 $f\\prime(0)$',
  subtitle: '考点：泰勒展开 / 等价无穷小 + 连续性与导数定义 · 条件：极限 $=-3$',
  counterLabel: '已完成',
  intro: '点击「▶ 播放」逐步演示：化简分母 → 展开分子 → 反解结构 → 定义求导。',

  build: function(stage){
    stage.innerHTML = '';
    var head = AW.el('div', '',
      '<p>$$\\lim_{x\\to0}\\frac{x f(x)-e^{2\\sin x}+1}{\\ln(1+x)+\\ln(1-x)}=-3$$</p>');
    stage.appendChild(head);
    this._board = AW.el('div', '');
    stage.appendChild(this._board);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'先用和的对数公式合并分母，认清它是二阶小量', count:1,
      board: '<div class="aw-row-label"><b>第 1 步 · 化简分母</b></div>'
        + '<p>$$\\ln(1+x)+\\ln(1-x)=\\ln(1-x^2)\\sim -x^2\\quad(x\\to0)$$</p>'
        + '<p>分母是 $x^2$ 阶，极限为非零常数 $-3$：分子必为 $x^2$ 阶，这就是突破口。</p>' },
    { cls:'step', tag:'展开', log:'把 e 的二次正弦展开到平方项，三次项不参与', count:2,
      ribbon:{k:1, ok:true},
      board: '<div class="aw-row-label"><b>第 2 步 · $e^{2\\sin x}$ 展到 $x^2$</b></div>'
        + '<p>$2\\sin x=2x+o(x^2)$，代入 $e^u=1+u+\\dfrac{u^2}2+o(u^2)$：</p>'
        + '<p>$$e^{2\\sin x}=1+2x+\\frac{(2x)^2}{2}+o(x^2)=1+2x+2x^2+o(x^2)$$</p>' },
    { cls:'step', tag:'定分子', log:'极限是负 3、分母是负的平方小量，所以分子是 3 倍平方小量', count:3,
      board: '<div class="aw-row-label"><b>第 3 步 · 由极限条件读出分子的阶</b></div>'
        + '<p>分子 $=-3\\times$（分母）$+o(x^2)$：</p>'
        + '<p>$$x f(x)-e^{2\\sin x}+1=3x^2+o(x^2)$$</p>' },
    { cls:'ok', tag:'反解', log:'把 e 的展开代回去，移项解出 x 倍 f(x)', count:4,
      ribbon:{k:2, ok:true},
      board: '<div class="aw-row-label"><b>第 4 步 · 反解 $x f(x)$</b></div>'
        + '<p>$$x f(x)=e^{2\\sin x}-1+3x^2+o(x^2)=(1+2x+2x^2)-1+3x^2+o(x^2)$$</p>'
        + '<p>$$x f(x)=2x+5x^2+o(x^2)$$</p>' },
    { cls:'step', tag:'出结构', log:'两边除以 x（x 不取零），得到 f 在零点附近的样子', count:5,
      board: '<div class="aw-row-label"><b>第 5 步 · 除以 $x$ 得 $f$ 的结构（$x\\ne0$）</b></div>'
        + '<p>$$f(x)=2+5x+o(x)\\qquad(x\\to0,\\ x\\ne0)$$</p>'
        + '<p>注意：这一步只给出 $x\\ne0$ 处的信息，$f(0)$ 还悬着。</p>' },
    { cls:'step', tag:'连续性', log:'用题设的连续性取极限，把 f(0) 补成 2', count:6,
      ribbon:{k:3, ok:true},
      board: '<div class="aw-row-label"><b>第 6 步 · 连续性补 $f(0)$</b></div>'
        + '<p>$$f(0)=\\lim_{x\\to0}f(x)=\\lim_{x\\to0}\\big(2+5x+o(x)\\big)=2$$</p>' },
    { cls:'ok', tag:'定义求导', log:'按导数定义写差商，一次项除以 x 剩下 5', count:7,
      ribbon:{k:4, ok:true},
      board: '<div class="aw-row-label"><b>第 7 步 · 导数定义</b></div>'
        + '<p>$$f\\prime(0)=\\lim_{x\\to0}\\frac{f(x)-f(0)}{x}=\\lim_{x\\to0}\\frac{5x+o(x)}{x}=5$$</p>' },
    { cls:'done', tag:'验算', log:'把 f 约等于 2 加 5x 代回原极限，恰好等于负 3，闭环', count:8, done:true,
      board: '<div class="aw-row-label"><b>第 8 步 · 验算闭环</b></div>'
        + '<p>取 $f\\approx2+5x$：分子 $=(2x+5x^2)-(2x+2x^2)+o(x^2)=3x^2+o(x^2)$，除以 $-x^2$ 得 $-3$ ✓，与条件一致。</p>'
        + '<p>$$\\boxed{f\\text{ 在 }x=0\\text{ 处可导，}f\\prime(0)=5}$$</p>' },
  ],

  render: function(stage, sn, i){
    this._board.innerHTML = sn.board || '';
    renderMathAfterSnap(stage);
  },

  result: {
    big: 'f 在 x=0 可导，f′(0) = 5',
    html: '结论：$$f\\prime(0)=5$$'
      + '解题链条：<b>化简分母 $\\sim-x^2$ → 展开 $e^{2\\sin x}=1+2x+2x^2+o(x^2)$ → 极限反解 $xf(x)=2x+5x^2+o(x^2)$ → 连续性定 $f(0)=2$ → 定义算导数</b>。'
      + '易错：$f$ 只知连续不能用洛必达；展开精度必须到 $x^2$；$f(0)$ 必须靠连续性单独补上。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
