<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·17 切线、弓形面积与旋转体体积</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  '<p><b>审题</b>：过 $(0,1)$ 作 $y=\\ln x$ 的切线，切点 $A$；$L$ 与 $x$ 轴交于 $B$；区域 $D$ 由 $L$ 与弦 $AB$ 围成。先定 $A$、$B$，再算面积与绕 $x$ 轴的旋转体体积。</p>',
  '<p><b>定切点</b>：设切点 $(a,\\ln a)$，$y\'=\\dfrac1x$，切线 $y-\\ln a=\\dfrac1a(x-a)$。代入 $(0,1)$：$1-\\ln a=-1\\ \\Rightarrow\\ \\ln a=2\\ \\Rightarrow\\ a=\\mathrm e^2$，故 $A=(\\mathrm e^2,2)$。</p>',
  '<p><b>定 $B$ 与弦</b>：$\\ln x=0$ 给 $B=(1,0)$；弦 $AB$：斜率 $\\dfrac{2}{\\mathrm e^2-1}$，方程 $y=\\dfrac{2}{\\mathrm e^2-1}(x-1)$。</p>',
  '<p><b>面积选口径</b>：两条边界都易写成 $x(y)$——曲线 $x=\\mathrm e^y$，弦 $x=1+\\dfrac{\\mathrm e^2-1}{2}y$；$y\\in[0,2]$，弦在右、曲线在左，按 $y$ 积分。</p>',
  '<p><b>算面积</b>：$$S=\\int_0^2\\Big[\\Big(1+\\frac{\\mathrm e^2-1}{2}y\\Big)-\\mathrm e^y\\Big]\\mathrm dy=\\Big[y+\\frac{\\mathrm e^2-1}{4}y^2-\\mathrm e^y\\Big]_0^2=2.$$</p>',
  '<p><b>体积选口径</b>：绕 $x$ 轴、$x\\in[1,\\mathrm e^2]$。$y=\\ln x$ 是凹函数，弦连两端点必在曲线下方，圆盘套环：$$V=\\pi\\int_1^{\\mathrm e^2}\\Big[(\\ln x)^2-\\frac{4(x-1)^2}{(\\mathrm e^2-1)^2}\\Big]\\mathrm dx.$$</p>',
  '<p><b>曲线块</b>：$$\\int_1^{\\mathrm e^2}(\\ln x)^2\\,\\mathrm dx=\\big[x(\\ln x)^2-2x\\ln x+2x\\big]_1^{\\mathrm e^2}=2\\mathrm e^2-2.$$</p>',
  '<p><b>弦块</b>：$$\\frac{4}{(\\mathrm e^2-1)^2}\\int_1^{\\mathrm e^2}(x-1)^2\\,\\mathrm dx=\\frac{4}{(\\mathrm e^2-1)^2}\\cdot\\frac{(\\mathrm e^2-1)^3}{3}=\\frac{4(\\mathrm e^2-1)}{3}.$$</p>',
  '<p><b>合并</b>：$$V=\\pi\\Big[(2\\mathrm e^2-2)-\\frac{4(\\mathrm e^2-1)}{3}\\Big]=\\pi(\\mathrm e^2-1)\\Big(2-\\frac43\\Big)=\\frac{2\\pi}{3}(\\mathrm e^2-1).$$</p>',
  '<p><b>结论</b>：$$S=2,\\qquad V=\\frac{2\\pi}{3}(\\mathrm e^2-1).$$</p>',
];

AW.init({
  title: '$y=\\ln x$ 的切线、弓形面积与旋转体体积',
  subtitle: '考点：切线定点 · 面积（按 $y$ 积分）· 绕 $x$ 轴圆盘法',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示从切点到面积再到体积的全过程。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var pts = AW.el('div', '');
    pts.style.cssText = 'display:flex;gap:10px;margin:2px 0 12px;flex-wrap:wrap;';
    this._chips = [];
    var labels = ['$A=(\\mathrm e^2,\\,2)$', '$B=(1,\\,0)$', '$S=\\,?$', '$V=\\,?$'];
    for(var k = 0; k < labels.length; k++){
      var c = AW.el('div', '', labels[k]);
      c.style.cssText = 'padding:6px 12px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;background:#f8fafc;color:#94a3b8;';
      pts.appendChild(c);
      this._chips.push(c);
    }
    this._labels = labels;
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(pts);
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    var chips = this._chips;
    var known = [sn.show >= 2, sn.show >= 3, sn.show >= 5, sn.show >= 9];
    var vals = ['$A=(\\mathrm e^2,\\,2)$', '$B=(1,\\,0)$', '$S=2$', '$V=\\dfrac{2\\pi}{3}(\\mathrm e^2-1)$'];
    for(var k = 0; k < chips.length; k++){
      if(known[k]){
        chips[k].style.border = '2px solid #16a34a';
        chips[k].style.background = '#f6fef9';
        chips[k].style.color = '#14532d';
        chips[k].innerHTML = '<b>' + vals[k] + '</b>';
      } else {
        chips[k].style.border = '2px solid #e2e8f0';
        chips[k].style.background = '#f8fafc';
        chips[k].style.color = '#94a3b8';
        chips[k].innerHTML = this._labels[k];
      }
    }
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',   log:'先把切点和曲线与 x 轴的交点找出来，几何信息才齐', show:1, count:0 },
    { cls:'step',  tag:'切点',   log:'设切点坐标代入切线方程，让它过 0,1 这一点，解出 a 等于 e 平方', show:2, count:1 },
    { cls:'step',  tag:'弦',     log:'曲线与 x 轴交于 1,0，连结两点得弦的方程', show:3, count:2 },
    { cls:'shift', tag:'选口径', log:'两条边界都能写成 x 关于 y 的式子，按 y 积分最省事', show:4, count:3 },
    { cls:'ok',    tag:'面积',   log:'右边界减左边界从 0 积到 2，面积等于 2', show:5, count:4 },
    { cls:'shift', tag:'旋转',   log:'绕 x 轴转：曲线在上当外半径，弦在下当内半径，环形截面', show:6, count:5 },
    { cls:'step',  tag:'曲线块', log:'对数平方的积分用两次分部，得 2e² 减 2', show:7, count:6 },
    { cls:'step',  tag:'弦块',   log:'弦平方那块是简单幂函数，得 4(e²−1)/3', show:8, count:7 },
    { cls:'ok',    tag:'合并',   log:'外减内再乘 π，提出公因子 (e²−1)，得 2π/3 倍的 (e²−1)', show:9, count:8 },
    { cls:'done',  tag:'完成',   log:'结论：S=2，V=2π/3·(e²−1)', show:10, count:9, done:true },
  ],

  result: {
    big: '$S=2,\\qquad V=\\dfrac{2\\pi}{3}(\\mathrm e^2-1)$',
    html: '记忆锚点：<b>切点设 $(a,\\ln a)$ 而不是定点本身</b>；面积挑好积分变量（两边界都写成 $x(y)$）；旋转体区域是弓形，必须用 $R^2-r^2$ 的环形截面。$\\ln x$ 是凹函数，弦恒在曲线下方。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
