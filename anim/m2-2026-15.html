<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：ln(2+x) 在 [0,2] 上的平均值</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$\\ln(2+x)$ 在 $[0,2]$ 上的平均值',
  subtitle: '考点：函数平均值公式 · 换元 · 分部积分',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示平均值计算。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>平均值公式</b>：连续函数在 $[a,b]$ 上的平均值为 $\\dfrac{1}{b-a}\\displaystyle\\int_a^b f\\,dx$ $$\\bar f=\\frac12\\int_0^2\\ln(2+x)\\,dx$$',
      '<b>换元</b>：令 $u=2+x$，$du=dx$，$x:0\\to2$ 对应 $u:2\\to4$ $$\\int_0^2\\ln(2+x)\\,dx=\\int_2^4\\ln u\\,du$$',
      '<b>分部积分</b>：对数因子留作求导方 $$\\int\\ln u\\,du=u\\ln u-\\int u\\cdot\\frac1u\\,du=u\\ln u-u$$',
      '<b>代限</b>：$$[u\\ln u-u]_2^4=(4\\ln4-4)-(2\\ln2-2)=8\\ln2-2\\ln2-2=6\\ln2-2$$',
      '<b>平均值</b>：$$\\bar f=\\frac12(6\\ln2-2)=3\\ln2-1$$',
      '<b>结论</b>：$\\ln(2+x)$ 在 $[0,2]$ 上的平均值为 $3\\ln2-1$。',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'公式',   log:'平均值 = 积分除以区间长度 2', count:0 },
    { cls:'shift', tag:'换元',   log:'u = 2+x：积分区间从 [0,2] 变成 [2,4]', count:1 },
    { cls:'step',  tag:'分部',   log:'∫ln u du = u·ln u − u（对数留作求导方）', count:2 },
    { cls:'ok',    tag:'代限',   log:'(4ln4−4)−(2ln2−2) = 6ln2−2', count:3 },
    { cls:'ok',    tag:'平均',   log:'除以 2 得 3ln2 − 1', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：平均值为 3ln2 − 1', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\bar f=3\\ln2-1$',
    html: '记忆锚点：<b>平均值 $=\\dfrac{1}{b-a}\\int_a^b f\\,dx$；$\\int\\ln u\\,du=u\\ln u-u$；$\\ln4=2\\ln2$</b>。易错：换元忘改限（$[0,2]\\to[2,4]$）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
