<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2015·04 由 f″ 的图象数拐点</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：判据是变号，不是零点',
    cls: 'key',
    body: '<p>拐点 = 凹凸性改变的点。$f$ 连续、$f^{\\prime\\prime}$ 存在时判据：$f^{\\prime\\prime}(x)$ <b>变号</b>处产生拐点。题目给的是 $f^{\\prime\\prime}$ 的图象——要数「图象穿越 $x$ 轴」的次数，不是与轴接触的次数。</p>',
    log: '拐点看 f″ 变号：数穿越，不数零点' },
  { title: '把图象读成文字',
    cls: 'key',
    body: '<p>$f^{\\prime\\prime}(x)$ 的图象与 $x$ 轴共<b>三次接触</b>：两处<b>真穿越</b>（从轴一侧穿到另一侧，$f^{\\prime\\prime}$ 变号），一处<b>相切</b>（碰轴弹回，$f^{\\prime\\prime}=0$ 但两侧同号）。</p>',
    log: '三次接触：两次穿越 + 一次相切' },
  { title: '穿越点 1：变号，是拐点',
    cls: 'good',
    body: '<p>此处 $f^{\\prime\\prime}$ 由正变负，凹凸性由下凸变上凸——凹凸性改变，$\\big(x_1,\\,f(x_1)\\big)$ 是<b>拐点</b>（第 1 个）。</p>',
    ribbon: {k:1, ok:true},
    log: '穿越点 1：+ → −，凹凸性改变，是拐点' },
  { title: '穿越点 2：变号，是拐点',
    cls: 'good',
    body: '<p>此处 $f^{\\prime\\prime}$ 由负变正，凹凸性再次改变——<b>拐点</b>（第 2 个）。已凑齐两个。</p>',
    ribbon: {k:2, ok:true},
    log: '穿越点 2：− → +，第二个拐点' },
  { title: '相切点：不变号，不是拐点',
    cls: 'bad',
    body: '<p>相切处 $f^{\\prime\\prime}=0$ 但两侧同为正（或同为负），凹凸性<b>不改变</b>——不是拐点。这正是 D 选项多算的那个。</p>',
    ribbon: {k:3, ok:false},
    log: '相切点：f″=0 但两侧同号，不是拐点' },
  { title: '排除干扰项',
    cls: 'step',
    body: '<p><b>A（0 个）、B（1 个）</b>：漏数了穿越变号点。<b>D（3 个）</b>：把相切点也算进去——$f^{\\prime\\prime}=0$ 只是候选资格，<b>变号</b>才是判据。</p>',
    log: 'A/B 漏数，D 多数' },
  { title: '结论',
    cls: 'good',
    body: '<p>拐点共 <b>2</b> 个，答案选 <b>C</b>。记忆锚点：<b>拐点个数 = $f^{\\prime\\prime}$ 图象穿轴变号的次数</b>；相切（零点但不变号）一律不算。</p>',
    log: '选 C：2 个拐点' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log || s.title,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '由 $f^{\\prime\\prime}(x)$ 的图象数拐点个数',
  subtitle: '考点：凹凸性与拐点 · 方法：数「穿越 x 轴变号」次数，不是数零点',
  counterLabel: '检查点',
  ribbonTitle: '接触点排查（✓ 变号算拐点 / ✗ 不变号不算）',
  intro: '点击「▶ 播放」逐个排查 f″ 图象与 x 轴的接触点。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C（2 个拐点）',
    html: '记忆锚点：<b>拐点数 = $f^{\\prime\\prime}$ 穿轴变号次数</b>。图象三次接触中，两次穿越各贡献一个拐点，一次相切因两侧同号被排除——「$f^{\\prime\\prime}=0$」不等于「凹凸性改变」。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
