<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2021·19 弧长与旋转曲面面积</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [
  "$$\\int\\frac{f(x)}{\\sqrt{x}}\\,\\mathrm{d}x=\\frac{1}{6}x^2-x+C\\qquad\\text{两边求导，解锁 } f(x)$$",
  "<b>① 还原 $f(x)$：</b>$\\dfrac{f(x)}{\\sqrt{x}}=\\dfrac{x}{3}-1\\ \\Rightarrow\\ f(x)=\\dfrac{1}{3}x^{3/2}-x^{1/2}$",
  "<b>② 求导并配方：</b>$f^{\\prime}(x)=\\dfrac{1}{2}x^{1/2}-\\dfrac{1}{2}x^{-1/2}=\\dfrac{x-1}{2\\sqrt{x}}$，$$1+\\left[f^{\\prime}(x)\\right]^2=1+\\frac{(x-1)^2}{4x}=\\frac{(x+1)^2}{4x}$$",
  "<b>③ 开方：</b>在 $[4,9]$ 上 $x+1>0$：$\\sqrt{1+\\left[f^{\\prime}\\right]^2}=\\dfrac{x+1}{2\\sqrt{x}}$ —— 完全平方开出有理式",
  "<b>④ 弧长：</b>$$s=\\int_4^9\\frac{x+1}{2\\sqrt{x}}\\,\\mathrm{d}x=\\frac{1}{2}\\int_4^9\\left(x^{1/2}+x^{-1/2}\\right)\\mathrm{d}x=\\frac{1}{2}\\left(\\frac{38}{3}+2\\right)=\\frac{22}{3}$$",
  "<b>⑤ 面积公式：</b>$A=2\\pi\\int_4^9\\left|f(x)\\right|\\sqrt{1+\\left[f^{\\prime}\\right]^2}\\,\\mathrm{d}x$；$x\\in[4,9]$ 时 $\\dfrac{x}{3}-1\\ge\\dfrac13>0$，$f(x)\\ge0$，去掉绝对值",
  "<b>⑥ 化简被积函数：</b>$$A=2\\pi\\int_4^9\\sqrt{x}\\left(\\frac{x}{3}-1\\right)\\cdot\\frac{x+1}{2\\sqrt{x}}\\,\\mathrm{d}x=\\pi\\int_4^9\\left(\\frac{x}{3}-1\\right)(x+1)\\,\\mathrm{d}x=\\pi\\int_4^9\\left(\\frac{x^2}{3}-\\frac{2x}{3}-1\\right)\\mathrm{d}x$$",
  "<b>⑦ 积分收尾：</b>$$A=\\pi\\left[\\frac{x^3}{9}-\\frac{x^2}{3}-x\\right]_4^9=\\pi\\left(45+\\frac{20}{9}\\right)=\\frac{425\\pi}{9}$$"
];

AW.init({
  title: "2021·19　弧长 $s$ 与旋转曲面面积 $A$",
  subtitle: "考点：求导还原 $f$ · 弧长公式 · 侧面积公式 $A=2\\pi\\int\\lvert f\\rvert\\sqrt{1+f^{\\prime 2}}\\,\\mathrm{d}x$",
  counterLabel: "推导步数",
  ribbonTitle: "推导进度（✓ 完成）",
  intro: "点击「▶ 播放」或「下一步」，先还原 f，再算弧长与旋转面积。",

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前步亮琥珀色，已完成步变绿'));
    this._rows = [];
    for (var i = 0; i < ROWS.length; i++){
      var r = AW.el('div', 'aw-stepcard', ROWS[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    {"cls": "step", "tag": "审题", "log": "题目给的是含 f 的不定积分等式，两边对 x 求导就能解出 f", "count": 0, "ribbon": {"k": 1, "ok": true}},
    {"cls": "ok", "tag": "还原", "log": "求导得 f 除以根号 x 等于三分之 x 减一，乘上根号 x 还原出 f", "count": 1, "ribbon": {"k": 2, "ok": true}},
    {"cls": "ok", "tag": "配方", "log": "一阶导化为分式，平方加一恰好配成完全平方", "count": 2, "ribbon": {"k": 3, "ok": true}},
    {"cls": "ok", "tag": "开方", "log": "区间上 x 加一为正，开方得 x 加一除以二倍根号 x", "count": 3, "ribbon": {"k": 4, "ok": true}},
    {"cls": "ok", "tag": "弧长", "log": "拆成幂函数积分，代入上下限，弧长为三分之二十二", "count": 4, "ribbon": {"k": 5, "ok": true}},
    {"cls": "ok", "tag": "面积", "log": "侧面积公式带二派乘 f，区间上 f 非负，绝对值直接去掉", "count": 5, "ribbon": {"k": 6, "ok": true}},
    {"cls": "ok", "tag": "化简", "log": "根号 x 约掉，被积函数化为二次多项式", "count": 6, "ribbon": {"k": 7, "ok": true}},
    {"cls": "ok", "tag": "收尾", "log": "原函数代上限得四十五，代下限得负九分之二十，面积收敛", "count": 7, "ribbon": {"k": 8, "ok": true}},
    {"cls": "done", "tag": "完成", "log": "完成：弧长三分之二十二，旋转面积四百二十五派除以九", "count": 8, "ribbon": {"k": 9, "ok": true}, "done": true}
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: "$s=\\dfrac{22}{3}$，　$A=\\dfrac{425\\pi}{9}$",
    html: "记忆锚点：<b>先求导解锁 $f$；$1+f^{\\prime 2}$ 配方成 $\\dfrac{(x+1)^2}{4x}$ 是本题题眼</b>。易错：侧面积漏 $2\\pi f$ 因子；开方不讨论 $x+1$ 的符号。"
  }
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
