<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：反常积分两段判敛（2013 年第 4 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '拆成两段',
    body: '<p>第一段 $\\int_1^{\\mathrm e}\\dfrac{\\mathrm dx}{(x-1)^{\\alpha-1}}$：瑕点 $x=1$ 的瑕积分；第二段 $\\int_{\\mathrm e}^{+\\infty}\\dfrac{\\mathrm dx}{x\\ln^{\\alpha+1}x}$：无穷限积分。整体收敛 $\\iff$ <b>两段都收敛</b>。</p>' },
  { cls: '', title: '第一段标准化',
    body: '<p>$\\dfrac1{(x-1)^{\\alpha-1}}=(x-1)^{1-\\alpha}=(x-1)^{-p}$，即判敛参数</p>' +
          '<p>$$p=\\alpha-1.$$</p>' },
  { cls: 'key', title: '瑕积分判敛',
    body: '<p>$x\\to1^+$ 处 $\\int\\frac{\\mathrm dx}{(x-1)^p}$ 收敛 $\\iff p&lt;1$：</p>' +
          '<p>$$\\alpha-1&lt;1\\;\\Longleftrightarrow\\;\\alpha&lt;2.$$</p>' },
  { cls: '', title: '第二段换元',
    body: '<p>令 $u=\\ln x$，$\\mathrm du=\\dfrac{\\mathrm dx}{x}$：</p>' +
          '<p>$$\\int_{\\mathrm e}^{+\\infty}\\frac{\\mathrm dx}{x\\ln^{\\alpha+1}x}=\\int_1^{+\\infty}\\frac{\\mathrm du}{u^{\\alpha+1}}.$$</p>' },
  { cls: 'key', title: '无穷限判敛',
    body: '<p>$\\int_1^{+\\infty}\\dfrac{\\mathrm du}{u^{q}}$ 收敛 $\\iff q&gt;1$，这里 $q=\\alpha+1$：</p>' +
          '<p>$$\\alpha+1&gt;1\\;\\Longleftrightarrow\\;\\alpha&gt;0.$$</p>' },
  { cls: 'good', title: '取交集并对号',
    body: '<p>$\\{\\alpha&lt;2\\}\\cap\\{\\alpha&gt;0\\}=\\{0&lt;\\alpha&lt;2\\}$。A、C 含 $\\alpha\\le0$（第二段发散），B 含 $\\alpha\\ge2$（瑕点发散），只有 <b>D</b> 同时满足。</p>' },
];

AW.init({
  title: '$\\int_1^{+\\infty}f\\,\\mathrm dx$ 收敛的条件推演',
  subtitle: '考点：反常积分判敛 · 方法：拆段 → 标准幂型 → 取交集',
  counterLabel: '步数',
  ribbonTitle: '选项判定（A=1 · B=2 · C=3 · D=4）',
  intro: '点击「▶ 播放」逐步演示判敛过程。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一行'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'拆分', log:'积分拆成瑕积分与无穷限两段，都要收敛' },
    { cls:'step',  tag:'标准化', log:'第一段写成标准幂型，判敛参数 p=α−1' },
    { cls:'ok',    tag:'判敛一', log:'瑕积分收敛要求幂次小于 1，得 α<2' },
    { cls:'step',  tag:'换元', log:'第二段令 u=ln x，化成幂积分' },
    { cls:'ok',    tag:'判敛二', log:'无穷限收敛要求幂次大于 1，得 α>0' },
    { cls:'done',  tag:'完成', log:'交集为 0<α<2，答案 D', ribbon:{k:4, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 D（0 &lt; α &lt; 2）',
    html: '记忆锚点：<b>瑕积分看 $p&lt;1$，无穷限看 $q&gt;1$</b>——同样是幂积分，幂次与 1 的比较方向相反；两段判敛取交集，缺一即发散。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
