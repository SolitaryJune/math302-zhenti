<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2015·05 由复合关系反求 f(u,v) 再求偏导</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 推导板各行：与 snaps 一一对应（build 建立、render 按 i 点亮）
var ROWS = [
  { label: '第 0 步 · 审题',
    h: '<p>已知 $f\\Big(x+y,\\ \\dfrac{y}{x}\\Big)=x^2-y^2$。目标：先反求 $f(u,v)$ 的显式表达，再算 $\\left.\\dfrac{\\partial f}{\\partial u}\\right|_{(1,1)}$ 与 $\\left.\\dfrac{\\partial f}{\\partial v}\\right|_{(1,1)}$。</p>' },
  { label: '第 1 步 · 反解 x、y',
    h: '<p>令 $u=x+y,\\ v=\\dfrac{y}{x}$。由 $y=vx$ 代入第一式得 $u=x(1+v)$，解出 $$x=\\dfrac{u}{1+v},\\qquad y=\\dfrac{uv}{1+v}.$$</p>' },
  { label: '第 2 步 · 代回，凑平方差',
    h: '<p>$$x^2-y^2=(x+y)(x-y)=u\\cdot\\dfrac{u}{1+v}(1-v)=u^2\\cdot\\dfrac{1-v}{1+v},$$ 故 $f(u,v)=u^2\\,\\dfrac{1-v}{1+v}$。</p>' },
  { label: '第 3 步 · 对 u 求偏导',
    h: '<p>$\\dfrac{\\partial f}{\\partial u}=2u\\cdot\\dfrac{1-v}{1+v}$，在 $(1,1)$：$2\\cdot\\dfrac{1-1}{2}=0$ —— 因子 $1-v$ 在 $v=1$ 处为零。</p>' },
  { label: '第 4 步 · 对 v 求偏导（商法则）',
    h: '<p>$\\Big(\\dfrac{1-v}{1+v}\\Big)^{\\prime}=\\dfrac{-(1+v)-(1-v)}{(1+v)^2}=\\dfrac{-2}{(1+v)^2}$，故 $\\dfrac{\\partial f}{\\partial v}=\\dfrac{-2u^2}{(1+v)^2}$，在 $(1,1)$：$-\\dfrac{2}{4}=-\\dfrac12$。</p>' },
  { label: '第 5 步 · 结论',
    h: '<p>$$\\left.\\dfrac{\\partial f}{\\partial u}\\right|_{(1,1)}=0,\\qquad \\left.\\dfrac{\\partial f}{\\partial v}\\right|_{(1,1)}=-\\dfrac12,$$ 依次为 $0,\\ -\\tfrac12$，选 <b>D</b>。</p>' },
];

var rowEls = [];

AW.init({
  title: '由 $f\\big(x+y,\\tfrac{y}{x}\\big)=x^2-y^2$ 求 $\\partial f/\\partial u,\\ \\partial f/\\partial v$ 在 $(1,1)$ 的值',
  subtitle: '考点：多元复合函数 · 方法：反解 x、y → 显式化 f(u,v) → 求偏导 → 代值',
  counterLabel: '步骤',
  intro: '点击「▶ 播放」逐步演示推导板上的六步计算。',

  build: function(stage){
    stage.innerHTML = '';
    rowEls = [];
    var wrap = AW.el('div', 'aw-scroll');
    ROWS.forEach(function(r){
      var d = AW.el('div', '');
      d.style.cssText = 'padding:9px 14px;margin:8px 0;border-left:4px solid transparent;border-radius:10px;opacity:.15;transition:opacity .35s,background .35s,border-color .35s;';
      d.innerHTML = '<div style="font-size:12.5px;color:#64748b;font-weight:700;margin-bottom:2px">' + r.label + '</div>' + r.h;
      wrap.appendChild(d);
      rowEls.push(d);
    });
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'x、y 是中间量：先用 u、v 反解，再显式化 f(u,v)', count:0 },
    { cls:'step',  tag:'反解',   log:'y=vx 代入得 x=u/(1+v)、y=uv/(1+v)', count:1 },
    { cls:'ok',    tag:'代回',   log:'平方差凑成 (x+y)(x−y)，f(u,v)=u²(1−v)/(1+v)', count:2 },
    { cls:'ok',    tag:'∂f/∂u', log:'在 (1,1) 处因子 1−v 为零，偏导等于 0', count:3 },
    { cls:'ok',    tag:'∂f/∂v', log:'商法则得 −2u²/(1+v)²，代值 −1/2', count:4 },
    { cls:'done',  tag:'完成',   log:'依次 0、−1/2，选 D', count:5, done:true },
  ],

  render: function(stage, sn, i){
    rowEls.forEach(function(d, j){
      d.style.opacity = j <= i ? '1' : '.15';
      d.style.borderLeftColor = j < i ? '#16a34a' : (j === i ? '#d97706' : 'transparent');
      d.style.background = j === i ? '#fffbeb' : (j < i ? '#f6fef9' : 'transparent');
    });
    renderMathAfterSnap(stage);
  },

  result: {
    big: '0 与 −1/2（选 D）',
    html: '记忆锚点：<b>先反解、后代回</b>，把 $f(u,v)=u^2\\dfrac{1-v}{1+v}$ 显式化再动手求导。$\\dfrac{\\partial f}{\\partial u}$ 在 $(1,1)$ 因子 $1-v=0$ 归零；$\\dfrac{\\partial f}{\\partial v}$ 用商法则得 $\\dfrac{-2u^2}{(1+v)^2}=-\\dfrac12$。干扰项专设「顺序颠倒」「符号弄反」两种坑。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
