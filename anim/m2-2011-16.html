<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2011·16 参数方程的极值与凹凸拐点</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>审题 + 通行证</b>：$x=\\dfrac13t^3+t+\\dfrac13,\\ y=\\dfrac13t^3-t+\\dfrac13$。先查 $x'(t)=t^2+1>0$ 恒成立——$x$ 随 $t$ 严格增，按 $t$ 讨论符号可以放心搬到 $x$ 轴上。</p>",
  "<p><b>一阶导</b>：$$\\frac{\\mathrm dy}{\\mathrm dx}=\\frac{y'(t)}{x'(t)}=\\frac{t^2-1}{t^2+1},$$ 驻点 $t=\\pm1$（此处 $x'=2\\neq0$，确为函数极值）。</p>",
  "<p><b>符号表</b>（$t$ 与 $x$ 同向）：$$\\frac{\\mathrm dy}{\\mathrm dx}:\\ \\underbrace{+}_{t<-1}\\ \\underbrace{0}_{t=-1}\\ \\underbrace{-}_{-1<t<1}\\ \\underbrace{0}_{t=1}\\ \\underbrace{+}_{t>1}$$</p>",
  "<p><b>极大值</b>：$t=-1$ 处导数由正变负。$x=-\\dfrac13-1+\\dfrac13=-1$，$y=-\\dfrac13+1+\\dfrac13=1$，极大值 $y=1$（$x=-1$）。</p>",
  "<p><b>极小值</b>：$t=1$ 处导数由负变正。$x=\\dfrac13+1+\\dfrac13=\\dfrac53$，$y=\\dfrac13-1+\\dfrac13=-\\dfrac13$，极小值 $y=-\\dfrac13$（$x=\\dfrac53$）。</p>",
  "<p><b>二阶导</b>：$$\\frac{\\mathrm d^2y}{\\mathrm dx^2}=\\frac{\\dfrac{\\mathrm d}{\\mathrm dt}\\left(\\dfrac{t^2-1}{t^2+1}\\right)}{x'(t)}=\\frac{4t/(t^2+1)^2}{t^2+1}=\\frac{4t}{(t^2+1)^3}.$$</p>",
  "<p><b>凹凸判断</b>：$y''$ 的符号与 $t$ 相同。$t<0$（即 $x<\\dfrac13$）时 $y''<0$，曲线<b>凸</b>，凸区间 $\\left(-\\infty,\\dfrac13\\right)$；$t>0$（即 $x>\\dfrac13$）时 $y''>0$，曲线<b>凹</b>，凹区间 $\\left(\\dfrac13,+\\infty\\right)$。</p>",
  "<p><b>拐点</b>：$t=0$ 给出 $x=y=\\dfrac13$，凹凸性在此改变，拐点 $\\left(\\dfrac13,\\dfrac13\\right)$。</p>",
  "<p><b>结论</b>：极大值 $y=1$（$x=-1$）；极小值 $y=-\\dfrac13$（$x=\\dfrac53$）；凸区间 $\\left(-\\infty,\\dfrac13\\right)$，凹区间 $\\left(\\dfrac13,+\\infty\\right)$，拐点 $\\left(\\dfrac13,\\dfrac13\\right)$。</p>"
];

AW.init({
  title: '参数曲线 $\\begin{cases}x=\\frac13t^3+t+\\frac13\\\\ y=\\frac13t^3-t+\\frac13\\end{cases}$ 的极值与凹凸、拐点',
  subtitle: '考点：参数方程求导 · 方法：一阶导定极值（$t=\\pm1$）/ 二阶导定凹凸（$t=0$）',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示极值与拐点的求取过程。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',   log:'先查 x 对 t 的导数恒正，t 的左右关系就是 x 的左右关系', show:1, count:0 },
    { cls:'step',  tag:'一阶导', log:'y 对 x 的导数 = y 对 t 导除以 x 对 t 导，等于 (t²−1)/(t²+1)', show:2, count:1 },
    { cls:'step',  tag:'符号表', log:'t 从负到正：导数先正、过 −1 变负、过 1 再变正', show:3, count:2 },
    { cls:'ok',    tag:'极大',   log:'t=−1 处导数由正变负，是极大值：x=−1，y=1', show:4, count:3 },
    { cls:'ok',    tag:'极小',   log:'t=1 处导数由负变正，是极小值：x=5/3，y=−1/3', show:5, count:4 },
    { cls:'step',  tag:'二阶导', log:'二阶导 = 一阶导再对 t 求导后除以 x 的导数，得 4t/(t²+1)³', show:6, count:5 },
    { cls:'step',  tag:'凹凸',   log:'二阶导符号同 t：t<0（x<1/3）凸，t>0（x>1/3）凹', show:7, count:6 },
    { cls:'ok',    tag:'拐点',   log:'t=0 对应 x=y=1/3，凹凸性在此改变，是拐点', show:8, count:7 },
    { cls:'done',  tag:'完成',   log:'极值与拐点全部落定，答案汇总如右', show:9, count:8, done:true },
  ],

  result: {
    big: '极大值 $y=1$，极小值 $y=-\\dfrac13$，拐点 $\\left(\\dfrac13,\\dfrac13\\right)$',
    html: '记忆锚点：<b>参数方程先验证 $x\'(t)\\neq0$ 再动手</b>。极值看 $\\frac{\\mathrm dy}{\\mathrm dx}=\\frac{t^2-1}{t^2+1}$ 在 $t=\\pm1$ 的变号；拐点看二阶导 $\\frac{4t}{(t^2+1)^3}$ 的变号（$t=0$），最后务必把 $t$ 换算回 $x,y$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
