<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：幂级数系数读出高阶导数</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$f(x)=x^2\\ln(1-x)$：求 $f^{(n)}(0)$（$n\\ge3$）',
  subtitle: '考点：泰勒展开 · 方法：读 $x^n$ 系数，$f^{(n)}(0)=n!\\,a_n$',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步展开系数推导。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>思路</b>：逐阶求导不可行，改读麦克劳林系数——$f^{(n)}(0)=n!\\,a_n$，$a_n$ 是 $x^n$ 的系数',
      '<b>标准展开</b>：$$\\ln(1-x)=-\\sum_{k=1}^{\\infty}\\frac{x^k}{k}=-x-\\frac{x^2}{2}-\\frac{x^3}{3}-\\cdots\\quad(整体带负号)$$',
      '<b>乘 $x^2$</b>：$$f(x)=x^2\\ln(1-x)=-\\sum_{k=1}^{\\infty}\\frac{x^{k+2}}{k}=-x^3-\\frac{x^4}{2}-\\frac{x^5}{3}-\\cdots$$',
      '<b>对准 $x^n$</b>：令 $k+2=n$ 即 $k=n-2$（$n\\ge3$ 时 $k\\ge1$），系数 $a_n=-\\dfrac{1}{n-2}$',
      '<b>乘阶乘</b>：$f^{(n)}(0)=n!\\cdot\\left(-\\dfrac{1}{n-2}\\right)=-\\dfrac{n!}{n-2}$',
      '<b>验算 $n=3$</b>：展开式中 $x^3$ 系数为 $-1$，$f^{(3)}(0)=3!\\times(-1)=-6$，公式给 $-\\dfrac{3!}{3-2}=-6$ ✓',
      '<b>答案：$-\\dfrac{n!}{n-2}$，选 A</b>',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',  log:'不硬求导，改读幂级数系数，再乘 n 的阶乘', count:0 },
    { cls:'shift', tag:'展开',  log:'写出 ln(1-x) 的标准展开，全部系数带负号', count:1 },
    { cls:'step',  tag:'乘 x²', log:'整体乘 x²，每一项次数加 2', count:2 },
    { cls:'step',  tag:'对下标', log:'x 的 n 次方项对应 k = n−2，系数是负的 1/(n−2)', count:3 },
    { cls:'ok',    tag:'乘阶乘', log:'系数乘 n! 得 n 阶导数值', count:4 },
    { cls:'step',  tag:'验算',  log:'用 n=3 特例回代验证，两种算法都得 −6，吻合', count:5 },
    { cls:'done',  tag:'完成',  log:'结论：负的 n!/(n−2)，选 A', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$-\\dfrac{n!}{n-2}$（选 A）',
    html: '记忆锚点：<b>$f^{(n)}(0)=n!\\cdot a_n$</b>；$\\ln(1-x)=-\\sum_k\\frac{x^k}{k}$ 整体带负号。易错：乘 $x^2$ 后 $x^n$ 对应 $k=n-2$（下标错位）；阶乘是 $n!$ 不是 $(n-2)!$，负号别丢。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
