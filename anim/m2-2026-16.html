<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：规范形 y₁² 反推秩定 a+b</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：规范形读秩',
    cls: 'key',
    body: '<p>$AA^T$ 实对称，且 $x^T(AA^T)x=\\lVert A^Tx\\rVert^2\\ge0$ 恒成立——<b>半正定</b>，负惯性指数必为 $0$。规范形 $y_1^2$ 说明正惯性指数为 $1$，故 $$r(AA^T)=1.$$</p>' },
  { title: '秩降到 A 上',
    cls: 'key',
    body: '<p>实矩阵恒有 $r(AA^T)=r(A)$（$A^Tx=0$ 与 $(AA^T)x=0$ 同解），故 $$r(A)=1\\iff A\\text{ 的两行成比例}.$$</p>' },
  { title: '成比例列方程',
    cls: 'good',
    body: '<p>设 $(a+2,\\ 3,\\ -3a)=k(1,\\ b,\\ -1)$。由第 1、3 分量：$$k=a+2,\\qquad k=3a\\ \\Longrightarrow\\ a+2=3a\\ \\Longrightarrow\\ a=1,\\ k=3.$$</p>' },
  { title: '定 b',
    cls: 'good',
    body: '<p>由第 2 分量 $3=kb=3b$，得 $$b=1.$$</p>' },
  { title: '验证',
    cls: 'good',
    body: '<p>$a=1,b=1$ 时 $A=\\begin{pmatrix}1&1&-1\\\\3&3&-3\\end{pmatrix}$，两行成比例、$r(A)=1$，$AA^T$ 半正定秩 $1$，规范形恰为 $y_1^2$ ✓。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>$a+b=1+1=\\boxed{2}$。记忆锚点：<b>规范形只有 $r$ 个平方项、无负项 $\\Rightarrow$ 半正定且秩 $r$；$r(AA^T)=r(A)$ 是降维的钥匙</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '二次型 $x^T(AA^T)x$ 的规范形为 $y_1^2$，求 $a+b$',
  subtitle: '考点：二次型规范形与惯性指数 · $r(AA^T)=r(A)$ · 行成比例',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '$a+b=2$',
    html: '记忆锚点：<b>规范形 $y_1^2$ = 半正定 + 秩 1 ⇒ $r(A)=1$ ⇒ 两行成比例</b>。两个分量联立消 $k$ 得 $a=1$，再定 $b=1$。易错：把 $y_1^2$ 误当正定（正定是 $y_1^2+y_2^2$）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
