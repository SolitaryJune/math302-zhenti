<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2019·04 由通解反推微分方程系数 abc</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>审题</b>：二阶常系数线性方程的通解 = <b>齐次通解 + 特解</b>。题给通解 $y=(C_1+C_2x)\\mathrm{e}^{-x}+\\mathrm{e}^x$ 里，齐次部分携带特征根信息（定 $a,b$），特解 $\\mathrm{e}^x$ 代回方程（定 $c$）。</p>",
  "<p><b>读特征根</b>：齐次部分 $(C_1+C_2x)\\mathrm{e}^{-x}$ 是标准的<b>二重根结构</b>——口诀：$C_1\\mathrm{e}^{rx}$ 是单根，$(C_1+C_2x)\\mathrm{e}^{rx}$ 是二重根。故特征方程有二重根 $r_1=r_2=-1$：</p>",
  "<p>$$(r+1)^2=r^2+2r+1=0\\ \\Longrightarrow\\ a=2,\\quad b=1.$$</p>",
  "<p><b>代特解定 $c$</b>：特解 $y^*=\\mathrm{e}^x$（$1$ 不是特征根，形式合理）。代入方程左端 $y\'\'+2y\'+y$：三项分别是 $\\mathrm{e}^x$、$2\\mathrm{e}^x$、$\\mathrm{e}^x$。</p>",
  "<p>$$\\mathrm{e}^x+2\\mathrm{e}^x+\\mathrm{e}^x=4\\mathrm{e}^x=c\\,\\mathrm{e}^x\\ \\Longrightarrow\\ c=4.$$</p>",
  "<p><b>选项体检</b>：A、B 给 $a=1,b=0$，特征方程 $r^2+r=0$ 的根是 $0$ 与 $-1$，齐次通解应为 $C_1+C_2\\mathrm{e}^{-x}$，与题面结构对不上；C 给 $c=3$，是代特解时漏了一项——正确三项之和是 $1+2+1=4$。</p>",
  "<p><b>结论</b>：$a,b,c$ 依次为 $2,1,4$，<b>选 D</b>。</p>"
];

AW.init({
  title: '通解 $y=(C_1+C_2x)\\mathrm{e}^{-x}+\\mathrm{e}^x$ 反推 $a,b,c$',
  subtitle: '考点：二阶常系数微分方程 · 方法：齐次结构定 a,b，特解代回定 c',
  counterLabel: '已执行',
  intro: '点击「▶ 播放」逐步演示反推过程。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',     log:'通解拆成齐次通解加特解：前者定 a、b，后者定 c', show:1, count:0 },
    { cls:'step',  tag:'读根',     log:'齐次部分是二重根结构，特征根为重根负一', show:2, count:1 },
    { cls:'ok',    tag:'定 a,b',   log:'特征方程 r+1 的平方展开得 a=2、b=1', show:3, count:2, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'代特解',   log:'把 e 的 x 次方代入左端，三项分别得 1、2、1 倍', show:4, count:3 },
    { cls:'ok',    tag:'定 c',     log:'三项相加为 4 倍，故 c=4', show:5, count:4, ribbon:{k:2, ok:true} },
    { cls:'miss',  tag:'排错',     log:'A、B 的特征根对不上结构；C 的 c=3 是漏项', show:6, count:5 },
    { cls:'done',  tag:'完成',     log:'a,b,c = 2,1,4，答案选 D', show:7, count:6, done:true },
  ],

  result: {
    big: '答案 D：$a=2,\\ b=1,\\ c=4$',
    html: '记忆锚点：<b>$(C_1+C_2x)\\mathrm{e}^{rx}\\Rightarrow$ 二重根 $r$</b>，展开 $(r+1)^2=r^2+2r+1$ 得 $a=2,b=1$；特解 $\\mathrm{e}^x$ 代回时三项 $1+2+1=4$，一个都不能漏。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
