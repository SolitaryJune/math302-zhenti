<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011 数二第 5 题 · 乘积型二元函数的极小值条件</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：极小值的充分条件',
    cls: 'key',
    body: '<p>$z=f(x)g(y)$，已知 $f(0)>0$、$g(0)<0$、$f\'(0)=g\'(0)=0$。问「取极小值的充分条件」，就走<b>二元极值二阶判别法</b>：先验驻点，再查 $A>0$ 且 $AC-B^2>0$。</p>' },
  { title: '第一步：验证 (0,0) 是驻点',
    cls: 'good',
    body: '<p>$z_x=f\'(x)g(y)$，$z_y=f(x)g\'(y)$。在 $(0,0)$ 处：$z_x=f\'(0)g(0)=0$，$z_y=f(0)g\'(0)=0$，是驻点 ✓，满足讨论前提。</p>' },
  { title: '第二步：算 A、B、C',
    cls: 'key',
    body: '<p>乘积结构的偏导各只「打」自己的因子：$$A=z_{xx}=f\'\'(0)g(0),\\qquad B=z_{xy}=f\'(0)g\'(0)=0,\\qquad C=z_{yy}=f(0)g\'\'(0).$$</p>' },
  { title: '第三步：极小条件化简',
    cls: 'good',
    body: '<p>极小值充分条件：$A>0$ 且 $AC-B^2>0$。$B=0$，条件化简为 <b>$A>0$ 且 $C>0$</b>。</p>' },
  { title: '第四步：翻译成符号条件',
    cls: 'key',
    body: '<p>$A=f\'\'(0)g(0)>0$，除以负数 $g(0)<0$ 要变号 $\\Rightarrow f\'\'(0)<0$；$C=f(0)g\'\'(0)>0$，除以正数 $f(0)>0$ 不变号 $\\Rightarrow g\'\'(0)>0$。对照选项，A 符合。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p><b>选 A</b>（$f\'\'(0)<0,\\ g\'\'(0)>0$）。干扰项 D 的 $f\'\'(0)>0$ 正是忘了「除以 $g(0)<0$ 要变号」的典型失误。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '第 5 题 · $z=f(x)g(y)$ 在 $(0,0)$ 取极小值的充分条件',
  subtitle: '考点：二元函数极值二阶判别法 · 选项逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链：驻点 → A、B、C → 符号翻译。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 A',
    html: '充分条件 <b>$f\'\'(0)<0,\\ g\'\'(0)>0$</b>。记忆锚点：乘积结构里 $B=f\'(0)g\'(0)=0$ 自动消失，只需 $A>0$、$C>0$；而 $A=f\'\'(0)\\,g(0)$ 里<b>除以负数要变号</b>——这一步是 A 与 D 的分水岭。',
  },
});
</script>
</body>
</html>
