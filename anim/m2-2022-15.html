<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：玫瑰线一瓣的面积</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$r=\\sin3\\theta\\ (0\\le\\theta\\le\\frac{\\pi}{3})$ 一瓣的面积',
  subtitle: '考点：极坐标面积 · 方法：$S=\\frac12\\int r^2\\mathrm{d}\\theta$ + 二倍角降幂',
  counterLabel: '计算步',
  intro: '点击「▶ 播放」逐步演示面积计算。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$r=\\sin3\\theta$ 在 $0\\le\\theta\\le\\frac{\\pi}{3}$ 上从 $0$ 升到 $1$ 再回到 $0$ —— 恰好画出玫瑰线<b>一整瓣</b>，两端 $r=0$ 自动封闭',
      '<b>面积公式</b>（扇形微元 $\\frac12r^2\\mathrm{d}\\theta$）：$$S=\\frac{1}{2}\\int_0^{\\frac{\\pi}{3}}\\sin^23\\theta\\,\\mathrm{d}\\theta$$',
      '<b>二倍角降幂</b>（$\\sin^2t=\\frac{1-\\cos2t}{2}$，$t=3\\theta$ 角频率翻倍）：$$S=\\frac{1}{4}\\int_0^{\\frac{\\pi}{3}}\\bigl(1-\\cos6\\theta\\bigr)\\,\\mathrm{d}\\theta$$',
      '<b>求原函数</b>：$$S=\\frac{1}{4}\\Bigl[\\theta-\\frac{\\sin6\\theta}{6}\\Bigr]_0^{\\frac{\\pi}{3}}$$',
      '<b>代限</b>：$\\sin\\bigl(6\\cdot\\frac{\\pi}{3}\\bigr)=\\sin2\\pi=0$，下限处同样为 $0$，只剩 $\\frac{\\pi}{3}$',
      '<b>得值</b>：$$S=\\frac{1}{4}\\cdot\\frac{\\pi}{3}=\\frac{\\pi}{12}$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'θ 从 0 到 π/3，r 从 0 起、归 0 止，正是一瓣', count:0 },
    { cls:'shift', tag:'写公式', log:'极坐标面积带因子 1/2：S = ½∫r²dθ', count:1 },
    { cls:'shift', tag:'降幂',   log:'sin²3θ 降幂成 (1−cos6θ)/2，角频率翻倍到 6θ', count:2 },
    { cls:'step',  tag:'求原函数', log:'逐项积分：θ 减去 sin6θ/6，再整体乘 1/4', count:3 },
    { cls:'ok',    tag:'代限',   log:'sin2π=0，三角项两端都消掉，只剩 π/3', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：S = ¼ × π/3 = π/12', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$S=\\dfrac{\\pi}{12}$',
    html: '记忆锚点：<b>极坐标面积 $\\frac12\\int r^2\\mathrm{d}\\theta$ 自带因子 $\\frac12$</b>；\\sin^23\\theta$ 降幂后角频率是 $6\\theta$。本题一瓣恰占 $\\frac{\\pi}{3}$，$\\sin2\\pi=0$ 让三角项全部消失。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
