<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009 数二第 18 题 · 降阶解微分方程定曲线并求旋转体体积（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: "2009·18　由 $xy''-y'+2=0$ 定出曲线，再求绕 $y$ 轴的旋转体体积",
  subtitle: "考点：不显含 $y$ 的方程降阶 · 两个条件定两个常数 · <b>柱壳法</b>",
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，从解方程到算体积一气呵成。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      "<b>① 降阶：</b>方程 $xy''-y'+2=0$ 不显含 $y$，令 $p=y'$，得 $p'-\\dfrac1xp=-\\dfrac2x$",
      "<b>② 解出 $p$：</b>两边乘积分因子 $\\dfrac1x$，左端凑成商的导数：$\\Big(\\dfrac px\\Big)'=-\\dfrac{2}{x^2}\\ \\Rightarrow\\ \\dfrac px=\\dfrac2x+C_1\\ \\Rightarrow\\ p=2+C_1x$",
      "<b>③ 回代积分：</b>$y'=2+C_1x\\ \\Rightarrow\\ y=2x+Cx^2+C_2$（记 $C=\\dfrac{C_1}2$）",
      "<b>④ 条件一（过原点）：</b>$y(0)=0\\ \\Rightarrow\\ C_2=0$，曲线为 $y=2x+Cx^2$",
      "<b>⑤ 条件二（面积为 2）：</b>$$\\int_0^1(2x+Cx^2)\\,\\mathrm{d}x=1+\\frac C3=2\\ \\Rightarrow\\ C=3$$",
      "<b>⑥ 曲线确定：</b>$y=2x+3x^2$，在 $[0,1]$ 上 $y\\ge0$，符合非负函数的题设",
      "<b>⑦ 柱壳法：</b>绕 $y$ 轴旋转、区域横放在 $x$ 轴上方，取竖条壳最直接：$$V=2\\pi\\int_0^1 x\\,y\\,\\mathrm{d}x$$",
      "<b>⑧ 代入：</b>$$V=2\\pi\\int_0^1(2x^2+3x^3)\\,\\mathrm{d}x=2\\pi\\Big(\\frac23+\\frac34\\Big)$$",
      "<b>⑨ 结果：</b>$$V=2\\pi\\cdot\\frac{17}{12}=\\frac{17\\pi}{6}$$"
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'方程里不出现 y 本身，令一阶导数为 p 直接降阶', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'降阶',   log:'整理成 p 的一阶线性方程，标准形式右端是负的二除以 x', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'解 p',  log:'乘积分因子 x 分之一，左端凑成商的导数，积分得 p 等于 2 加常数倍 x', count:2, ribbon:{k:3, ok:true} },
    { cls:'step',  tag:'回代',  log:'把 p 换回 y 的导数再积分一次，得到含两个常数的曲线族', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'条件一', log:'曲线过原点：x 取零时 y 为零，第二个常数清零', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'条件二', log:'区域面积等于二：在零到一上积分曲线，解出 C 等于三', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'确认',  log:'曲线定为 2x 加 3x 平方，在整个区间上非负，符合题设', count:6, ribbon:{k:7, ok:true} },
    { cls:'step',  tag:'公式',  log:'绕 y 轴旋转选柱壳法：二派乘半径乘高，对 x 积分', count:7, ribbon:{k:8, ok:true} },
    { cls:'ok',    tag:'计算',  log:'代入曲线逐项积分：三分之二加四分之三', count:8, ribbon:{k:9, ok:true} },
    { cls:'done',  tag:'完成',  log:'结论：旋转体体积为十七派除以六', count:9, ribbon:{k:10, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$V=\\dfrac{17\\pi}{6}$',
    html: '本题链条：<b>降阶解方程</b> $\\to$ <b>双条件定常数</b> $\\to$ <b>柱壳法积分</b>。曲线 $y=2x+3x^2$（过原点 + 面积为 2 定出）。易错：绕 $y$ 轴硬用垫圈法要把 $x$ 反解成 $y$ 的函数，繁琐易错；柱壳法 $V=2\\pi\\int_0^1 xy\\,\\mathrm{d}x$ 一步到位。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
