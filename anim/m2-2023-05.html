<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：含 |t| 的参数函数逐级验导</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：|t| 必须分段消参',
    cls: 'key',
    log: 'x=2t+|t| 在 t=0 处 dx/dt 左 1 右 3，公式法失效，先分段得显式 f(x)',
    body: '<p>$|t|$ 意味着<b>分段函数</b>，以 $t=0$ 为界把 $x,y$ 各写两段，再消参得 $f(x)$ 的显式表达式；$f\'(0)$、$f\'$ 连续、$f\'\'(0)$ 三件事全靠左右两侧比较。</p>' },
  { title: '分段消参',
    cls: 'good',
    log: 't≥0 时 x=3t；t<0 时 x=t。得到两段显式表达式，两段在 0 处都是 0',
    body: '<p>$t\\ge0$：$x=3t,\\ y=t\\sin t\\Rightarrow f(x)=\\dfrac x3\\sin\\dfrac x3\\ (x\\ge0)$；$t<0$：$x=t,\\ y=-t\\sin t\\Rightarrow f(x)=-x\\sin x\\ (x<0)$。两段在 $x=0$ 都是 0，$f$ <b>连续</b>。</p>' },
  { title: '一阶导：两段表达式与极限',
    cls: 'step',
    log: '右段求导后趋于 0，左段求导后也趋于 0',
    body: '<p>$x>0$：$f\'(x)=\\dfrac13\\sin\\dfrac x3+\\dfrac x9\\cos\\dfrac x3\\to0$；$x<0$：$f\'(x)=-\\sin x-x\\cos x\\to0$。</p>' },
  { title: '判定① f′(0) 存在',
    cls: 'good',
    log: '差商两侧极限都是 0，f′(0)=0',
    ribbon: {k:1, ok:true},
    body: '<p>用定义：右差商 $\\dfrac{f(x)}x=\\dfrac{\\sin(x/3)}3\\to0$，左差商 $\\dfrac{-x\\sin x}x=-\\sin x\\to0$，故 $f\'(0)=0$ <b>存在</b>——A 的说法错。</p>' },
  { title: '判定② f′(x) 在 0 处连续',
    cls: 'good',
    log: 'lim f′(x) = 0 = f′(0)，导函数连续',
    ribbon: {k:2, ok:true},
    body: '<p>$\\lim\\limits_{x\\to0}f\'(x)=0=f\'(0)$，$f\'$ 在 $x=0$ 处<b>连续</b>——B、D 中「$f\'$ 不连续」的说法落空。</p>' },
  { title: '判定③ f″(0)：右 2/9 vs 左 −2',
    cls: 'step',
    log: '对 f′ 用定义取左右极限：右侧 2/9，左侧 −2',
    body: '<p>右侧：$\\lim\\limits_{x\\to0^+}\\dfrac{f\'(x)-0}x=\\lim\\Bigl(\\dfrac{\\sin(x/3)}{3x}+\\dfrac{\\cos(x/3)}9\\Bigr)=\\dfrac19+\\dfrac19=\\dfrac29$；左侧：$\\lim\\limits_{x\\to0^-}\\Bigl(-\\dfrac{\\sin x}x-\\cos x\\Bigr)=-2$。</p>' },
  { title: '裁决：f″(0) 不存在，选 C',
    cls: 'good',
    log: '2/9 ≠ −2，二阶导不存在；f′ 连续，选 C',
    ribbon: {k:3, ok:false},
    body: '<p>$\\dfrac29\\neq-2$，$f\'\'(0)$ <b>不存在</b>；而 $f\'$ 存在且连续——两条同时成立的只有 <b>C</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$x=2t+|t|,\\ y=|t|\\sin t$：连续性、一阶与二阶逐级判定',
  subtitle: '考点：参数方程 + 分段函数可导性 · 方法：分段消参 → 左右极限',
  counterLabel: '判定步',
  ribbonTitle: '三级判定（✓ 成立 / ✗ 不成立）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C（$f\'$ 连续，$f\'\'(0)$ 不存在）',
    html: '记忆锚点：<b>含 $|t|$ 的参数方程先分段消参</b>；判 $f\'\'(0)$ 对 $f\'$ 用定义取左右极限（本题左 $-2$、右 $\\dfrac29$）。易错：跳过消参直接对 $t$ 用公式——$\\dfrac{\\mathrm dx}{\\mathrm dt}$ 在 $t=0$ 左 1 右 3，公式失效。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
