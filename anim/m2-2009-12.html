<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2009·12 隐函数的二阶导数</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>定点</b>：$x=0$ 代入 $xy+\\mathrm e^y=x+1$：$\\mathrm e^y=1\\ \\Longrightarrow\\ y=0$。</p>",
  "<p><b>一阶求导</b>（$y$ 按 $y(x)$ 处理）：$$y+xy\'+\\mathrm e^y\\,y\'=1$$</p>",
  "<p>代入 $x=0,\\ y=0$：$0+0+y\'=1\\ \\Longrightarrow\\ y\'(0)=1$。</p>",
  "<p><b>二阶求导</b>（$xy\'$ 与 $\\mathrm e^y y\'$ 都是乘积，$\\mathrm e^y$ 还要链式）：$$2y\'+xy\'\'+\\mathrm e^y\\big[(y\')^2+y\'\'\\big]=0$$</p>",
  "<p>代入 $x=0,\\ y=0,\\ y\'=1$：$2+0+1\\cdot(1+y\'\')=0\\ \\Longrightarrow\\ y\'\'(0)=-3$。</p>",
  "<p><b>方法小结</b>：隐函数求高阶导不必解出通式——每求一次导就代入已知数值，逐层消元最快。</p>"
];

AW.init({
  title: '隐函数 $xy+\\mathrm e^y=x+1$ 在 $x=0$ 处的二阶导',
  subtitle: '考点：隐函数求导 · 方法：定点 → 一阶代值 → 二阶代值',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'定点',   log:'x = 0 时 e^y = 1，得 y = 0', show:1, count:0 },
    { cls:'step',  tag:'一阶',   log:'两边对 x 求导，逐项处理', show:2, count:1 },
    { cls:'ok',    tag:'代值',   log:'代 x=0、y=0，得 y′(0) = 1', show:3, count:2 },
    { cls:'step',  tag:'二阶',   log:'乘积法则加链式：xy′ 与 e^y·y′ 都要按乘积求导', show:4, count:3 },
    { cls:'ok',    tag:'代值',   log:'三个数值一次代入，解出 y″(0) = −3', show:5, count:4 },
    { cls:'done',  tag:'完成',   log:'答案 y″(0) = −3', show:6, count:5, done:true },
  ],

  result: {
    big: '$y\'\'(0) = -3$',
    html: '记忆锚点：<b>每求一阶就代一次值</b>。两个易错处：$xy\'$ 求导得 $y\'+xy\'\'$；$\\mathrm e^y$ 求导要带 $y\'$，二阶时出现 $\\mathrm e^y\\big[(y\')^2+y\'\'\\big]$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
