<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2019·01 x−tan x 的无穷小阶数</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>审题</b>：同阶无穷小的定义是存在 $k$ 使 $$\\lim_{x\\to0}\\frac{x-\\tan x}{x^k}=C\\neq0$$（有限非零）。所以只需找出分子 $x-\\tan x$ 的<b>最低次主部</b>：主部是几次幂，阶就是几。</p>",
  "<p><b>展开</b>：减法结构里等价无穷小会失效（$\\tan x\\sim x$ 一减就成 0），必须用泰勒展开到三次项：$$\\tan x=x+\\frac{1}{3}x^3+o(x^3).$$</p>",
  "<p><b>定主部</b>：相减把主部减了出来 $$x-\\tan x=x-\\Big(x+\\frac13x^3+o(x^3)\\Big)=-\\frac{1}{3}x^3+o(x^3).$$ 主部是三次幂——目标锁定 $k=3$。</p>",
  "<p><b>验证 $k=3$</b>：$$\\lim_{x\\to0}\\frac{x-\\tan x}{x^3}=\\lim_{x\\to0}\\frac{-\\frac13x^3+o(x^3)}{x^3}=-\\frac13\\neq0.$$ 极限有限且非零，$x-\\tan x$ 与 $x^3$ 同阶。</p>",
  "<p><b>排除 A（$k=1$）</b>：$\\dfrac{-\\frac13x^3}{x}\\to0$，$x-\\tan x$ 是 $x$ 的<b>高阶</b>无穷小，不同阶。</p>",
  "<p><b>排除 B（$k=2$）</b>：$\\dfrac{-\\frac13x^3}{x^2}\\to0$，仍是高阶，不同阶。</p>",
  "<p><b>排除 D（$k=4$）</b>：$\\dfrac{-\\frac13x^3}{x^4}\\to\\infty$，$x-\\tan x$ 比 $x^4$ <b>低阶</b>，也不同阶。</p>",
  "<p><b>结论</b>：主部 $-\\frac13x^3$ 一锤定音——除以 $x^3$ 剩 $-\\frac13$（非零有限），$k=3$，<b>选 C</b>。</p>"
];

AW.init({
  title: '当 $x\\to0$ 时 $x-\\tan x$ 是几阶无穷小？',
  subtitle: '考点：无穷小比较 · 方法：泰勒展开定主部',
  counterLabel: '已执行',
  intro: '点击「▶ 播放」逐步演示定阶过程。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',   log:'同阶的定义：比值极限存在且非零，先找最低次主部', show:1, count:0 },
    { cls:'step',  tag:'展开',   log:'tan x 的麦克劳林展开取到三次项', show:2, count:1 },
    { cls:'ok',    tag:'定主部', log:'相减后主部是负的三分之一 x 三次方', show:3, count:2 },
    { cls:'ok',    tag:'验证',   log:'除以 x 三次方得负三分之一，非零有限，同阶成立', show:4, count:3, ribbon:{k:3, ok:true} },
    { cls:'miss',  tag:'排除A',  log:'k=1 时比值趋于零，是高阶不是同阶', show:5, count:4, ribbon:{k:1, ok:false} },
    { cls:'miss',  tag:'排除B',  log:'k=2 时比值仍趋于零，排除', show:6, count:5, ribbon:{k:2, ok:false} },
    { cls:'miss',  tag:'排除D',  log:'k=4 时比值发散，是低阶，排除', show:7, count:6, ribbon:{k:4, ok:false} },
    { cls:'done',  tag:'完成',   log:'k=3，答案选 C', show:8, count:7, done:true },
  ],

  result: {
    big: '答案 C：$k=3$',
    html: '记忆锚点：<b>$x-\\tan x=-\\dfrac13x^3+o(x^3)$，三阶无穷小</b>。减法结构里等价无穷小不能相减（$\\tan x\\sim x$ 会减成 0），必须泰勒展开；$k=1,2$ 时比值为 0（高阶）、$k=4$ 时发散（低阶），均不同阶。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
