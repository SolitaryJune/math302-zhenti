<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·06 对称区域上的二重积分</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];   // 推导板的持久 DOM 行

var LINES = [
  "<p><b>写出区域</b>：$D=\\left\\{(x,y):-\\tfrac{\\pi}{2}\\le x\\le\\tfrac{\\pi}{2},\\ \\sin x\\le y\\le1\\right\\}$，下边界 $y=\\sin x$、上边界 $y=1$、左右 $x=\\pm\\tfrac{\\pi}{2}$，<b>关于 $y$ 轴对称</b>。拆被积函数：$$\\iint_D(xy^{5}-1)\\,\\mathrm{d}\\sigma=\\iint_D xy^{5}\\,\\mathrm{d}\\sigma+\\iint_D(-1)\\,\\mathrm{d}\\sigma$$</p>",
  "<p><b>第一块先积 $y$</b>：$\\int_{\\sin x}^{1}y^{5}\\,\\mathrm{d}y=\\dfrac{1-\\sin^{6}x}{6}$。</p>",
  "<p><b>奇偶性清零</b>：$x$ 是奇函数，$\\dfrac{1-\\sin^{6}x}{6}$ 是偶函数，乘积为<b>奇函数</b>，在对称区间上 $$\\int_{-\\pi/2}^{\\pi/2}x\\cdot\\frac{1-\\sin^{6}x}{6}\\,\\mathrm{d}x=0.$$</p>",
  "<p><b>第二块 = 负的面积</b>：$$\\iint_D(-1)\\,\\mathrm{d}\\sigma=-\\int_{-\\pi/2}^{\\pi/2}\\Big(\\int_{\\sin x}^{1}\\mathrm{d}y\\Big)\\mathrm{d}x=-\\int_{-\\pi/2}^{\\pi/2}(1-\\sin x)\\,\\mathrm{d}x.$$</p>",
  "<p><b>算面积</b>：$\\sin x$ 是奇函数，对称区间上积分为 $0$，故面积 $=\\int_{-\\pi/2}^{\\pi/2}1\\,\\mathrm{d}x=\\pi$，第二块 $=-\\pi$。</p>",
  "<p><b>合并</b>：$$0+(-\\pi)=-\\pi$$</p>",
  "<p><b>结论</b>：$\\iint_D(xy^{5}-1)\\,\\mathrm{d}\\sigma=-\\pi$，<b>选 D</b>。</p>"
];

AW.init({
  title: '对称区域上的二重积分：$\\iint_D(xy^{5}-1)\\,\\mathrm{d}\\sigma$',
  subtitle: '考点：二重积分与奇偶对称性 · 方法：拆块 → 奇函数清零 → 常数项 = 负面积',
  counterLabel: '已推演',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'拆块',    log:'区域上下界是 y=1 与 y=sin x，关于 y 轴对称；被积函数拆成 xy⁵ 和 −1 两块', show:1, count:0 },
    { cls:'step',  tag:'先积 y',  log:'内层积分 y⁵ 从 sin x 积到 1，得 (1−sin⁶x)/6', show:2, count:1 },
    { cls:'ok',    tag:'清零',    log:'x 是奇函数、(1−sin⁶x)/6 是偶函数，乘积为奇，对称区间上积分为 0', show:3, count:2 },
    { cls:'step',  tag:'负面积',  log:'−1 的积分就是区域面积的相反数，化作一重积分', show:4, count:3 },
    { cls:'ok',    tag:'算面积',  log:'sin x 项奇函数归零，面积就是区间长度 π', show:5, count:4 },
    { cls:'ok',    tag:'合并',    log:'第一块 0，第二块 −π，相加得 −π', show:6, count:5 },
    { cls:'done',  tag:'完成',    log:'结论：积分 = −π，选 D', show:7, count:6, done:true },
  ],

  result: {
    big: '积分 = −π（选 D）',
    html: '记忆锚点：<b>先拆块，奇偶清零，常数项收尾</b>。$xy^{5}$ 经"先 $y$ 后 $x$"拆出奇函数整体，对称区域上归零；剩下 $\\iint_D(-1)\\,\\mathrm{d}\\sigma=-\\,\\text{面积}=-\\pi$（$\\sin$ 项在对称区间上积分为 0）。只算 $xy^{5}$ 得 0 就选 A 是最常见的翻车点。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
