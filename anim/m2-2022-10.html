<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：向量组等价的参数范围</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$\\{\\alpha_1,\\alpha_2,\\alpha_3\\}$ 与 $\\{\\alpha_1,\\alpha_2,\\alpha_4\\}$ 等价的 $\\lambda$ 范围',
  subtitle: '考点：向量组等价与秩 · 方法：两个行列式 + 特值逐情形讨论',
  counterLabel: '讨论步',
  intro: '点击「▶ 播放」逐步展开分类讨论。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：两组共用 $\\alpha_1,\\alpha_2$。等价 $\\iff$ 秩相等且等于合并组的秩：$$r(\\alpha_1,\\alpha_2,\\alpha_3)=r(\\alpha_1,\\alpha_2,\\alpha_4)=r(\\alpha_1,\\alpha_2,\\alpha_3,\\alpha_4)$$',
      '<b>行列式一</b>：$$\\bigl|\\alpha_1,\\alpha_2,\\alpha_3\\bigr|=\\begin{vmatrix}\\lambda&1&1\\\\1&\\lambda&1\\\\1&1&\\lambda\\end{vmatrix}=(\\lambda+2)(\\lambda-1)^2$$',
      '<b>行列式二</b>：$$\\bigl|\\alpha_1,\\alpha_2,\\alpha_4\\bigr|=\\begin{vmatrix}\\lambda&1&1\\\\1&\\lambda&\\lambda\\\\1&1&\\lambda^2\\end{vmatrix}=(\\lambda-1)^2(\\lambda+1)^2$$',
      '<b>$\\lambda=1$</b>：四个向量全为 $(1,1,1)^{\\mathrm T}$，两组秩都是 $1$，<b>等价 ✓（可取）</b>',
      '<b>$\\lambda=-2$</b>：第一组秩 $2$（行列式 $=0$），第二组秩 $3$（行列式 $=9\\neq0$），秩不等，<b>不等价 ✗</b>',
      '<b>$\\lambda=-1$</b>：第一组秩 $3$（行列式 $=4\\neq0$），第二组中 $\\alpha_2=\\alpha_4$ 秩 $2$，秩不等，<b>不等价 ✗</b>',
      '<b>其余 $\\lambda$</b>（$\\lambda\\neq-1,-2$）：两个行列式都非零，两组秩都是 $3$，都张成 $\\mathbf R^3$，<b>等价 ✓</b>',
      '<b>结论</b>：等价 $\\iff\\lambda\\neq-1$ 且 $\\lambda\\neq-2$（$\\lambda=1$ 允许），<b>选 C</b>',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'秩条件',   log:'两组共用 α₁,α₂，等价 ⟺ 三个秩相等', count:0 },
    { cls:'shift', tag:'行列式一', log:'第一组是循环型行列式，分解出 (λ+2)(λ−1)²', count:1 },
    { cls:'shift', tag:'行列式二', log:'第二组算出 (λ−1)²(λ+1)²', count:2 },
    { cls:'ok',    tag:'λ=1',     log:'四个向量退化为同一个，秩 1=1，等价成立，λ=1 可取', count:3 },
    { cls:'miss',  tag:'λ=−2',    log:'第一组秩 2、第二组秩 3，秩不等，排除 λ=−2', count:4 },
    { cls:'miss',  tag:'λ=−1',    log:'第二组中 α₂=α₄，秩 2 对 3，排除 λ=−1', count:5 },
    { cls:'ok',    tag:'其余λ',    log:'两个行列式都非零，两组秩都是 3，都等价', count:6 },
    { cls:'done',  tag:'完成',     log:'结论：λ≠−1 且 λ≠−2，选 C', count:7, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\lambda\\neq-1$ 且 $\\lambda\\neq-2$（选 C）',
    html: '记忆锚点：<b>两个行列式各封死一个值</b>：$\\lambda=-2$ 让第一组掉秩、$\\lambda=-1$ 让第二组掉秩（$\\alpha_2=\\alpha_4$）；而 $\\lambda=1$ 时四向量全相同反而等价——带平方因子 $(\\lambda-1)^2$ 的零点<b>不排除</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
