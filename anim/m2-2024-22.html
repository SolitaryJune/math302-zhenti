<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2024·22 解空间真包含定参数 + 正交变换化标准形</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：翻译成解空间语言',
    cls: 'key',
    body: '<p>「$A\\boldsymbol x=\\boldsymbol 0$ 的解均是 $B^{\\mathrm T}\\boldsymbol x=\\boldsymbol 0$ 的解，但两方程组不同解」$\\iff$</p>' +
          '$$N(A)\\subsetneq N(B^{\\mathrm T})\\quad(\\text{真包含}).$$' },
  { title: '维数比较',
    cls: '',
    body: '<p>$A=\\begin{pmatrix}0&1&a\\\\1&0&1\\end{pmatrix}$ 两行无关，$r(A)=2$，故 $\\dim N(A)=3-2=1$。真包含要求</p>' +
          '$$\\dim N(B^{\\mathrm T})\\ge2\\ \\Longleftrightarrow\\ r(B^{\\mathrm T})\\le1.$$' },
  { title: '先定 $b$',
    cls: 'good',
    body: '<p>$B^{\\mathrm T}=\\begin{pmatrix}1&1&b\\\\1&1&2\\end{pmatrix}$，两行成比例 $\\iff b=2$，此时 $r(B^{\\mathrm T})=1$、$\\dim N(B^{\\mathrm T})=2$。</p>' +
          '<p>（若 $r(B^{\\mathrm T})=2$，则两个解空间都是 $1$ 维，包含变同解，与「不同解」矛盾。）</p>' },
  { title: '再定 $a$：第 (1) 问完成',
    cls: 'good',
    body: '<p>解 $A\\boldsymbol x=\\boldsymbol 0$：$x_2+ax_3=0,\\ x_1+x_3=0$，基础解系 $\\boldsymbol\\xi=(-1,-a,1)^{\\mathrm T}$。它必须满足 $x_1+x_2+2x_3=0$：</p>' +
          '$$-1-a+2=0\\ \\Longrightarrow\\ a=1.$$' +
          '<p>$\\dim N(A)=1<2$，真包含成立：<b>$a=1,\\ b=2$</b>。</p>' },
  { title: '第 (2) 问：写二次型矩阵',
    cls: 'key',
    body: '<p>代入 $a=1,b=2$：</p>' +
          '$$BA=\\begin{pmatrix}1&1\\\\1&1\\\\2&2\\end{pmatrix}\\begin{pmatrix}0&1&1\\\\1&0&1\\end{pmatrix}=\\begin{pmatrix}1&1&2\\\\1&1&2\\\\2&2&4\\end{pmatrix}.$$' +
          '<p>它<b>恰已对称</b>，故二次型矩阵 $S=BA$；且 $S=\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T}$，$\\boldsymbol\\alpha=(1,1,2)^{\\mathrm T}$，$r(S)=1$。</p>' },
  { title: '特征值：秩 1 直接读出',
    cls: '',
    body: '<p>秩 $1$ 的对称阵只有一个非零特征值，等于迹：</p>' +
          '$$\\lambda_1=\\operatorname{tr}(S)=1+1+4=6,\\qquad \\lambda_2=\\lambda_3=0.$$' },
  { title: '求正交特征向量组',
    cls: '',
    body: '<p>$\\lambda=6$：特征向量即 $\\boldsymbol\\alpha$，$q_3=\\dfrac1{\\sqrt6}(1,1,2)^{\\mathrm T}$。</p>' +
          '<p>$\\lambda=0$：解 $x_1+x_2+2x_3=0$，在解平面内取两个<b>互相正交</b>的单位向量：$q_1=\\dfrac1{\\sqrt2}(-1,1,0)^{\\mathrm T}$，$q_2=\\dfrac1{\\sqrt3}(-1,-1,1)^{\\mathrm T}$。三者两两正交。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>令 $Q=(q_1,q_2,q_3)$（正交阵），在 $\\boldsymbol x=Q\\boldsymbol y$ 下：</p>' +
          '$$f=0\\cdot y_1^2+0\\cdot y_2^2+6y_3^2=6y_3^2.$$' +
          '<p>$Q$ 不唯一（特征向量取法/排列不同），但非零系数必为 $6$。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title.replace(/\$/g, ''),
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '【2024·22】由解空间真包含定 $a,b$，正交变换化 $f=\\boldsymbol x^{\\mathrm T}BA\\boldsymbol x$ 为标准形',
  subtitle: '考点：解空间与秩 · 实对称矩阵正交对角化 · 二次型标准形',
  intro: '点击「▶ 播放」逐步展开推理链。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '$a=1,\\ b=2$；标准形 $f=6y_3^2$',
    html: '<p>记忆锚点：<b>「解均是解但不同解」$\\Rightarrow N(A)\\subsetneq N(B^{\\mathrm T})\\Rightarrow$ 维数严格变大</b>，先定 $r(B^{\\mathrm T})\\le1$ 得 $b=2$，再代基础解系得 $a=1$。</p>' +
          '<p>易错：$f$ 的矩阵一般要对称化 $\\tfrac12(BA+(BA)^{\\mathrm T})$（本题 $BA$ 恰已对称但要写明）；秩 $1$ 矩阵非零特征值 $=\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol\\alpha=6$；$\\lambda=0$ 的两个特征向量要先正交化再单位化。</p>',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
