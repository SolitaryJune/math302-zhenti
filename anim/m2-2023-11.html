<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：等价无穷小定参数 ab</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$f=ax+bx^2+\\ln(1+x)$ 与 $g=\\mathrm e^{x^2}-\\cos x$ 等价，求 $ab$',
  subtitle: '考点：等价无穷小 + 泰勒展开 · 方法：逐阶对齐首项系数',
  counterLabel: '对齐步',
  intro: '点击「▶ 播放」逐步演示：先展 g 定阶，再展 f 对系数。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$f\\sim g\\iff$ 两者同阶且首项系数相等。先把 $g$ 展开定出「模板」',
      '<b>展开 g</b>：$$g=\\Bigl(1+x^2+\\frac{x^4}2+\\cdots\\Bigr)-\\Bigl(1-\\frac{x^2}2+\\frac{x^4}{24}+\\cdots\\Bigr)=\\frac32x^2+o(x^2)$$ $g$ 是 <b>2 阶</b>无穷小，首项系数 $\\dfrac32$',
      '<b>展开 f</b>：由 $\\ln(1+x)=x-\\dfrac{x^2}2+o(x^2)$，$$f=(a+1)x+\\Bigl(b-\\frac12\\Bigr)x^2+o(x^2)$$',
      '<b>一次项归零</b>：$f$ 必须也是 2 阶——一次项必须消失 $$a+1=0\\quad\\Rightarrow\\quad a=-1$$',
      '<b>二次项对齐</b>：首项系数与 $g$ 相等 $$b-\\frac12=\\frac32\\quad\\Rightarrow\\quad b=2$$',
      '<b>结算</b>：$$ab=(-1)\\times2=\\boxed{-2}$$ 复核：此时 $f=\\dfrac32x^2+o(x^2)\\sim g$ ✓',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'等价就是同阶同系数，先把右边的函数展开定阶', count:0 },
    { cls:'shift', tag:'展 g',   log:'两个展开相减，常数抵消，剩二阶项 3/2 x²', count:1 },
    { cls:'shift', tag:'展 f',   log:'ln(1+x) 展到二阶，与 ax、bx² 合并同类项', count:2 },
    { cls:'step',  tag:'消一次', log:'一次项必须消失，否则阶数对不上，解出 a = −1', count:3 },
    { cls:'step',  tag:'对系数', log:'二阶系数等于 3/2，解出 b = 2', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：ab = −2，代回验证等价成立', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$ab=-2$',
    html: '记忆锚点：<b>等价 $\\iff$ 同阶 + 首项系数相等，泰勒展开逐阶对齐</b>。易错：忘了先让一次项归零（$a\\neq-1$ 时阶数都不同）；$\\ln(1+x)$ 的二次系数是 $-\\dfrac12$，记成正的会解出 $b=1$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
