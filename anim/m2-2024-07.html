<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2024·07 反常积分敛散三命题真假</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：三命题 = 两反例 + 一证明',
    cls: 'key',
    tag: '策略',
    body: '<p>$f\\ge0$ 连续。三个命题：<b>(1)</b> $\\int_0^{+\\infty}f^2$ 收敛 $\\Rightarrow\\int f$ 收敛？<b>(2)</b> 有 $p>1$ 使 $x^pf(x)$ 有极限 $\\Rightarrow\\int f$ 收敛？<b>(3)</b> $\\int f$ 收敛 $\\Rightarrow$ 存在这样的 $p$？打法：证真用<b>比较判别法</b>，证伪用<b>构造反例</b>。</p>',
    log: '(1)(3) 找反例，(2) 用比较判别法' },
  { title: '命题 (1) 假：f = 1/(x+1)',
    cls: 'bad',
    tag: '(1) ✗',
    ribbon: {k:1, ok:false},
    body: '<p>取 $f(x)=\\dfrac1{x+1}$（非负连续）：$$\\int_0^{+\\infty}\\frac{\\mathrm dx}{(x+1)^2}=1\\ \\text{收敛},\\qquad \\int_0^{+\\infty}\\frac{\\mathrm dx}{x+1}=\\lim_{b\\to+\\infty}\\ln(b+1)=+\\infty.$$ 平方可积推不出本身可积——$f$ 只是"一阶小"，平方后才到"二阶小"。命题 (1) 错。</p>',
    log: 'f=1/(x+1)：平方收敛但本身发散，(1) 假' },
  { title: '命题 (2) 真：比较判别法一步到位',
    cls: 'good',
    tag: '(2) ✓',
    ribbon: {k:2, ok:true},
    body: '<p>设 $\\lim\\limits_{x\\to+\\infty}x^pf(x)=L$（$p>1$）。由极限定义，存在 $X$ 使 $x\\ge X$ 时 $0\\le f(x)\\le\\dfrac{L+1}{x^p}$。因 $p>1$，$\\displaystyle\\int_X^{+\\infty}\\frac{L+1}{x^p}\\,\\mathrm dx$ 收敛，比较判别法给出 $\\displaystyle\\int_X^{+\\infty}f$ 收敛；$[0,X]$ 上连续积分为有限值。<b>命题 (2) 真</b>。</p>',
    log: 'f(x)≤(L+1)/x^p，p>1 压住，(2) 真' },
  { title: '命题 (3) 假：高瘦尖峰反例',
    cls: 'bad',
    tag: '(3) ✗',
    ribbon: {k:3, ok:false},
    body: '<p>在 $x=n\\ (n\\ge2)$ 处放底宽 $\\dfrac2{n^3}$、峰高 $n$ 的三角形尖峰（峰间 $f=0$，连续保持）：第 $n$ 个峰面积 $=\\dfrac12\\cdot\\dfrac2{n^3}\\cdot n=\\dfrac1{n^2}$，故 $\\displaystyle\\int_0^{+\\infty}f=\\sum_{n\\ge2}\\frac1{n^2}$ 收敛。但峰顶处 $x^pf(x)=n^p\\cdot n=n^{p+1}\\to+\\infty$，谷底处为 $0$——对<b>任何</b> $p>1$，$x^pf(x)$ 都在 $0$ 与 $\\infty$ 之间横跳，极限不存在。(3) 错。</p>',
    log: '尖峰：积分收敛但 x^p·f 无极限，(3) 假' },
  { title: '计数：真命题只有 (2)',
    cls: 'good',
    tag: '计数',
    body: '<p>(1) 假、(2) 真、(3) 假——真命题个数 $=1$，对应选项 <b>B</b>。</p>',
    log: '真命题 1 个，选 B' },
  { title: '干扰项复盘',
    cls: 'bad',
    tag: '防坑',
    body: '<p><b>A（0 个）</b>：漏了 (2)——$x^pf$ 有极限意味着尾部衰减快于 $\\frac1{x^p}$，比较判别法稳真。<b>C（2 个）</b>：把 (1) 或 (3) 当真——(1) 缺"单调/有界"类条件，(3) 是 (2) 的<b>逆命题</b>，方向反了不成立。<b>D（3 个）</b>：(1)(3) 都有具体反例，不可能全真。</p>',
    log: 'A 漏(2)，C/D 把(1)(3)当真' },
  { title: '结论',
    cls: 'good',
    tag: '完成',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>平方可积 ⇏ 可积</b>（$\\frac1{x+1}$）；<b>$x^pf$ 有极限 $\\Rightarrow$ 可积</b>（$p>1$ 比较判别）；<b>可积 ⇏ 逐点衰减</b>（高瘦尖峰，面积 $\\sum\\frac1{n^2}$ 收敛但峰值 $\\to\\infty$）。</p>',
    log: '选 B：真命题只有 (2)' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.log || s.title,
    count: i,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '反常积分敛散性：三个命题的真假判定',
  subtitle: '考点：反常积分 · 方法：比较判别法（证真）+ 反例（证伪）',
  counterLabel: '命题进度',
  ribbonTitle: '命题判定（✓ 真 / ✗ 假）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B（真命题 1 个：只有 (2)）',
    html: '记忆锚点：(1) 反例 $f=\\frac1{x+1}$——$\\int f^2$ 收敛而 $\\int f$ 发散；(2) $x^pf(x)\\le L+1$ 配 $p$-积分比较，真；(3) 高瘦尖峰（峰高 $n$、底宽 $\\frac2{n^3}$）——可积但 $x^pf$ 无极限。<b>(3) 是 (2) 的逆命题，天然可疑</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
