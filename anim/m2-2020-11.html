<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：复合函数求全微分</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$z=\\arctan\\left[xy+\\sin(x+y)\\right]$：求 $\\mathrm{d}z\\big|_{(0,\\pi)}$',
  subtitle: '考点：多元复合函数微分 · 方法：链式法则 + 先代点再化简',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示全微分的组装。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>拆结构</b>：外层 $z=\\arctan u$，内层 $u=xy+\\sin(x+y)$；目标 $\\mathrm{d}z=z_x\\,\\mathrm{d}x+z_y\\,\\mathrm{d}y$ 在 $(0,\\pi)$ 的值',
      '<b>先算内层在该点的值</b>：$u\\big|_{(0,\\pi)}=0\\cdot\\pi+\\sin\\pi=0$，故外层因子 $\\dfrac{1}{1+u^2}\\Big|_{(0,\\pi)}=1$',
      '<b>内层偏导</b>：$u_x=y+\\cos(x+y)$，$u_y=x+\\cos(x+y)$',
      '<b>链式法则</b>：$z_x=\\dfrac{u_x}{1+u^2}$，$z_y=\\dfrac{u_y}{1+u^2}$',
      '<b>代入 $(0,\\pi)$</b>：$\\cos(0+\\pi)=-1$，故 $z_x\\big|_{(0,\\pi)}=\\pi-1$，$z_y\\big|_{(0,\\pi)}=0-1=-1$',
      '<b>组装</b>：$$\\mathrm{d}z\\Big|_{(0,\\pi)}=(\\pi-1)\\,\\mathrm{d}x-\\mathrm{d}y$$',
      '<b>答案：$(\\pi-1)\\,\\mathrm{d}x-\\mathrm{d}y$</b>',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'外层 arctan，内层 xy 加 sin(x+y)，目标是该点的全微分', count:0 },
    { cls:'shift', tag:'算内层', log:'先代点：u 在 (0,π) 处等于 0，外层因子 1/(1+u²) 退化为 1', count:1 },
    { cls:'step',  tag:'内层导', log:'u 对 x 出 y，对 y 出 x，各加一个 cos(x+y)', count:2 },
    { cls:'step',  tag:'链式',   log:'z 的偏导 = 内层偏导 × 外层导数 1/(1+u²)', count:3 },
    { cls:'ok',    tag:'代点',   log:'cos π = −1，z_x = π−1，z_y = −1', count:4 },
    { cls:'step',  tag:'组装',   log:'全微分 = z_x dx + z_y dy', count:5 },
    { cls:'done',  tag:'完成',   log:'结论：dz = (π−1)dx − dy', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$(\\pi-1)\\,\\mathrm{d}x-\\mathrm{d}y$',
    html: '记忆锚点：<b>先算内层函数在该点的值</b>——$u(0,\\pi)=0$ 使外层因子 $\\frac{1}{1+u^2}$ 退化为 1，计算量骤减。易错：$\\cos\\pi=-1$ 别记成 $1$；$u_x$ 出 $y$、$u_y$ 出 $x$，别对调。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
