<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-23 P 可逆性与 P⁻¹AP · 推理链</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '(1) 反证：α 与 Aα 线性无关',
    cls: 'key',
    body: '<p>假设 $\\alpha,\\ A\\alpha$ 线性相关。因 $\\alpha\\neq0$，存在数 $\\lambda$ 使 $A\\alpha=\\lambda\\alpha$——这说明 $\\alpha$ 是 $A$ 的特征向量，与题设<b>矛盾</b>。</p><p>故两列线性无关，$r(P)=2$，$P$ 可逆。</p>' },
  { title: '(2) 把 A²α 用基 {α, Aα} 表出',
    cls: 'key',
    body: '<p>由 $A^2\\alpha+A\\alpha-6\\alpha=0$ 移项：</p><p>$$A\\alpha=0\\cdot\\alpha+1\\cdot(A\\alpha),\\qquad A(A\\alpha)=A^2\\alpha=6\\cdot\\alpha+(-1)\\cdot(A\\alpha).$$</p><p>两列的坐标分别是 $(0,1)^{\\mathrm T}$ 与 $(6,-1)^{\\mathrm T}$。</p>' },
  { title: '(2) 按列拼出 AP = P·B',
    cls: 'good',
    body: '<p>$P^{-1}AP$ 的第 $j$ 列 = $Ap_j$ 在基 $\\{\\alpha,A\\alpha\\}$ 下的坐标，按列拼装：</p><p>$$A(\\alpha,\\ A\\alpha)=(A\\alpha,\\ 6\\alpha-A\\alpha)=(\\alpha,\\ A\\alpha)\\begin{pmatrix}0&6\\\\1&-1\\end{pmatrix}.$$</p><p>两边左乘 $P^{-1}$（第 (1) 问已证可逆）：</p><p>$$P^{-1}AP=\\begin{pmatrix}0&6\\\\1&-1\\end{pmatrix}.$$</p>' },
  { title: '(2) 判 A 是否相似于对角矩阵',
    cls: 'good',
    body: '<p>$A$ 与 $B=P^{-1}AP$ 相似，可对角化性质相同。$B$ 的特征值：</p><p>$$\\lambda^2+\\lambda-6=(\\lambda-2)(\\lambda+3)=0\\ \\Longrightarrow\\ \\lambda_1=2,\\ \\lambda_2=-3.$$</p><p>二阶矩阵有两个<b>互异</b>特征值，必可对角化，故 $A\\sim\\operatorname{diag}(2,-3)$。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p><b>(1)</b> $P$ 可逆（反证）；<b>(2)</b> $P^{-1}AP=\\begin{pmatrix}0&6\\\\1&-1\\end{pmatrix}$，$A$ 相似于对角矩阵 $\\operatorname{diag}(2,-3)$。记忆锚点：<b>$P^{-1}AP$ 的第 $j$ 列 = $Ap_j$ 的坐标</b>；特征值互异 ⇒ 必可对角化。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$P=(\\alpha,\\ A\\alpha)$ 可逆吗？$P^{-1}AP$ 是什么？',
  subtitle: '考点：线性无关反证 · 基下坐标求 $P^{-1}AP$ · 相似对角化判定',
  intro: '点击「▶ 播放」逐步展开 (1)(2) 两问的推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '$P^{-1}AP=\\begin{pmatrix}0&6\\\\1&-1\\end{pmatrix}$，$A\\sim\\operatorname{diag}(2,-3)$',
    html: '正确答案：(1) $P$ 可逆；(2) $P^{-1}AP=\\begin{pmatrix}0&6\\\\1&-1\\end{pmatrix}$，$A$ 相似于对角矩阵 $\\operatorname{diag}(2,-3)$。易错：<b>坐标列的位置别放反</b>（$A\\alpha$ 的坐标在第 1 列）；相似论证要完整——$A\\sim B$ 且 $B$ 有互异特征值，故 $B$ 从而 $A$ 可对角化。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
