<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011 数二第 8 题 · 伴随矩阵方程组的基础解系</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：从基础解系读出秩',
    cls: 'key',
    body: '<p>$(1,0,1,0)^{\\mathrm T}$ 是 $Ax=0$ 的<b>基础解系</b>，说明解空间维数 $=n-r=1$，故 $\\operatorname{rank}(A)=4-1=3$。</p>' },
  { title: '把解代回去',
    cls: 'step',
    body: '<p>$A(1,0,1,0)^{\\mathrm T}=\\alpha_1+\\alpha_3=0$，即 $\\alpha_3=-\\alpha_1$：第 1、3 列<b>线性相关</b>。</p>' },
  { title: '秩的接力：r(A*)=1',
    cls: 'key',
    body: '<p>伴随矩阵秩的公式：$r(A)=n-1$ 时 $r(A^*)=1$。于是 $A^*x=0$ 的基础解系含 $4-1=3$ 个向量——选项 A、B 各只给 2 个向量，<b>直接排除</b>。</p>' },
  { title: '关键恒等式：A*A=O',
    cls: 'key',
    body: '<p>$r(A)=3<4\\Rightarrow\\lvert A\\rvert=0$，而 $A^*A=\\lvert A\\rvert E=O$。按列看就是 $A^*\\alpha_i=0$：$A$ 的<b>每一列 $\\alpha_i$ 都是 $A^*x=0$ 的解</b>。</p>' },
  { title: '排除 C：凑不出无关组',
    cls: 'bad',
    body: '<p>候选解要从 $\\alpha_1,\\cdots,\\alpha_4$ 里挑 3 个<b>线性无关</b>的。$r(A)=3$ 且 $\\alpha_3=-\\alpha_1$，故 $\\alpha_1,\\alpha_2,\\alpha_4$ 无关；C 给的 $\\alpha_1,\\alpha_2,\\alpha_3$ 含相关对，排除。</p>' },
  { title: '验证 D',
    cls: 'good',
    body: '<p>D 给 $\\alpha_2,\\alpha_3,\\alpha_4$：把 $\\alpha_3=-\\alpha_1$ 代回去，就是 $\\alpha_2,\\alpha_1,\\alpha_4$——3 个线性无关的解，恰构成 $A^*x=0$ 的基础解系。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p><b>选 D</b>。推理链：基础解系 1 个 → $r(A)=3$ → $r(A^*)=1$ → 维数 $4-1=3$ → $A^*A=\\lvert A\\rvert E=O$ 找解 → 挑线性无关组。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '第 8 题 · $A^*x=0$ 的基础解系',
  subtitle: '考点：伴随矩阵的秩 · 线性方程组基础解系 · 选项逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链：读秩 → r(A*) → A*A=O 找解 → 选无关组。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '推理链：<b>基础解系 1 个 ⇒ $r(A)=3$ ⇒ $r(A^*)=1$ ⇒ 基础解系含 $4-1=3$ 个向量 ⇒ $A^*A=\\lvert A\\rvert E=O$ 说明 $A$ 的列全是解 ⇒ 取 $\\alpha_2,\\alpha_3,\\alpha_4$（$\\alpha_3=-\\alpha_1$，等价于 $\\alpha_1$）</b>。易错：背错秩公式（$r(A)=n-1\\Rightarrow r(A^*)=1$，不是别的值）。',
  },
});
</script>
</body>
</html>
