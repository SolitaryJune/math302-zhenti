<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：y=∛(x³−3x²+1) 的斜渐近线</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '曲线 $y=\\sqrt[3]{x^3-3x^2+1}$ 的斜渐近线',
  subtitle: '考点：渐近线 · 方法：$k=\\lim\\dfrac yx$ → 提主部 + $(1+t)^{1/3}$ 泰勒展开求 $b$',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示 k 与 b 的完整推导。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$x\\to\\pm\\infty$ 时 $y\\to\\pm\\infty$（无水平渐近线），三次根号处处有定义（无铅直渐近线），只可能斜渐近线 $y=kx+b$。',
      '<b>求 $k$</b>：根号内除以 $x^3$ $$k=\\lim_{x\\to\\infty}\\frac{y}{x}=\\lim_{x\\to\\infty}\\sqrt[3]{1-\\frac3x+\\frac1{x^3}}=1$$ 立方根保号，$x\\to-\\infty$ 同样成立，$k=1$。',
      '<b>提主部</b>：把 $x$ 提出根号 $$y=x\\Bigl(1-\\frac3x+\\frac1{x^3}\\Bigr)^{1/3}$$ 令 $t=-\\dfrac3x+\\dfrac1{x^3}\\to0$。',
      '<b>泰勒展开</b>：$(1+t)^{1/3}=1+\\dfrac{t}{3}+o(t)$ $$\\Bigl(1-\\frac3x+\\frac1{x^3}\\Bigr)^{1/3}=1+\\frac13\\Bigl(-\\frac3x+\\frac1{x^3}\\Bigr)+o\\Bigl(\\frac1x\\Bigr)=1-\\frac1x+o\\Bigl(\\frac1x\\Bigr)$$',
      '<b>收尾求 $b$</b>：$$y=x\\Bigl(1-\\frac1x+o\\Bigl(\\frac1x\\Bigr)\\Bigr)=x-1+o(1)\\ \\Longrightarrow\\ b=\\lim_{x\\to\\infty}(y-x)=-1$$',
      '<b>结论</b>：斜渐近线 $$y=x-1\\qquad(x\\to+\\infty\\ \\text{与}\\ x\\to-\\infty\\ \\text{同一条})$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题', log:'x→±∞ 时 y→±∞，只有斜渐近线 y=kx+b', count:0 },
    { cls:'step',  tag:'定斜率', log:'根号内除以 x³，k = 1，两个方向都成立', count:1 },
    { cls:'shift', tag:'提主部', log:'把 x 提出三次根号，括号内是 1 + 小量 t', count:2 },
    { cls:'step',  tag:'展开', log:'(1+t)^(1/3) ≈ 1 + t/3，t 的首项 −3/x 贡献 −1/x', count:3 },
    { cls:'ok',    tag:'求截距', log:'y − x → −1，b = −1', count:4 },
    { cls:'done',  tag:'完成', log:'结论：斜渐近线 y = x − 1', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$y=x-1$',
    html: '记忆锚点：<b>根式求 $b$ 必先提主部：$y=x\\bigl(1-\\tfrac3x+\\tfrac1{x^3}\\bigr)^{1/3}$，再对 $(1+t)^{1/3}$ 泰勒展开到一次项</b>。丢掉 $\\dfrac t3$ 的一次项、或对 $\\infty-\\infty$ 硬算，都会把截距算错。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
