<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017·18 隐函数求极值</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2017·18　$y(x)$ 由 $x^{3}+y^{3}-3x+3y-2=0$ 确定，求极值',
  subtitle: '考点：隐函数极值 · 流程：求 $y\'$ → 驻点回代定 $y$ → $y\'\'$ 判别',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，走完隐函数求极值的标准三步。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      "$$x^{3}+y^{3}-3x+3y-2=0\\qquad(y=y(x)\\ \\text{隐函数})$$",
      "<b>① 两边求导：</b>$3x^{2}+3y^{2}y'-3+3y'=0$",
      "<b>② 解出：</b>$y'=\\dfrac{1-x^{2}}{y^{2}+1}$（分母恒正，处处可导）",
      "<b>③ 驻点：</b>$y'=0\\iff1-x^{2}=0\\iff x=\\pm1$",
      "<b>④ 回代 $x=1$：</b>$y^{3}+3y-4=0\\iff(y-1)(y^{2}+y+4)=0$，二次因子恒正 $\\Rightarrow y=1$",
      "<b>⑤ 回代 $x=-1$：</b>$y^{3}+3y=0\\iff y(y^{2}+3)=0\\ \\Rightarrow y=0$",
      "<b>⑥ 再求导：</b>对 $(y^{2}+1)y\'=1-x^{2}$ 两边求导：$2y(y\')^{2}+(y^{2}+1)y\'\'=-2x$",
      "<b>⑦ 驻点处 $y\'=0$：</b>$y\'\'=\\dfrac{-2x}{y^{2}+1}$",
      "<b>⑧ 判别：</b>$(1,1)$：$y\'\'=-1<0$ 极大；$(-1,0)$：$y\'\'=2>0$ 极小",
      "<b>⑨ 结论：</b>$$\\text{极大值 }y(1)=1,\\qquad \\text{极小值 }y(-1)=0$$"
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题', log:'方程确定隐函数，目标：求 y 的极值', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'求导', log:'两边对 x 求导，y 当中间变量，带上 y 撇', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'整理', log:'把 y 撇解出来，分母 y 平方加一恒为正', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'驻点', log:'令分子为零，得 x 等于一或负一', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'回代一', log:'x 取一代回原方程，三次式因式分解只有 y 等于一这个实根', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'回代二', log:'x 取负一代回，提出公因子 y，只有 y 等于零', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'二阶', log:'再求一次导，出现 y 撇平方项与二阶项', count:6, ribbon:{k:7, ok:true} },
    { cls:'ok',    tag:'化简', log:'驻点处 y 撇为零，平方项消失，二阶导公式极简', count:7, ribbon:{k:8, ok:true} },
    { cls:'ok',    tag:'判别', log:'点一一处二阶导为负取极大，点负一零处为正取极小', count:8, ribbon:{k:9, ok:true} },
    { cls:'done',  tag:'完成', log:'结论：极大值 y(1)=1，极小值 y(-1)=0', count:9, ribbon:{k:10, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '极大值 $y(1)=1$，极小值 $y(-1)=0$',
    html: '标准三步：<b>隐函数求导解 $y\'$ → 驻点回代原方程定 $y$ → $y\'\'$ 判别</b>。记忆点：驻点处 $y\'=0$ 会让 $2y(y\')^{2}$ 项自动消失，$y\'\'=\\dfrac{-2x}{y^{2}+1}$ 秒算。易错：只解 $x$ 不回代求 $y$；三次方程不说清其余根为何不成立。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
