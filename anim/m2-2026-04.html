<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：微元法求细棒对质点的引力</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '微元法：线密度 $1$ 的细棒（$-1\\le x\\le1$）对质点 $m$（$(0,1)$）的引力',
  subtitle: '考点：定积分物理应用 · 万有引力 + 矢量分解 + 对称性',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示微元法的完整流程。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>取微元</b>：棒在 $y=0,\\ -1\\le x\\le1$，线密度 $1$；质点 $m$ 在 $(0,1)$。取微元 $[x,x+dx]$，质量 $dm=dx$。',
      '<b>元引力</b>：距离 $r=\\sqrt{x^2+1}$，由万有引力定律 $$dF=\\frac{Gm\\,dm}{r^2}=\\frac{Gm}{x^2+1}\\,dx$$',
      '<b>矢量分解</b>：$x$ 与 $-x$ 处微元的水平分量等大反向、<b>全部抵消</b>；竖直分量同向叠加，合力沿 $y$ 轴。',
      '<b>竖直分量</b>：乘竖直方向余弦 $\\cos\\theta=\\dfrac1r=\\dfrac{1}{\\sqrt{x^2+1}}$ $$dF_y=\\frac{Gm}{x^2+1}\\cdot\\frac{1}{\\sqrt{x^2+1}}\\,dx=\\frac{Gm}{(x^2+1)^{3/2}}\\,dx$$',
      '<b>对称合并</b>：$$F=\\int_{-1}^{1}\\frac{Gm}{(x^2+1)^{3/2}}dx=2\\int_0^1\\frac{Gm}{(x^2+1)^{3/2}}dx=\\int_0^1\\frac{2Gm}{(x^2+1)^{3/2}}dx$$',
      '<b>排错</b>：分母 $(x^2+1)^{1/2}$（A、B）少乘了方向余弦；分子带 $x$（A、C）用的是水平方向余弦 $\\dfrac{x}{r}$——那个分量已抵消。',
      '<b>结论</b>：$$F=\\int_0^1\\frac{2Gm}{(x^2+1)^{3/2}}\\,dx\\qquad\\Longrightarrow\\qquad \\text{选 D}$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'取微元', log:'棒上取 [x, x+dx]，质量 dm = dx，质点在 (0,1)', count:0 },
    { cls:'step',  tag:'元引力', log:'距离平方在分母：dF = Gm dx/(x²+1)', count:1 },
    { cls:'shift', tag:'分解',   log:'引力是矢量：水平分量左右对称、互相抵消', count:2 },
    { cls:'ok',    tag:'竖直分量', log:'乘竖直方向余弦 1/r，分母变成 (x²+1) 的 3/2 次方', count:3 },
    { cls:'ok',    tag:'合并',   log:'[−1,1] 上的积分由对称性折成 2 倍 [0,1] 积分', count:4 },
    { cls:'miss',  tag:'排错',   log:'A、B 指数少一次方；A、C 分子多一个 x（水平余弦）', count:5 },
    { cls:'done',  tag:'完成',   log:'结论：F = ∫₀¹ 2Gm/(x²+1)^(3/2) dx，选 D', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$F=\\displaystyle\\int_0^1\\frac{2Gm}{(x^2+1)^{3/2}}\\,dx$（选 D）',
    html: '记忆锚点：<b>距离平方给 $(x^2+1)^{-1}$，竖直方向余弦再给 $(x^2+1)^{-1/2}$，合成 $(x^2+1)^{-3/2}$；水平分量被对称性抵消</b>。易错：分子带 $x$ 是水平方向余弦（A、C），指数 $1/2$ 是漏乘方向余弦（B）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
