<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2024·15 由平均速度反求参数 k</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

/* 推导行工具：acc 取 key/ok/bad/blue 决定高亮色；未揭示时隐去 */
var ACC = { key:'#f59e0b', ok:'#22c55e', bad:'#ef4444', blue:'#3b82f6' };
var BGS = { key:'#fffbeb', ok:'#f6fef9', bad:'#fff8f8', blue:'#eff6ff' };
function row(accent, html){
  var d = AW.el('div', '', html);
  d.style.cssText = 'border-left:4px solid #cbd5e1;padding:7px 14px;margin:9px 0;border-radius:10px;'
    + 'opacity:0;transform:translateX(-12px);transition:all .45s ease;font-size:15px;line-height:2;';
  d.dataset.acc = accent;
  return d;
}

// 每行推导内容（html 里可写 $..$ / $$..$$ 公式）
var ROWS = [
  { acc: 'key', html: '<p><b>翻译条件</b>：平均速度 = 位移 ÷ 时间 = 函数平均值，$$\\bar v=\\frac1{3-0}\\int_0^3\\big(t+k\\sin\\pi t\\big)\\,\\mathrm dt=\\frac52.$$</p>' },
  { acc: 'blue', html: '<p><b>第一项积分</b>：$$\\int_0^3 t\\,\\mathrm dt=\\Big[\\frac{t^2}2\\Big]_0^3=\\frac92.$$</p>' },
  { acc: 'key', html: '<p><b>第二项积分（关键）</b>：$$\\int_0^3\\sin\\pi t\\,\\mathrm dt=\\Big[-\\frac{\\cos\\pi t}\\pi\\Big]_0^3=\\frac{-\\cos3\\pi+\\cos0}\\pi=\\frac{1+1}\\pi=\\frac2\\pi.$$ 直觉：周期为 $2$，$[0,3]$ 是"两个完整周期 + 半个"，完整部分归零，$[2,3]$ 贡献 $\\tfrac2\\pi$。</p>' },
  { acc: 'blue', html: '<p><b>列方程</b>：$$\\frac13\\Big(\\frac92+\\frac{2k}\\pi\\Big)=\\frac52\\ \\Longrightarrow\\ \\frac92+\\frac{2k}\\pi=\\frac{15}2.$$</p>' },
  { acc: 'ok', html: '<p><b>解出 $k$</b>：$\\dfrac{2k}\\pi=\\dfrac{15}2-\\dfrac92=3$，$$k=\\frac{3\\pi}2.$$</p>' },
  { acc: 'blue', html: '<p><b>验算</b>：$k=\\dfrac{3\\pi}2$ 时 $\\displaystyle\\int_0^3 v\\,\\mathrm dt=\\frac92+\\frac{3\\pi}2\\cdot\\frac2\\pi=\\frac92+3=\\frac{15}2$，除以 $3$ 得 $\\dfrac52$ ✓。</p>' },
  { acc: 'bad', html: '<p><b>易错对照</b>：把 $\\displaystyle\\int_0^3\\sin\\pi t\\,\\mathrm dt$ 当成 $0$（以为整数个周期——实际 $1.5$ 个）；或忘了除以区间长 $3$，把位移 $\\frac{15}2$ 当成平均速度去解方程。</p>' },
];

AW.init({
  title: '平均速度 $\\frac52$ 反求 $v(t)=t+k\\sin\\pi t$ 中的 $k$',
  subtitle: '考点：定积分应用（函数平均值）· 方法：积分方程 → 分项计算 → 解 $k$',
  counterLabel: '计算步',
  intro: '点击「▶ 播放」逐步演示推导。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>（每步揭示一行，最新一行高亮）'));
    var board = AW.el('div', '');
    this.rows = [];
    ROWS.forEach(function(r){
      var d = row(r.acc, r.html);
      board.appendChild(d);
      this.rows.push(d);
    }, this);
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },
  render: function(stage, sn, i){
    (this.rows || []).forEach(function(d, j){
      var on = j < i;
      d.style.opacity = on ? '1' : '0';
      d.style.transform = on ? 'none' : 'translateX(-12px)';
      d.style.borderLeftColor = on ? (ACC[d.dataset.acc] || ACC.blue) : '#cbd5e1';
      d.style.background = on ? (BGS[d.dataset.acc] || BGS.blue) : '#f8fafc';
    });
    renderMathAfterSnap(stage);
  },
  snaps: [
    { cls: 'key',   tag: '审题', log: '平均速度 = 位移/时间 = (1/3)∫₀³ v dt = 5/2', count: 0 },
    { cls: 'step',  tag: '积分①', log: '∫₀³ t dt = 9/2', count: 1 },
    { cls: 'key',   tag: '积分②', log: '∫₀³ sin πt dt = 2/π：1.5 个周期，不是 0', count: 2 },
    { cls: 'step',  tag: '方程', log: '(1/3)(9/2 + 2k/π) = 5/2', count: 3 },
    { cls: 'ok',    tag: '求解', log: '2k/π = 3，k = 3π/2', count: 4 },
    { cls: 'step',  tag: '验算', log: '代回：9/2 + 3 = 15/2，除以 3 得 5/2 ✓', count: 5 },
    { cls: 'done',  tag: '完成', log: '结论：k = 3π/2', count: 6, done: true },
  ],
  result: {
    big: '答案：k = 3π/2',
    html: '记忆锚点：平均速度 $\\bar v=\\dfrac1{b-a}\\int_a^b v\\,\\mathrm dt$（<b>别忘除以区间长</b>）。$\\sin\\pi t$ 周期 $2$，$[0,3]$ 只有 $1.5$ 个周期，$\\displaystyle\\int_0^3\\sin\\pi t\\,\\mathrm dt=\\frac2\\pi\\neq0$——这是本题最大的坑。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
