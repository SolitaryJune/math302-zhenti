<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：二重积分交换积分次序</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$\\displaystyle\\int_0^2\\mathrm{d}y\\int_y^2\\frac{y}{\\sqrt{1+x^3}}\\,\\mathrm{d}x$：交换积分次序求值',
  subtitle: '考点：二重积分换序 · 方法：还原区域 → 先积 $y$ → 凑微分 $\\mathrm{d}(1+x^3)$',
  counterLabel: '换序步',
  intro: '点击「▶ 播放」逐步演示换序与求值。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$\\dfrac{1}{\\sqrt{1+x^3}}$ 没有初等原函数，按原次序先对 $x$ 积不动 —— 信号：<b>交换积分次序</b>',
      '<b>还原区域</b>：$0\\le y\\le2$，$y\\le x\\le2$，即三角形 $$D=\\{0\\le x\\le2,\\ 0\\le y\\le x\\}$$',
      '<b>换序</b>（先对 $y$ 积，范围 $0\\to x$）：$$I=\\int_0^2\\mathrm{d}x\\int_0^x\\frac{y}{\\sqrt{1+x^3}}\\,\\mathrm{d}y$$',
      '<b>内层积分</b>：$\\displaystyle\\int_0^x y\\,\\mathrm{d}y=\\frac{x^2}{2}$，得 $$I=\\int_0^2\\frac{x^2}{2\\sqrt{1+x^3}}\\,\\mathrm{d}x$$',
      '<b>凑微分</b>：令 $u=1+x^3$，$\\mathrm{d}u=3x^2\\,\\mathrm{d}x$（$u:1\\to9$） $$I=\\frac{1}{6}\\int_1^9 u^{-1/2}\\,\\mathrm{d}u$$',
      '<b>收尾</b>：$I=\\dfrac{1}{6}\\bigl[2\\sqrt{u}\\bigr]_1^9=\\dfrac{1}{6}(6-2)=\\dfrac{2}{3}$，<b>选 D</b>',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',     log:'内层 1/√(1+x³) 积不出，先对 x 积不动，必须换序', count:0 },
    { cls:'shift', tag:'还原区域', log:'由 0≤y≤2、y≤x≤2 还原出三角形区域 0≤y≤x≤2', count:1 },
    { cls:'shift', tag:'换序',     log:'交换次序：先对 y 积，范围 0 到 x', count:2 },
    { cls:'step',  tag:'内层积分', log:'y²/2 从 0 到 x 得 x²/2，被积函数变成 x²/(2√(1+x³))', count:3 },
    { cls:'shift', tag:'凑微分',   log:'令 u=1+x³，3x²dx 恰好凑进去，积分限变 1 到 9', count:4 },
    { cls:'done',  tag:'完成',     log:'结论：2√u 从 1 到 9 得 6−2=4，再除 6 得 2/3，选 D', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\dfrac{2}{3}$（选 D）',
    html: '记忆锚点：<b>被积函数对哪个变量积不出，就换序把「好积的」放到内层</b>：$y\\,\\mathrm{d}y$ 积完凑出 $x^2$，配 $\\mathrm{d}(1+x^3)=3x^2\\,\\mathrm{d}x$ 一气呵成。易错：换序后 $y$ 的上限是 $x$ 不是 2；总系数 $\\dfrac16\\times4=\\dfrac23$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
