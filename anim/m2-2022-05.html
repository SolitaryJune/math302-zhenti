<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画：含参反常积分的收敛范围</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两个瑕点，两端分别定阶',
    cls: 'key',
    log: '瑕点有两个：x→0⁺ 与 x→1⁻，整体收敛 = 两端同时收敛',
    body: '<p>被积函数 $\\dfrac{\\ln x}{x^p(1-x)^{1-p}}$ 在 $x\\to0^+$ 与 $x\\to1^-$ 两处都可能爆破。判敛框架：<b>两端分别用等价无穷小定阶，再取交集</b>。</p>' },
  { title: '工具：幂阶判据 + 对数的量级',
    cls: 'step',
    log: '∫dx/x^α 收敛 ⟺ α<1；ln x 在 0 端低于任何幂、在 1 端是一阶无穷小',
    body: '<p>幂判据：$\\displaystyle\\int_0\\frac{\\mathrm{d}x}{x^{\\alpha}}$ 收敛 $\\iff\\alpha<1$。对数两端脾气不同：$x\\to0^+$ 时量级低于任何幂；$x\\to1^-$ 时 $\\ln x=\\ln\\bigl(1-(1-x)\\bigr)\\sim-(1-x)$ 是<b>一阶无穷小</b>。</p>' },
  { title: 'x→1⁻ 端：定出下界 p>−1',
    cls: 'good',
    log: '1 端：被积函数等价于 −(1−x)^p，收敛 ⟺ p>−1',
    body: '<p>$x^p\\to1$，被积函数 $\\sim\\dfrac{-(1-x)}{(1-x)^{1-p}}=-(1-x)^p$。以 $1-x$ 为无穷小套幂判据，收敛 $\\iff p>-1$（<b>下界</b>）。</p>' },
  { title: 'x→0⁺ 端：定出上界 p<1',
    cls: 'good',
    log: '0 端：被积函数等价于 ln x/x^p，收敛 ⟺ p<1',
    body: '<p>被积函数 $\\sim\\dfrac{\\ln x}{x^p}$。$p<1$ 时被积函数被可积的 $\\dfrac{C}{x^{p+\\varepsilon}}$（$p+\\varepsilon<1$）压住（$x^{\\varepsilon}|\\ln x|\\to0$）；$p\\ge1$ 时不小于 $\\dfrac{|\\ln x|}{x}$ 而发散。收敛 $\\iff p<1$（<b>上界</b>）。</p>' },
  { title: '取交集：(−1, 1)',
    cls: 'good',
    log: '两端同时收敛：p>−1 且 p<1，即 (−1,1)',
    body: '<p>$$p>-1\\quad\\text{且}\\quad p<1\\ \\Longrightarrow\\ p\\in(-1,1).$$ 答案选 <b>A</b>。</p>' },
  { title: '结论与干扰项',
    cls: 'done',
    log: 'C/D 漏了 1 端的下界，B 把上界放宽到 2，均错',
    body: '<p>答案 <b>A</b>，$p\\in(-1,1)$。C 只判了 $0$ 端（漏下界），B 错在把 $1$ 端条件当成 $p<2$——$\\ln x$ 自带一阶 $(1-x)$ 因子，条件是 $p>-1$ 而非另设上界。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$\\displaystyle\\int_0^1\\frac{\\ln x}{x^p(1-x)^{1-p}}\\,\\mathrm{d}x$ 收敛的 $p$ 范围',
  subtitle: '考点：反常积分敛散判别 · 方法：两端瑕点分别定阶 + 取交集',
  counterLabel: '判敛步',
  ribbonTitle: '约束条件（✓ 已锁定 / ✗ 排除）',
  intro: '点击「▶ 播放」逐步展开判敛推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 A（$p\\in(-1,1)$）',
    html: '记忆锚点：<b>$1$ 端给下界 $p>-1$（$\\ln x\\sim-(1-x)$ 自带一阶零点），$0$ 端给上界 $p<1$（对数压不过幂的发散）</b>。两端都要判，取交集 $(-1,1)$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
