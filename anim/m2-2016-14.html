<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2016·14 由矩阵等价定参数 a</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：等价 ⇔ 秩相等',
    cls: 'key',
    tag: '审题',
    body: '<p>同型矩阵 $A$ 与 $B$ 等价的充要条件是 $\\mathrm{rank}(A)=\\mathrm{rank}(B)$。路线：先量出 $B$ 的秩，再令 $A$ 的秩与它相等，解出 $a$ 并核对。</p>',
    log: '等价只看秩，先给 B 的秩定量' },
  { title: '量 B 的秩：行和为零',
    cls: 'good',
    tag: 'rank(B)',
    ribbon: {k:1, ok:true},
    body: '<p>$B=\\begin{pmatrix}1&1&0\\\\0&-1&1\\\\1&0&1\\end{pmatrix}$：第三行 $=$ 第一行 $+$ 第二行（$1{+}0{=}1,\\ 1{+}(-1){=}0,\\ 0{+}1{=}1$），前两行线性无关，故 $\\mathrm{rank}(B)=2$。</p>',
    log: 'r₃ = r₁ + r₂，rank(B) = 2' },
  { title: '拆 A 的结构：(a+1)E − J',
    cls: 'key',
    tag: '拆矩阵',
    body: '<p>$$A=(a+1)E-J,\\qquad J\\ \\text{为全 1 矩阵（特征值 } 3,0,0\\text{）}.$$ 平移得 $A$ 的特征值：$$a+1-3=a-2\\ (\\text{一重}),\\qquad a+1\\ (\\text{二重}).$$</p>',
    log: '特征值 a−2 与 a+1（二重）' },
  { title: '行列式给零点候选',
    cls: 'step',
    tag: '候选值',
    body: '<p>$\\mathrm{rank}(A)=2$ 必须 $\\det A=0$：$$\\det A=(a-2)(a+1)^2=0\\ \\Longrightarrow\\ a=2\\ \\text{或}\\ a=-1.$$ 但「行列式为零」只是必要条件，两个候选都要回头查秩。</p>',
    log: '候选 a = 2 与 a = −1，逐一验秩' },
  { title: '核对秩：a = 2 留下，a = −1 出局',
    cls: 'good',
    tag: '验秩',
    ribbon: {k:2, ok:true},
    body: '<p>$a=2$：特征值 $0,3,3$，恰一个零，秩 $=2$ ✓。$a=-1$：特征值 $-3,0,0$，两个零（$A=-J$ 各行相同），秩 $=1$ ✗。</p>',
    log: 'a=2 秩为 2；a=−1 秩为 1，弃' },
  { title: '结论',
    cls: 'good',
    tag: '完成',
    body: '<p>$a=2$。记忆锚点：<b>等价看秩，秩为 $n-1$ 意味着恰有一个零特征值</b>——行列式的根要逐个回代验秩，别让低秩的根混进来。</p>',
    log: '填 a = 2' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.log || s.title,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$\\begin{pmatrix}a&-1&-1\\\\-1&a&-1\\\\-1&-1&a\\end{pmatrix}$ 与给定矩阵等价，求 $a$',
  subtitle: '考点：矩阵等价 ⇔ 秩相等 · 方法：rank(B)=2 → det A 的根 → 逐个验秩',
  counterLabel: '推理步',
  ribbonTitle: '两步确认（✓ 已锁定）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: 'a = 2',
    html: '记忆锚点：<b>等价 = 秩相等</b>；$\\det A=(a-2)(a+1)^2$ 给出候选后必须验秩——$a=2$ 时特征值 $0,3,3$（秩 2），$a=-1$ 时 $A=-J$ 秩仅 1，出局。$\\det=0$ 只是必要条件。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
