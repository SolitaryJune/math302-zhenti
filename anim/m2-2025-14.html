<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：参数方程 + 变限积分隐函数求 dy/dx</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$x=\\ln(1+2t)$，$2t-\\displaystyle\\int_1^{y+t^2}\\mathrm e^{-u^2}\\mathrm du=0$：求 $\\left.\\dfrac{\\mathrm dy}{\\mathrm dx}\\right|_{t=0}$',
  subtitle: '考点：参数方程求导 · 变限积分求导 · 方法：先定 $y(0)$，再 $y\'(0)/x\'(0)$',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示完整链路。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$\\dfrac{\\mathrm dy}{\\mathrm dx}=\\dfrac{\\mathrm dy/\\mathrm dt}{\\mathrm dx/\\mathrm dt}$，全在 $t=0$ 处取值；$y=y(t)$ 由含变限积分的方程隐式给出，先定 $y(0)$。',
      '<b>定 $y(0)$</b>：代 $t=0$ $$\\int_1^{y}\\mathrm e^{-u^2}\\,\\mathrm du=0$$ 被积函数恒正，积分只能在上限等于下限时为零，故 $y\\big|_{t=0}=1$。',
      '<b>求 $x\'(0)$</b>：$x=\\ln(1+2t)$ $$x\'(t)=\\frac{2}{1+2t}\\ \\Longrightarrow\\ x\'(0)=2$$',
      '<b>对隐式方程求导</b>：上限 $y+t^2$ 是 $t$ 的函数，变上限求导要乘内层导数 $y\'+2t$ $$2-\\mathrm e^{-(y+t^2)^2}\\cdot\\bigl(y\'+2t\\bigr)=0$$',
      '<b>代 $t=0$ 解 $y\'(0)$</b>：此时 $y=1$，$y+t^2=1$ $$2-\\mathrm e^{-1}\\cdot y\'(0)=0\\ \\Longrightarrow\\ y\'(0)=2\\mathrm e$$',
      '<b>合成</b>：$$\\left.\\frac{\\mathrm dy}{\\mathrm dx}\\right|_{t=0}=\\frac{y\'(0)}{x\'(0)}=\\frac{2\\mathrm e}{2}=\\mathrm e$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题', log:'dy/dx = y′(t)/x′(t)，先定 y(0) 再各求导', count:0 },
    { cls:'ok',    tag:'定 y(0)', log:'∫₁^y e^(−u²) du = 0，被积函数恒正，只能 y(0)=1', count:1 },
    { cls:'step',  tag:'x′(0)', log:'x = ln(1+2t)，x′ = 2/(1+2t)，x′(0) = 2', count:2 },
    { cls:'shift', tag:'隐式求导', log:'变上限求导乘内层导数 y′+2t，得 2 − e^(−(y+t²)²)(y′+2t) = 0', count:3 },
    { cls:'step',  tag:'代 t=0', log:'y+t²=1，2 − e^(−1)·y′(0) = 0，y′(0) = 2e', count:4 },
    { cls:'done',  tag:'完成', log:'结论：dy/dx = 2e/2 = e', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\left.\\dfrac{\\mathrm dy}{\\mathrm dx}\\right|_{t=0}=\\mathrm e$',
    html: '记忆锚点：<b>三件套：$y(0)=1$（恒正被积函数积分归零 $\\Rightarrow$ 上下限相等）、$x\'(0)=2$、$y\'(0)=2\\mathrm e$，相除得 $\\mathrm e$</b>。变上限求导务必乘内层导数 $y\'+2t$，最后别忘了除以 $x\'(0)$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
