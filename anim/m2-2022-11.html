<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：1^∞ 型极限取对数求值</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$\\displaystyle\\lim_{x\\to0}\\left(\\frac{1+\\mathrm{e}^x}{2}\\right)^{\\cot x}$：$1^\\infty$ 型求值',
  subtitle: '考点：幂指函数极限 · 方法：取对数 → 等价无穷小 → 还原',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示取对数求值流程。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：底数 $\\dfrac{1+\\mathrm{e}^x}{2}\\to1$、指数 $\\cot x\\to\\infty$ —— <b>$1^\\infty$ 型</b>，取对数：$$\\ln L=\\lim_{x\\to0}\\cot x\\cdot\\ln\\frac{1+\\mathrm{e}^x}{2}$$',
      '<b>化成 $0/0$ 型</b>（$\\cot x=\\dfrac{1}{\\tan x}$）：$$\\ln L=\\lim_{x\\to0}\\frac{\\ln\\dfrac{1+\\mathrm{e}^x}{2}}{\\tan x}$$',
      '<b>分子等价</b>：凑 $\\ln(1+u)$ 形状，$\\ln\\dfrac{1+\\mathrm{e}^x}{2}=\\ln\\left(1+\\dfrac{\\mathrm{e}^x-1}{2}\\right)\\sim\\dfrac{\\mathrm{e}^x-1}{2}\\sim\\dfrac{x}{2}$',
      '<b>分母等价并求值</b>：$\\tan x\\sim x$，$$\\ln L=\\lim_{x\\to0}\\frac{x/2}{x}=\\frac{1}{2}$$',
      '<b>还原</b>：$L=\\mathrm{e}^{1/2}=\\sqrt{\\mathrm{e}}$',
      '<b>洛必达验证</b>：分子导 $\\dfrac{\\mathrm{e}^x}{1+\\mathrm{e}^x}\\to\\dfrac12$，分母导 $\\sec^2x\\to1$，极限同为 $\\dfrac12$ ✓',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'定型',     log:'底数趋 1、指数趋无穷，1^∞ 型，先取对数', count:0 },
    { cls:'shift', tag:'化0/0',    log:'cot x 翻到分母变成 tan x，化为零比零型', count:1 },
    { cls:'shift', tag:'分子等价', log:'ln(1+u)∼u 接 e^x−1∼x，分子等价于 x/2', count:2 },
    { cls:'ok',    tag:'求lnL',    log:'分母 tan x∼x，约分得 ln L = 1/2', count:3 },
    { cls:'ok',    tag:'还原',     log:'别忘还原：L = e^(1/2) = √e', count:4 },
    { cls:'done',  tag:'验证',     log:'洛必达复核同为 1/2，结论：极限为 √e', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\sqrt{\\mathrm{e}}$',
    html: '记忆锚点：<b>$1^\\infty$ 型三步走：取对数、等价代换、$\\mathrm{e}^{\\ln L}$ 还原</b>。这里 $\\ln\\dfrac{1+\\mathrm{e}^x}{2}\\sim\\dfrac{x}{2}$、$\\tan x\\sim x$，故 $\\ln L=\\dfrac12$。易错：算到 $\\ln L=\\frac12$ 忘了还原，或分子不凑 $\\ln(1+u)$ 就乱代换。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
