<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2024·12 二元函数的极值点</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

/* 推导行工具：acc 取 key/ok/bad/blue 决定高亮色；未揭示时隐去 */
var ACC = { key:'#f59e0b', ok:'#22c55e', bad:'#ef4444', blue:'#3b82f6' };
var BGS = { key:'#fffbeb', ok:'#f6fef9', bad:'#fff8f8', blue:'#eff6ff' };
function row(accent, html){
  var d = AW.el('div', '', html);
  d.style.cssText = 'border-left:4px solid #cbd5e1;padding:7px 14px;margin:9px 0;border-radius:10px;'
    + 'opacity:0;transform:translateX(-12px);transition:all .45s ease;font-size:15px;line-height:2;';
  d.dataset.acc = accent;
  return d;
}

// 每行推导内容（html 里可写 $..$ / $$..$$ 公式）
var ROWS = [
  { acc: 'blue', html: '<p><b>一阶偏导</b>（偏导可分离，各自只含一个变量）：$$f_x=6x^2-18x+12=6(x-1)(x-2),\\qquad f_y=-24y^3+24=24(1-y^3).$$</p>' },
  { acc: 'key', html: '<p><b>求驻点</b>：$f_x=0\\Rightarrow x=1$ 或 $x=2$；$f_y=0\\Rightarrow y=1$。驻点两个：$\\boxed{(1,1)}$ 与 $\\boxed{(2,1)}$。</p>' },
  { acc: 'blue', html: '<p><b>二阶偏导</b>：$$A=f_{xx}=12x-18,\\qquad B=f_{xy}=0,\\qquad C=f_{yy}=-72y^2.$$</p>' },
  { acc: 'ok', html: '<p><b>判 $(1,1)$</b>：$A=-6$，$C=-72$，$$AC-B^2=(-6)(-72)-0=432>0\\quad\\text{且}\\quad A\\lt 0,$$ 故 $(1,1)$ 是<b>极大值点</b>（极大值 $f(1,1)=2-9-6+12+24=23$）。</p>' },
  { acc: 'bad', html: '<p><b>判 $(2,1)$</b>：$A=6$，$C=-72$，$$AC-B^2=(6)(-72)-0=-432\\lt 0,$$ 判别式为负，$(2,1)$ 是<b>鞍点</b>，不是极值点。</p>' },
  { acc: 'ok', html: '<p><b>结论</b>：极值点只有 $\\boxed{(1,1)}$（极大值点）。</p>' },
];

AW.init({
  title: '$f(x,y)=2x^3-9x^2-6y^4+12x+24y$ 的极值点',
  subtitle: '考点：二元函数极值 · 方法：驻点全找齐 → $AC-B^2$ 逐点判别',
  counterLabel: '计算步',
  intro: '点击「▶ 播放」逐步演示推导。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>（每步揭示一行，最新一行高亮）'));
    var board = AW.el('div', '');
    this.rows = [];
    ROWS.forEach(function(r){
      var d = row(r.acc, r.html);
      board.appendChild(d);
      this.rows.push(d);
    }, this);
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },
  render: function(stage, sn, i){
    (this.rows || []).forEach(function(d, j){
      var on = j < i;
      d.style.opacity = on ? '1' : '0';
      d.style.transform = on ? 'none' : 'translateX(-12px)';
      d.style.borderLeftColor = on ? (ACC[d.dataset.acc] || ACC.blue) : '#cbd5e1';
      d.style.background = on ? (BGS[d.dataset.acc] || BGS.blue) : '#f8fafc';
    });
    renderMathAfterSnap(stage);
  },
  snaps: [
    { cls: 'step',  tag: '审题', log: '偏导可分离：f_x 只含 x，f_y 只含 y', count: 0 },
    { cls: 'shift', tag: '驻点', log: 'x=1 或 2，y=1：驻点 (1,1) 与 (2,1)', count: 1 },
    { cls: 'shift', tag: '二阶导', log: 'A=12x−18，B=0，C=−72y²', count: 2 },
    { cls: 'ok',    tag: '判(1,1)', log: 'AC−B²=432>0 且 A=−6<0：极大值点', count: 3 },
    { cls: 'miss',  tag: '判(2,1)', log: 'AC−B²=−432<0：鞍点，不是极值点', count: 4 },
    { cls: 'step',  tag: '汇总', log: '极值点只剩 (1,1)', count: 5 },
    { cls: 'done',  tag: '完成', log: '结论：极值点是 (1,1)，极大值 23', count: 6, done: true },
  ],
  result: {
    big: '答案：(1, 1)',
    html: '记忆锚点：<b>驻点要找齐</b>——$f_x=6(x-1)(x-2)$ 有两个根；判别式 $AC-B^2$：<b>&gt;0 且 $A&lt;0$ 极大、$A&gt;0$ 极小；$&lt;0$ 是鞍点</b>。$(2,1)$ 因 $AC-B^2=-432&lt;0$ 出局，极值点仅 $(1,1)$（极大值 $23$）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
