<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2024·08 初等矩阵包围下的矩阵方程</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

/* 推导行工具：acc 取 key/ok/bad/blue 决定高亮色；未揭示时隐去 */
var ACC = { key:'#f59e0b', ok:'#22c55e', bad:'#ef4444', blue:'#3b82f6' };
var BGS = { key:'#fffbeb', ok:'#f6fef9', bad:'#fff8f8', blue:'#eff6ff' };
function row(accent, html){
  var d = AW.el('div', '', html);
  d.style.cssText = 'border-left:4px solid #cbd5e1;padding:7px 14px;margin:9px 0;border-radius:10px;'
    + 'opacity:0;transform:translateX(-12px);transition:all .45s ease;font-size:15px;line-height:2;';
  d.dataset.acc = accent;
  return d;
}

// 每行推导内容（html 里可写 $..$ / $$..$$ 公式）
var ROWS = [
  { acc: 'key', html: '<p><b>认清 $\\boldsymbol P$</b>：$\\boldsymbol P=\\begin{pmatrix}1&0&0\\\\0&1&0\\\\1&0&1\\end{pmatrix}$ 是初等矩阵——单位阵作 $r_3+r_1$ 所得。铁律：<b>左乘 = 行变换，右乘 = 列变换</b>。</p>' },
  { acc: 'blue', html: '<p><b>解出目标</b>：记题给右端为 $\\boldsymbol B=\\begin{pmatrix}a+2c&0&c\\\\0&b&0\\\\2c&0&c\\end{pmatrix}$，由 $\\boldsymbol P^{\\mathrm T}\\boldsymbol A\\boldsymbol P^2=\\boldsymbol B$ 得 $$\\boldsymbol A=(\\boldsymbol P^{\\mathrm T})^{-1}\\boldsymbol B\\,(\\boldsymbol P^2)^{-1}.$$</p>' },
  { acc: 'blue', html: '<p><b>左乘因子</b>：$(\\boldsymbol P^{\\mathrm T})^{-1}=\\begin{pmatrix}1&0&-1\\\\0&1&0\\\\0&0&1\\end{pmatrix}$，作用 = 行变换 $r_1-r_3$（$\\boldsymbol P^{\\mathrm T}$ 由 $r_1+r_3$ 而来，逆变换换成减法）。</p>' },
  { acc: 'blue', html: '<p><b>右乘因子</b>：$\\boldsymbol P^2=\\begin{pmatrix}1&0&0\\\\0&1&0\\\\2&0&1\\end{pmatrix}$（$r_3+2r_1$ 型），其逆 $\\begin{pmatrix}1&0&0\\\\0&1&0\\\\-2&0&1\\end{pmatrix}$，作用 = 列变换 $c_1-2c_3$。</p>' },
  { acc: 'blue', html: '<p><b>第一步（左乘）</b>：对 $\\boldsymbol B$ 作 $r_1-r_3$（第 3 行的 $-1$ 倍加到第 1 行）：$$\\begin{pmatrix}a+2c-2c&0&c-c\\\\0&b&0\\\\2c&0&c\\end{pmatrix}=\\begin{pmatrix}a&0&0\\\\0&b&0\\\\2c&0&c\\end{pmatrix}.$$</p>' },
  { acc: 'ok', html: '<p><b>第二步（右乘）</b>：作 $c_1-2c_3$（第 3 列的 $-2$ 倍加到第 1 列），第 3 行首元 $2c-2c=0$：$$\\boldsymbol A=\\begin{pmatrix}a&0&0\\\\0&b&0\\\\0&0&c\\end{pmatrix}=\\mathrm{diag}(a,b,c).$$</p>' },
  { acc: 'blue', html: '<p><b>回代验证</b>：$\\boldsymbol A\\boldsymbol P^2=\\begin{pmatrix}a&0&0\\\\0&b&0\\\\2c&0&c\\end{pmatrix}$，再左乘 $\\boldsymbol P^{\\mathrm T}$（$r_1+r_3$）得 $\\begin{pmatrix}a+2c&0&c\\\\0&b&0\\\\2c&0&c\\end{pmatrix}$——与题给右端一致 ✓。</p>' },
  { acc: 'bad', html: '<p><b>干扰项复盘</b>：A（对角元 $c,a,b$）、B（$b,c,a$）、D（$c,b,a$）全是<b>顺序错</b>——把 $\\boldsymbol P^{\\mathrm T}$ 对应的行变换与 $\\boldsymbol P^2$ 对应的列变换方向张冠李戴，或漏算 $\\boldsymbol P^2$ 的系数 2。</p>' },
];

AW.init({
  title: '由 $\\boldsymbol P^{\\mathrm T}\\boldsymbol A\\boldsymbol P^2=\\begin{pmatrix}a+2c&0&c\\\\0&b&0\\\\2c&0&c\\end{pmatrix}$ 求 $\\boldsymbol A$',
  subtitle: '考点：初等矩阵与矩阵方程 · 方法：左右乘 = 行列变换，两步清洗',
  counterLabel: '计算步',
  intro: '点击「▶ 播放」逐步演示推导。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>（每步揭示一行，最新一行高亮）'));
    var board = AW.el('div', '');
    this.rows = [];
    ROWS.forEach(function(r){
      var d = row(r.acc, r.html);
      board.appendChild(d);
      this.rows.push(d);
    }, this);
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },
  render: function(stage, sn, i){
    (this.rows || []).forEach(function(d, j){
      var on = j < i;
      d.style.opacity = on ? '1' : '0';
      d.style.transform = on ? 'none' : 'translateX(-12px)';
      d.style.borderLeftColor = on ? (ACC[d.dataset.acc] || ACC.blue) : '#cbd5e1';
      d.style.background = on ? (BGS[d.dataset.acc] || BGS.blue) : '#f8fafc';
    });
    renderMathAfterSnap(stage);
  },
  snaps: [
    { cls: 'key',   tag: '认阵', log: 'P 是 r₃+r₁ 型初等矩阵；左乘行变换、右乘列变换', count: 0 },
    { cls: 'shift', tag: '列式', log: 'A = (Pᵀ)⁻¹ B (P²)⁻¹，先备好两个逆', count: 1 },
    { cls: 'shift', tag: '左因子', log: '(Pᵀ)⁻¹ = 行变换 r₁−r₃', count: 2 },
    { cls: 'shift', tag: '右因子', log: 'P² 再取逆 = 列变换 c₁−2c₃，系数 2 别丢', count: 3 },
    { cls: 'step',  tag: '行变换', log: '对 B 作 r₁−r₃：首行变 a, 0, 0', count: 4 },
    { cls: 'ok',    tag: '列变换', log: '再作 c₁−2c₃：2c−2c=0，得 diag(a,b,c)', count: 5 },
    { cls: 'step',  tag: '验证', log: '回代：A P² 后再左乘 Pᵀ，恰好还原题给右端', count: 6 },
    { cls: 'step',  tag: '对照', log: 'A/B/D 都是对角元顺序排错', count: 7 },
    { cls: 'done',  tag: '完成', log: '结论：A = diag(a,b,c)，选 C', count: 8, done: true },
  ],
  result: {
    big: '答案 C：A = diag(a, b, c)',
    html: '记忆锚点：<b>左乘去 $\\boldsymbol P^{\\mathrm T}$ = 行变换 $r_1-r_3$，右乘去 $\\boldsymbol P^2$ = 列变换 $c_1-2c_3$</b>。注意 $(\\boldsymbol P^2)^{-1}$ 里系数是 $-2$（不是 $-1$）。两步清洗后副对角元素全归零，$\\boldsymbol A=\\begin{pmatrix}a&0&0\\\\0&b&0\\\\0&0&c\\end{pmatrix}$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
