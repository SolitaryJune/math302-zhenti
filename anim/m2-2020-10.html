<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：交换二次积分次序</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$\\int_0^1\\mathrm{d}y\\int_{\\sqrt{y}}^{1}\\sqrt{x^3+1}\\,\\mathrm{d}x$：交换积分次序',
  subtitle: '考点：二重积分累次积分 · 方法：$\\sqrt{x^3+1}$ 无初等原函数 → 先 $y$ 后 $x$',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示换序与积分。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>原式</b>：$$I=\\int_0^1\\mathrm{d}y\\int_{\\sqrt{y}}^{1}\\sqrt{x^3+1}\\,\\mathrm{d}x$$ —— $\\sqrt{x^3+1}$ 对 $x$ 没有初等原函数，先 $x$ 后 $y$ 走不通',
      '<b>重写区域</b>：$0\\le y\\le1$，$\\sqrt{y}\\le x\\le1$。由 $\\sqrt{y}\\le x$（两边非负，平方合法）得 $y\\le x^2$：$$D:\\ 0\\le x\\le1,\\quad 0\\le y\\le x^2$$',
      '<b>交换次序</b>：$$I=\\int_0^1\\mathrm{d}x\\int_0^{x^2}\\sqrt{x^3+1}\\,\\mathrm{d}y$$',
      '<b>内层先积</b>：$\\sqrt{x^3+1}$ 对 $y$ 是常数，$\\int_0^{x^2}\\mathrm{d}y=x^2$，故 $I=\\displaystyle\\int_0^1x^2\\sqrt{x^3+1}\\,\\mathrm{d}x$',
      '<b>凑微分</b>：令 $u=x^3+1$，$\\mathrm{d}u=3x^2\\,\\mathrm{d}x$；$x:0\\to1$ 对应 $u:1\\to2$',
      '<b>收尾</b>：$$I=\\frac{1}{3}\\int_1^2\\sqrt{u}\\,\\mathrm{d}u=\\frac{1}{3}\\cdot\\frac{2}{3}\\,u^{3/2}\\Big|_1^2=\\frac{2}{9}\\left(2\\sqrt{2}-1\\right)$$',
      '<b>答案：$\\dfrac{2(2\\sqrt{2}-1)}{9}$</b>',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题',  log:'根号(x³+1) 对 x 没有初等原函数，必须换序', count:0 },
    { cls:'step',  tag:'定区域', log:'由根号 y ≤ x 得 y ≤ x²，区域改写成 0≤x≤1、0≤y≤x²', count:1 },
    { cls:'step',  tag:'换序',  log:'改成先 y 后 x：x 从 0 到 1，y 从 0 到抛物线 x²', count:2 },
    { cls:'ok',    tag:'内层',  log:'根号(x³+1) 对 y 是常数，内层直接积出因子 x²', count:3 },
    { cls:'step',  tag:'凑微分', log:'令 u = x³+1，du = 3x² dx，上限从 1 到 2', count:4 },
    { cls:'step',  tag:'积分',  log:'根号 u 的原函数是 2/3 的 u^(3/2) 次方，代入得 2(2√2−1)/9', count:5 },
    { cls:'done',  tag:'完成',  log:'结论：积分值 2(2√2−1)/9', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\dfrac{2(2\\sqrt{2}-1)}{9}$',
    html: '记忆锚点：<b>被积函数对哪个变量没有初等原函数，就换掉那个变量先积分的位置</b>。区域 $\\{0\\le x\\le1,\\ 0\\le y\\le x^2\\}$ 换序后内层秒积 $x^2$，再凑微分 $u=x^3+1$ 收尾。易错：$\\sqrt{y}\\le x$ 等价于 $y\\le x^2$，别把抛物线上下弄反。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
