<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：含参方程组解的情况判定</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$A=\\begin{pmatrix}1&1&1\\\\1&a&a^2\\\\1&b&b^2\\end{pmatrix},\\ b=(1,2,4)^{\\mathrm T}$：$Ax=b$ 解的情况',
  subtitle: '考点：非齐次线性方程组解的判定 · 方法：范德蒙行列式 + 两行相同时看右端',
  counterLabel: '讨论步',
  intro: '点击「▶ 播放」逐步展开分类讨论。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：系数矩阵行形如 $(1,x,x^2)$，节点 $1,a,b$ —— 范德蒙型 $$\\det A=\\begin{vmatrix}1&1&1\\\\1&a&a^2\\\\1&b&b^2\\end{vmatrix}=(a-1)(b-1)(b-a)$$',
      '<b>$\\det A\\neq0$</b>（$a\\neq1,\\ b\\neq1,\\ a\\neq b$）：$r(A)=3=n$，方程组<b>有唯一解</b>',
      '<b>$\\det A=0$</b>：$1,a,b$ 中至少两个相等 $\\Rightarrow$ $A$ 有两行相同，看右端 $(1,2,4)^{\\mathrm T}$ 是否相容',
      '<b>$a=1$</b>：行 1、2 同为 $(1,1,1)$，右端却是 $1$ 与 $2$ —— 矛盾方程，<b>无解</b>',
      '<b>$b=1$</b>：行 1、3 相同，右端 $1\\neq4$；<b>$a=b$</b>：行 2、3 相同，右端 $2\\neq4$ —— 均<b>无解</b>',
      '<b>排除无穷多解</b>：那需要「两行相同且对应右端分量也相同」，但 $1,2,4$ 两两不同，不可能',
      '<b>结论</b>：$\\det A\\neq0$ 唯一解、$\\det A=0$ 无解 —— <b>有唯一解或无解，选 D</b>',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'算行列式', log:'范德蒙型行列式直接分解出三个因式', count:0 },
    { cls:'ok',    tag:'满秩情形', log:'a,b 与 1 互不相等时 r(A)=3，唯一解', count:1 },
    { cls:'shift', tag:'降秩情形', log:'det A=0 意味着 1,a,b 有两个相等，出现相同行', count:2 },
    { cls:'miss',  tag:'a=1',     log:'行1=行2=(1,1,1)，右端却是 1 和 2，矛盾，无解', count:3 },
    { cls:'miss',  tag:'b=1或a=b', log:'相同两行对应的右端分量总不相等，全都不相容', count:4 },
    { cls:'step',  tag:'排除无穷解', log:'无穷多解要求相同行的右端也相同，但 1,2,4 互异', count:5 },
    { cls:'done',  tag:'完成',     log:'结论：唯一解或无解，选 D', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '有唯一解或无解（选 D）',
    html: '记忆锚点：<b>$\\det A=0$ 只说明秩降，解有没有还看右端</b>：右端 $(1,2,4)^{\\mathrm T}$ 两两不同，相同行对应的方程必矛盾 ⟹ 只能无解；右端互异这一条件同时封死了无穷多解。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
