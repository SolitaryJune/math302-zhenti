<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：参数曲线的曲率半径（2014 年第 4 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '公式就位',
    body: '<p>参数曲线的曲率与曲率半径：</p>' +
          '<p>$$\\kappa=\\frac{\\lvert x\'y\'\'-y\'x\'\'\\rvert}{(x\'^{2}+y\'^{2})^{3/2}},\\qquad R=\\frac{1}{\\kappa}.$$</p>' +
          '<p>题问<b>半径</b>，最后要取倒数。</p>' },
  { cls: '', title: '求一阶、二阶导数',
    body: '<p>$x=t^{2}+7$，$y=t^{2}+4t+1$：</p>' +
          '<p>$$x\'=2t,\\qquad y\'=2t+4,\\qquad x\'\'=2,\\qquad y\'\'=2.$$</p>' },
  { cls: 'step', title: '代入 $t=1$',
    body: '<p>$x\'=2,\\quad y\'=6,\\quad x\'\'=2,\\quad y\'\'=2.$</p>' },
  { cls: '', title: '算分子',
    body: '<p>$$\\lvert x\'y\'\'-y\'x\'\'\\rvert=\\lvert2\\cdot2-6\\cdot2\\rvert=\\lvert-8\\rvert=8.$$</p>' },
  { cls: '', title: '算分母',
    body: '<p>$$(x\'^{2}+y\'^{2})^{3/2}=(2^{2}+6^{2})^{3/2}=40^{3/2}=40\\sqrt{40}=80\\sqrt{10}.$$</p>' },
  { cls: 'ok', title: '得曲率 $\\kappa$',
    body: '<p>$$\\kappa=\\frac{8}{80\\sqrt{10}}=\\frac{1}{10\\sqrt{10}}.$$</p>' },
  { cls: 'good', title: '取倒数得半径 $R$',
    body: '<p>$$R=\\frac{1}{\\kappa}=10\\sqrt{10}.$$</p>' +
          '<p>选 <b>C</b>。选项 B 的 $\\dfrac{\\sqrt{10}}{100}=\\dfrac{1}{10\\sqrt{10}}$ 恰是 $\\kappa$ 本身——忘取倒数的陷阱。</p>' },
];

AW.init({
  title: '【2014 数二·4】$t=1$ 处的曲率半径',
  subtitle: '考点：曲率 · 方法：参数曲线曲率公式 + 取倒数',
  counterLabel: '已执行',
  ribbonTitle: '关键量（分子/分母/κ/R）',
  intro: '点击「▶ 播放」逐步演示计算。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一张卡'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'背公式：曲率 = 叉积绝对值除以模长二分之三次方，半径取倒数', count:0 },
    { cls:'step',  tag:'求导', log:'x 一撇 = 2t，y 一撇 = 2t+4，二阶导都是 2', count:1 },
    { cls:'step',  tag:'代值', log:'t=1 处：2、6、2、2', count:2 },
    { cls:'ok',    tag:'分子', log:'叉积绝对值 = 8', count:3, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'分母', log:'40 的二分之三次方 = 80√10', count:4, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'曲率', log:'κ = 8/(80√10) = 1/(10√10)', count:5, ribbon:{k:3, ok:true} },
    { cls:'done',  tag:'完成', log:'半径 R = 10√10，答案 C', count:6, ribbon:{k:4, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 C（R = 10√10）',
    html: '记忆锚点：<b>曲率半径 = 曲率的倒数</b>。干扰项 B 是 $\\kappa=\\dfrac{1}{10\\sqrt{10}}$ 本身；A/D 来自 $40^{3/2}$ 算错（应为 $80\\sqrt{10}$）或分子算错。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
