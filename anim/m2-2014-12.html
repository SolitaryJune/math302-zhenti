<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：阿基米德螺线的切线（2014 年第 12 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '极坐标化参数方程',
    body: '<p>$r=\\theta$（阿基米德螺线），以 $\\theta$ 为参数：</p>' +
          '<p>$$x=r\\cos\\theta=\\theta\\cos\\theta,\\qquad y=r\\sin\\theta=\\theta\\sin\\theta.$$</p>' },
  { cls: '', title: '求两个参数导数',
    body: '<p>$$\\frac{\\mathrm dx}{\\mathrm d\\theta}=\\cos\\theta-\\theta\\sin\\theta,\\qquad \\frac{\\mathrm dy}{\\mathrm d\\theta}=\\sin\\theta+\\theta\\cos\\theta.$$</p>' },
  { cls: 'step', title: '代入 $\\theta=\\dfrac{\\pi}{2}$',
    body: '<p>$\\cos\\dfrac\\pi2=0$，$\\sin\\dfrac\\pi2=1$：</p>' +
          '<p>$$\\frac{\\mathrm dx}{\\mathrm d\\theta}=-\\frac{\\pi}{2},\\qquad \\frac{\\mathrm dy}{\\mathrm d\\theta}=1.$$</p>' },
  { cls: 'ok', title: '斜率 $k$',
    body: '<p>$$k=\\frac{\\mathrm dy/\\mathrm d\\theta}{\\mathrm dx/\\mathrm d\\theta}=\\frac{1}{-\\pi/2}=-\\frac{2}{\\pi}.$$</p>' },
  { cls: '', title: '切点的直角坐标',
    body: '<p>$x=\\dfrac{\\pi}{2}\\cos\\dfrac{\\pi}{2}=0$，$y=\\dfrac{\\pi}{2}\\sin\\dfrac{\\pi}{2}=\\dfrac{\\pi}{2}$，切点 $\\Big(0,\\dfrac{\\pi}{2}\\Big)$。注意 $(\\tfrac\\pi2,\\tfrac\\pi2)$ 是<b>极坐标</b>，不能直接当 $x,y$。</p>' },
  { cls: 'good', title: '写切线方程',
    body: '<p>$$y-\\frac{\\pi}{2}=-\\frac{2}{\\pi}(x-0)\\ \\Longleftrightarrow\\ y=-\\frac{2}{\\pi}x+\\frac{\\pi}{2}.$$</p>' },
];

AW.init({
  title: '【2014 数二·12】$r=\\theta$ 在 $\\theta=\\tfrac{\\pi}{2}$ 处的切线',
  subtitle: '考点：极坐标求切线 · 方法：化参数方程 + 参数求导',
  counterLabel: '已执行',
  ribbonTitle: '关键节点',
  intro: '点击「▶ 播放」逐步演示推导。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一张卡'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'极坐标曲线没有现成斜率，先化成参数方程', count:0 },
    { cls:'step',  tag:'参数化', log:'x = θcosθ，y = θsinθ', count:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'求导', log:'dx/dθ 与 dy/dθ 各自求出', count:2 },
    { cls:'ok',    tag:'代值', log:'θ=π/2 处：dx/dθ = −π/2，dy/dθ = 1', count:3 },
    { cls:'ok',    tag:'斜率', log:'k = 1 ÷ (−π/2) = −2/π', count:4, ribbon:{k:2, ok:true} },
    { cls:'step',  tag:'切点', log:'极坐标换算：切点是 (0, π/2)，不是 (π/2, π/2)', count:5 },
    { cls:'done',  tag:'完成', log:'y = −2/π x + π/2', count:6, ribbon:{k:3, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 y = −(2/π)x + π/2',
    html: '记忆锚点：<b>极坐标切线两件套</b>——切点用 $x=r\\cos\\theta,\\ y=r\\sin\\theta$ 换算；斜率用 $k=\\dfrac{y\'_\\theta}{x\'_\\theta}$，别拿 $r\'$ 当斜率。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
