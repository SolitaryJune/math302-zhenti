<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>m2-2010-20 伪极坐标二重积分换直角坐标</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var PAGES = [
  "<p>计算 $I=\\displaystyle\\iint\\limits_D r^2\\sin\\theta\\,\\sqrt{1-r^2\\cos2\\theta}\\;\\mathrm dr\\,\\mathrm d\\theta$，$D=\\Big\\{(r,\\theta)\\;\\Big|\\;0\\le r\\le\\sec\\theta,\\ 0\\le\\theta\\le\\dfrac\\pi4\\Big\\}$。</p>",
  "<p><b>先看微元</b>：题面是 $\\mathrm dr\\,\\mathrm d\\theta$，<b>没有</b>极坐标的雅可比因子 $r$——这不是极坐标二重积分，直接硬算会碰壁。</p>",
  "<p>被积式里藏着 $x^2-y^2$！令 $x=r\\cos\\theta,\\ y=r\\sin\\theta$：</p>$$r^2\\cos2\\theta=x^2-y^2,\\qquad \\mathrm dx\\,\\mathrm dy=r\\,\\mathrm dr\\,\\mathrm d\\theta\\ \\Longrightarrow\\ \\mathrm dr\\,\\mathrm d\\theta=\\frac1r\\,\\mathrm dx\\,\\mathrm dy$$",
  "<p>化简被积式（$r^2\\sin\\theta=r\\,y$，$r$ 与 $\\dfrac1r$ 相消）：</p>$$r\\,y\\sqrt{1-x^2+y^2}\\cdot\\frac1r\\,\\mathrm dx\\,\\mathrm dy=y\\sqrt{1-x^2+y^2}\\,\\mathrm dx\\,\\mathrm dy$$",
  "<p>翻译区域：$0\\le\\theta\\le\\dfrac\\pi4\\iff0\\le y\\le x$；$r\\le\\sec\\theta\\iff r\\cos\\theta\\le1\\iff x\\le1$：</p>$$D'=\\{(x,y)\\mid0\\le x\\le1,\\ 0\\le y\\le x\\}\\quad(三角形)$$",
  "<p>先对 $y$ 积分（凑微分 $u=1-x^2+y^2$，$\\mathrm du=2y\\,\\mathrm dy$）：</p>$$\\int_0^xy\\sqrt{1-x^2+y^2}\\,\\mathrm dy=\\frac13(1-x^2+y^2)^{3/2}\\Big|_{y=0}^{y=x}=\\frac13\\Big[1-(1-x^2)^{3/2}\\Big]$$",
  "<p>再对 $x$ 积分：</p>$$I=\\int_0^1\\frac13\\Big[1-(1-x^2)^{3/2}\\Big]\\mathrm dx=\\frac13\\Big[1-\\int_0^1(1-x^2)^{3/2}\\,\\mathrm dx\\Big]$$",
  "<p>三角换元 $x=\\sin t$ + 华里士公式：</p>$$\\int_0^1(1-x^2)^{3/2}\\mathrm dx=\\int_0^{\\pi/2}\\cos^4t\\,\\mathrm dt=\\frac34\\cdot\\frac12\\cdot\\frac\\pi2=\\frac{3\\pi}{16}$$",
  "<p>代回：</p>$$I=\\frac13\\Big(1-\\frac{3\\pi}{16}\\Big)=\\frac13-\\frac{\\pi}{16}\\approx0.137>0\\ \\checkmark$$"
];

AW.init({
  title: "2010·20　识破「伪极坐标」：$\\mathrm dr\\,\\mathrm d\\theta$ 型二重积分",
  subtitle: "考点：变量代换与雅可比 · 区域翻译 · 凑微分 · 华里士公式",
  counterLabel: "步数",
  intro: "点击「▶ 播放」逐步演示：认微元 → 换坐标 → 译区域 → 累次积分。",

  build: function(stage){
    stage.innerHTML = "";
    var wrap = AW.el("div", "aw-scroll");
    wrap.appendChild(AW.el("div", "aw-row-label", "<b>推导板</b>：$I=\\iint_D r^2\\sin\\theta\\sqrt{1-r^2\\cos2\\theta}\\,\\mathrm dr\\,\\mathrm d\\theta$"));
    this._board = AW.el("div", "", "");
    wrap.appendChild(this._board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:"shift", tag:"审题", log:"积分变量记作 (r,θ)，但先别急着套极坐标——看看微元长什么样", count:0 },
    { cls:"ok", tag:"认微元", log:"微元是 dr·dθ，没有极坐标该有的 r 因子，硬按极坐标算必错", count:1 },
    { cls:"step", tag:"换坐标", log:"令 x=r·cosθ, y=r·sinθ：r²cos2θ 变成 x²−y²，且 dr·dθ = (1/r)·dx·dy", count:2 },
    { cls:"ok", tag:"化被积式", log:"r²sinθ = r·y，与 1/r 相消，被积函数变成 y·√(1−x²+y²)", count:3 },
    { cls:"ok", tag:"译区域", log:"0≤θ≤π/4 给出 0≤y≤x；r≤secθ 给出 x≤1——区域是直角三角形", count:4 },
    { cls:"step", tag:"内层积分", log:"对 y 凑微分 u=1−x²+y²，积出 ⅓[1−(1−x²)^{3/2}]", count:5 },
    { cls:"step", tag:"外层积分", log:"剩下 ⅓[1 − ∫(1−x²)^{3/2}dx]，关键是算后面那个定积分", count:6 },
    { cls:"ok", tag:"华里士", log:"x=sin t 换元后是 cos⁴t 在 [0,π/2] 的积分，华里士公式得 3π/16", count:7 },
    { cls:"done", tag:"完成", log:"代回得 I = 1/3 − π/16 ≈ 0.137，与被积函数非负、区域有界的直觉相符", count:8, done:true },
  ],

  render: function(stage, sn, i){
    this._board.innerHTML = PAGES[i];
    renderMathAfterSnap(stage);
  },

  result: {
    big: "I = 1/3 − π/16",
    html: "最终答案：$I=\\dfrac13-\\dfrac\\pi{16}$。<br>" +
          "记忆点：<b>微元是 $\\mathrm dr\\,\\mathrm d\\theta$ 时它不是极坐标积分</b>，代换后 $\\mathrm dr\\,\\mathrm d\\theta=\\dfrac1r\\mathrm dx\\,\\mathrm dy$；被积式里的 $x^2-y^2$ 是换直角坐标的信号灯。",
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
