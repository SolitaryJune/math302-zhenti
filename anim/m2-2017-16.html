<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017·16 抽象复合函数求二阶导</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2017·16　$y=f(\\mathrm{e}^{x},\\cos x)$，求 $\\left.\\dfrac{\\mathrm{d}y}{\\mathrm{d}x}\\right|_{x=0}$ 与 $\\left.\\dfrac{\\mathrm{d}^{2}y}{\\mathrm{d}x^{2}}\\right|_{x=0}$',
  subtitle: '考点：抽象复合函数链式法则 · 关键：$f_1\',f_2\'$ 仍是复合函数，二阶导要继续链式',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看链式法则如何一层层展开。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      "$$y=f(u,v),\\quad u=\\mathrm{e}^{x},\\ v=\\cos x;\\qquad u'=\\mathrm{e}^{x},\\ v'=-\\sin x$$",
      "<b>① 链式法则：</b>$\\dfrac{\\mathrm{d}y}{\\mathrm{d}x}=f_1'\\,u'+f_2'\\,v'=\\mathrm{e}^{x}f_1'-\\sin x\\,f_2'$",
      "<b>② 代 $x=0$：</b>$u=\\mathrm{e}^{0}=1,\\ v=\\cos0=1,\\ \\sin0=0\\ \\Rightarrow\\ y'(0)=f_1'(1,1)$",
      "<b>③ 关键提醒：</b>$f_1',f_2'$ 的位置仍在 $(u,v)=(\\mathrm{e}^{x},\\cos x)$ 处——对 $x$ 求导<b>必须继续链式</b>",
      "<b>④ 再链式：</b>$\\dfrac{\\mathrm{d}f_1'}{\\mathrm{d}x}=f_{11}''\\,\\mathrm{e}^{x}-f_{12}''\\sin x$；$\\dfrac{\\mathrm{d}f_2'}{\\mathrm{d}x}=f_{21}''\\,\\mathrm{e}^{x}-f_{22}''\\sin x$",
      "<b>⑤ 乘积法则：</b>$y''=\\mathrm{e}^{x}f_1'+\\mathrm{e}^{x}\\left(f_{11}''\\mathrm{e}^{x}-f_{12}''\\sin x\\right)-\\cos x\\,f_2'-\\sin x\\left(f_{21}''\\mathrm{e}^{x}-f_{22}''\\sin x\\right)$",
      "<b>⑥ 混合偏导：</b>$f$ 二阶偏导连续 $\\Rightarrow f_{12}''=f_{21}''$（可合并）",
      "<b>⑦ 代 $x=0$：</b>$\\sin0=0$ 使含 $\\sin x$ 的项全为零，$\\mathrm{e}^{0}=1,\\ \\cos0=1$",
      "<b>⑧ 结论：</b>$$y''(0)=f_{11}''(1,1)+f_1'(1,1)-f_2'(1,1)$$"
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'设元', log:'设两个中间变量，先备好它们对 x 的导数', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'一阶', log:'链式法则：第一支乘 e 的 x 次方，第二支乘负 sin x', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'代入', log:'x 取零时两个中间变量都是一，sin 项消失，一阶导只剩第一支', count:2, ribbon:{k:3, ok:true} },
    { cls:'shift', tag:'提醒', log:'易错点来了：偏导数仍在原位置，对 x 求导不能当常数', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'链式', log:'两个偏导数各自继续走链式，各出两项二阶偏导', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'展开', log:'乘积法则逐项展开，四块合成完整的二阶导', count:5, ribbon:{k:6, ok:true} },
    { cls:'step',  tag:'合并', log:'二阶偏导连续时混合偏导相等，可以合并', count:6, ribbon:{k:7, ok:true} },
    { cls:'ok',    tag:'代入', log:'x 取零后含 sin 的项全部归零，只剩三块', count:7, ribbon:{k:8, ok:true} },
    { cls:'done',  tag:'完成', log:'结论：二阶导等于 f 下标 11 的二阶偏导加 f1 减 f2，都在点 (1,1) 取值', count:8, ribbon:{k:9, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$y\'(0)=f_1\'(1,1)$，$y\'\'(0)=f_{11}\'\'(1,1)+f_1\'(1,1)-f_2\'(1,1)$',
    html: '记忆锚点：<b>「抽象函数求到几阶，偏导就复合到几层」</b>——$f_1\'$ 仍在 $(\\mathrm{e}^{x},\\cos x)$ 处，再求导必链式出 $f_{11}\'\',f_{12}\'\'$。易错：把 $f_1\'$ 当常数（丢二阶偏导项）；忘记乘积法则补出的 $f_1\'-f_2\'$；结果忘了写在 $(1,1)$ 处。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
