<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2016·04 由导函数图形读极值点与拐点</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：图上画的是 f′，不是 f',
    cls: 'key',
    tag: '审题',
    body: '<p>极值点看 $f\'$ 的<b>变号零点</b>（图形真正穿过 $x$ 轴）；拐点看 $f\'\'$ 变号，而 $f\'\'$ 变号等价于 $f\'$ 的<b>单调性改变</b>——即 $f\'$ 图形的峰、谷（含与 $x$ 轴相切的触点，只要它先减后增）。</p>',
    log: '极值 ⇔ f′ 变号；拐点 ⇔ f′ 增减互换' },
  { title: '数极值点：穿过型零点',
    cls: 'good',
    tag: '极值点',
    ribbon: {k:1, ok:true},
    body: '<p>图中 $f\'$ <b>穿过</b> $x$ 轴并正负互换的有 <b>2</b> 处，每处都是极值点；其余位置 $f\'$ 不变号，不产生极值。</p>',
    log: 'f′ 变号零点 2 个 → 极值点 2 个' },
  { title: '相切触点：非极值，但藏着一个拐点',
    cls: 'bad',
    tag: '陷阱',
    body: '<p>图中另有一处 $f\'$ 与 $x$ 轴<b>相切</b>、两侧不变号——切而不穿，$f\'$ 符号不变，<b>不是极值点</b>。但触点附近 $f\'$ 先减后增，$f\'\'=0$ 且变号，<b>这里恰是拐点</b>。</p>',
    log: '切而不穿：不给极值，却给拐点' },
  { title: '数拐点：f′ 的峰谷 + 触点',
    cls: 'good',
    tag: '拐点',
    ribbon: {k:2, ok:true},
    body: '<p>$f\'\'$ 变号 = $f\'$ 增减互换：图中 $f\'$ 有 <b>2 个内部峰/谷</b>，加上相切触点处（$f\'$ 由减转增），共 <b>3</b> 处。$f$ 处处可导足够光滑，3 处都是 $y=f(x)$ 的拐点。</p>',
    log: 'f′′ 变号 3 处 → 拐点 3 个' },
  { title: '对选项',
    cls: 'step',
    tag: '选项',
    body: '<p><b>A</b>（2 极值 2 拐点）：拐点少算了触点。<b>B</b>（2 极值 3 拐点）：两数都对。<b>C/D</b>（3 极值…）：把相切不变号的点误计为极值。</p>',
    log: 'A 拐点少 1；C/D 极值多 1' },
  { title: '结论',
    cls: 'good',
    tag: '完成',
    body: '<p>答案选 <b>B</b>：$f$ 有 2 个极值点，曲线 $y=f(x)$ 有 3 个拐点。记忆锚点：<b>变号才极值，峰谷出拐点</b>；相切零点是「不给极值、专给拐点」的经典陷阱。</p>',
    log: '选 B：2 个极值点 + 3 个拐点' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.log || s.title,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '由 $f\'$ 的图形读出极值点与拐点个数',
  subtitle: '考点：极值判定 · 拐点判定 · 方法：f′ 变号定极值、f′ 峰谷定拐点',
  counterLabel: '推理步',
  ribbonTitle: '两个计数（✓ 已定）',
  intro: '点击「▶ 播放」逐步展开推理链（题图以文字转述：f′ 有 2 个穿过型零点、1 个相切型触点、2 个内部峰谷）。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B（2 个极值点，3 个拐点）',
    html: '记忆锚点：<b>变号才极值，峰谷出拐点</b>。$f\'$ 穿过 $x$ 轴变号 2 处 → 2 个极值；$f\'$ 的 2 个峰谷 + 1 个相切触点（先减后增）共 3 处 $f\'\'$ 变号 → 3 个拐点。相切零点不产生极值，专产拐点。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
