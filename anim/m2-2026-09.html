<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：矩阵方程 AB=C 的相容性定参数</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '矩阵方程 $AB=C$（$A$ 为 $4\\times3$）有解，定 $a,\\ b$',
  subtitle: '考点：线性方程组相容性 · 按列分块 · 回代求解',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示按列分块的完整求解。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$A$ 是 $4\\times3$，$C$ 是 $4\\times2$，故 $B$ 为 $3\\times2$。按列分块：$AB=C\\iff A\\beta_1=c_1$ 与 $A\\beta_2=c_2$ <b>同时有解</b>。',
      '<b>写出方程组</b>（设 $\\beta=(x_1,x_2,x_3)^T$，第 2 行只含 $x_3$，回代最稳）：$$x_1+x_3=c^{(1)},\\quad x_3=c^{(2)},\\quad x_1+x_2+3x_3=c^{(3)},\\quad x_1+x_2+x_3=c^{(4)}$$ 前 3 个方程解出 $\\beta$，第 4 个给相容条件。',
      '<b>第一列</b> $c_1=(2,1,1,a)^T$：$x_3=1,\\ x_1=2-1=1,\\ x_2=1-1-3=-3$；代第 4 式 $$1-3+1=-1\\ \\Longrightarrow\\ a=-1$$',
      '<b>第二列</b> $c_2=(0,1,1,b)^T$：$x_3=1,\\ x_1=0-1=-1,\\ x_2=1+1-3=-1$；代第 4 式 $$-1-1+1=-1\\ \\Longrightarrow\\ b=-1$$',
      '<b>验算</b>：$\\beta_1=(1,-3,1)^T$ 使 $A\\beta_1=(2,1,1,-1)^T$ ✓；$\\beta_2=(-1,-1,1)^T$ 使 $A\\beta_2=(0,1,1,-1)^T$ ✓，与 $C$ 吻合。',
      '<b>排错</b>：$a$ 或 $b$ 取其他值时 $r(A\\mid c)=4>r(A)=3$，对应方程组无解——C、D 各只对一个。',
      '<b>结论</b>：$$a=-1,\\qquad b=-1\\qquad\\Longrightarrow\\qquad \\text{选 A}$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'按列分块：AB=C 等价于两个方程组同时有解', count:0 },
    { cls:'step',  tag:'列方程', log:'四个方程：前 3 个解出 β，第 4 个给相容条件', count:1 },
    { cls:'shift', tag:'第一列', log:'c₁=(2,1,1,a)：解出 (1,−3,1)，第 4 式要 a = −1', count:2 },
    { cls:'ok',    tag:'第二列', log:'c₂=(0,1,1,b)：解出 (−1,−1,1)，第 4 式要 b = −1', count:3 },
    { cls:'ok',    tag:'验算',   log:'两组解代回 Aβ 与 C 的两列完全吻合', count:4 },
    { cls:'miss',  tag:'排错',   log:'a、b 任一个不是 −1 就矛盾，增广秩变 4 无解', count:5 },
    { cls:'done',  tag:'完成',   log:'结论：a = b = −1，选 A', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$a=-1,\\quad b=-1$（选 A）',
    html: '记忆锚点：<b>$AB=C$ 有解 $\\iff$ $C$ 的每列都能被 $A$ 的列线性表出（$r(A\\mid c)=r(A)$）</b>。技巧：$A$ 的第 2 行只含 $x_3$，直接回代最快；两列各自要相容条件，缺一不可。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
