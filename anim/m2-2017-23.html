<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017·23 二次型定参数并求正交矩阵</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2017·23　标准形 $\\lambda_{1}y_{1}^{2}+\\lambda_{2}y_{2}^{2}$：求 $a$ 与正交矩阵 $\\boldsymbol{Q}$',
  subtitle: '考点：正交变换标准形系数 = 特征值 · 缺项 $\\Rightarrow|A|=0$ · 特征向量单位化拼 $Q$',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，走完二次型的标准流程。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      "$$f=2x_{1}^{2}-x_{2}^{2}+ax_{3}^{2}+2x_{1}x_{2}-8x_{1}x_{3}+2x_{2}x_{3}$$",
      "<b>① 写矩阵：</b>交叉项系数除以 $2$：$\\boldsymbol{A}=\\begin{pmatrix}2&1&-4\\\\1&-1&1\\\\-4&1&a\\end{pmatrix}$",
      "<b>② 定 $a$：</b>标准形只有两项 $\\Rightarrow$ 有一个特征值为 $0\\ \\Rightarrow\\ |\\boldsymbol{A}|=0$：$-3a+6=0\\Rightarrow a=2$",
      "<b>③ 特征值：</b>$\\operatorname{tr}\\boldsymbol{A}=3$，$0$ 已占一席 $\\Rightarrow\\lambda_{1}+\\lambda_{2}=3$；二阶主子式和 $=-18=\\lambda_{1}\\lambda_{2}$ $\\Rightarrow\\ \\lambda^{2}-3\\lambda-18=0$",
      "<b>④ 解得：</b>$\\lambda_{1}=-3,\\ \\lambda_{2}=6,\\ \\lambda_{3}=0$（标准形即 $-3y_{1}^{2}+6y_{2}^{2}$）",
      "<b>⑤ $\\lambda=-3$：</b>$(\\boldsymbol{A}+3\\boldsymbol{E})\\boldsymbol{x}=\\boldsymbol{0}\\ \\Rightarrow\\ \\boldsymbol{\\xi}_{1}=(1,-1,1)^{\\mathrm T}$，验算 $\\boldsymbol{A}\\boldsymbol{\\xi}_{1}=-3\\boldsymbol{\\xi}_{1}$ ✓",
      "<b>⑥ $\\lambda=6$：</b>$(\\boldsymbol{A}-6\\boldsymbol{E})\\boldsymbol{x}=\\boldsymbol{0}\\ \\Rightarrow\\ \\boldsymbol{\\xi}_{2}=(-1,0,1)^{\\mathrm T}$，验算 $\\boldsymbol{A}\\boldsymbol{\\xi}_{2}=6\\boldsymbol{\\xi}_{2}$ ✓",
      "<b>⑦ $\\lambda=0$：</b>$\\boldsymbol{Ax}=\\boldsymbol{0}\\ \\Rightarrow\\ \\boldsymbol{\\xi}_{3}=(1,2,1)^{\\mathrm T}$，验算 $\\boldsymbol{A}\\boldsymbol{\\xi}_{3}=\\boldsymbol{0}$ ✓",
      "<b>⑧ 正交检查：</b>$\\boldsymbol{\\xi}_{1}\\!\\cdot\\!\\boldsymbol{\\xi}_{2}=\\boldsymbol{\\xi}_{1}\\!\\cdot\\!\\boldsymbol{\\xi}_{3}=\\boldsymbol{\\xi}_{2}\\!\\cdot\\!\\boldsymbol{\\xi}_{3}=0$（互异特征值自动正交，免施密特）",
      "<b>⑨ 单位化拼 $\\boldsymbol{Q}$：</b>$\\|\\boldsymbol{\\xi}_{1}\\|=\\sqrt3,\\ \\|\\boldsymbol{\\xi}_{2}\\|=\\sqrt2,\\ \\|\\boldsymbol{\\xi}_{3}\\|=\\sqrt6$，以单位向量为列：$\\boldsymbol{Q}=\\left(\\dfrac{\\boldsymbol{\\xi}_{1}}{\\sqrt3},\\dfrac{\\boldsymbol{\\xi}_{2}}{\\sqrt2},\\dfrac{\\boldsymbol{\\xi}_{3}}{\\sqrt6}\\right)$"
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题', log:'标准形只含两个平方项，第三个特征值必为零', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'写阵', log:'交叉项系数逐个除以二，写出实对称矩阵', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'定参', log:'有零特征值等价于行列式为零，解出 a 等于二', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'追值', log:'用迹与二阶主子式之和联立，解出三个特征值', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'负根', log:'特征值负三：解齐次组得一零一方向，代回验算成立', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'正根', log:'特征值六：得负一零一方向，验算翻六倍成立', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'零根', log:'特征值零：即矩阵方程本身，得一二一方向', count:6, ribbon:{k:7, ok:true} },
    { cls:'step',  tag:'正交', log:'三个特征值互不相同，特征向量自动两两垂直', count:7, ribbon:{k:8, ok:true} },
    { cls:'ok',    tag:'单位化', log:'各自除以模长：根三、根二、根六，拼成正交矩阵的列', count:8, ribbon:{k:9, ok:true} },
    { cls:'done',  tag:'完成', log:'结论：a=2，Q 三列分别为 xi1/√3、xi2/√2、xi3/√6，标准形 -3y1²+6y2²', count:9, ribbon:{k:10, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$a=2$，$f=-3y_{1}^{2}+6y_{2}^{2}$',
    html: '<b>$\\boldsymbol{Q}=\\begin{pmatrix}\\tfrac{1}{\\sqrt3}&-\\tfrac{1}{\\sqrt2}&\\tfrac{1}{\\sqrt6}\\\\-\\tfrac{1}{\\sqrt3}&0&\\tfrac{2}{\\sqrt6}\\\\\\tfrac{1}{\\sqrt3}&\\tfrac{1}{\\sqrt2}&\\tfrac{1}{\\sqrt6}\\end{pmatrix}$</b>。流程记忆：<b>缺项 $\\Rightarrow|\\boldsymbol{A}|=0$ 定参数 → 迹与主子式联立求特征值 → 解三个齐次组 → 互异免正交化、直接单位化拼列</b>。易错：交叉项不除二；$\\boldsymbol{Q}$ 的列与特征值不对应。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
