<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017·22 特征值定秩 + 读出方程组通解</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：两个条件的分工',
    cls: 'key',
    body: '<p>$\\boldsymbol{A}=(\\boldsymbol{\\alpha}_{1},\\boldsymbol{\\alpha}_{2},\\boldsymbol{\\alpha}_{3})$ 三阶，条件一：$\\boldsymbol{\\alpha}_{3}=\\boldsymbol{\\alpha}_{1}+2\\boldsymbol{\\alpha}_{2}$（列向量相关）；条件二：3 个<b>互不相同</b>的特征值（可对角化）。一个压秩，一个顶秩。</p>' },
  { title: '(1)① 列相关给上界',
    cls: 'bad',
    body: '<p>$\\boldsymbol{\\alpha}_{3}=\\boldsymbol{\\alpha}_{1}+2\\boldsymbol{\\alpha}_{2}$ 即 $\\boldsymbol{\\alpha}_{1}+2\\boldsymbol{\\alpha}_{2}-\\boldsymbol{\\alpha}_{3}=\\boldsymbol{0}$，三列线性相关 $\\Rightarrow r(\\boldsymbol{A})\\le2$，且 $|\\boldsymbol{A}|=0$，故 $0$ 是 $\\boldsymbol{A}$ 的特征值。</p>' },
  { title: '(1)② 互异特征值给下界',
    cls: 'good',
    body: '<p>3 个互异特征值 $\\Rightarrow$ 每个代数重数为 $1$（$0$ 只占一个名额），且 $\\boldsymbol{A}$ 可对角化，$r(\\boldsymbol{A})$ = 非零特征值个数 $\\ge2$，即 $r(\\boldsymbol{A})\\ge2$。</p>' },
  { title: '(1)③ 夹逼定秩',
    cls: 'good',
    body: '<p>$2\\le r(\\boldsymbol{A})\\le2\\ \\Longrightarrow\\ r(\\boldsymbol{A})=2$。<b>(1) 得证</b>。</p>' },
  { title: '(2)① 零空间只剩一维',
    cls: 'key',
    body: '<p>$n-r(\\boldsymbol{A})=3-2=1$：基础解系只需 <b>1 个</b>向量。它不在消元里，而在列关系里。</p>' },
  { title: '(2)② 从列关系读出 ξ',
    cls: 'good',
    body: '<p>按列组合观点：$\\boldsymbol{A}\\boldsymbol{x}=x_{1}\\boldsymbol{\\alpha}_{1}+x_{2}\\boldsymbol{\\alpha}_{2}+x_{3}\\boldsymbol{\\alpha}_{3}$。取系数 $(1,2,-1)$ 恰好凑出 $\\boldsymbol{\\alpha}_{1}+2\\boldsymbol{\\alpha}_{2}-\\boldsymbol{\\alpha}_{3}=\\boldsymbol{0}$，故 $\\boldsymbol{\\xi}=(1,2,-1)^{\\mathrm T}$ 是 $\\boldsymbol{Ax}=\\boldsymbol{0}$ 的基础解系。</p>' },
  { title: '(2)③ 从 β 的表示读出特解',
    cls: 'good',
    body: '<p>$\\boldsymbol{\\beta}=\\boldsymbol{\\alpha}_{1}+\\boldsymbol{\\alpha}_{2}+\\boldsymbol{\\alpha}_{3}=\\boldsymbol{A}(1,1,1)^{\\mathrm T}$，故 $\\boldsymbol{\\eta}=(1,1,1)^{\\mathrm T}$ 是 $\\boldsymbol{Ax}=\\boldsymbol{\\beta}$ 的特解。</p>' },
  { title: '(2)④ 通解 + 验算',
    cls: 'good',
    body: '<p>$$\\boldsymbol{x}=\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}+k\\begin{pmatrix}1\\\\2\\\\-1\\end{pmatrix}\\quad(k\\ \\text{任意}).$$ 验算：$\\boldsymbol{A}\\boldsymbol{x}=\\boldsymbol{\\beta}+k\\,\\boldsymbol{A}\\boldsymbol{\\xi}=\\boldsymbol{\\beta}+\\boldsymbol{0}=\\boldsymbol{\\beta}$，恒成立。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2017·22　$\\boldsymbol{\\alpha}_{3}=\\boldsymbol{\\alpha}_{1}+2\\boldsymbol{\\alpha}_{2}$，3 个互异特征值：证 $r(\\boldsymbol{A})=2$ 并求 $\\boldsymbol{Ax}=\\boldsymbol{\\beta}$ 的通解',
  subtitle: '考点：秩的夹逼 · 可对角化时秩 = 非零特征值个数 · 按列组合读解向量',
  ribbonTitle: '推理进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，按推理链逐张展开。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '$r(\\boldsymbol{A})=2$，$\\boldsymbol{x}=(1,1,1)^{\\mathrm T}+k(1,2,-1)^{\\mathrm T}$',
    html: '记忆锚点：<b>抽象矩阵求秩用「两头夹逼」</b>：线性相关给 $\\le$，互异特征值（可对角化、秩 = 非零特征值个数）给 $\\ge$。抽象方程组的解向量<b>从 $\\boldsymbol{A}\\boldsymbol{x}=\\sum x_{i}\\boldsymbol{\\alpha}_{i}$ 按列组合直接读系数</b>：零组合系数 $(1,2,-1)$ 是 $\\boldsymbol{\\xi}$，$\\boldsymbol{\\beta}$ 的组合系数 $(1,1,1)$ 是特解。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
