<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-17 二元函数极值 · 逐步推导</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域 ================== */
var rows = [];

AW.init({
  title: '求 $f(x,y)=x^3+8y^3-xy$ 的极值',
  subtitle: '考点：无条件极值 · 流程：驻点方程组 → $AC-B^2$ 判别 → 代回求值',
  counterLabel: '已推进',
  intro: '点击「▶ 播放」：解驻点、算判别式、逐点下结论。',

  build: function(stage){
    stage.innerHTML = '';
    rows = [];
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label',
      '<b>推导板</b>：$f(x,y)=x^3+8y^3-xy$，判别式 $AC-B^2$（$A=f_{xx},B=f_{xy},C=f_{yy}$）'));
    var ROWS = [
      '$$f_x=3x^2-y=0,\\qquad f_y=24y^2-x=0$$',
      '$$y=3x^2\\ \\Rightarrow\\ 24(3x^2)^2-x=x(216x^3-1)=0\\ \\Rightarrow\\ (0,0),\\ \\left(\\tfrac16,\\tfrac1{12}\\right)$$',
      '$$A=f_{xx}=6x,\\qquad B=f_{xy}=-1,\\qquad C=f_{yy}=48y$$',
      '$$\\text{在 }(0,0):\\quad AC-B^2=0\\cdot0-(-1)^2=-1<0\\ \\Rightarrow\\ \\text{非极值（鞍点）}$$',
      '$$\\text{在 }\\left(\\tfrac16,\\tfrac1{12}\\right):\\quad AC-B^2=1\\cdot4-1=3>0,\\ A=1>0\\ \\Rightarrow\\ \\text{极小值点}$$',
      '$$f\\left(\\tfrac16,\\tfrac1{12}\\right)=\\frac1{216}+\\frac1{216}-\\frac3{216}=-\\frac1{216}$$'
    ];
    ROWS.forEach(function(html){
      var row = AW.el('div', 'derive-row', html);
      row.style.cssText = 'padding:6px 14px;margin:8px 0;border-radius:8px;' +
        'border-left:4px solid #cbd5e1;background:#f8fafc;opacity:0;' +
        'transform:translateY(8px);transition:all .35s ease;';
      wrap.appendChild(row);
      rows.push(row);
    });
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    rows.forEach(function(row, j){
      var vis = j < i;
      var cur = vis && j === i - 1;
      row.style.opacity = vis ? '1' : '0';
      row.style.transform = vis ? 'translateY(0)' : 'translateY(8px)';
      row.style.borderLeftColor = cur ? '#f59e0b' : (vis ? '#10b981' : '#cbd5e1');
      row.style.background = cur ? '#fffbeb' : (vis ? '#f0fdf4' : '#f8fafc');
    });
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'无条件极值标准流程：驻点、判别、求值', count:0 },
    { cls:'step',  tag:'列方程', log:'两个一阶偏导同时为零', count:1 },
    { cls:'ok',    tag:'解驻点', log:'代入消元得 x 乘 (216x三次方减1)，两个根都不能丢', count:2 },
    { cls:'step',  tag:'二阶导', log:'A、B、C 三个二阶偏导写出来，都是线性式子', count:3 },
    { cls:'miss',  tag:'判 (0,0)', log:'判别式等于负 1 小于 0，原点是鞍点不是极值点', count:4 },
    { cls:'ok',    tag:'判另一点', log:'判别式等于 3 大于 0，且 A=1 大于 0，是极小值点', count:5 },
    { cls:'done',  tag:'结论', log:'通分求值：极小值 = 负 1/216', count:6, done:true },
  ],

  result: {
    big: '极小值 $f\\left(\\dfrac16,\\dfrac1{12}\\right)=-\\dfrac1{216}$；$(0,0)$ 非极值点',
    html: '正确答案：只有极小值 $f\\left(\\dfrac16,\\dfrac1{12}\\right)=-\\dfrac1{216}$，驻点 $(0,0)$ 处 $AC-B^2=-1<0$ 是鞍点。易错：<b>解 $x(216x^3-1)=0$ 时除以 $x$ 会丢根 $(0,0)$</b>；判别式为正时还要看 $A$ 的符号定极大极小。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
