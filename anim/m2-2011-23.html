<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2011·23 从矩阵等式读特征对，谱分解还原 A</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>按列拆开已知等式</b>：题给 $A\\begin{pmatrix}1&1\\\\0&0\\\\-1&1\\end{pmatrix}=\\begin{pmatrix}-1&1\\\\0&0\\\\1&1\\end{pmatrix}$ 的两列各是 $A$ 作用在一个向量上：$$A\\begin{pmatrix}1\\\\0\\\\-1\\end{pmatrix}=\\begin{pmatrix}-1\\\\0\\\\1\\end{pmatrix},\\qquad A\\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}=\\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}.$$</p>",
  "<p><b>读出特征对</b>：右端恰是左向量的倍数——$$A\\boldsymbol\\xi_2=-1\\cdot\\boldsymbol\\xi_2\\ (\\boldsymbol\\xi_2=(1,0,-1)^{\\mathrm T}),\\qquad A\\boldsymbol\\xi_3=1\\cdot\\boldsymbol\\xi_3\\ (\\boldsymbol\\xi_3=(1,0,1)^{\\mathrm T}).$$ 得 $\\lambda_2=-1,\\ \\lambda_3=1$。</p>",
  "<p><b>补出 $\\lambda=0$</b>：$r(A)=2<3\\Rightarrow\\det A=0\\Rightarrow\\lambda_1=0$ 必是第三个特征值（三个特征值 $0,-1,1$ 互异）。</p>",
  "<p><b>正交定位 $\\boldsymbol\\xi_1$</b>：$A$ 实对称，不同特征值的特征向量相互正交。设 $\\boldsymbol\\xi_1=(a,b,c)^{\\mathrm T}$：$\\boldsymbol\\xi_1\\cdot\\boldsymbol\\xi_2=a-c=0$，$\\boldsymbol\\xi_1\\cdot\\boldsymbol\\xi_3=a+c=0$，解得 $a=c=0$，取 $\\boldsymbol\\xi_1=(0,1,0)^{\\mathrm T}$。</p>",
  "<p><b>单位化</b>：$e_1=(0,1,0)^{\\mathrm T},\\ e_2=\\dfrac1{\\sqrt2}(1,0,-1)^{\\mathrm T},\\ e_3=\\dfrac1{\\sqrt2}(1,0,1)^{\\mathrm T}$，构成正交矩阵 $P=(e_1,e_2,e_3)$，$\\Lambda=\\mathrm{diag}(0,-1,1)$，且 $A=P\\Lambda P^{\\mathrm T}$。</p>",
  "<p><b>谱分解计算</b>：$A=\\sum_i\\lambda_i e_ie_i^{\\mathrm T}=0\\cdot e_1e_1^{\\mathrm T}-e_2e_2^{\\mathrm T}+e_3e_3^{\\mathrm T}$，其中 $$e_2e_2^{\\mathrm T}=\\frac12\\begin{pmatrix}1&0&-1\\\\0&0&0\\\\-1&0&1\\end{pmatrix},\\qquad e_3e_3^{\\mathrm T}=\\frac12\\begin{pmatrix}1&0&1\\\\0&0&0\\\\1&0&1\\end{pmatrix}.$$</p>",
  "<p><b>相加还原</b>：$$A=\\frac12\\begin{pmatrix}0&0&2\\\\0&0&0\\\\2&0&0\\end{pmatrix}=\\begin{pmatrix}0&0&1\\\\0&0&0\\\\1&0&0\\end{pmatrix}.$$</p>",
  "<p><b>验算</b>：$A(1,0,-1)^{\\mathrm T}=(-1,0,1)^{\\mathrm T}$ ✓，$A(1,0,1)^{\\mathrm T}=(1,0,1)^{\\mathrm T}$ ✓，$r(A)=2$ ✓。特征值 $0,-1,1$，矩阵如上。</p>"
];

AW.init({
  title: '实对称阵 $A$（$r(A)=2$）：求特征对并还原 $A$',
  subtitle: '考点：特征值与实对称矩阵 · 方法：拆列读特征对 → 秩亏补 0 → 正交定位 → 谱分解',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示特征信息提取与矩阵重构。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'拆列',   log:'矩阵等式按列拆开，两列各是 A 乘一个具体向量', show:1, count:0 },
    { cls:'ok',    tag:'读对',   log:'两列右端都是原向量的倍数：读出特征值 −1 和 1 及各自的特征向量', show:2, count:1 },
    { cls:'key',   tag:'补 0',   log:'秩是 2，行列式为 0，第三个特征值必是 0', show:3, count:2 },
    { cls:'ok',    tag:'正交',   log:'实对称阵不同特征值的特征向量互相垂直：与两条都垂直的只有 (0,1,0)ᵀ', show:4, count:3 },
    { cls:'step',  tag:'单位化', log:'三条向量单位化拼成正交矩阵 P，对角阵对角线为 0、−1、1', show:5, count:4 },
    { cls:'step',  tag:'谱分解', log:'用 A=Σλᵢeᵢeᵢᵀ：只有 −e₂e₂ᵀ 和 e₃e₃ᵀ 两块有份量', show:6, count:5 },
    { cls:'ok',    tag:'还原',   log:'两块相加得 A：副对角线两个 1，其余全零', show:7, count:6 },
    { cls:'done',  tag:'验算',   log:'代回两个特征向量与秩，全部吻合', show:8, count:7, done:true },
  ],

  result: {
    big: '$\\lambda_1=0,\\ \\lambda_2=-1,\\ \\lambda_3=1$；$A=\\begin{pmatrix}0&0&1\\\\0&0&0\\\\1&0&0\\end{pmatrix}$',
    html: '记忆锚点：<b>矩阵等式按列拆 = 一串现成的特征向量方程</b>；秩亏一维补出 $\\lambda=0$；实对称 ⇒ 正交定位第三条向量；谱分解 $A=\\sum\\lambda_ie_ie_i^{\\mathrm T}$ 记得先单位化。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
