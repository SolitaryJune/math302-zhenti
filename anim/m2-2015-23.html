<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015 数二第 23 题 · 相似定参数并对角化（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2015·23　$A\\sim B$：(1) 求 $a,b$；(2) 求 $P$ 使 $P^{-1}AP$ 为对角阵',
  subtitle: '考点：相似矩阵不变量 · <b>特征值二重根的对角化</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看 a、b 如何定出、三个特征向量如何凑齐。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '$$A=\\begin{pmatrix}0&2&-3\\\\-1&3&-3\\\\1&-2&a\\end{pmatrix}\\sim B=\\begin{pmatrix}1&-2&0\\\\0&b&0\\\\0&3&1\\end{pmatrix}$$',
      '<b>① $B$ 的特征值：</b>分块下三角，特征值即对角元 $1,\\,b,\\,1$；相似传递给 $A$：特征值 $1,1,b$',
      '<b>② 迹相等：</b>$\\operatorname{tr}A=0+3+a=\\operatorname{tr}B=1+b+1\\ \\Rightarrow\\ b=a+1$',
      '<b>③ 行列式相等：</b>$\\det A=2a-3$（按第一列展开），$\\det B=b\\ \\Rightarrow\\ 2a-3=a+1\\ \\Rightarrow\\ a=4,\\ b=5$，特征值 $1,1,5$',
      '<b>④ $\\lambda=1$（二重）：</b>$A-E\\to\\begin{pmatrix}1&-2&3\\\\0&0&0\\\\0&0&0\\end{pmatrix}$（秩 $1$），$x_1-2x_2+3x_3=0$：$\\xi_1=(2,1,0)^T,\\ \\xi_2=(-3,0,1)^T$',
      '<b>⑤ $\\lambda=5$：</b>$A-5E\\to x_1+x_3=0,\\ x_2+x_3=0$，取 $x_3=1$：$\\xi_3=(-1,-1,1)^T$（验证 $A\\xi_3=5\\xi_3$ ✓）',
      '<b>⑥ 拼 $P$ 并验可逆：</b>$P=(\\xi_1,\\xi_2,\\xi_3)=\\begin{pmatrix}2&-3&-1\\\\1&0&-1\\\\0&1&1\\end{pmatrix}$，$\\det P=4\\ne0$',
      '<b>⑦ 对角化：</b>$P^{-1}AP=\\operatorname{diag}(1,1,5)$'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'先借相似关系定出 a 与 b，再对 A 做对角化', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'特征值', log:'B 是分块下三角，特征值就是对角元：一、b、一', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'迹相等', log:'相似矩阵迹相等，得到 b 与 a 的第一个关系', count:2, ribbon:{k:3, ok:true} },
    { cls:'shift', tag:'行列式', log:'行列式也相等，联立解出 a 等于四、b 等于五，特征值一、一、五', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'λ=1',  log:'二重根对应的齐次方程秩为一，自由量两个，凑出两个无关特征向量', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'λ=5',  log:'单根对应一个特征向量，代回验证成立', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'拼 P',  log:'三个向量按列拼成 P，行列式等于四非零，可逆', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'完成',  log:'对角矩阵按特征向量顺序写出：一、一、五', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$a=4,\\ b=5;\\quad P^{-1}AP=\\operatorname{diag}(1,1,5)$',
    html: '记忆锚点：<b>相似用「迹相等 + 行列式相等」两个方程定两个参数</b>；$B$ 分块下三角，特征值即对角元 $1,b,1$。易错：$\\lambda=1$ 是二重根，必须凑齐<b>两个</b>无关特征向量（$A-E$ 秩为 $1$）；$P$ 的列顺序要与对角元 $1,1,5$ 一一对应。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
