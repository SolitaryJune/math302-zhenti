<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2015 数二第 15 题 · 等价无穷小定参（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2015·15　$f\\sim g$：$x+a\\ln(1+x)+bx\\sin x \\sim kx^3$，求 $a,b,k$',
  subtitle: '考点：等价无穷小 · <b>泰勒展开按幂次配系数</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看三个参数如何被逐幂次「逼」出来。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '$$f(x)=x+a\\ln(1+x)+b\\,x\\sin x,\\qquad g(x)=kx^{3},\\qquad f(x)\\sim g(x)\\ (x\\to0)$$',
      '<b>① 翻译条件：</b>$f(x)\\sim kx^3$ 即 $f(x)=kx^3+o(x^3)$ —— 展到三阶后，一、二次项系数须为 $0$，三次项系数须等于 $k$',
      '<b>② 展开 $\\ln(1+x)$：</b>$\\ln(1+x)=x-\\dfrac{x^2}2+\\dfrac{x^3}3+o(x^3)$',
      '<b>③ 展开 $x\\sin x$：</b>$\\sin x=x-\\dfrac{x^3}6+o(x^3)\\ \\Rightarrow\\ x\\sin x=x^2+o(x^3)$（主部是二阶）',
      '<b>④ 代入合并：</b>$f(x)=(1+a)x+\\Bigl(b-\\dfrac a2\\Bigr)x^2+\\dfrac a3x^3+o(x^3)$',
      '<b>⑤ 一次项归零：</b>$1+a=0\\ \\Rightarrow\\ a=-1$',
      '<b>⑥ 二次项归零：</b>$b-\\dfrac a2=0\\ \\Rightarrow\\ b=\\dfrac a2=-\\dfrac12$',
      '<b>⑦ 三次项定 $k$：</b>$k=\\dfrac a3=\\dfrac{-1}3=-\\dfrac13$',
      '<b>⑧ 验算：</b>$f(x)=-\\dfrac{x^3}3+o(x^3)\\sim-\\dfrac{x^3}3=g(x)$ ✓'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'等价无穷小就是比值极限为 1，把 f 展开到三阶与 k x 三次方比对系数', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'翻译',   log:'等价翻译成展开语言：f 的展开里一、二次项系数必须为零，三次项系数是 k', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'对数',   log:'对数展开到三阶：一阶、二分之一二阶、三分之一三阶', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'乘积',   log:'正弦乘 x：主部落在二阶，别误当成三阶', count:3, ribbon:{k:4, ok:true} },
    { cls:'shift', tag:'合并',   log:'按幂次合并同类项：三个系数分别写出来', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'定 a',   log:'一次项系数归零：a 等于负一', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'定 b',   log:'二次项系数归零：b 等于 a 的一半，即负二分之一', count:6, ribbon:{k:7, ok:true} },
    { cls:'ok',    tag:'定 k',   log:'三次项系数就是 k：a 除以三，等于负三分之一', count:7, ribbon:{k:8, ok:true} },
    { cls:'done',  tag:'完成',   log:'验算通过：f 的三阶主部恰为负三分之一个 x 三次方', count:8, ribbon:{k:9, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$a=-1,\\quad b=-\\dfrac12,\\quad k=-\\dfrac13$',
    html: '记忆锚点：<b>等价无穷小 = 泰勒展开比系数</b>：$f\\sim kx^3$ 就是「低幂次归零、$x^3$ 系数归 $k$」。易错：$x\\sin x$ 的主部是<b>二阶</b>（不是三阶），$b$ 全靠它定；三个参数依次为 $-1,-\\tfrac12,-\\tfrac13$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
