<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念动画：实对称矩阵相似的充要条件（2013 年第 8 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>$A=\\begin{pmatrix}1&a&1\\\\a&b&a\\\\1&a&1\\end{pmatrix}$ 是<b>实对称</b>矩阵，必可对角化；$\\Lambda=\\mathrm{diag}(2,b,0)$ 是对角阵。都可对角化 $\\Rightarrow$ 相似 $\\iff$ 特征值同为 $\\{2,b,0\\}$（含重数）。</p>' },
  { title: '两条自动满足的条件', cls: '',
    body: '<p>迹：$\\operatorname{tr}A=1+b+1=2+b=\\operatorname{tr}\\Lambda$，特征值之和已对上；$A$ 的第 1、3 行相同 $\\Rightarrow|A|=0$，$0$ 已是 $A$ 的特征值。</p>' },
  { title: '剩余条件：乘积要对上', cls: 'key',
    body: '<p>设另两个特征值为 $\\mu_1,\\mu_2$：和已对，须 $\\mu_1\\mu_2=2b$。特征多项式 $\\lambda$ 项系数 $=$ 二阶主子式之和，且常数项 $|A|=0$，故 $\\mu_1\\mu_2$ 等于它。</p>' },
  { title: '算二阶主子式之和', cls: 'key',
    body: '<p>$$\\begin{vmatrix}1&a\\\\a&b\\end{vmatrix}+\\begin{vmatrix}1&1\\\\1&1\\end{vmatrix}+\\begin{vmatrix}b&a\\\\a&1\\end{vmatrix}=(b-a^2)+0+(b-a^2)=2b-2a^2.$$</p>' },
  { title: '解出 a = 0（必要条件）', cls: 'key',
    body: '<p>$$2b-2a^2=2b\\;\\Rightarrow\\;a^2=0\\;\\Rightarrow\\;a=0.$$</p>' +
          '<p>与 $b$ 无关——必要条件只约束 $a$。</p>' },
  { title: '充分性：a=0 时特征值恰为 {2,b,0}', cls: 'good',
    body: '<p>$a=0$ 时 $A$ 按第 2 行、列分块：$\\begin{pmatrix}1&1\\\\1&1\\end{pmatrix}\\oplus(b)$，前者特征值 $\\{2,0\\}$，故 $A$ 的特征值恰为 $\\{2,b,0\\}$，对<b>任意</b> $b$ 都与 $\\Lambda$ 相似。</p>' },
  { title: '排除 A：b=2 是多余约束', cls: 'bad',
    body: '<p>$a=0$ 已充分，$b$ 取任何值都相似；把 $b$ 限死为 2 缩小了条件，不是充要。<b>排除 A</b>。</p>' },
  { title: '排除 C / D：a=2 不行', cls: 'bad',
    body: '<p>$a=2$ 时二阶主子式之和 $=2b-2a^2=2b-8\\ne2b$，两个非零特征值之积对不上 $2b$，特征值不再是 $\\{2,b,0\\}$。<b>排除 C、D</b>。</p>' },
  { title: '结论：a=0，b 任意 ✓', cls: 'good',
    body: '<p>充要条件是 $a=0$（$b$ 为任意常数），答案选 <b>B</b>。</p>' },
];

var RIBBONS = [null, null, null, null, null,
  null, {k:1, ok:false}, {k:3, ok:false}, {k:2, ok:true}];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step')),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    count: i + 1,
    ribbon: RIBBONS[i],
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$A\\sim\\mathrm{diag}(2,b,0)$ 的充要条件',
  subtitle: '考点：相似与对角化 · 方法：特征值对齐 + 二阶主子式之和',
  ribbonTitle: '选项判定（A=1 · B=2 · C=3 · D=4）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B（a=0，b 任意）',
    html: '记忆锚点：<b>实对称 + 特征值一致 ⇒ 相似</b>。迹与行列式只是必要条件，本题的"判别器"是二阶主子式之和 $2b-2a^2\\overset{!}{=}2b$，解出 $a=0$；$b$ 不受约束。排除 C/D：$a=2$ 时乘积差 $2a^2=8$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
