<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：全微分系数 + 链式法则求 g′(1)</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: "全微分 $df(0,0)=\\pi\\,dx+3\\,dy$，$g(x)=f(\\ln x,\\sin\\pi x)$，求 $g'(1)$",
  subtitle: '考点：全微分与偏导 · 多元复合函数链式法则',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示读偏导与链式求导。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>读偏导</b>：可微时 $df=f_x\\,dx+f_y\\,dy$，对照 $df(0,0)=\\pi\\,dx+3\\,dy$：$$f_x(0,0)=\\pi,\\qquad f_y(0,0)=3.$$',
      '<b>复合结构</b>：$g(x)=f(u,v)$，$u=\\ln x$、$v=\\sin\\pi x$。在 $x=1$ 处 $u=\\ln1=0$、$v=\\sin\\pi=0$——恰好落在已知偏导的 $(0,0)$。',
      '<b>链式法则</b>（两条支路都要乘）：$$g\'(x)=f_u\\cdot\\frac1x+f_v\\cdot\\pi\\cos\\pi x$$',
      '<b>代入 $x=1$</b>（$\\cos\\pi=-1$）：$$g\'(1)=\\pi\\cdot1+3\\cdot\\pi\\cdot(-1)=\\pi-3\\pi$$',
      '<b>结论</b>：$$g\'(1)=-2\\pi.$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'读偏导', log:'全微分的系数就是偏导：f_x(0,0)=π，f_y(0,0)=3', count:0 },
    { cls:'step',  tag:'定位',   log:'x=1 时 ln1=0、sinπ=0，复合点正好是 (0,0)', count:1 },
    { cls:'shift', tag:'链式',   log:'两条支路：1/x 和 π·cos πx，一条都不能丢', count:2 },
    { cls:'ok',    tag:'代入',   log:'cos π = −1：π·1 + 3·π·(−1) = π − 3π', count:3 },
    { cls:'done',  tag:'完成',   log:'结论：g′(1) = −2π', count:4, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: "$g'(1)=-2\\pi$",
    html: '记忆锚点：<b>$df$ 的系数 = 该点偏导；链式两条支路各乘各的导数</b>。易错：弧度制 $\\cos\\pi=-1$；漏掉 $\\sin\\pi x$ 那条支路只得 $\\pi$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
