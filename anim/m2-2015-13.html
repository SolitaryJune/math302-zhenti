<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2015·13 隐函数的全微分</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 推导板各行：与 snaps 一一对应（build 建立、render 按 i 点亮）
var ROWS = [
  { label: '第 0 步 · 审题与路线',
    h: '<p>$\\mathrm{e}^{x+2y+3z}+xyz=1$ 确定 $z=z(x,y)$，求 $\\left.\\mathrm{d}z\\right|_{(0,0)}$。路线：<b>先定点</b> → 两边取全微分 → 代点解出 $\\mathrm{d}z$。</p>' },
  { label: '第 1 步 · 定工作点：z(0,0)=0',
    h: '<p>代 $x=y=0$：$\\mathrm{e}^{3z}+0=1\\Rightarrow 3z=0\\Rightarrow z=0$，工作点是 $(0,0,0)$。</p>' },
  { label: '第 2 步 · 两边取全微分',
    h: '<p>$$\\mathrm{e}^{x+2y+3z}\\,(\\mathrm{d}x+2\\,\\mathrm{d}y+3\\,\\mathrm{d}z)+yz\\,\\mathrm{d}x+xz\\,\\mathrm{d}y+xy\\,\\mathrm{d}z=0.$$（指数链式三项齐全，$xyz$ 按乘积微分）</p>' },
  { label: '第 3 步 · 代点 (0,0,0)',
    h: '<p>$\\mathrm{e}^{0}=1$，$yz=xz=xy=0$（三项乘积微分全消失），只剩 $$\\mathrm{d}x+2\\,\\mathrm{d}y+3\\,\\mathrm{d}z=0.$$</p>' },
  { label: '第 4 步 · 解出 dz',
    h: '<p>$3\\,\\mathrm{d}z=-\\mathrm{d}x-2\\,\\mathrm{d}y\\ \\Longrightarrow\\ \\mathrm{d}z=-\\dfrac13\\,\\mathrm{d}x-\\dfrac23\\,\\mathrm{d}y.$</p>' },
  { label: '第 5 步 · 公式法核对',
    h: '<p>$\\dfrac{\\partial z}{\\partial x}=-\\dfrac{F_x}{F_z}=-\\dfrac{\\mathrm{e}^{x+2y+3z}+yz}{3\\mathrm{e}^{x+2y+3z}+xy}\\Big|_{(0,0,0)}=-\\dfrac13$，同理 $\\dfrac{\\partial z}{\\partial y}=-\\dfrac23$，与全微分法一致 ✓。</p>' },
];

var rowEls = [];

AW.init({
  title: '$\\mathrm{e}^{x+2y+3z}+xyz=1$ 确定的隐函数在 $(0,0)$ 处的全微分',
  subtitle: '考点：隐函数求微分 · 方法：定点 → 两边取全微分 → 代点解出 dz',
  counterLabel: '步骤',
  intro: '点击「▶ 播放」逐步演示推导板上的六步计算。',

  build: function(stage){
    stage.innerHTML = '';
    rowEls = [];
    var wrap = AW.el('div', 'aw-scroll');
    ROWS.forEach(function(r){
      var d = AW.el('div', '');
      d.style.cssText = 'padding:9px 14px;margin:8px 0;border-left:4px solid transparent;border-radius:10px;opacity:.15;transition:opacity .35s,background .35s,border-color .35s;';
      d.innerHTML = '<div style="font-size:12.5px;color:#64748b;font-weight:700;margin-bottom:2px">' + r.label + '</div>' + r.h;
      wrap.appendChild(d);
      rowEls.push(d);
    });
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'路线：定点 → 全微分 → 代点解 dz', count:0 },
    { cls:'ok',    tag:'定点',   log:'x=y=0 时 e^(3z)=1，得 z=0，工作点 (0,0,0)', count:1 },
    { cls:'shift', tag:'全微分', log:'指数项链式微分三项齐全，xyz 乘积微分', count:2 },
    { cls:'ok',    tag:'代点',   log:'e⁰=1，yz=xz=xy=0，只剩 dx+2dy+3dz=0', count:3 },
    { cls:'ok',    tag:'解出',   log:'dz = −(1/3)dx − (2/3)dy', count:4 },
    { cls:'done',  tag:'完成',   log:'偏导公式法核对一致，结果成立', count:5, done:true },
  ],

  render: function(stage, sn, i){
    rowEls.forEach(function(d, j){
      d.style.opacity = j <= i ? '1' : '.15';
      d.style.borderLeftColor = j < i ? '#16a34a' : (j === i ? '#d97706' : 'transparent');
      d.style.background = j === i ? '#fffbeb' : (j < i ? '#f6fef9' : 'transparent');
    });
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\mathrm{d}z=-\\tfrac13\\,\\mathrm{d}x-\\tfrac23\\,\\mathrm{d}y$',
    html: '记忆锚点：<b>隐函数求全微分三步走——定点、微分、代点</b>。$z(0,0)=0$ 与 $\\mathrm{e}^0=1$ 让方程瞬间干净；指数 $x+2y+3z$ 的微分三项一个都不能少。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
