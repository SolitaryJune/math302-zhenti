<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：隐函数定点二阶导数</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$x^2+xy+y^3=3$ 确定 $y(x)$：求 $y\'\'(1)$',
  subtitle: '考点：隐函数求导 · 方法：定点代值 → 逐阶求导 → 数值代入',
  counterLabel: '求导步',
  intro: '点击「▶ 播放」逐步演示隐函数二阶求导流程。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>定点</b>：$x=1$ 代入方程 $x^2+xy+y^3=3$：$$y^3+y-2=0\\Longrightarrow(y-1)(y^2+y+2)=0,$$ 二次因式判别式 $<0$ 无实根，故 $y(1)=1$',
      '<b>一阶求导</b>（$y=y(x)$，含 $y$ 项按复合处理）：$$2x+y+xy\'+3y^2y\'=0$$',
      '<b>代点求 $y\'$</b>：代入 $(1,1)$：$2+1+y\'+3y\'=0\\Longrightarrow3+4y\'=0$，得 $y\'(1)=-\\dfrac34$',
      '<b>二阶求导</b>（$xy\'$ 与 $3y^2y\'$ 都用乘积法则）：$$2+2y\'+xy\'\'+6y(y\')^2+3y^2y\'\'=0$$',
      '<b>数值代入</b>：$x=1,\\ y=1,\\ y\'=-\\dfrac34$：$$2-\\frac32+y\'\'+\\frac{27}{8}+3y\'\'=0$$',
      '<b>解出</b>：$\\dfrac{31}{8}+4y\'\'=0\\Longrightarrow y\'\'(1)=-\\dfrac{31}{32}$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'定点',     log:'x=1 代入三次方程，因式分解定出 y(1)=1', count:0 },
    { cls:'shift', tag:'一阶求导', log:'两边对 x 求导，y 的项都带因子 y′', count:1 },
    { cls:'ok',    tag:'求y′',     log:'代 (1,1) 得 3+4y′=0，y′(1)=−3/4', count:2 },
    { cls:'shift', tag:'二阶求导', log:'xy′ 和 3y²y′ 按乘积法则再导，出现 (y′)² 项', count:3 },
    { cls:'step',  tag:'代数值',   log:'把 x=1、y=1、y′=−3/4 全部代入', count:4 },
    { cls:'done',  tag:'完成',     log:'31/8 + 4y″ = 0，解得 y″(1) = −31/32', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$y\'\'(1)=-\\dfrac{31}{32}$',
    html: '记忆锚点：<b>隐函数高阶导在定点求值，不必解出 $y$，每求导一次就把已知数值代进去</b>。易错：$xy\'\\to y\'+xy\'\'$ 漏项；$3y^2y\'\\to6y(y\')^2+3y^2y\'\'$ 丢掉链式因子 $y\'$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
