<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016 数二第 21 题 · 平均值与唯一零点推理链（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：把「原函数」翻译成导数条件',
    cls: 'key',
    body: '<p>「$f$ 是 $\\frac{\\cos x}{2x-3\\pi}$ 的原函数」即 $f^{\\prime}(x)=\\frac{\\cos x}{2x-3\\pi}$，且 $f(0)=0$。平均值即 $\\bar f=\\frac{2}{3\\pi}\\int_{0}^{3\\pi/2}f(x)\\,\\mathrm{d}x$。</p>' },
  { title: '(I) 分部积分：把未知函数的积分甩到导数上',
    cls: '',
    body: '<p>$f$ 没有初等表达式，只能分部积分：</p><p>$$\\int_{0}^{3\\pi/2}f\\,\\mathrm{d}x=\\Bigl[xf(x)\\Bigr]_{0}^{3\\pi/2}-\\int_{0}^{3\\pi/2}x\\,f^{\\prime}(x)\\,\\mathrm{d}x.$$</p>' },
  { title: '(I) 关键拆项：未知端点值恰好相消',
    cls: 'good',
    body: '<p>由 $\\frac{x}{2x-3\\pi}=\\frac{1}{2}+\\frac{3\\pi/2}{2x-3\\pi}$：</p><p>$$\\int_{0}^{3\\pi/2}\\frac{x\\cos x}{2x-3\\pi}\\,\\mathrm{d}x=-\\frac{1}{2}+\\frac{3\\pi}{2}f\\Bigl(\\frac{3\\pi}{2}\\Bigr),$$</p><p>代回后含 $f\\bigl(\\frac{3\\pi}{2}\\bigr)$ 的项相消，$\\int_{0}^{3\\pi/2}f\\,\\mathrm{d}x=\\frac{1}{2}$。</p>' },
  { title: '(I) 平均值',
    cls: 'good',
    body: '<p>$\\bar f=\\frac{2}{3\\pi}\\cdot\\frac{1}{2}=\\frac{1}{3\\pi}$。</p>' },
  { title: '(II) 用导数的符号划分单调区间',
    cls: 'key',
    body: '<p>区间内分母 $2x-3\\pi<0$，符号看分子 $\\cos x$：$(0,\\frac{\\pi}{2})$ 上 $f^{\\prime}<0$，严格减；$(\\frac{\\pi}{2},\\frac{3\\pi}{2})$ 上 $f^{\\prime}>0$，严格增；$x=\\frac{\\pi}{2}$ 是最小值点。</p>' },
  { title: '(II) 两端符号锁死零点',
    cls: '',
    body: '<p>$(0,\\frac{\\pi}{2}]$ 上 $f<f(0)=0$，无零点；另一端代换 $w=3\\pi-2x$ 得</p><p>$$f\\Bigl(\\frac{3\\pi}{2}\\Bigr)=\\frac{1}{2}\\int_{0}^{3\\pi/2}\\frac{\\sin w}{w}\\,\\mathrm{d}w>0$$</p><p>（正贡献 $>\\frac{2}{\\pi}>\\frac{1}{2}$，负贡献 $\\le\\frac{1}{2}$）。</p>' },
  { title: '结论：存在且唯一',
    cls: 'good',
    body: '<p>$f$ 在 $[\\frac{\\pi}{2},\\frac{3\\pi}{2}]$ 上从 $f\\bigl(\\frac{\\pi}{2}\\bigr)<0$ 连续变到 $f\\bigl(\\frac{3\\pi}{2}\\bigr)>0$：零点定理给<b>存在性</b>，严格单调给<b>唯一性</b>。故 $(0,\\frac{3\\pi}{2})$ 内有唯一零点。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2016·21　平均值 $\\dfrac{1}{3\\pi}$ 与 $(0,\\frac{3\\pi}{2})$ 内唯一零点',
  subtitle: '考点：原函数条件 · 分部积分 · <b>单调性 + 零点定理</b>',
  intro: '点击「▶ 播放」逐步展开推理链：先算平均值，再锁死唯一零点。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '平均值 $\\dfrac{1}{3\\pi}$；(II) 唯一零点成立',
    html: '记忆锚点：<b>没有表达式的 $f$ → 分部积分甩到 $f^{\\prime}$ 上，再拆 $\\frac{x}{2x-3\\pi}$ 让 $f\\bigl(\\frac{3\\pi}{2}\\bigr)$ 相消</b>。零点存在靠端点异号 + 零点定理，唯一靠严格单调 + 左段无零点。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
