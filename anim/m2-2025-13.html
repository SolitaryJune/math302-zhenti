<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：和式极限化定积分 ∫₀¹ x ln x dx</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$\\lim\\limits_{n\\to\\infty}\\dfrac{1}{n^2}\\Bigl[\\ln\\tfrac1n+2\\ln\\tfrac2n+\\cdots+(n-1)\\ln\\tfrac{n-1}{n}\\Bigr]$',
  subtitle: '考点：和式极限化定积分（黎曼和） · 方法：拆 $\\tfrac{1}{n^2}$ 凑 $\\tfrac in$，再分部积分',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示黎曼和的识别与积分。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：通项是 $i\\ln\\dfrac in$，系数 $\\dfrac{1}{n^2}$——拆成 $\\dfrac1n\\cdot\\dfrac1n$，一个 $\\dfrac1n$ 与 $i$ 凑成 $\\dfrac in$ $$\\frac{1}{n^2}\\sum_{i=1}^{n-1}i\\ln\\frac in=\\frac1n\\sum_{i=1}^{n-1}\\underbrace{\\frac in\\ln\\frac in}_{g\\left(\\frac in\\right)}$$',
      '<b>认出 $g$</b>：$g(x)=x\\ln x$，节点 $\\dfrac in\\in(0,1)$，这是 $g$ 在 $[0,1]$ 上的黎曼和 $$\\lim_{n\\to\\infty}\\frac1n\\sum_{i=1}^{n-1}g\\Bigl(\\frac in\\Bigr)=\\int_0^1x\\ln x\\,\\mathrm dx$$ 缺第 $0$、$n$ 两项不影响极限。',
      '<b>分部积分</b>：取 $u=\\ln x$，$\\mathrm dv=x\\,\\mathrm dx$，则 $\\mathrm du=\\dfrac{\\mathrm dx}{x}$，$v=\\dfrac{x^2}{2}$ $$\\int_0^1x\\ln x\\,\\mathrm dx=\\Bigl[\\frac{x^2}{2}\\ln x\\Bigr]_0^1-\\int_0^1\\frac x2\\,\\mathrm dx$$',
      '<b>处理端点</b>：$x=1$ 处 $\\dfrac12\\ln1=0$；$x\\to0^+$ 处幂压对数 $x^2\\ln x\\to0$（可去反常点），首项为 $0$。',
      '<b>收尾</b>：$$\\int_0^1x\\ln x\\,\\mathrm dx=0-\\Bigl[\\frac{x^2}{4}\\Bigr]_0^1=-\\frac14$$ 负号合理：$\\ln\\frac in<0$ 对 $i<n$ 全部成立。',
      '<b>结论</b>：原极限 $=-\\dfrac14$。',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'拆系数', log:'1/n² 拆成 1/n × 1/n，一个 1/n 与 i 凑成 i/n', count:0 },
    { cls:'ok',    tag:'认黎曼和', log:'通项变成 g(i/n)·(1/n)，g(x)=x ln x，区间 [0,1]', count:1 },
    { cls:'shift', tag:'分部积分', log:'u = ln x，dv = x dx，积出 x²/2·ln x 减 ∫x/2 dx', count:2 },
    { cls:'step',  tag:'端点归零', log:'x=1 处 ln1=0；x→0⁺ 处 x² ln x → 0，首项消失', count:3 },
    { cls:'step',  tag:'算结果', log:'剩下 −∫x/2 dx = −1/4，负号与各项对数为负相符', count:4 },
    { cls:'done',  tag:'完成', log:'结论：原极限 = −1/4', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$-\\dfrac14$',
    html: '记忆锚点：<b>和式极限三步：拆系数凑 $\\dfrac in$、认出 $g(x)$ 化成 $\\displaystyle\\int_0^1g\\,\\mathrm dx$、分部积分收尾</b>；$x\\to0^+$ 处 $x^2\\ln x\\to0$（幂压对数）让端点项消失。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
