<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019·23 相似矩阵定参数与求 P</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [
  "$$A=\\begin{pmatrix}-2&-2&1\\\\2&x&-2\\\\0&0&-2\\end{pmatrix}\\sim B=\\begin{pmatrix}2&1&0\\\\0&-1&0\\\\0&0&y\\end{pmatrix}\\qquad\\text{相似不变量：迹、行列式}$$",
  "<b>① 迹相等：</b>$\\operatorname{tr}A=x-4$，$\\operatorname{tr}B=1+y$ → $x-4=1+y$",
  "<b>② 行列式相等：</b>$\\det A=(-2)\\begin{vmatrix}-2&-2\\\\2&x\\end{vmatrix}=4x-8$（按第三行展开），$\\det B=-2y$（上三角读对角元）→ $4x-8=-2y$",
  "<b>③ 联立求解：</b>代入 $y=x-5$：$4x-8=-2x+10\\Rightarrow 6x=18$，得 $x=3,\\ y=-2$",
  "<b>④ $A$ 的特征值：</b>$\\lvert\\lambda E-A\\rvert=(\\lambda+2)\\left[(\\lambda+2)(\\lambda-3)+4\\right]=(\\lambda+2)(\\lambda-2)(\\lambda+1)$ → $\\lambda=2,\\,-1,\\,-2$（恰为 $B$ 的对角元 ✓）",
  "<b>⑤ $A$ 的特征向量：</b>$\\lambda=2:\\ \\xi_1=(-1,2,0)^{\\mathsf T}$；$\\lambda=-1:\\ \\xi_2=(-2,1,0)^{\\mathsf T}$；$\\lambda=-2:\\ \\xi_3=(-1,2,4)^{\\mathsf T}$ → $P_1=(\\xi_1,\\xi_2,\\xi_3)$",
  "<b>⑥ $B$ 的特征向量：</b>上三角直接解：$\\lambda=2:\\ (1,0,0)^{\\mathsf T}$；$\\lambda=-1:\\ (-1,3,0)^{\\mathsf T}$；$\\lambda=-2:\\ (0,0,1)^{\\mathsf T}$ → $P_2$，且 $P_2^{-1}BP_2=\\Lambda$",
  "<b>⑦ 借道对角化：</b>$P_1^{-1}AP_1=P_2^{-1}BP_2=\\Lambda=\\operatorname{diag}(2,-1,-2)$ → 变形得 $P^{-1}AP=B$ 于 $P=P_1P_2^{-1}$",
  "<b>⑧ 求 $P$：</b>$P_2^{-1}=\\begin{pmatrix}1&\\tfrac13&0\\\\0&\\tfrac13&0\\\\0&0&1\\end{pmatrix}$，$$P=P_1P_2^{-1}=\\begin{pmatrix}-1&-2&-1\\\\2&1&2\\\\0&0&4\\end{pmatrix}\\begin{pmatrix}1&\\tfrac13&0\\\\0&\\tfrac13&0\\\\0&0&1\\end{pmatrix}=\\begin{pmatrix}-1&-1&-1\\\\2&1&2\\\\0&0&4\\end{pmatrix}$$",
  "<b>⑨ 验证：</b>$\\det P=4\\begin{vmatrix}-1&-1\\\\2&1\\end{vmatrix}=4\\ne0$，且 $AP=PB=\\begin{pmatrix}-2&0&2\\\\4&1&-4\\\\0&0&-8\\end{pmatrix}$ ✓（特征向量取倍数不同，$P$ 不唯一）"
];

AW.init({
  title: '2019·23　由 $A\\sim B$ 求 $x,y$ 与可逆矩阵 $P$',
  subtitle: '考点：相似不变量（迹、行列式）· 特征向量 · 借道对角化 $P=P_1P_2^{-1}$',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，先定参数，再借对角阵搭桥求过渡矩阵。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    this._rows = [];
    for (var i = 0; i < ROWS.length; i++){
      var r = AW.el('div', 'aw-stepcard', ROWS[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'相似矩阵共享不变量，先用迹和行列式解出两个参数', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'迹',     log:'迹相等给出第一个方程：x 减 4 等于 1 加 y', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'行列式', log:'行列式相等给出第二个方程：4 x 减 8 等于负 2 y', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'解参数', log:'联立解得 x 等于三，y 等于负二', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'特征值', log:'A 的特征多项式沿零行展开，三个特征值与 B 的对角元一致', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'P1',     log:'解三个齐次方程组，得 A 的三个特征向量拼成 P1', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'P2',     log:'B 是上三角阵，特征向量一眼看出，拼成 P2', count:6, ribbon:{k:7, ok:true} },
    { cls:'shift', tag:'搭桥',   log:'两边同时对角化到同一个 L，取 P 等于 P1 乘 P2 逆', count:7, ribbon:{k:8, ok:true} },
    { cls:'ok',    tag:'求 P',   log:'算出 P2 的逆并相乘，得到整数元素的过渡矩阵', count:8, ribbon:{k:9, ok:true} },
    { cls:'done',  tag:'完成',   log:'结论：行列式非零且 A P 等于 P B，验证通过', count:9, ribbon:{k:10, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: "(1) $x=3,\\ y=-2$；　(2) $P=\\begin{pmatrix}-1&-1&-1\\\\2&1&2\\\\0&0&4\\end{pmatrix}$",
    html: "记忆锚点：<b>相似 = 迹相等 + 行列式相等（二阶时够用）；$P=P_1P_2^{-1}$，两边特征向量按同一特征值顺序逐列对齐</b>。易错：只列迹一个方程；$P_1$、$P_2$ 顺序错位；交卷前不验 $AP=PB$。",
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
