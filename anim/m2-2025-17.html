<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>m2-2025-17 · 部分分式分解求定积分</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$\\int_0^1\\dfrac{\\mathrm{d}x}{(x+1)(x^2-2x+2)}$ · 部分分式分解逐步演示',
  subtitle: '考点：有理函数定积分 · 方法：部分分式 + 凑分母导数 + 配方 arctan',
  counterLabel: '已完成',
  intro: '点击「▶ 播放」逐步演示部分分式分解与积分全程。',

  /* 持久 DOM：顶部固定题目，下方推导板每步更新 */
  build: function(stage){
    stage.innerHTML = '';
    var head = AW.el('div', '',
      '<p>$$\\int_0^1\\frac{\\mathrm{d}x}{(x+1)(x^2-2x+2)}$$</p>');
    stage.appendChild(head);
    this._board = AW.el('div', '');
    stage.appendChild(this._board);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'二次因式判别式小于零，不可再分：分子要设一次式', count:1,
      board: '<div class="aw-row-label"><b>第 1 步 · 判型与设分解</b></div>'
        + '<p>$x^2-2x+2=(x-1)^2+1$，$\\Delta<0$ 在实数域不可约；一次因式 $x+1$ 配常数，二次因式配一次分子：</p>'
        + '<p>$$\\frac{1}{(x+1)(x^2-2x+2)}=\\frac{A}{x+1}+\\frac{Bx+C}{x^2-2x+2}$$</p>' },
    { cls:'step', tag:'定 A', log:'两边乘分母，再令 x 等于负 1，把一次因式那块掐成零', count:2,
      ribbon:{k:1, ok:true},
      board: '<div class="aw-row-label"><b>第 2 步 · 通分乘开，令 x=-1</b></div>'
        + '<p>$$1=A(x^2-2x+2)+(Bx+C)(x+1)$$</p>'
        + '<p>令 $x=-1$：$1=A\\big(1+2+2\\big)=5A$，故 $A=\\dfrac15$。</p>' },
    { cls:'step', tag:'定 B、C', log:'再代 x 等于 0 定 C，比较平方项系数定 B', count:3,
      ribbon:{k:2, ok:true},
      board: '<div class="aw-row-label"><b>第 3 步 · 剩余系数</b></div>'
        + '<p>令 $x=0$：$1=2A+C\\;\\Rightarrow\\;C=\\dfrac35$；比较 $x^2$ 系数：$0=A+B\\;\\Rightarrow\\;B=-\\dfrac15$。</p>'
        + '<div class="aw-cells" style="margin-top:8px">'
        + '<div class="aw-col"><div class="aw-ptr">=1/5</div><div class="aw-box ok">A</div></div>'
        + '<div class="aw-col"><div class="aw-ptr">=-1/5</div><div class="aw-box ok">B</div></div>'
        + '<div class="aw-col"><div class="aw-ptr">=3/5</div><div class="aw-box ok">C</div></div>'
        + '</div>'
        + '<p style="margin-top:8px">$$\\frac{1}{(x+1)(x^2-2x+2)}=\\frac{1/5}{x+1}+\\frac{-x/5+3/5}{x^2-2x+2}$$</p>' },
    { cls:'ok', tag:'对数块', log:'一次因式那块直接积出对数，代限得五分之一 ln2', count:4,
      ribbon:{k:3, ok:true},
      board: '<div class="aw-row-label"><b>第 4 步 · 第一块：纯对数</b></div>'
        + '<p>$$\\frac15\\int_0^1\\frac{\\mathrm{d}x}{x+1}=\\frac15\\Big[\\ln(x+1)\\Big]_0^1=\\frac15\\ln 2$$</p>' },
    { cls:'shift', tag:'凑导数', log:'二次因式那块：把分子拆成「分母导数的倍数 + 余下的常数」', count:5,
      board: '<div class="aw-row-label"><b>第 5 步 · 第二块：拆分子</b></div>'
        + '<p>分母的导数 $(x^2-2x+2)\'=2x-2$，把分子 $-x+3$ 凑成</p>'
        + '<p>$$-x+3=-\\frac12(2x-2)+2$$</p>'
        + '<p>前半积出 $\\ln$，后半配方便出 $\\arctan$。</p>' },
    { cls:'step', tag:'两小项', log:'对数项代限得二分之一 ln2；反正切项代限得二分之 π', count:6,
      ribbon:{k:4, ok:true},
      board: '<div class="aw-row-label"><b>第 6 步 · 第二块分别代限</b></div>'
        + '<p>$$-\\frac12\\Big[\\ln(x^2-2x+2)\\Big]_0^1=-\\frac12\\big(\\ln 1-\\ln 2\\big)=\\frac12\\ln 2$$</p>'
        + '<p>$$2\\Big[\\arctan(x-1)\\Big]_0^1=2\\Big(0-(-\\tfrac\\pi4)\\Big)=\\frac{\\pi}{2}$$</p>' },
    { cls:'step', tag:'并第二块', log:'两小项除以系数五分之一，得十分之一 ln2 加十分之 π', count:7,
      board: '<div class="aw-row-label"><b>第 7 步 · 第二块合计</b></div>'
        + '<p>$$\\frac15\\Big(\\frac12\\ln 2+\\frac\\pi2\\Big)=\\frac1{10}\\ln 2+\\frac{\\pi}{10}$$</p>' },
    { cls:'done', tag:'完成', log:'两块合并：五分之一加十分之一等于十分之三', count:8, done:true,
      ribbon:{k:5, ok:true},
      board: '<div class="aw-row-label"><b>第 8 步 · 合并结论</b></div>'
        + '<p>$$\\int_0^1\\frac{\\mathrm{d}x}{(x+1)(x^2-2x+2)}=\\frac15\\ln 2+\\frac1{10}\\ln 2+\\frac{\\pi}{10}=\\frac3{10}\\ln 2+\\frac{\\pi}{10}$$</p>'
        + '<p>数值约 $0.5221$，与被积函数在 $[0,1]$ 上约 $0.5$ 出头的取值一致。</p>' },
  ],

  render: function(stage, sn, i){
    this._board.innerHTML = sn.board || '';
    renderMathAfterSnap(stage);
  },

  result: {
    big: '3/10 · ln 2 + π/10 ≈ 0.522',
    html: '结论：$$\\int_0^1\\frac{\\mathrm{d}x}{(x+1)(x^2-2x+2)}=\\frac{3}{10}\\ln 2+\\frac{\\pi}{10}$$'
      + '记忆点：<b>不可约二次因式 $\\Rightarrow$ 分子设一次式 $Bx+C$</b>；'
      + '系数用「代特殊值（掐死一次因式）+ 比较高次系数」最快；'
      + '二次因式积分一律拆成「凑导数出 $\\ln$ + 配方出 $\\arctan$」两块。易错：$\\arctan(x-1)$ 在 $x=0$ 处取负值 $-\\dfrac\\pi4$，上减下得正。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
