<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画：特征值确定的充要条件</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：三根互异 ⟹ 可对角化为 Λ',
    cls: 'key',
    log: '特征值 1,−1,0 互异 ⟹ A 必相似于 Λ=diag(1,−1,0)',
    body: '<p>$\\Lambda=\\operatorname{diag}(1,-1,0)$，特征值恰为 $1,-1,0$。三个特征值<b>互异</b>，故「$A$ 的特征值为 $1,-1,0$」等价于「$A$ 可对角化且对角化为 $\\Lambda$」。逐项检验四种矩阵关系。</p>' },
  { title: 'A 项：等价 A=PΛQ —— 只保秩',
    cls: 'bad',
    log: 'A：等价只保持秩 2，反例 diag(2,3,0)，只必要不充分',
    ribbon: {k:1, ok:false},
    body: '<p>等价不变量只有秩（$r(\\Lambda)=2$）。反例 $\\operatorname{diag}(2,3,0)$：与 $\\Lambda$ 等价，但特征值是 $2,3,0$。<b>只必要不充分</b>。</p>' },
  { title: 'B 项：相似 A=PΛP⁻¹ —— 充要',
    cls: 'good',
    log: 'B：相似保特征多项式；三根互异 ⟸ 反向也对角化为 Λ，充要',
    ribbon: {k:2, ok:true},
    body: '<p><b>充分</b>：$A=P\\Lambda P^{-1}$ 则 $A\\sim\\Lambda$，特征多项式相同，特征值同为 $1,-1,0$。<b>必要</b>：三根互异 $\\Rightarrow$ $A$ 可对角化且结果唯一为 $\\Lambda$，即存在可逆 $P$ 使 $A=P\\Lambda P^{-1}$。<b>充要 ✓</b>。</p>' },
  { title: 'C 项：正交相似 A=QΛQ⁻¹ —— 强制对称',
    cls: 'bad',
    log: 'C：QΛQᵀ 必对称，条件过强，只充分不必要',
    ribbon: {k:3, ok:false},
    body: '<p>$Q$ 正交时 $Q^{-1}=Q^{\\mathrm T}$，$A=Q\\Lambda Q^{\\mathrm T}$ 必<b>对称</b>。但特征值为 $1,-1,0$ 的矩阵未必对称，如上三角 $\\begin{pmatrix}1&1&0\\\\0&-1&0\\\\0&0&0\\end{pmatrix}$。<b>只充分不必要</b>。</p>' },
  { title: 'D 项：合同 A=PΛPᵀ —— 只保惯性指数',
    cls: 'bad',
    log: 'D：合同保正负惯性指数不保特征值，反例 diag(4,−1,0)',
    ribbon: {k:4, ok:false},
    body: '<p>取 $P=\\operatorname{diag}(2,1,1)$，得 $A=\\operatorname{diag}(4,-1,0)$：与 $\\Lambda$ 合同（惯性指数不变），但特征值为 $4,-1,0$。<b>既不充分也不必要</b>。</p>' },
  { title: '结论：选 B',
    cls: 'good',
    log: '等价保秩、合同保惯性、正交相似强加对称，唯有相似保特征值',
    body: '<p>答案 <b>B</b>：「$A$ 的特征值为 $1,-1,0$」$\\iff$ $A$ 与 $\\operatorname{diag}(1,-1,0)$ <b>相似</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$A$ 的特征值为 $1,-1,0$ 的充要条件：四种矩阵关系辨析',
  subtitle: '考点：相似 / 等价 / 合同 / 正交相似 · 方法：看各关系保持什么不变量',
  counterLabel: '判定步',
  ribbonTitle: '选项判定（✓ 充要 / ✗ 不充要）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B（相似 $A=P\\Lambda P^{-1}$）',
    html: '记忆锚点：<b>等价保秩、合同保惯性指数、正交相似额外强制对称，只有相似保持特征值</b>。三根互异 ⟹ 可对角化且对角阵唯一，所以「特征值确定」恰是「与 $\\operatorname{diag}(1,-1,0)$ 相似」。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
