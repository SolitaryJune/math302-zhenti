<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2017·08 特征值相同是否相似（秩判对角化）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>第一步：读特征值</b>。$A$、$B$ 是上三角阵，$C$ 是对角阵，主对角线就是特征值：三者都是 $1,2,2$。$C=\\mathrm{diag}(1,2,2)$ 本身已对角化，于是 $$A\\sim C\\iff A\\text{ 可对角化},\\qquad B\\sim C\\iff B\\text{ 可对角化}.$$</p>",
  "<p><b>第二步：定判据</b>。特征值相同只是相似的<b>必要</b>条件；$\\lambda=2$ 是二重根，可对角化要求它有 $3-2=2$ 个线性无关特征向量，即 $$r(2E-M)=3-2=1.$$ 分别对 $A$、$B$ 算这个秩。</p>",
  "<p><b>判 $A$</b>：$$2E-A=\\begin{pmatrix}0&0&0\\\\0&0&-1\\\\0&0&1\\end{pmatrix}$$ 只有第 3 列非零（第 3 行是第 2 行的反号），$r(2E-A)=1$。$\\lambda=2$ 有 $3-1=2$ 个无关特征向量 = 代数重数 ⟹ <b>$A$ 可对角化</b>，$A\\sim C$ ✓</p>",
  "<p><b>判 $B$</b>：$$2E-B=\\begin{pmatrix}0&-1&0\\\\0&0&0\\\\0&0&1\\end{pmatrix}$$ 第 2 列（$-1$）与第 3 列（$1$）都非零且线性无关，$r(2E-B)=2$。$\\lambda=2$ 只有 $3-2=1$ 个特征向量 &lt; 代数重数 $2$ ⟹ <b>$B$ 不可对角化</b>，$B\\not\\sim C$ ✗</p>",
  "<p><b>第三步：汇总</b>。$A$ 与 $C$ 相似、$B$ 与 $C$ 不相似，对应选项 <b>B</b>。</p>",
  "<p><b>排错</b>：只看\"特征值相同\"就认定都相似会误选 A；把 $r(2E-B)$ 算成 $1$（漏了第 2 列的 $-1$）也会误选 A；把两个结论看反会选 C。</p>"
];

AW.init({
  title: '$A=\\begin{pmatrix}2&0&0\\\\0&2&1\\\\0&0&1\\end{pmatrix}$，$B=\\begin{pmatrix}2&1&0\\\\0&2&0\\\\0&0&1\\end{pmatrix}$ 与 $C=\\mathrm{diag}(1,2,2)$ 是否相似',
  subtitle: '考点：相似判定 + 可对角化 · 方法：二重根 λ=2 的几何重数，r(2E−M) 是否为 1',
  counterLabel: '已执行',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'特征值', log:'三个矩阵都是三角/对角形，特征值同为 1,2,2；C 已对角化', show:1, count:0 },
    { cls:'step',  tag:'判据',   log:'特征值相同不够，还要看 λ=2 有没有 2 个无关特征向量：r(2E−M)=1？', show:2, count:1 },
    { cls:'ok',    tag:'判 A',   log:'2E−A 只有第 3 列非零，秩为 1 → 可对角化，A∼C ✓', show:3, count:2 },
    { cls:'miss',  tag:'判 B',   log:'2E−B 第 2、3 列都非零，秩为 2 → 只 1 个特征向量，不可对角化，B≁C ✗', show:4, count:3 },
    { cls:'done',  tag:'完成',   log:'A 与 C 相似、B 与 C 不相似，选 B', show:5, count:4, done:true },
    { cls:'step',  tag:'排错',   log:'只看特征值会误选 A；r(2E−B)=2 别算成 1', show:6, count:5, done:true },
  ],

  result: {
    big: '答案 B：$A\\sim C$ 相似，$B\\not\\sim C$ 不相似',
    html: '记忆锚点：<b>上三角阵特征值 = 对角线</b>；特征值相同 ≠ 相似，还要看<b>二重根的几何重数</b>：$r(2E-A)=1$ 过关、$r(2E-B)=2$ 卡住。判据一句话：$r(2E-M)=n-\\text{重数}$ 才可对角化。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
