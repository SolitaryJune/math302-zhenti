<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：中值点 ξ²/x² 的极限（2014 年第 5 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '认出拉格朗日中值',
    body: '<p>$f(x)=xf\'(\\xi)$ 即 $f(x)-f(0)=f\'(\\xi)(x-0)$，$\\xi$ 介于 $0$ 与 $x$ 之间，随 $x\\to0$。目标：把 $\\xi^{2}$ 用 $x$ 表示。</p>' },
  { cls: '', title: '反解 $\\xi^{2}$',
    body: '<p>$f\'(x)=\\dfrac{1}{1+x^{2}}$，条件即</p>' +
          '<p>$$\\arctan x=\\frac{x}{1+\\xi^{2}}\\ \\Longrightarrow\\ \\xi^{2}=\\frac{x}{\\arctan x}-1=\\frac{x-\\arctan x}{\\arctan x}.$$</p>' },
  { cls: '', title: '泰勒展开 $\\arctan x$',
    body: '<p>$$\\arctan x=x-\\frac{x^{3}}{3}+o(x^{3})\\ \\Longrightarrow\\ x-\\arctan x=\\frac{x^{3}}{3}+o(x^{3}).$$</p>' +
          '<p>关键：分子是<b>三阶</b>无穷小。</p>' },
  { cls: 'shift', title: '分母用等价替换',
    body: '<p>$\\arctan x\\sim x$（一阶），只需一阶精度。</p>' },
  { cls: 'ok', title: '约分定阶',
    body: '<p>$$\\xi^{2}\\sim\\frac{x^{3}/3}{x}=\\frac{x^{2}}{3}.$$</p>' },
  { cls: 'good', title: '求极限',
    body: '<p>$$\\lim_{x\\to0}\\frac{\\xi^{2}}{x^{2}}=\\frac{1}{3}.$$</p>' +
          '<p>选 <b>D</b>。A 的 $1$ 来自误以为 $\\xi\\sim x$。</p>' },
];

AW.init({
  title: '【2014 数二·5】$\\lim_{x\\to0}\\dfrac{\\xi^{2}}{x^{2}}$ 的计算',
  subtitle: '考点：微分中值定理 + 泰勒展开 · 方法：反解中值点再定阶',
  counterLabel: '已执行',
  ribbonTitle: '关键节点',
  intro: '点击「▶ 播放」逐步演示推导。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一张卡'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'条件是拉格朗日中值公式，ξ 随 x 一起趋于 0', count:0 },
    { cls:'step',  tag:'反解', log:'用 arctan x = x/(1+ξ²) 解出 ξ²', count:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'展开', log:'arctan x 展开到三阶：x − x³/3', count:2 },
    { cls:'shift', tag:'化简', log:'分母 arctan x 只是一阶，等价成 x 即可', count:3 },
    { cls:'ok',    tag:'定阶', log:'ξ² 约分后相当于 x²/3', count:4, ribbon:{k:2, ok:true} },
    { cls:'done',  tag:'完成', log:'极限 = 1/3，答案 D', count:5, ribbon:{k:3, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 D（极限 = 1/3）',
    html: '记忆锚点：<b>$x-\\arctan x\\sim\\dfrac{x^{3}}{3}$（三阶）</b>。链条：$\\arctan x=x-\\dfrac{x^{3}}{3}+o(x^{3})$ → $\\xi^{2}=\\dfrac{x-\\arctan x}{\\arctan x}\\sim\\dfrac{x^{2}}{3}$。误以为 $\\xi\\sim x$ 会错选 A。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
