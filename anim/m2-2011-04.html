<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011 数二第 4 题 · 非齐次特解形式判定</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：先解特征方程',
    cls: 'key',
    body: '<p>齐次方程 $y\'\'-\\lambda^2y=0$ 的特征方程 $r^2-\\lambda^2=0$，两根 $r=\\pm\\lambda$（$\\lambda>0$，<b>相异单根</b>）。右端 $\\mathrm e^{\\lambda x}+\\mathrm e^{-\\lambda x}$ 是两个指数函数之和，按<b>叠加原理</b>逐项确定特解形状。</p>' },
  { title: '右端项 e^(λx)：撞上单根，必须升幂',
    cls: 'key',
    body: '<p>指数 $\\lambda$ 恰好是特征<b>单根</b>——发生共振。形状 $a\\,\\mathrm e^{\\lambda x}$ 不乘 $x$ 的话，代入左端输出恒为 $0$，无法平衡右端，必须升幂为 $ax\\,\\mathrm e^{\\lambda x}$。</p>' },
  { title: '右端项 e^(−λx)：同样共振',
    cls: 'key',
    body: '<p>指数 $-\\lambda$ 也是特征单根，同样要乘 $x$：形状 $bx\\,\\mathrm e^{-\\lambda x}$。</p>' },
  { title: '排除干扰项 A、B',
    cls: 'bad',
    body: '<p>A 给 $a\\left(\\mathrm e^{\\lambda x}+\\mathrm e^{-\\lambda x}\\right)$、B 给 $ax\\left(\\mathrm e^{\\lambda x}+\\mathrm e^{-\\lambda x}\\right)$：两项指数函数<b>线性无关</b>，系数必须分开设 $a$ 与 $b$；而且 B 只给第一项升了幂，第二项漏乘。</p>' },
  { title: '排除干扰项 D',
    cls: 'bad',
    body: '<p>D 乘了 $x^2$：只有指数是<b>二重根</b>时才乘 $x^2$，这里 $\\pm\\lambda$ 是两个相异单根，各升一次幂就够。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>叠加合并：$$y^*=ax\\,\\mathrm e^{\\lambda x}+bx\\,\\mathrm e^{-\\lambda x}=x\\bigl(a\\,\\mathrm e^{\\lambda x}+b\\,\\mathrm e^{-\\lambda x}\\bigr),$$ <b>选 C</b>。口诀：右端指数是几重特征根，特解就乘几个 $x$。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    count: i,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '第 4 题 · $y\'\'-\\lambda^2y=\\mathrm e^{\\lambda x}+\\mathrm e^{-\\lambda x}$ 的特解形式',
  subtitle: '考点：二阶常系数非齐次方程 · 选项逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链：特征根 → 共振判定 → 选项排除。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '特解形式 $\\boldsymbol{y^*=x\\bigl(a\\,\\mathrm e^{\\lambda x}+b\\,\\mathrm e^{-\\lambda x}\\bigr)}$。记忆锚点：<b>右端指数撞上特征根 ⇒ 乘 $x$ 升幂；撞几重根乘几个 $x$</b>。干扰项 A/B 错在两个线性无关的指数共用一个系数，D 错在把单根当二重根。',
  },
});
</script>
</body>
</html>
