<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2013·23 二次型矩阵与正交变换标准形</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：把「组合的平方」翻译成矩阵语言',
    cls: 'key',
    body: '<p>记 $\\boldsymbol x=(x_1,x_2,x_3)^{\\mathrm T}$，则 $a_1x_1+a_2x_2+a_3x_3=\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol x$ 是<b>一个数</b>：$$f=2(\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol x)^2+(\\boldsymbol\\beta^{\\mathrm T}\\boldsymbol x)^2$$ 关键桥梁：<b>标量的转置等于自身</b>，这是把平方写成 $\\boldsymbol x^{\\mathrm T}\\boldsymbol A\\boldsymbol x$ 的全部秘密。</p>' },
  { title: '改写平方项（秩 1 外积）',
    cls: 'step',
    body: '<p>$$(\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol x)^2=(\\boldsymbol x^{\\mathrm T}\\boldsymbol\\alpha)(\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol x)=\\boldsymbol x^{\\mathrm T}(\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T})\\boldsymbol x$$ 同理 $(\\boldsymbol\\beta^{\\mathrm T}\\boldsymbol x)^2=\\boldsymbol x^{\\mathrm T}(\\boldsymbol\\beta\\boldsymbol\\beta^{\\mathrm T})\\boldsymbol x$。注意外积 $\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T}$ 是 $3\\times3$ 对称矩阵，不是数。</p>' },
  { title: '(1) 合并 + 验证对称',
    cls: 'good',
    body: '<p>$$f=\\boldsymbol x^{\\mathrm T}\\big(2\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T}+\\boldsymbol\\beta\\boldsymbol\\beta^{\\mathrm T}\\big)\\boldsymbol x$$ 又 $(\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T})^{\\mathrm T}=\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T}$，$\\boldsymbol\\beta\\boldsymbol\\beta^{\\mathrm T}$ 同理，$2\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T}+\\boldsymbol\\beta\\boldsymbol\\beta^{\\mathrm T}$ 是对称矩阵——由二次型矩阵的唯一性，它就是 $f$ 的矩阵。<b>(1) 得证。</b></p>' },
  { title: '(2) 条件清单：正交 + 单位',
    cls: 'key',
    body: '<p>已知 $\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol\\alpha=1$，$\\boldsymbol\\beta^{\\mathrm T}\\boldsymbol\\beta=1$，$\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol\\beta=\\boldsymbol\\beta^{\\mathrm T}\\boldsymbol\\alpha=0$。记 $\\boldsymbol A=2\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T}+\\boldsymbol\\beta\\boldsymbol\\beta^{\\mathrm T}$，<b>直接用定义试探</b>：算 $\\boldsymbol A\\boldsymbol\\alpha$ 与 $\\boldsymbol A\\boldsymbol\\beta$。</p>' },
  { title: '试探 $\\boldsymbol A\\boldsymbol\\alpha$',
    cls: 'good',
    body: '<p>$$(\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol\\alpha)=1,\\quad(\\boldsymbol\\beta^{\\mathrm T}\\boldsymbol\\alpha)=0\\ \\Longrightarrow\\ \\boldsymbol A\\boldsymbol\\alpha=2\\boldsymbol\\alpha\\cdot1+\\boldsymbol\\beta\\cdot0=2\\boldsymbol\\alpha$$ 所以 $\\lambda_1=2$，$\\boldsymbol\\alpha$ 是对应特征向量。</p>' },
  { title: '试探 $\\boldsymbol A\\boldsymbol\\beta$',
    cls: 'good',
    body: '<p>$$(\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol\\beta)=0,\\quad(\\boldsymbol\\beta^{\\mathrm T}\\boldsymbol\\beta)=1\\ \\Longrightarrow\\ \\boldsymbol A\\boldsymbol\\beta=2\\boldsymbol\\alpha\\cdot0+\\boldsymbol\\beta\\cdot1=\\boldsymbol\\beta$$ 所以 $\\lambda_2=1$，$\\boldsymbol\\beta$ 是对应特征向量。</p>' },
  { title: '补第三个方向 $\\boldsymbol\\gamma$',
    cls: 'step',
    body: '<p>取与 $\\boldsymbol\\alpha,\\boldsymbol\\beta$ 都正交的非零向量 $\\boldsymbol\\gamma$（三维中两个正交约束必有非零解），则 $\\boldsymbol A\\boldsymbol\\gamma=2\\boldsymbol\\alpha\\cdot0+\\boldsymbol\\beta\\cdot0=\\boldsymbol 0$，$$\\lambda_3=0$$ 故 $\\boldsymbol A$ 的特征值为 $2,\\,1,\\,0$。</p>' },
  { title: '结论：标准形系数 = 特征值',
    cls: 'good',
    body: '<p>$\\boldsymbol A$ 是实对称矩阵，存在正交矩阵 $\\boldsymbol Q$（$\\boldsymbol x=\\boldsymbol Q\\boldsymbol y$）把 $f$ 化为标准形，系数恰为特征值：$$f=2y_1^2+y_2^2+0\\cdot y_3^2=\\boxed{2y_1^2+y_2^2}$$ (1)(2) 均得证。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '二次型 $f=2(\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol x)^2+(\\boldsymbol\\beta^{\\mathrm T}\\boldsymbol x)^2$ 的矩阵与标准形',
  subtitle: '考点：二次型矩阵 · 正交变换标准形 · 方法：外积改写 + 定义读特征值',
  intro: '点击「▶ 播放」逐步展开两问的证明推理链。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '矩阵 $2\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T}+\\boldsymbol\\beta\\boldsymbol\\beta^{\\mathrm T}$；标准形 $2y_1^2+y_2^2$',
    html: '记忆锚点：<b>「组合的平方」$\\to\\boldsymbol x^{\\mathrm T}(\\boldsymbol\\alpha\\boldsymbol\\alpha^{\\mathrm T})\\boldsymbol x$（标量转置等于自身）</b>；单位正交向量下直接算 $\\boldsymbol A\\boldsymbol\\alpha=2\\boldsymbol\\alpha$、$\\boldsymbol A\\boldsymbol\\beta=\\boldsymbol\\beta$，补一个正交补方向得 $\\lambda=0$。易错：写成 $\\boldsymbol x^{\\mathrm T}\\boldsymbol\\alpha^{\\mathrm T}\\boldsymbol\\alpha\\boldsymbol x$（完全错误）；忘验对称性。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
