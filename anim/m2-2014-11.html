<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：隐函数全微分 dz（2014 年第 11 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '审题：先定点值再微分',
    body: '<p>$\\mathrm e^{2yz}+x+y^{2}+z=\\dfrac74$ 确定 $z=z(x,y)$，求 $\\mathrm dz\\big|_{(\\frac12,\\frac12)}$。第一步：代点定 $z_{0}$。</p>' },
  { cls: 'ok', title: '代点解出 $z_{0}$',
    body: '<p>$x=y=\\dfrac12$ 代入：</p>' +
          '<p>$$\\mathrm e^{z}+\\frac12+\\frac14+z=\\frac74\\ \\Longrightarrow\\ \\mathrm e^{z}+z=1.$$</p>' +
          '<p>$z=0$ 满足，且 $\\mathrm e^{z}+z$ 严格递增，解唯一：$z_{0}=0$。</p>' },
  { cls: '', title: '两边取全微分',
    body: '<p>$$\\mathrm e^{2yz}\\,\\mathrm d(2yz)+\\mathrm dx+2y\\,\\mathrm dy+\\mathrm dz=0.$$</p>' +
          '<p>乘积微分 $\\mathrm d(2yz)=2z\\,\\mathrm dy+2y\\,\\mathrm dz$，两项都要。</p>' },
  { cls: 'shift', title: '代入 $z=0,\\ y=\\dfrac12$',
    body: '<p>$\\mathrm e^{2yz}=1$，$2z=0$，$2y=1$：</p>' +
          '<p>$$1\\cdot(0\\cdot\\mathrm dy+1\\cdot\\mathrm dz)+\\mathrm dx+1\\cdot\\mathrm dy+\\mathrm dz=0.$$</p>' +
          '<p>$2z=0$ 恰好把 $\\mathrm dy$ 项整块消掉。</p>' },
  { cls: 'ok', title: '解出 $\\mathrm dz$',
    body: '<p>$$2\\,\\mathrm dz=-\\mathrm dx-\\mathrm dy\\ \\Longrightarrow\\ \\mathrm dz=-\\frac12\\,\\mathrm dx-\\frac12\\,\\mathrm dy.$$</p>' },
  { cls: 'good', title: '验算与结论',
    body: '<p>隐函数求偏导验算：$z_{x}=-\\dfrac{F_{x}}{F_{z}}=-\\dfrac{1}{2y\\,\\mathrm e^{2yz}+1}\\Big|=-\\dfrac12$；$z_{y}=-\\dfrac{F_{y}}{F_{z}}=-\\dfrac{2z\\,\\mathrm e^{2yz}+2y}{2y\\,\\mathrm e^{2yz}+1}\\Big|=-\\dfrac{0+1}{1+1}=-\\dfrac12$，一致。</p>' +
          '<p>$$\\mathrm dz\\Big|_{(\\frac12,\\frac12)}=-\\frac12\\,\\mathrm dx-\\frac12\\,\\mathrm dy.$$</p>' },
];

AW.init({
  title: '【2014 数二·11】$\\mathrm dz$ 在点 $(\\tfrac12,\\tfrac12)$ 处的值',
  subtitle: '考点：隐函数全微分 · 方法：定点值 + 整体微分',
  counterLabel: '已执行',
  ribbonTitle: '关键节点',
  intro: '点击「▶ 播放」逐步演示推导。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一张卡'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'求全微分先定该点的 z 值', count:0 },
    { cls:'ok',    tag:'定值', log:'代 x=y=1/2，得 e^z + z = 1，解出 z = 0', count:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'微分', log:'两边取微分，乘积 d(2yz) 出两项', count:2 },
    { cls:'shift', tag:'代入', log:'z=0、y=1/2 代入：2z=0 消掉 dy 项，剩 2dz + dx + dy = 0', count:3 },
    { cls:'ok',    tag:'解出', log:'dz = −1/2 dx − 1/2 dy', count:4, ribbon:{k:2, ok:true} },
    { cls:'done',  tag:'完成', log:'验算偏导一致，dz = −1/2 dx − 1/2 dy', count:5, ribbon:{k:3, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 dz = −(1/2)dx − (1/2)dy',
    html: '记忆锚点：<b>先定点值（$\\mathrm e^{z}+z=1\\Rightarrow z_{0}=0$），再整体微分</b>——代值后 $2z=0$ 让 $\\mathrm dy$ 项消失，方程立刻变简单。等价写法：$z_{x}=z_{y}=-\\dfrac12$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
