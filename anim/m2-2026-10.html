<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：幂零矩阵 (A−B)²=O 的推理链</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：拆出完全平方',
    cls: 'key',
    body: '<p>$AB+BA=A^2+B^2$ 移项：$$A^2-AB-BA+B^2=O,$$ 而 $(A-B)^2=A^2-AB-BA+B^2$（交叉项恰凑齐）。记 $C=A-B$：<b>$C^2=O$ 且 $C\\ne O$（因 $A\\ne B$）</b>——幂零指数为 2。</p>' },
  { title: 'A 项：成立',
    cls: 'good',
    body: '<p>$C^3=C\\cdot C^2=C\\cdot O=O$，即 $(A-B)^3=O$。<b>结论正确</b>。</p>' },
  { title: 'B 项：成立',
    cls: 'good',
    body: '<p>若 $C\\xi=\\lambda\\xi$，则 $O=C^2\\xi=\\lambda^2\\xi\\Rightarrow\\lambda=0$——特征值只能全为 $0$，$A-B$ 只有零特征值。<b>结论正确</b>。</p>' },
  { title: 'C 项：成立',
    cls: 'good',
    body: '<p>若 $A,B$ 都是对角矩阵，则 $C=A-B$ 也是对角矩阵；对角阵平方为零必须每个对角元为零，即 $C=O\\Rightarrow A=B$，与 $A\\ne B$ 矛盾。<b>结论正确</b>。</p>' },
  { title: 'D 项：错在个数',
    cls: 'bad',
    body: '<p>$C^2=O\\Rightarrow\\operatorname{Im}C\\subseteq\\ker C\\Rightarrow 2\\operatorname{rank}C\\le3$；又 $C\\ne O$，故 $\\operatorname{rank}C=1$。零特征值的几何重数 $$\\dim\\ker C=3-1=2,$$ 即有 <b>2 个</b>线性无关的特征向量，不是"只有一个"。<b>结论错误</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>题目问"错误的结论"，答案选 <b>D</b>。记忆锚点：<b>幂零矩阵特征值全零、秩 $\\le n/2$；线性无关特征向量个数 = $n-r$，不是 1</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$AB+BA=A^2+B^2$ 且 $A\\ne B$：哪个结论错误',
  subtitle: '考点：矩阵完全平方 · 幂零矩阵 · 特征值与几何重数',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐项检验 A、B、C、D。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 D（$A-B$ 有 2 个线性无关特征向量）',
    html: '记忆锚点：<b>条件即 $(A-B)^2=O$；幂零 + 非零 ⇒ $\\operatorname{rank}=1$ ⇒ $\\dim\\ker=3-1=2$</b>。易错：展开 $(A-B)^2$ 漏掉 $-BA$；把"特征值全零"误当成"只有一个特征向量"。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
