<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：四阶稀疏行列式的值（2014 年第 7 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var D4 = '$$D=\\begin{vmatrix}0&a&b&0\\\\a&0&0&b\\\\0&c&d&0\\\\c&0&0&d\\end{vmatrix}$$';

var CARDS = [
  { cls: 'key', title: '观察非零元分布',
    body: '<p>' + D4 + '</p><p>非零元「交错」分布：第 1、3 行的非零元只落在第 2、3 列，第 2、4 行的非零元只落在第 1、4 列。选好展开方式，只剩两个二阶行列式。</p>' },
  { cls: '', title: '按第 1、3 行拉普拉斯展开',
    body: '<p>这两行的非零列只有 $\\{2,3\\}$，非零二阶子式只有一个：</p>' +
          '<p>$$\\Delta_{1}=\\begin{vmatrix}a&b\\\\c&d\\end{vmatrix}=ad-bc.$$</p>' +
          '<p>取自第 1、3 行与第 2、3 列。</p>' },
  { cls: '', title: '写出对应余子式',
    body: '<p>划掉第 1、3 行与第 2、3 列，剩第 2、4 行与第 1、4 列：</p>' +
          '<p>$$\\Delta_{2}=\\begin{vmatrix}a&b\\\\c&d\\end{vmatrix}=ad-bc.$$</p>' },
  { cls: 'shift', title: '算符号因子',
    body: '<p>$$(-1)^{(1+3)+(2+3)}=(-1)^{9}=-1.$$</p>' },
  { cls: 'ok', title: '合并得值',
    body: '<p>$$D=(-1)\\,(ad-bc)(ad-bc)=-(ad-bc)^{2}.$$</p>' },
  { cls: 'good', title: '另解验证与结论',
    body: '<p>按第一列展开验证：$M_{21}=d(ad-bc)$，$M_{41}=-b(ad-bc)$，</p>' +
          '<p>$$D=-ad(ad-bc)+bc(ad-bc)=(ad-bc)(bc-ad)=-(ad-bc)^{2}.$$</p>' +
          '<p>一致，选 <b>B</b>。</p>' },
];

AW.init({
  title: '【2014 数二·7】$\\begin{vmatrix}0&a&b&0\\\\a&0&0&b\\\\0&c&d&0\\\\c&0&0&d\\end{vmatrix}$ 的值',
  subtitle: '考点：行列式 · 方法：拉普拉斯展开（按 1、3 行）',
  counterLabel: '已执行',
  ribbonTitle: '关键节点',
  intro: '点击「▶ 播放」逐步演示展开过程。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一张卡'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'非零元交错分布，挑第 1、3 行展开最省事', count:0 },
    { cls:'step',  tag:'选子式', log:'第 1、3 行的非零元只占第 2、3 列，子式 = ad−bc', count:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'找余子式', log:'划掉 1、3 行与 2、3 列，剩下 2、4 行 1、4 列，还是 ad−bc', count:2 },
    { cls:'shift', tag:'定符号', log:'行标和加列标和 = 9，奇数取负号', count:3 },
    { cls:'ok',    tag:'合并', log:'D = −(ad−bc)²', count:4, ribbon:{k:2, ok:true} },
    { cls:'done',  tag:'完成', log:'按第一列展开验证一致，答案 B', count:5, ribbon:{k:3, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 B（D = −(ad−bc)²）',
    html: '记忆锚点：<b>稀疏行列式先找「成块」的行</b>：两行非零元只占两列时，拉普拉斯展开只剩一个子式。负号来自 $(1+3)+(2+3)=9$ 为奇数；A 是漏负号的典型错误。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
