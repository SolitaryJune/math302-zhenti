<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念动画：变上限积分在分段点处连续但不可导（2013 年第 3 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>$f(x)=\\sin x$（$0\\le x&lt;\\pi$），$f(x)=2$（$\\pi\\le x\\le2\\pi$），$F(x)=\\int_0^x f(t)\\,\\mathrm dt$。要判断 $F$ 在分段点 $x=\\pi$ 处：<b>先连续，后可导</b>。</p>' },
  { title: '连续性保底', cls: '',
    body: '<p>$f$ 在 $[0,2\\pi]$ 上分段连续、有界，故可积。被积函数可积 $\\Rightarrow$ $F(x)=\\int_0^x f$ <b>处处连续</b>——积分抹平了被积函数的跳跃。</p>' },
  { title: '排除 A：不是跳跃间断', cls: 'bad',
    body: '<p>跳跃间断点要求 $F$ 本身左右极限不等，但 $F$ 在 $x=\\pi$ 处连续（左极限 $=$ 右极限 $=$ $F(\\pi)=2$）。<b>排除 A</b>。</p>' },
  { title: '排除 B：不是可去间断', cls: 'bad',
    body: '<p>可去间断要求极限存在但不等于函数值，而 $F$ 在该点的极限就等于函数值。<b>排除 B</b>。</p>' },
  { title: '左导数：沿 sin 段逼近', cls: 'key',
    body: '<p>在 $f$ 的跳跃点两侧分别用定义：</p>' +
          '<p>$$F\'_-(\\pi)=\\lim_{x\\to\\pi^-}\\frac{F(x)-F(\\pi)}{x-\\pi}=f(\\pi^-)=\\sin\\pi=0.$$</p>' },
  { title: '右导数：沿常数段逼近', cls: 'key',
    body: '<p>$$F\'_+(\\pi)=f(\\pi^+)=2.$$</p>' +
          '<p>图像上：$F$ 在 $[0,\\pi]$ 是 $1-\\cos x$（斜率趋于 $0$），在 $[\\pi,2\\pi]$ 是 $2+2(x-\\pi)$（斜率恒 $2$）。</p>' },
  { title: '排除 D：左右导数不等', cls: 'bad',
    body: '<p>$0\\ne2$，左、右导数不相等，$F$ 在 $x=\\pi$ 处<b>不可导</b>。<b>排除 D</b>。</p>' },
  { title: '结论：连续但不可导 ✓', cls: 'good',
    body: '<p>连续（第一步）+ 不可导（第七步）＝ <b>C</b> 选项的描述："折点"——函数值衔接无缝、斜率突变。</p>' },
];

var RIBBONS = [null, null, {k:1, ok:false}, {k:2, ok:false},
  null, null, {k:4, ok:false}, {k:3, ok:true}];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step')),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    count: i + 1,
    ribbon: RIBBONS[i],
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$F(x)=\\int_0^x f(t)\\,\\mathrm dt$ 在 $x=\\pi$ 处的性态',
  subtitle: '考点：变限积分 · 方法：可积保连续 → 左右导数判可导',
  ribbonTitle: '选项判定（A=1 · B=2 · C=3 · D=4）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：<b>被积函数可积 ⇒ 变限积分连续</b>；在 $f$ 的跳跃点 $x_0$ 处 $F$ 连续但不可导，左、右导数恰为 $f(x_0^-)$ 与 $f(x_0^+)$。本题 $f(\\pi^-)=0\\ne2=f(\\pi^+)$——"折点"。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
