<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2021·10 用三角可逆阵把 A 化为对角阵</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [
  "<b>① 审题：</b>$A=\\begin{pmatrix}1&0&-1\\\\2&-1&1\\\\-1&2&-5\\end{pmatrix}$，要下三角 $P$（行变换）+ 上三角 $Q$（列变换）使 $PAQ$ 为对角阵",
  "<b>② 设计行变换：</b>$r_2\\to 2r_1-r_2$ 消 $(2,1)$；$r_3\\to-3r_1+2r_2+r_3$ 消 $(3,1),(3,2)$——记录成 $P=\\begin{pmatrix}1&0&0\\\\2&-1&0\\\\-3&2&1\\end{pmatrix}$（下三角、可逆）",
  "<b>③ 执行 $PA$：</b>$PA=\\begin{pmatrix}1&0&-1\\\\0&1&-3\\\\0&0&0\\end{pmatrix}$——对角线下方全零，但右上还有 $-1,-3$",
  "<b>④ 由此判 B：</b>若 $Q=E$（选项 B），$PA$ 的右上 $-1,-3$ 无人清理，不是对角阵——B 出局",
  "<b>⑤ 设计列变换：</b>第 3 列 $\\to$ 第 3 列 $+1\\times$ 第 1 列 $+3\\times$ 第 2 列，记录成 $Q=\\begin{pmatrix}1&0&1\\\\0&1&3\\\\0&0&1\\end{pmatrix}$（上三角、可逆）",
  "<b>⑥ 执行 $PAQ$：</b>新第 3 列 $=(1,0,0)^{\\mathrm T}+3(0,1,0)^{\\mathrm T}+(-1,-3,0)^{\\mathrm T}=(0,0,0)^{\\mathrm T}$，得 $PAQ=\\begin{pmatrix}1&0&0\\\\0&1&0\\\\0&0&0\\end{pmatrix}$",
  "<b>⑦ 排除 A、D：</b>A 的 $P=E$ 没做行变换，对角线下方 $2,-1,-1,2$ 原样留着；D 实算 $PAQ=\\begin{pmatrix}1&2&-4\\\\2&5&-7\\\\6&13&-23\\end{pmatrix}$，根本没消掉",
  "<b>⑧ 结论：</b>C 的 $P,Q$ 满足全部条件——下三角、上三角、都可逆、乘积为对角，选 C"
];

AW.init({
  title: '2021·10　左乘行变换、右乘列变换，把 $A$ 磨成对角阵',
  subtitle: '考点：初等矩阵与初等变换 · $P$ 管下方、$Q$ 管右方',
  counterLabel: '已执行',
  ribbonTitle: '变换进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，先消下方、再消右方，逐个排除选项。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    this._rows = [];
    for (var i = 0; i < ROWS.length; i++){
      var r = AW.el('div', 'aw-stepcard', ROWS[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'左乘下三角做行变换清对角线下方，右乘上三角做列变换清右上方', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'设计P',  log:'两步行消元的系数记录下来，就是一个下三角可逆矩阵', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'算PA',   log:'行变换后对角线下方全零，只剩右上两个非零元素', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'排 B',   log:'单位阵当 Q 时右上角没人清，B 出局', count:3, ribbon:{k:4, ok:true} },
    { cls:'shift', tag:'设计Q',  log:'第三列加上第一列的一倍与第二列的三倍，记录成上三角矩阵', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'算PAQ',  log:'第三列三个数恰好抵消成零，得到对角阵一一零', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'排 A D', log:'A 没做行变换、D 的乘积离对角很远，双双出局', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'完成',   log:'结论：选项 C 的 P 和 Q 满足全部要求，选 C', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '选 C　$P=\\begin{pmatrix}1&0&0\\\\2&-1&0\\\\-3&2&1\\end{pmatrix}$，$Q=\\begin{pmatrix}1&0&1\\\\0&1&3\\\\0&0&1\\end{pmatrix}$，$PAQ=\\mathrm{diag}(1,1,0)$',
    html: '记忆锚点：<b>左乘动行（$P$ 下三角清下方），右乘动列（$Q$ 上三角清右方）</b>。易错：算出 $PA$ 就选 B——必须整个 $PAQ$ 是对角；D 的 $P$ 其实也是下三角，错在乘积不是对角阵。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
