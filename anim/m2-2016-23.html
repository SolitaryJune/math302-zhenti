<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016 数二第 23 题 · A^99 对角化与 B^100 按列组合（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2016·23　$A^{99}$（对角化）与 $B^{100}$（归纳 $B^{100}=BA^{99}$）',
  subtitle: '考点：特征值与对角化 · 方法：<b>$PD^{n}P^{-1}$ + 按列线性组合</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看高次幂如何被对角化压平、列组合如何照抄系数。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '<b>题设：</b>$A=\\begin{pmatrix}0&-1&1\\\\2&-3&0\\\\0&0&0\\end{pmatrix}$；$B=(\\alpha_{1},\\alpha_{2},\\alpha_{3})$ 满足 $B^{2}=BA$',
      '<b>① 特征值：</b>$\\det(A-\\lambda I)=-\\lambda(\\lambda+1)(\\lambda+2)$，$\\lambda=0,-1,-2$ 互异 $\\Rightarrow$ 可对角化',
      '<b>② 特征向量：</b>$\\xi_{1}=(3,2,2)^{\\mathrm T},\\ \\xi_{2}=(1,1,0)^{\\mathrm T},\\ \\xi_{3}=(1,2,0)^{\\mathrm T}$，$P=(\\xi_{1},\\xi_{2},\\xi_{3})$，$P^{-1}=\\begin{pmatrix}0&0&\\frac{1}{2}\\\\2&-1&-2\\\\-1&1&\\frac{1}{2}\\end{pmatrix}$',
      '<b>③ 高次幂公式：</b>$A^{99}=P\\,\\mathrm{diag}\\bigl(0,(-1)^{99},(-2)^{99}\\bigr)P^{-1}=P\\,\\mathrm{diag}(0,-1,-2^{99})\\,P^{-1}$',
      '<b>④ 乘开：</b>$A^{99}=\\begin{pmatrix}2^{99}-2&1-2^{99}&2-2^{98}\\\\2^{100}-2&1-2^{100}&2-2^{99}\\\\0&0&0\\end{pmatrix}$（第三行全零）',
      '<b>⑤ 归纳：</b>$B^{2}=BA\\ \\Rightarrow\\ B^{n}=BA^{n-1}\\ (n\\ge1)$，故 $B^{100}=BA^{99}$',
      '<b>⑥ 按列拆：</b>$B^{100}=BA^{99}$ 的第 $j$ 列 $\\beta_{j}=c_{1j}\\alpha_{1}+c_{2j}\\alpha_{2}+c_{3j}\\alpha_{3}$（$A^{99}=(c_{ij})$）；第三行 $c_{3j}=0$',
      '<b>⑦ 结论：</b>$\\beta_{1}=(2^{99}-2)\\alpha_{1}+(2^{100}-2)\\alpha_{2}$，$\\beta_{2}=(1-2^{99})\\alpha_{1}+(1-2^{100})\\alpha_{2}$，$\\beta_{3}=(2-2^{98})\\alpha_{1}+(2-2^{99})\\alpha_{2}$'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'第三行全零提示零是特征值，算特征多项式拆出三个互异根，必可对角化', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'特征值', log:'零、负一、负二两两不同，走对角化路线', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'特征向量', log:'分别解三个齐次方程组拿特征向量，拼出过渡矩阵并求逆', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'压平幂', log:'九十九次幂变成对角阵的幂：负一奇次幂还是负一，负二奇次幂是负的二幂次', count:3, ribbon:{k:4, ok:true} },
    { cls:'shift', tag:'乘开',   log:'三个矩阵连乘逐元素落位，第三行保持全零', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'归纳',   log:'第二问靠归纳：每多乘一次 B 相当于右端多乘一次 A，一百次幂等于 B 乘 A 的九十九次幂', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'列组合', log:'B 乘矩阵等于按列组合：第 j 列的系数照抄右矩阵第 j 列，第三行全零说明只用前两个向量', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'完成',  log:'三列的组合系数全部照抄前两行，结论写出', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$A^{99}$ 第三行全零；$\\beta_{j}$ 系数取 $A^{99}$ 第 $j$ 列前两分量',
    html: '记忆锚点：<b>特征值互异必可对角化，$A^{n}=PD^{n}P^{-1}$</b>；$B^{2}=BA$ 归纳出 $B^{100}=BA^{99}$，而 $B$ 乘矩阵 = 按列线性组合。易错：$(-2)^{99}=-2^{99}$ 别丢负号；$B^{100}$ 中 $B$ 在左侧，不可交换。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
