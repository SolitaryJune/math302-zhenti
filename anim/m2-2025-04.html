<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：高阶无穷小运算性质逐项辨析</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：判据只有一个比值极限',
    cls: 'key',
    log: 'f = o(g) 即 f/g → 0；判断 A = o(B) 就算 lim A/B 是否为 0',
    body: '<p>已知 $\\lim_{x\\to0}\\dfrac{f(x)}{g(x)}=0$（记 $f=o(g)$），且 $f,g$ 在去心邻域恒不为零。要判「$A=o(B)$」是否成立，就老实算 $\\lim_{x\\to0}\\dfrac{A}{B}$：等于 $0$ 才成立。</p>' },
  { title: 'C 项：等价无穷小搭桥 → 成立',
    cls: 'good',
    log: 'e^g − 1 ~ g（g→0），比值拆成 0 × 1 = 0，C 正确',
    ribbon: {k:1, ok:true},
    body: '<p>由 $f=o(g)$ 知 $g\\to0$，故 $\\mathrm e^g-1\\sim g$。于是 $$\\lim_{x\\to0}\\frac{f}{\\mathrm e^g-1}=\\lim_{x\\to0}\\frac fg\\cdot\\frac{g}{\\mathrm e^g-1}=0\\cdot1=0,$$ 所以 $f=o\\bigl(\\mathrm e^g-1\\bigr)$ <b>成立</b> ✓。</p>' },
  { title: 'A 项：主部吞并高阶 → 同阶不是高阶',
    cls: 'bad',
    log: '(f+g)/g = f/g + 1 → 1 ≠ 0，A 错',
    ribbon: {k:2, ok:true},
    body: '<p>$\\dfrac{f+g}{g}=\\dfrac fg+1\\to0+1=1\\ne0$：$f+g$ 与 $g$ <b>同阶</b>，不是高阶。低阶主部 $g$ 把高阶的 $f$ 吞并了。</p>' },
  { title: 'B 项：关系恰好反向 → 错',
    cls: 'bad',
    log: 'fg/f² = g/f → ∞，真实关系是 f² = o(fg)',
    ribbon: {k:3, ok:true},
    body: '<p>$\\dfrac{fg}{f^2}=\\dfrac{g}{f}=\\dfrac{1}{f/g}\\to\\infty$：比值趋于无穷不是零，$fg=o(f^2)$ 不成立；恰好<b>反过来</b>才有 $f^2=o(fg)$。</p>' },
  { title: 'D 项：0·∞ 型不定，反例否决 → 错',
    cls: 'bad',
    log: 'f/g² = (f/g)(1/g) 极限不定；取 g=x, f=x^(3/2) 比值 → +∞',
    ribbon: {k:4, ok:true},
    body: '<p>$\\dfrac{f}{g^2}=\\dfrac fg\\cdot\\dfrac1g$ 是 $0\\cdot\\infty$ 型。反例：取 $g=x$，$f=x^{3/2}$（$x>0$），则 $\\dfrac fg=x^{1/2}\\to0$ 满足题设，但 $\\dfrac{f}{g^2}=x^{-1/2}\\to+\\infty$，故 $f=o(g^2)$ 不成立。</p>' },
  { title: '结论',
    cls: 'good',
    log: '只有 C 能严格证出比值极限为 0，选 C',
    body: '<p>四个选项里只有 C 能严格证出比值为 $0$，答案选 <b>C</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$f=o(g)$ 时，四个运算式哪个仍成立',
  subtitle: '考点：无穷小阶的比较 · 判据 $\\lim A/B=0$ · 等价无穷小 $\\mathrm e^g-1\\sim g$',
  counterLabel: '检验步',
  ribbonTitle: '选项裁决（✓ 已裁决 / ✗ 待复核）',
  intro: '点击「▶ 播放」逐项检验 A–D。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：<b>验 $o(\\cdot)$ 就是算 $\\lim\\dfrac AB$</b>；$o(g)+g$ 与 $g$ 同阶（主部吞并高阶）；$\\dfrac{fg}{f^2}=\\dfrac gf\\to\\infty$（关系反向）；$\\dfrac{f}{g^2}$ 是 $0\\cdot\\infty$ 不定型，反例 $g=x,\\ f=x^{3/2}$ 直接否决。C 靠 $\\mathrm e^g-1\\sim g$ 拆成已知比值。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
