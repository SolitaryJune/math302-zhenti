<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：分块上三角矩阵的伴随矩阵</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$\\Bigl(\\begin{smallmatrix}A&E\\\\O&B\\end{smallmatrix}\\Bigr)^*$ 的完整推导',
  subtitle: '考点：分块矩阵 + 伴随矩阵 · 方法：$M^*=|M|M^{-1}$ → 分块求逆 → 收标量',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示行列式、逆矩阵、伴随矩阵的计算链。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>主公式</b>：$\\boldsymbol M=\\Bigl(\\begin{smallmatrix}\\boldsymbol A&\\boldsymbol E\\\\\\boldsymbol O&\\boldsymbol B\\end{smallmatrix}\\Bigr)$ 可逆，$$\\boldsymbol M^*=|\\boldsymbol M|\\,\\boldsymbol M^{-1}$$ 先求行列式，再求逆，最后相乘',
      '<b>行列式</b>：分块上三角，$$|\\boldsymbol M|=|\\boldsymbol A|\\,|\\boldsymbol B|\\neq0$$',
      '<b>分块求逆</b>：设 $\\boldsymbol M^{-1}=\\Bigl(\\begin{smallmatrix}\\boldsymbol X&\\boldsymbol Y\\\\\\boldsymbol Z&\\boldsymbol W\\end{smallmatrix}\\Bigr)$，由 $\\boldsymbol M\\boldsymbol M^{-1}=\\boldsymbol E$ 比较各块：$\\boldsymbol X=\\boldsymbol A^{-1}$、$\\boldsymbol Z=\\boldsymbol O$、$\\boldsymbol W=\\boldsymbol B^{-1}$，而 $\\boldsymbol A\\boldsymbol Y+\\boldsymbol B^{-1}=\\boldsymbol O\\Rightarrow\\boldsymbol Y=-\\boldsymbol A^{-1}\\boldsymbol B^{-1}$',
      '<b>逆的形状</b>：$$\\boldsymbol M^{-1}=\\begin{pmatrix}\\boldsymbol A^{-1}&-\\boldsymbol A^{-1}\\boldsymbol B^{-1}\\\\\\boldsymbol O&\\boldsymbol B^{-1}\\end{pmatrix}$$',
      '<b>乘标量收伴随</b>：$|\\boldsymbol A||\\boldsymbol B|$ 分别乘进各块，用 $|\\boldsymbol A|\\boldsymbol A^{-1}=\\boldsymbol A^*$、$|\\boldsymbol B|\\boldsymbol B^{-1}=\\boldsymbol B^*$ 收拢 $$\\boldsymbol M^*=\\begin{pmatrix}|\\boldsymbol B|\\,\\boldsymbol A^*&-\\boldsymbol A^*\\boldsymbol B^*\\\\\\boldsymbol O&|\\boldsymbol A|\\,\\boldsymbol B^*\\end{pmatrix}$$',
      '<b>对照选项</b>：左上 $|\\boldsymbol B|\\boldsymbol A^*$、右下 $|\\boldsymbol A|\\boldsymbol B^*$、右上 $-\\boldsymbol A^*\\boldsymbol B^*$ 三条全对 → <b>选 D</b>；C 的 $-\\boldsymbol B^*\\boldsymbol A^*$ 顺序颠倒，矩阵乘法不可交换',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'主公式', log:'可逆矩阵的伴随等于行列式乘逆矩阵，路线定了', count:0 },
    { cls:'step',  tag:'行列式', log:'分块上三角，行列式等于主对角两块行列式相乘', count:1 },
    { cls:'shift', tag:'求逆',   log:'设逆的分块形状，乘回去逐块对齐解出四个未知块', count:2 },
    { cls:'shift', tag:'写逆',   log:'右上块由 A·Y = −B⁻¹ 解出，是两个逆的乘积带负号', count:3 },
    { cls:'step',  tag:'收伴随', log:'行列式分别乘进各块，用 |A|A⁻¹=A* 收成伴随形式', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：左上 |B|A*、右上 −A*B*、右下 |A|B*，选 D', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '选 D',
    html: '记忆锚点：<b>$\\Bigl(\\begin{smallmatrix}A&E\\\\O&B\\end{smallmatrix}\\Bigr)^*=\\Bigl(\\begin{smallmatrix}|B|A^*&-A^*B^*\\\\O&|A|B^*\\end{smallmatrix}\\Bigr)$</b>——左上标量属 $B$、右下标量属 $A$（交叉分配），右上块保持 $A^*$ 在前。易错：A、B 把标量分配进错块；C 交换了右上块顺序，$\\boldsymbol A^*\\boldsymbol B^*\\neq\\boldsymbol B^*\\boldsymbol A^*$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
