<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：反常积分收敛范围 0&lt;p&lt;2</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '反常积分 $\\displaystyle\\int_0^{+\\infty}\\frac{\\arctan x}{x^p(x+1)}\\,dx$ 收敛，求 $p$ 的范围',
  subtitle: '考点：反常积分敛散 · 双瑕点 · 比较判别法（等价量定阶）',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步检查两个瑕点端。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：瑕点两个——$x\\to0^+$（$x^p$ 在分母）与 $x\\to+\\infty$（无穷区间）。收敛 = <b>两端同时收敛</b>，拆成 $\\int_0^1+\\int_1^{+\\infty}$ 分别判。',
      '<b>端点 $x\\to0^+$</b>：$\\arctan x\\sim x$、$x+1\\to1$ $$f(x)\\sim\\frac{x}{x^p}=\\frac{1}{x^{p-1}}$$ 与 $\\int_0^1\\dfrac{dx}{x^{p-1}}$ 比较：收敛 $\\iff p-1<1\\iff p<2$。',
      '<b>端点 $x\\to+\\infty$</b>：$\\arctan x\\to\\dfrac\\pi2$（有界正数）、$x+1\\sim x$ $$f(x)\\sim\\frac{\\pi/2}{x^{p+1}}$$ 与 $\\int_1^{+\\infty}\\dfrac{dx}{x^{p+1}}$ 比较：收敛 $\\iff p+1>1\\iff p>0$。',
      '<b>取交集</b>：两端同时成立 $$0<p<2.$$', 
      '<b>易错</b>：只查 $\\infty$ 端得 $p>0$（丢上界）；只查 $0$ 端得 $p<2$（丢下界）；分母里 $x^p$ 与 $x+1\\sim x$ 合计 $x^{p+1}$，别少算一个 $x$。',
      '<b>结论</b>：$$p\\in(0,\\ 2)$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'双瑕点：x→0⁺ 与 x→+∞，两端同时收敛才收敛', count:0 },
    { cls:'shift', tag:'零点端', log:'arctan x ~ x，被积函数约等于 1/x^(p−1)，要求 p < 2', count:1 },
    { cls:'shift', tag:'无穷端', log:'arctan x → π/2，被积函数约等于 1/x^(p+1)，要求 p > 0', count:2 },
    { cls:'ok',    tag:'取交集', log:'p < 2 且 p > 0，交集 0 < p < 2', count:3 },
    { cls:'miss',  tag:'易错',   log:'只查一端就作答会漏掉另一个不等式', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：p 的取值范围是 0 < p < 2', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$0<p<2$',
    html: '记忆锚点：<b>双瑕点拆两段分别定阶——零点处 $\\arctan x\\sim x$ 给 $p<2$；无穷处 $\\arctan x\\to\\dfrac\\pi2$、$x+1\\sim x$ 给 $p>0$</b>。收敛取交集，发散任一端即可。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
