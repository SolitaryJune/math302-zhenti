<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018·22 平方和二次型的解与规范形</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：平方和结构是本题的钥匙',
    cls: 'key',
    body: '<p>$f=L_1^{2}+L_2^{2}+L_3^{2}$，其中 $L_1=x_1-x_2+x_3,\\ L_2=x_2+x_3,\\ L_3=x_1+ax_3$。实数平方和为零 $\\iff$ 每个都为零：$$f=0\\iff L_1=L_2=L_3=0\\iff Cx=0,\\quad C=\\begin{pmatrix}1&-1&1\\\\0&1&1\\\\1&0&a\\end{pmatrix}.$$</p>' },
  { title: '算行列式：det C = a − 2',
    cls: '',
    body: '<p>按第一列展开：$\\det C=1\\cdot a+1\\cdot(-2)=a-2$。$a=2$ 是本题唯一的分界点。</p>' },
  { title: '(1) 当 a ≠ 2：只有零解',
    cls: 'good',
    body: '<p>$\\det C\\neq0$，$C$ 可逆，$Cx=0$ 只有零解 $$x=(0,0,0)^{\\mathrm T}.$$</p>' },
  { title: '(1) 当 a = 2：秩降为 2，有非零解',
    cls: 'good',
    body: '<p>$R_3-R_1=(0,1,1)=R_2$，$\\operatorname{rank}C=2$。解 $L_1=L_2=0$：由 $L_2$ 得 $x_2=-x_3$，代入 $L_1$ 得 $x_1=x_2-x_3=-2x_3$，通解 $$x=k\\,(-2,-1,1)^{\\mathrm T}\\quad(\\text{非零解取 } k\\neq0).$$</p>' },
  { title: '(2) 原理：平方和 ⇒ 半正定，p = rank C',
    cls: 'key',
    body: '<p>$f\\ge0$ 恒成立：负惯性指数为 $0$；正惯性指数 $p$ 等于 $L_1,L_2,L_3$ 中线性无关的个数，即 $\\operatorname{rank}C$。规范形 $=y_1^{2}+\\cdots+y_{p}^{2}$。</p>' },
  { title: '(2) 当 a ≠ 2：规范形三项平方',
    cls: 'good',
    body: '<p>$\\operatorname{rank}C=3$，令 $y_1=L_1,\\ y_2=L_2,\\ y_3=L_3$（可逆线性替换）：$$f=y_1^{2}+y_2^{2}+y_3^{2}.$$</p>' },
  { title: '(2) 当 a = 2：L₃ = L₁ + L₂，规范形两项平方',
    cls: 'good',
    body: '<p>$L_1+L_2=(x_1-x_2+x_3)+(x_2+x_3)=x_1+2x_3=L_3$，故 $$f=2L_1^{2}+2L_1L_2+2L_2^{2},$$ 系数矩阵 $\\begin{pmatrix}2&1\\\\1&2\\end{pmatrix}$ 正定（$2>0$，$\\det=3>0$），正惯性指数 $2$：$$f=y_1^{2}+y_2^{2}.$$</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>(1) $a\\neq2$：仅零解；$a=2$：非零解 $k(-2,-1,1)^{\\mathrm T}$。(2) $a\\neq2$：规范形 $y_1^{2}+y_2^{2}+y_3^{2}$；$a=2$：规范形 $y_1^{2}+y_2^{2}$。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title.replace(/[:：].*$/, ''),
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    count: i,
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018·22　$f=(x_1-x_2+x_3)^{2}+(x_2+x_3)^{2}+(x_1+ax_3)^{2}$：求解与规范形',
  subtitle: '考点：二次型 · 方法：平方和化方程组 → 参数讨论秩 → 惯性指数定规范形',
  intro: '点击「▶ 播放」或「下一步」，逐步展开推理链。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '(1) $a=2$ 出非零解 $k(-2,-1,1)^{\\mathrm T}$　(2) 规范形 $y_1^{2}+y_2^{2}+y_3^{2}$ / $y_1^{2}+y_2^{2}$',
    html: '记忆锚点：<b>平方和二次型 $f=0\\iff$ 每个线性式为零；规范形 $=y_1^{2}+\\cdots+y_{r}^{2}$，$r=\\operatorname{rank}C$</b>。易错：不讨论 $a$；把标准形（系数 $2$）当规范形；$L_3=L_1+L_2$ 不验证。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
