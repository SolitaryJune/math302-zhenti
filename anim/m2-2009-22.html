<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009 数二第 22 题 · 解两个非齐次方程组并证线性无关（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2009·22　解 $A\\xi_2=\\xi_1$、$A^2\\xi_3=\\xi_1$，并证 $\\xi_1,\\xi_2,\\xi_3$ 线性无关',
  subtitle: '考点：增广矩阵行变换求通解 · $A^2$ 的秩决定自由元个数 · <b>常值行列式证无关</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，先解两个方程组，再用行列式收尾。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '<b>题目数据：</b>$A=\\begin{pmatrix}1&-1&-1\\\\-1&1&1\\\\0&-4&-2\\end{pmatrix}$，$\\xi_1=\\begin{pmatrix}-1\\\\1\\\\-2\\end{pmatrix}$；两问分别是解 $A\\xi_2=\\xi_1$ 与 $A^2\\xi_3=\\xi_1$',
      '<b>① 解 $\\xi_2$：</b>第 2 行加第 1 行相消、第 3 行除以 $-2$：$$\\left(\\begin{array}{ccc|c}1&-1&-1&-1\\\\-1&1&1&1\\\\0&-4&-2&-2\\end{array}\\right)\\to\\left(\\begin{array}{ccc|c}1&-1&-1&-1\\\\0&2&1&1\\\\0&0&0&0\\end{array}\\right)$$',
      '<b>② 通解 $\\xi_2$：</b>秩为 2，取自由元 $x_3=k_1$：$x_2=\\dfrac{1-k_1}{2}$，$x_1=x_2+x_3-1=\\dfrac{k_1}{2}-\\dfrac12$，即 $\\xi_2=\\begin{pmatrix}\\tfrac12k_1-\\tfrac12\\\\-\\tfrac12k_1+\\tfrac12\\\\k_1\\end{pmatrix}$',
      '<b>③ 先算 $A^2$：</b>$$A^2=\\begin{pmatrix}2&2&0\\\\-2&-2&0\\\\4&4&0\\end{pmatrix}$$ 第三列全为零、秩为 1 $\\Rightarrow$ $\\xi_3$ 的通解含<b>两个</b>自由元',
      '<b>④ 通解 $\\xi_3$：</b>仅剩方程 $2x_1+2x_2=-1$；取 $x_2=k_2,\\ x_3=k_3$，得 $x_1=-k_2-\\dfrac12$，即 $\\xi_3=\\begin{pmatrix}-k_2-\\tfrac12\\\\k_2\\\\k_3\\end{pmatrix}$',
      '<b>⑤ 证无关（第 2 问）：</b>把 $\\xi_1,\\xi_2,\\xi_3$ 按列拼成行列式，第 2 行加第 1 行后第 2 行变为 $\\big(0,\\ 0,\\ -\\tfrac12\\big)$，参数 $k_1,k_2$ 全部消去',
      '<b>⑥ 展开：</b>按第 2 行展开只剩一个二阶行列式：$$\\det=\\tfrac12\\big[-k_1+(k_1-1)\\big]=-\\tfrac12\\neq0$$ 与任意常数取值无关，恒成立'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',     log:'两问都是解非齐次线性方程组，通解要带任意常数', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'消元',     log:'第一个方程组：两行相加消掉重复行，只剩两个有效方程', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'自由元',   log:'取第三个变量为自由元，回代解出前两个变量，通解带一个常数', count:2, ribbon:{k:3, ok:true} },
    { cls:'shift', tag:'平方',     log:'第二个方程组先算矩阵平方：第三列全为零，秩只有一', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'解三',     log:'只剩一个方程，取两个自由元，通解带两个常数', count:4, ribbon:{k:5, ok:true} },
    { cls:'step',  tag:'拼行列式', log:'第二问思路：三个向量按列拼成行列式，行变换消去所有参数', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'展开',     log:'按第二行展开只剩一个二阶行列式，算出恰好负二分之一', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'完成',     log:'结论：行列式恒为负二分之一，与常数取值无关，三向量线性无关', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\det(\\xi_1,\\xi_2,\\xi_3)\\equiv-\\dfrac12\\neq0$',
    html: '通解：$\\xi_2=\\big(\\tfrac12k_1-\\tfrac12,\\ -\\tfrac12k_1+\\tfrac12,\\ k_1\\big)^{\\mathrm T}$（1 个自由元）；$\\xi_3=\\big(-k_2-\\tfrac12,\\ k_2,\\ k_3\\big)^{\\mathrm T}$（2 个自由元，因为 $A^2$ 第三列全零、秩为 1）。记忆锚点：<b>证线性无关 → 算行列式，看它是否与参数无关地非零</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
