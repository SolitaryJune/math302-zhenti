<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009 数二第 16 题 · 分部积分求对数复合函数的不定积分（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2009·16　求 $\\int\\ln\\Big(1+\\sqrt{\\tfrac{1+x}{x}}\\Big)\\,\\mathrm{d}x\\;(x>0)$',
  subtitle: '考点：分部积分「求导掉」对数 · 根式有理化',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，逐步看分部积分与有理化如何接力。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '$$I=\\int\\ln\\Big(1+\\sqrt{\\tfrac{1+x}{x}}\\Big)\\,\\mathrm{d}x\\qquad(x>0)$$',
      '<b>① 分部设置：</b>记 $w=\\sqrt{\\tfrac{1+x}{x}}$，取 $u=\\ln(1+w)$、$\\mathrm{d}v=\\mathrm{d}x$（$v=x$）——目标是把对数「求导掉」',
      "<b>② 先求导：</b>$w'=\\dfrac12\\Big(1+\\tfrac1x\\Big)^{-1/2}\\Big(-\\tfrac1{x^2}\\Big)=-\\dfrac{1}{2x^2w}$，于是 $u'=\\dfrac{w'}{1+w}=-\\dfrac{1}{2x^2w\\,(1+w)}$",
      '<b>③ 分部结果：</b>$$I=x\\ln(1+w)+\\frac12\\int\\frac{\\mathrm{d}x}{x\\,w\\,(1+w)}$$',
      "<b>④ 整理分母：</b>$xw=\\sqrt{x(1+x)}$，$1+w=\\dfrac{\\sqrt x+\\sqrt{1+x}}{\\sqrt x}$，故 $\\dfrac{1}{xw(1+w)}=\\dfrac{1}{\\sqrt{1+x}\\,(\\sqrt x+\\sqrt{1+x})}$",
      "<b>⑤ 有理化：</b>分子分母同乘共轭 $\\sqrt{1+x}-\\sqrt x$，分母变为 $\\sqrt{1+x}\\big[(1+x)-x\\big]=\\sqrt{1+x}$，于是 $\\dfrac{1}{xw(1+w)}=1-\\sqrt{\\dfrac{x}{1+x}}$",
      "<b>⑥ 积出：</b>$\\displaystyle\\int\\sqrt{\\frac{x}{1+x}}\\,\\mathrm{d}x=\\sqrt{x(1+x)}-\\ln\\big(\\sqrt x+\\sqrt{1+x}\\big)+C_0$（求导可验证），故 $\\displaystyle\\int\\frac{\\mathrm{d}x}{xw(1+w)}=x-\\sqrt{x+x^2}+\\ln(\\sqrt x+\\sqrt{1+x})+C_0$",
      '<b>⑦ 合并：</b>$$I=x\\ln\\Big(1+\\sqrt{\\tfrac{1+x}{x}}\\Big)+\\tfrac12\\ln\\big(\\sqrt{1+x}+\\sqrt x\\big)+\\tfrac12x-\\tfrac12\\sqrt{x+x^2}+C$$'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'被积函数是对数套根式，没有现成公式，首选分部积分把对数求导掉', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'分部',   log:'取对数为 u、dx 为 dv，v 就是 x 本身', count:1, ribbon:{k:2, ok:true} },
    { cls:'step',  tag:'求导',   log:'先求根式的导数，再得到对数的导数：分母带着根式乘一加根式', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'落地',   log:'分部公式落地：原积分变成 x 倍对数加上半个新积分', count:3, ribbon:{k:4, ok:true} },
    { cls:'step',  tag:'化简',   log:'整理新积分的分母：x 乘根式恰是根号下 x 乘一加 x', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'有理化', log:'分子分母同乘共轭根式，分母只剩根号下一加 x，被积函数变成 1 减根式', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'积出',   log:'根式积分有现成结论：根号 x(1+x) 减对数，可求导验证', count:6, ribbon:{k:7, ok:true} },
    { cls:'ok',    tag:'合并',   log:'乘二分之一合并四项，得到最终答案', count:7, ribbon:{k:8, ok:true} },
    { cls:'done',  tag:'完成',   log:'结论：不定积分求出，对结果求导可还原被积函数', count:8, ribbon:{k:9, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '含任意常数 $C$ 的原函数已求出',
    html: '$$I=x\\ln\\Big(1+\\sqrt{\\tfrac{1+x}{x}}\\Big)+\\tfrac12\\ln(\\sqrt{1+x}+\\sqrt x)+\\tfrac12x-\\tfrac12\\sqrt{x+x^2}+C$$记忆锚点：对数函数积分<b>先分部把对数求导掉</b>；分母出现 $1+\\sqrt{\\cdot}$ 就<b>乘共轭根式有理化</b>。易错：分部后新积分前的 $\\tfrac12$ 系数漏乘，合并时三项都要带。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
