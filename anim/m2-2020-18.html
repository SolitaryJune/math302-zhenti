<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2020-18 函数方程消元 + 旋转体体积 · 逐步推导</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域 ================== */
var rows = [];

AW.init({
  title: '由 $2f(x)+x^2f\\!\\left(\\frac1x\\right)=\\dfrac{x^2+2x}{\\sqrt{1+x^2}}$ 求 $f(x)$ 与旋转体体积',
  subtitle: '考点：函数方程代换消元 · 定积分应用（柱壳法）',
  counterLabel: '已推进',
  intro: '点击「▶ 播放」：代换联立求 f，再柱壳法算体积。',

  build: function(stage){
    stage.innerHTML = '';
    rows = [];
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label',
      '<b>推导板</b>：$x>0$，代换 $x\\to\\frac1x$ 时 $\\sqrt{1+\\frac1{x^2}}=\\frac{\\sqrt{1+x^2}}x$'));
    var ROWS = [
      '$$2f(x)+x^2f\\!\\left(\\tfrac1x\\right)=\\frac{x^2+2x}{\\sqrt{1+x^2}}\\quad\\xrightarrow{\\ x\\to\\frac1x\\ }\\quad 2f\\!\\left(\\tfrac1x\\right)+\\frac{f(x)}{x^2}=\\frac{1+2x}{x\\sqrt{1+x^2}}$$',
      '$$\\text{式}(2)\\times x^2:\\quad 2x^2f\\!\\left(\\tfrac1x\\right)+f(x)=\\frac{2x^2+x}{\\sqrt{1+x^2}}$$',
      '$$\\text{代入 } x^2f\\!\\left(\\tfrac1x\\right)=\\frac{x^2+2x}{\\sqrt{1+x^2}}-2f(x):\\quad \\frac{2x^2+4x}{\\sqrt{1+x^2}}-3f(x)=\\frac{2x^2+x}{\\sqrt{1+x^2}}\\ \\Rightarrow\\ f(x)=\\frac{x}{\\sqrt{1+x^2}}$$',
      '$$\\text{反解曲线 } x=\\frac{y}{\\sqrt{1-y^2}};\\quad f=\\tfrac12\\Rightarrow x=\\tfrac1{\\sqrt3},\\qquad f=\\tfrac{\\sqrt3}2\\Rightarrow x=\\sqrt3$$',
      '$$V=2\\pi\\int_{1/2}^{\\sqrt3/2} y\\cdot\\frac{y}{\\sqrt{1-y^2}}\\,\\mathrm dy=2\\pi\\int_{1/2}^{\\sqrt3/2}\\frac{y^2}{\\sqrt{1-y^2}}\\,\\mathrm dy$$',
      '$$y=\\sin\\theta:\\quad \\int_{\\pi/6}^{\\pi/3}\\sin^2\\theta\\,\\mathrm d\\theta=\\left[\\frac\\theta2-\\frac{\\sin2\\theta}4\\right]_{\\pi/6}^{\\pi/3}=\\frac\\pi{12}$$',
      '$$V=2\\pi\\cdot\\frac\\pi{12}=\\frac{\\pi^2}6$$'
    ];
    ROWS.forEach(function(html){
      var row = AW.el('div', 'derive-row', html);
      row.style.cssText = 'padding:6px 14px;margin:8px 0;border-radius:8px;' +
        'border-left:4px solid #cbd5e1;background:#f8fafc;opacity:0;' +
        'transform:translateY(8px);transition:all .35s ease;';
      wrap.appendChild(row);
      rows.push(row);
    });
    stage.appendChild(wrap);
  },

  render: function(stage, sn, i){
    rows.forEach(function(row, j){
      var vis = j < i;
      var cur = vis && j === i - 1;
      row.style.opacity = vis ? '1' : '0';
      row.style.transform = vis ? 'translateY(0)' : 'translateY(8px)';
      row.style.borderLeftColor = cur ? '#f59e0b' : (vis ? '#10b981' : '#cbd5e1');
      row.style.background = cur ? '#fffbeb' : (vis ? '#f0fdf4' : '#f8fafc');
    });
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'f(x) 与 f(1/x) 同时出现，代换造第二个方程', count:0 },
    { cls:'step',  tag:'代换', log:'把 x 换成 1/x，根式化成 x 分之根号 1 加 x 平方', count:1 },
    { cls:'step',  tag:'整理', log:'第二个方程两边乘 x 平方，系数摆整齐', count:2 },
    { cls:'ok',    tag:'消元', log:'代入 x 平方 f(1/x) 的表达式，解出 f(x)', count:3 },
    { cls:'step',  tag:'看区域', log:'反解曲线，定出两条水平边对应的 x 范围', count:4 },
    { cls:'step',  tag:'柱壳', log:'绕 x 轴用水平条：2π 乘 y 乘 x(y) 对 y 积分', count:5 },
    { cls:'ok',    tag:'换元', log:'令 y 等于 sinθ，区间变到六分之π到三分之π', count:6 },
    { cls:'done',  tag:'结论', log:'体积 = π²/6，f(x) = x/√(1+x²)', count:7, done:true },
  ],

  result: {
    big: '$f(x)=\\dfrac{x}{\\sqrt{1+x^2}}$，$V=\\dfrac{\\pi^2}6$',
    html: '正确答案：$f(x)=\\dfrac{x}{\\sqrt{1+x^2}}$；旋转体体积 $V=2\\pi\\displaystyle\\int_{1/2}^{\\sqrt3/2}\\dfrac{y^2}{\\sqrt{1-y^2}}\\,\\mathrm dy=\\dfrac{\\pi^2}6$。记忆点：<b>含 $f(\\frac1x)$ 就代换联立</b>；绕 $x$ 轴而区域是横条时，<b>柱壳法一条积分搞定</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
