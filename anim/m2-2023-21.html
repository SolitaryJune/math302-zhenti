<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023·21 泰勒展开 + 介值定理的两问证明</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：武器是泰勒公式',
    cls: 'key',
    body: '<p>条件只有「$f$ 二阶连续可导 + 端点值（极值）」，这指向<b>带拉格朗日余项的泰勒公式</b>：把 $f(\\pm a)$ 在选定的内点展开到二阶，余项里的 $f\'\'(\\xi)$ 正是结论要的量。两问的关键都是<b>选对展开点让一阶项消掉</b>。</p>' },
  { title: '(1) 第 1 式：在 x=0 展开 f(a)',
    cls: '',
    body: '<p>$$f(a)=f(0)+f\'(0)\\,a+\\frac{f\'\'(\\xi_1)}{2}a^2,\\qquad \\xi_1\\in(0,a).$$</p><p>展开点选 $x=0$，因为条件只给了 $f(0)=0$。</p>' },
  { title: '(1) 第 2 式：再展开 f(−a)',
    cls: '',
    body: '<p>$$f(-a)=f(0)-f\'(0)\\,a+\\frac{f\'\'(\\xi_2)}{2}a^2,\\qquad \\xi_2\\in(-a,0).$$</p><p>余项来自 $(0+(-a))^2=a^2$；两个中值点分居 $0$ 两侧。</p>' },
  { title: '(1) 相加：一阶项消光',
    cls: '',
    body: '<p>代入 $f(0)=0$，$\\pm f\'(0)a$ 相消：</p><p>$$f(a)+f(-a)=\\frac{a^2}{2}\\big[f\'\'(\\xi_1)+f\'\'(\\xi_2)\\big].$$</p>' },
  { title: '(1) 介值定理兑现 ξ',
    cls: 'good',
    body: '<p>平均值 $\\dfrac{f\'\'(\\xi_1)+f\'\'(\\xi_2)}{2}$ 介于两点值的最小者与最大者之间；$f\'\'$ 连续 $\\Rightarrow$ 存在 $\\xi$ 介于 $\\xi_1,\\xi_2$ 之间（$\\xi\\in(-a,a)$）使</p><p>$$f\'\'(\\xi)=\\frac{1}{a^2}\\big[f(a)+f(-a)\\big].\\qquad\\blacksquare$$</p>' },
  { title: '(2) 极值点 c 处展开',
    cls: 'key',
    body: '<p>设 $f$ 在 $c\\in(-a,a)$ 取极值，<b>费马定理</b>给 $f\'(c)=0$。在 $c$ 处展开两端点：</p><p>$$f(a)=f(c)+\\frac{f\'\'(\\xi_1)}{2}(a-c)^2,\\qquad f(-a)=f(c)+\\frac{f\'\'(\\xi_2)}{2}(a+c)^2,$$</p><p>$\\xi_1$ 介于 $c,a$ 之间，$\\xi_2$ 介于 $-a,c$ 之间。</p>' },
  { title: '(2) 作差消 f(c) 并取绝对值',
    cls: '',
    body: '<p>$$f(a)-f(-a)=\\frac{f\'\'(\\xi_1)}{2}(a-c)^2-\\frac{f\'\'(\\xi_2)}{2}(a+c)^2.$$</p><p>记 $M=\\max\\{\\lvert f\'\'(\\xi_1)\\rvert,\\ \\lvert f\'\'(\\xi_2)\\rvert\\}=\\lvert f\'\'(\\eta)\\rvert$（$\\lvert f\'\'\\rvert$ 连续，最大值可达）。</p>' },
  { title: '(2) 放缩并控制二次因子',
    cls: '',
    body: '<p>$$\\lvert f(a)-f(-a)\\rvert\\le\\frac{M}{2}\\big[(a-c)^2+(a+c)^2\\big]=\\frac{M}{2}(2a^2+2c^2)\\le\\frac{M}{2}\\cdot4a^2=2a^2M.$$</p><p>末步用 $\\lvert c\\rvert<a\\Rightarrow c^2<a^2$。</p>' },
  { title: '结论：两问证毕',
    cls: 'good',
    body: '<p>由 $2a^2M=2a^2\\lvert f\'\'(\\eta)\\rvert\\ge\\lvert f(a)-f(-a)\\rvert$ 得 $\\lvert f\'\'(\\eta)\\rvert\\ge\\dfrac{1}{2a^2}\\lvert f(a)-f(-a)\\rvert$，证毕。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2023·21　泰勒展开 + 介值定理的两问证明',
  subtitle: '考点：带拉格朗日余项的泰勒公式 · 费马定理 · 介值定理 · 放缩',
  intro: '点击「▶ 播放」逐步展开证明推理链：(1) 在 x=0 展开，(2) 在极值点展开。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: "$f''(\\xi)=\\frac{f(a)+f(-a)}{a^2},\\qquad \\lvert f''(\\eta)\\rvert\\ge\\frac{\\lvert f(a)-f(-a)\\rvert}{2a^2}$",
    html: "两问同一套路：<b>带拉格朗日余项的泰勒公式选对展开点，让一阶项消光</b>——(1) 在 $x=0$（用 $f(0)=0$），(2) 在极值点 $c$（用费马定理 $f'(c)=0$）；收尾都靠 $f\'\'$ 连续：(1) 介值定理取平均，(2) 最大值点放缩并卡 $2a^2+2c^2\\le4a^2$。易错：展开点选错；忘写余项中值点所在区间；$\\eta$ 的存在性漏证；二次因子放缩方向弄反。",
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
