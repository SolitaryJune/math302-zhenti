<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：曲线 y=∫√(3−t²)dt 的弧长</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '曲线 $y=\\displaystyle\\int_{-\\sqrt3}^{x}\\sqrt{3-t^2}\\,\\mathrm dt$ 的弧长',
  subtitle: '考点：变限积分 + 弧长公式 · 方法：$y\'$ 白送 → 化成 $\\sqrt{4-x^2}$ 的积分',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示弧长的计算与几何自检。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：变限积分给出的曲线，用弧长公式 $$L=\\int_a^b\\sqrt{1+(y\')^2}\\,\\mathrm dx$$ 变限积分求导白送：$y\'=\\sqrt{3-x^2}$（下限是常数）',
      '<b>定积分限</b>：被积函数要有意义：$3-x^2\\ge0\\Rightarrow x\\in[-\\sqrt3,\\sqrt3]$——这就是曲线的定义域',
      '<b>代入化简</b>：$$L=\\int_{-\\sqrt3}^{\\sqrt3}\\sqrt{1+3-x^2}\\,\\mathrm dx=\\int_{-\\sqrt3}^{\\sqrt3}\\sqrt{4-x^2}\\,\\mathrm dx$$ 偶函数：$L=2\\displaystyle\\int_0^{\\sqrt3}\\sqrt{4-x^2}\\,\\mathrm dx$',
      '<b>算积分</b>：套公式 $\\displaystyle\\int\\sqrt{4-x^2}\\,\\mathrm dx=\\frac x2\\sqrt{4-x^2}+2\\arcsin\\frac x2$（或令 $x=2\\sin\\theta$）：$$\\int_0^{\\sqrt3}\\sqrt{4-x^2}\\,\\mathrm dx=\\frac{\\sqrt3}2+\\frac{2\\pi}3$$',
      '<b>收尾</b>：$$L=2\\Bigl(\\frac{\\sqrt3}2+\\frac{2\\pi}3\\Bigr)=\\sqrt3+\\frac{4\\pi}3$$',
      '<b>几何自检</b>：$\\sqrt{4-x^2}$ 是半径 2 的上半圆，弓形面积 $=$ 圆心角 $\\frac{2\\pi}3$ 的扇形 $\\frac12\\cdot4\\cdot\\frac{2\\pi}3=\\frac{4\\pi}3$，加两块直角三角形 $2\\cdot\\frac{\\sqrt3}2=\\sqrt3$，一致 ✓',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'求导',   log:'变限积分求导，导数就是根号里的被积函数', count:0 },
    { cls:'step',  tag:'定限',   log:'根号内不能为负，曲线只在 ±√3 之间有定义', count:1 },
    { cls:'shift', tag:'化简',   log:'1 加 3 得 4，被积函数变成半径 2 的半圆弧高', count:2 },
    { cls:'shift', tag:'积分',   log:'套现成公式，√3 处代出半个 √3 加 2π/3', count:3 },
    { cls:'step',  tag:'收尾',   log:'偶函数乘 2，得 √3 + 4π/3', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：弧长 = √3 + 4π/3，扇形加三角形几何验证一致', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$L=\\dfrac{4\\pi}{3}+\\sqrt3$',
    html: '记忆锚点：<b>变限积分给曲线，$y\'=$ 被积函数（上限代 $x$）</b>；弧长公式是 $\\sqrt{1+(y\')^2}$ 不是 $\\sqrt{(y\')^2}$。易错：积分限由「被积函数有意义」定在 $[-\\sqrt3,\\sqrt3]$；$\\arcsin\\frac{\\sqrt3}2=\\frac\\pi3$ 不是 $\\frac\\pi4$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
