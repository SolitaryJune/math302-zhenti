<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：带绝对值的差商极限能否推出可导</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：分母趋零逼分子趋零',
    cls: 'key',
    log: '差商分母 x→0，极限存在 ⇒ 分子→0，先定 f(0)=c 的符号再脱绝对值',
    body: '<p>$f$ 在 $0$ 连续，记 $f(0)=c$。四个条件都是「分母 $x\\to0$ 的分式极限存在」，故<b>分子必须趋零</b>，由此逼出 $c$ 的符号信息，再把绝对值脱掉、归结到标准差商 $\\dfrac{f(x)-f(0)}{x}$。</p>' },
  { title: '条件 (1)：分子 |f|−f(0) 趋零 ⇒ c≥0',
    cls: 'good',
    log: '|c|=c ⇒ c≥0；c>0 直接脱绝对值，c=0 夹逼出 f′(0)=0',
    ribbon: {k:1, ok:true},
    body: '<p>$\\lvert c\\rvert=c\\Rightarrow c\\ge0$。$c>0$ 时邻域内 $f>0$，原式即 $\\dfrac{f(x)-f(0)}{x}$，$f\'(0)$ 存在；$c=0$ 时原式 $=\\dfrac{\\lvert f(x)\\rvert}{x}$，右侧商 $\\ge0$、左侧商 $\\le0$，夹逼得极限 $=0$，故 $\\dfrac{f(x)}{x}\\to0$，$f\'(0)=0$ 存在 ✓。</p>' },
  { title: '条件 (2)：分子 f−|f(0)| 趋零 ⇒ c=|c|',
    cls: 'good',
    log: 'c=|c| ⇒ c≥0，此时 |f(0)|=f(0)，原式就是标准差商',
    ribbon: {k:2, ok:true},
    body: '<p>$c-\\lvert c\\rvert=0\\Rightarrow c\\ge0$，于是 $\\lvert f(0)\\rvert=c=f(0)$，原式恰为 $\\dfrac{f(x)-f(0)}{x}$，极限存在即 $f\'(0)$ 存在 ✓。</p>' },
  { title: '条件 (3)：|f|/x 存在 ⇒ 强制 f(0)=0',
    cls: 'good',
    log: '|c|=0 ⇒ c=0；同 (1) 左右夹逼，f′(0)=0 存在',
    ribbon: {k:3, ok:true},
    body: '<p>分子 $\\lvert f(x)\\rvert\\to\\lvert c\\rvert$ 必须趋零，得 $c=0$。原式即 $\\dfrac{\\lvert f(x)\\rvert}{x}$，由 (1) 的 $c=0$ 情形：右侧 $\\ge0$、左侧 $\\le0$，极限只能为 $0$，于是 $f\'(0)=0$ 存在 ✓。</p>' },
  { title: '条件 (4)：|f|−|f(0)| 趋零，分 c≠0 与 c=0',
    cls: 'good',
    log: 'c≠0 时 |f|=±f 脱绝对值，f′(0)=±B；c=0 时同 (3)',
    ribbon: {k:4, ok:true},
    body: '<p>记极限为 $B$。$c\\ne0$ 时邻域内 $f$ 与 $c$ 同号，$\\lvert f(x)\\rvert=\\operatorname{sgn}(c)f(x)$，原式 $=\\operatorname{sgn}(c)\\cdot\\dfrac{f(x)-f(0)}{x}$，故 $f\'(0)=\\operatorname{sgn}(c)\\,B$ 存在；$c=0$ 时同 (3) 夹逼得 $f\'(0)=0$ ✓。</p>' },
  { title: '结论',
    cls: 'good',
    log: '四条全部能推出 f 在 x=0 可导，个数为 4，选 D',
    body: '<p>四条殊途同归都能脱掉绝对值、归结到 $f\'(0)$ 的定义，个数 $=4$，答案选 <b>D</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '四个带绝对值的差商条件：几个能保证 $f\'(0)$ 存在',
  subtitle: '考点：导数定义 · 分母趋零逼分子趋零 · 脱绝对值的分类讨论',
  counterLabel: '检验步',
  ribbonTitle: '条件裁决（✓ 可推出 / ✗ 不能推出）',
  intro: '点击「▶ 播放」逐条检验 (1)–(4)。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 D（4 个条件全部可以）',
    html: '记忆锚点：<b>「分母趋零 ⇒ 分子趋零」是入口：先逼出 $\\lvert c\\rvert=c$ 或 $c=0$，再脱绝对值</b>。$c=0$ 的临界情形别漏：$\\dfrac{\\lvert f(x)\\rvert}{x}$ 被左右两侧 $\\ge0$ 与 $\\le0$ 夹逼成 $0$，照样给出 $f\'(0)=0$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
