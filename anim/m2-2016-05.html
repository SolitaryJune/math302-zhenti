<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2016·05 公切线与曲率：比较两曲线高低</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：公切 + 曲率大者更低',
    cls: 'key',
    tag: '审题',
    body: '<p>两条曲线在 $(x_0,y_0)$ 有公切线 $y=g(x)$：$f_i(x_0)=g(x_0)$、$f_i\'(x_0)=g\'(x_0)$（$i=1,2$）。已知 $f_i\'\'(x_0)<0$ 且 $\\kappa_1>\\kappa_2$。目标：比出 $f_1,\\ f_2,\\ g$ 在 $x_0$ 邻域的高低。</p>',
    log: '公切点处函数值与一阶导全部相同' },
  { title: '曲率公式约去分母',
    cls: 'step',
    tag: '化简',
    body: '<p>$\\kappa_i=\\dfrac{\\lvert f_i\'\'(x_0)\\rvert}{\\big(1+f_i\'(x_0)^2\\big)^{3/2}}$。切点处 $f_1\'(x_0)=f_2\'(x_0)$，<b>分母相同</b>，故 $\\kappa_1>\\kappa_2\\iff\\lvert f_1\'\'(x_0)\\rvert>\\lvert f_2\'\'(x_0)\\rvert$。</p>',
    log: '一阶导相同 ⇒ 曲率只比 |f″| 的大小' },
  { title: '翻译成 f″ 的不等式',
    cls: 'key',
    tag: '关键',
    body: '<p>两条曲线都上凸：$f_i\'\'(x_0)<0$，$\\lvert f_i\'\'\\rvert=-f_i\'\'$。于是 $$f_1\'\'(x_0)<f_2\'\'(x_0)<0.$$ 曲率大者二阶导<b>更负</b>——弯向下方更狠。</p>',
    log: 'κ₁>κ₂ 且同为凸 ⇒ f₁″ < f₂″ < 0' },
  { title: '曲线减切线：二阶泰勒估计',
    cls: 'step',
    tag: '定高低',
    body: '<p>令 $\\varphi_i=f_i-g$：$\\varphi_i(x_0)=\\varphi_i\'(x_0)=0$，$\\varphi_i\'\'=f_i\'\'$。泰勒展开 $$\\varphi_i(x)=\\frac12 f_i\'\'(x_0)(x-x_0)^2+o\\big((x-x_0)^2\\big)<0,$$ 两曲线在切点附近都在<b>公切线下方</b>——$g$ 是共同上界。</p>',
    log: '上凸曲线都弯到切线下方，g 是上界' },
  { title: 'f₁ 与 f₂ 谁更低',
    cls: 'good',
    tag: '对比',
    body: '<p>$\\varphi_1-\\varphi_2=f_1-f_2$，其主导项为 $\\frac12\\big(f_1\'\'-f_2\'\'\\big)(x-x_0)^2<0$，故 $f_1(x)<f_2(x)$：曲率大的 $f_1$ 压在更下面。合并得 $$f_1(x)\\le f_2(x)\\le g(x).$$</p>',
    log: 'f₁″ 更负 ⇒ f₁ 在 f₂ 下方 ⇒ f₁ ≤ f₂ ≤ g' },
  { title: '干扰项复盘',
    cls: 'bad',
    tag: '防坑',
    body: '<p><b>B</b>：把曲率大者放上面，颠倒了。<b>C/D</b>：让 $g$ 夹在两曲线之间——上凸曲线整体在切线下方，$g$ 不可能居中。</p>',
    log: 'B 上下颠倒；C/D 切线位置错' },
  { title: '结论',
    cls: 'good',
    tag: '完成',
    body: '<p>答案选 <b>A</b>。记忆锚点：<b>凸曲线弯在切线下，曲率大者弯得更低</b>——$f_1\'\'<f_2\'\'<0$ 直接排出 $f_1\\le f_2\\le g$。</p>',
    log: '选 A：f₁ ≤ f₂ ≤ g' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.log || s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '公切条件下由曲率比较 $f_1,\\ f_2$ 与公切线 $g$ 的高低',
  subtitle: '考点：曲率公式 · 凸性与切线 · 方法：约分母 → 比 $f\'\'$ → 二阶泰勒定位',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 A（f₁ ≤ f₂ ≤ g）',
    html: '记忆锚点：<b>两条推理一气呵成</b>——① 同分母下 $\\kappa_1>\\kappa_2\\Rightarrow f_1\'\'(x_0)<f_2\'\'(x_0)<0$；② $f_i-g\\approx\\frac12 f_i\'\'(x_0)(x-x_0)^2<0$，凸曲线都在切线下方，且 $f_1\'\'$ 更负者在最下。干扰项专攻「曲率与凹向配错」「切线夹中间」。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
