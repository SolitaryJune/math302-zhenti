<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：无穷限反常积分 3π/8（2014 年第 9 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '审题与定型',
    body: '<p>$$\\int_{-\\infty}^{1}\\frac{\\mathrm{d}x}{x^{2}+2x+5}$$</p><p>无穷限反常积分：下限按<b>极限</b>处理；分母先配方。</p>' },
  { cls: '', title: '配方',
    body: '<p>$$x^{2}+2x+5=(x+1)^{2}+4=(x+1)^{2}+2^{2}.$$</p><p>标准 $\\dfrac{1}{u^{2}+a^{2}}$ 型，$a=2$。</p>' },
  { cls: '', title: '写出原函数',
    body: '<p>$$\\int\\frac{\\mathrm{d}x}{(x+1)^{2}+4}=\\frac{1}{2}\\arctan\\frac{x+1}{2}+C.$$</p><p>系数 $\\dfrac12=\\dfrac1a$ 别丢。</p>' },
  { cls: 'step', title: '代上限 $x=1$',
    body: '<p>$$\\frac12\\arctan1=\\frac12\\cdot\\frac{\\pi}{4}=\\frac{\\pi}{8}.$$</p>' },
  { cls: 'step', title: '下限取极限 $x\\to-\\infty$',
    body: '<p>$\\dfrac{x+1}{2}\\to-\\infty$，$\\arctan\\to-\\dfrac{\\pi}{2}$：</p>' +
          '<p>$$\\frac12\\cdot\\Big(-\\frac{\\pi}{2}\\Big)=-\\frac{\\pi}{4}.$$</p>' },
  { cls: 'good', title: '相减收口',
    body: '<p>$$\\frac{\\pi}{8}-\\Big(-\\frac{\\pi}{4}\\Big)=\\frac{\\pi}{8}+\\frac{2\\pi}{8}=\\frac{3\\pi}{8}.$$</p>' },
];

AW.init({
  title: '【2014 数二·9】$\\int_{-\\infty}^{1}\\dfrac{\\mathrm dx}{x^{2}+2x+5}$',
  subtitle: '考点：反常积分 · 方法：配方 + 反正切原函数',
  counterLabel: '已执行',
  ribbonTitle: '关键节点',
  intro: '点击「▶ 播放」逐步演示计算。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一张卡'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'下限是无穷，反常积分按极限算；分母先配方', count:0 },
    { cls:'step',  tag:'配方', log:'分母 = (x+1)² + 4，是 u²+a² 型', count:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'原函数', log:'原函数是 1/2 乘 arctan((x+1)/2)，系数 1/2 来自 a=2', count:2 },
    { cls:'step',  tag:'上限', log:'x=1 处 arctan 1 = π/4，得 π/8', count:3 },
    { cls:'step',  tag:'下限', log:'x 趋于负无穷，arctan 趋于 −π/2，得 −π/4', count:4, ribbon:{k:2, ok:true} },
    { cls:'done',  tag:'完成', log:'π/8 − (−π/4) = 3π/8', count:5, ribbon:{k:3, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 3π/8',
    html: '记忆锚点：<b>$\\displaystyle\\int\\frac{\\mathrm du}{u^{2}+a^{2}}=\\frac1a\\arctan\\frac ua+C$</b>，且 $\\arctan(\\pm\\infty)=\\pm\\dfrac{\\pi}{2}$。易错：漏系数 $\\dfrac12$ 得 $\\dfrac{3\\pi}{4}$；下限极限当成 $0$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
