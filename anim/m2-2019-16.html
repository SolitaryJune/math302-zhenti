<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019·16 部分分式分解求不定积分</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [
  "$$\\int\\frac{3x+6}{(x-1)^2\\left(x^2+x+1\\right)}\\,\\mathrm{d}x\\qquad\\text{真分式}\\ \\text{（二重实根因子}\\times\\text{不可约二次因子）}$$",
  "<b>① 设部分分式：</b>$\\dfrac{3x+6}{(x-1)^2(x^2+x+1)}=\\dfrac{A}{x-1}+\\dfrac{B}{(x-1)^2}+\\dfrac{Cx+D}{x^2+x+1}$（二重根设两项；$\\Delta=1-4<0$，二次因子分子设一次式）",
  "<b>② 去分母：</b>$3x+6=A(x-1)(x^2+x+1)+B(x^2+x+1)+(Cx+D)(x-1)^2$，利用 $(x-1)(x^2+x+1)=x^3-1$",
  "<b>③ 赋值 $x=1$：</b>$9=3B\\Rightarrow B=3$——特殊值先行，最快的系数到手",
  "<b>④ 比较系数：</b>$x^3$：$A+C=0$；$x^2$：$3+D-2C=0$；$x^1$：$3+C-2D=3\\Rightarrow C=2D$；联立解得 $C=2,\\ D=1,\\ A=-2$（校验 $x^0$：$2+3+1=6$ ✓）",
  "<b>⑤ 分解成形：</b>$$\\frac{3x+6}{(x-1)^2(x^2+x+1)}=\\frac{-2}{x-1}+\\frac{3}{(x-1)^2}+\\frac{2x+1}{x^2+x+1}$$",
  "<b>⑥ 逐项积分：</b>前两项出 $-2\\ln\\lvert x-1\\rvert$ 与 $-\\dfrac{3}{x-1}$；第三项分子 $2x+1$ 恰是分母的导数 → $\\ln\\left(x^2+x+1\\right)$，且分母 $=\\left(x+\\tfrac12\\right)^2+\\tfrac34>0$ 恒正，无需绝对值、出不了 $\\arctan$ 项",
  "<b>⑦ 合并：</b>$$\\int\\frac{3x+6}{(x-1)^2\\left(x^2+x+1\\right)}\\,\\mathrm{d}x=-2\\ln\\lvert x-1\\rvert+\\ln\\left(x^2+x+1\\right)-\\frac{3}{x-1}+C$$"
];

AW.init({
  title: '2019·16　求 $\\displaystyle\\int\\frac{3x+6}{(x-1)^2\\left(x^2+x+1\\right)}\\,\\mathrm{d}x$',
  subtitle: '考点：有理函数积分 · 部分分式分解（赋值法 + 比较系数）',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看真分式如何被拆成三块再逐块积出。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    this._rows = [];
    for (var i = 0; i < ROWS.length; i++){
      var r = AW.el('div', 'aw-stepcard', ROWS[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'真分式分解定型：分母是二重实根因子乘不可约二次因子', count:0, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'设式',   log:'按因子类型设四个待定系数，二重根要占两项', count:1, ribbon:{k:2, ok:true} },
    { cls:'shift', tag:'去分母', log:'两边乘最简公分母，化成多项式恒等式', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'赋值',   log:'令 x 等于一，立得 B 等于三', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'比系数', log:'比较各次幂系数并联立，解出全部待定数', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'成形',   log:'部分分式分解完成，三项各管一段', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'积分',   log:'三项分别积出对数、幂函数与对数，第三项分子恰为分母导数', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'完成',   log:'结论：合并三项并补上积分常数 C', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: "$-2\\ln\\lvert x-1\\rvert+\\ln\\left(x^2+x+1\\right)-\\dfrac{3}{x-1}+C$",
    html: "记忆锚点：<b>二重根设两项、二次因子分子设一次式；先赋特殊值再比系数</b>。易错：漏设 $\\dfrac{B}{(x-1)^2}$；见到二次因子就硬凑 $\\arctan$（先看分子是否恰为分母导数）；结果忘写 $+C$。",
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
