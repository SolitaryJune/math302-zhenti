<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画：变限积分无穷小阶数比较</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：一条通用的阶数公式',
    cls: 'key',
    log: '积分让被积函数的阶加 1，再乘上限的阶',
    body: '<p>若 $t\\to0^+$ 时 $f(t)\\sim Ct^{\\alpha}$（$\\alpha>-1$），上限 $u(x)\\to0$，则 $$\\int_0^{u(x)}f(t)\\,\\mathrm{d}t\\sim\\frac{C}{\\alpha+1}\\,[u(x)]^{\\alpha+1}.$$ 口诀：<b>积分升 1 阶，再乘上限的阶</b>。「最高阶无穷小」＝阶数最大（趋于零最快）的那个。</p>' },
  { title: 'A 项：$\\int_0^x(e^{t^2}-1)\\,\\mathrm{d}t$',
    cls: 'step',
    log: 'A：被积 2 阶 × 上限 1 阶 → 3 阶',
    ribbon: {k:1, ok:false},
    body: '<p>被积 $e^{t^2}-1\\sim t^2$ 是 $2$ 阶，上限 $x$ 是 $1$ 阶：阶 $=2+1=3$，即 $\\displaystyle\\int_0^x(e^{t^2}-1)\\,\\mathrm{d}t\\sim\\frac{x^3}{3}$。<b>3 阶</b>。</p>' },
  { title: 'B 项：$\\int_0^x\\ln\\left(1+\\sqrt{t^3}\\right)\\,\\mathrm{d}t$',
    cls: 'step',
    log: 'B：被积 3/2 阶 × 上限 1 阶 → 5/2 阶，最低',
    ribbon: {k:2, ok:false},
    body: '<p>$\\sqrt{t^3}=t^{3/2}$，故 $\\ln\\left(1+\\sqrt{t^3}\\right)\\sim t^{3/2}$ 是 $\\frac32$ 阶，上限 $x$ 是 $1$ 阶：阶 $=\\frac32+1=\\frac52$，即 $\\sim\\frac25x^{5/2}$。<b>四者中最低阶</b>。</p>' },
  { title: 'C 项：$\\int_0^{\\sin x}\\sin t^2\\,\\mathrm{d}t$',
    cls: 'step',
    log: 'C：换上限 sin x 不改阶，仍是 3 阶',
    ribbon: {k:3, ok:false},
    body: '<p>被积 $\\sin t^2\\sim t^2$ 是 $2$ 阶；上限 $\\sin x\\sim x$ 仍是 $1$ 阶：阶 $=3$，$\\sim\\frac{(\\sin x)^3}{3}\\sim\\frac{x^3}{3}$。<b>与 A 同阶</b>。</p>' },
  { title: 'D 项：$\\int_0^{1-\\cos x}\\sqrt{\\sin^3t}\\,\\mathrm{d}t$',
    cls: 'good',
    log: 'D：被积 3/2 阶 × 上限 2 阶 → 5 阶，最高',
    ribbon: {k:4, ok:true},
    body: '<p>被积 $\\sqrt{\\sin^3t}=(\\sin t)^{3/2}\\sim t^{3/2}$ 是 $\\frac32$ 阶；<b>上限 $1-\\cos x\\sim\\frac{x^2}{2}$ 本身是 $2$ 阶无穷小</b>。阶 $=\\left(\\frac32+1\\right)\\times2=5$：$\\sim\\frac25\\left(\\frac{x^2}{2}\\right)^{5/2}$，是 $x^5$ 量级。</p>' },
  { title: '排序：B &lt; A = C &lt; D',
    cls: 'good',
    log: 'B(5/2) < A=C(3) < D(5)，D 最高阶',
    body: '<p>阶数排序：$$B\\left(\\tfrac52\\right)<A=C\\,(3)<D\\,(5).$$ D 趋于零最快，是最高阶无穷小，答案选 <b>D</b>。</p>' },
  { title: '结论',
    cls: 'good',
    log: '选 D：唯一达到 5 阶的选项',
    body: '<p>答案 <b>D</b>。记忆锚点：上限是几阶无穷小，就把「被积阶 + 1」再乘上去；<b>$1-\\cos x$ 的 2 阶</b>是 D 胜出的关键。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '比较四个变限积分的无穷小阶数（$x\\to0^+$）',
  subtitle: '考点：变限积分 · 等价无穷小定阶 · 方法：积分升 1 阶再乘上限的阶',
  counterLabel: '推理步',
  ribbonTitle: '选项判定（✓ 最高阶 / ✗ 非最高）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 D（5 阶无穷小）',
    html: '记忆锚点：<b>积分阶 =（被积阶 + 1）× 上限阶</b>。A、C 都是 3 阶，B 是 $\\frac52$ 阶，只有 D：$\\left(\\frac32+1\\right)\\times2=5$ 阶。易错：$1-\\cos x\\sim\\frac{x^2}{2}$ 这层「上限也是无穷小」最容易被忽略。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
