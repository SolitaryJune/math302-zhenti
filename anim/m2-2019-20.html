<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2019·20 指数变换消去一阶偏导项</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [
  "$$2u_{xx}-2u_{yy}+3u_x+3u_y=0,\\qquad u=v\\,\\mathrm{e}^{ax+by}\\qquad\\text{目标：}\\ v_x,\\,v_y\\ \\text{的系数同时为零}$$",
  "<b>① 一阶偏导：</b>$u_x=\\mathrm{e}^{ax+by}\\left(v_x+av\\right)$，$u_y=\\mathrm{e}^{ax+by}\\left(v_y+bv\\right)$——对 $x$ 每求导一次掉出一个 $a$，对 $y$ 掉出 $b$",
  "<b>② 二阶偏导：</b>$u_{xx}=\\mathrm{e}^{ax+by}\\left(v_{xx}+2av_x+a^2v\\right)$，$u_{yy}=\\mathrm{e}^{ax+by}\\left(v_{yy}+2bv_y+b^2v\\right)$",
  "<b>③ 代入并约去 $\\mathrm{e}^{ax+by}\\ne0$：</b>原方程两边同除以指数因子，按 $v_{xx},\\ v_{yy},\\ v_x,\\ v_y,\\ v$ 归类",
  "<b>④ 归类结果：</b>$$2v_{xx}-2v_{yy}+(4a+3)\\,v_x+(-4b+3)\\,v_y+\\left(2a^2-2b^2+3a+3b\\right)v=0$$",
  "<b>⑤ 令一阶项系数为零：</b>$4a+3=0$，$-4b+3=0$——$v_x$ 只跟 $a$ 有关、$v_y$ 只跟 $b$ 有关，两个方程互不纠缠",
  "<b>⑥ 解得：</b>$$a=-\\frac34,\\qquad b=\\frac34$$",
  "<b>⑦ 回代验证：</b>此时 $v$ 的系数 $2a^2-2b^2+3a+3b=0$，方程化为 $2v_{xx}-2v_{yy}=0$——确实不含任何一阶偏导数"
];

AW.init({
  title: '2019·20　取 $a,b$ 使变换 $u=v\\,\\mathrm{e}^{ax+by}$ 消去一阶偏导',
  subtitle: '考点：复合函数高阶偏导 · 乘积法则链式法则 · 待定系数归类',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，逐阶求偏导、归类系数、令一阶项消失。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    this._rows = [];
    for (var i = 0; i < ROWS.length; i++){
      var r = AW.el('div', 'aw-stepcard', ROWS[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'带指数因子的换元，目标是让新方程不含一阶偏导', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'一阶',   log:'一阶偏导各多出一项：v 加 a 倍 v、v 加 b 倍 v', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'二阶',   log:'二阶偏导三项结构：v 双导、二 a 乘 v 一阶导、a 平方乘 v', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'代入',   log:'代入原方程并约去指数因子，指数不为零可整体消去', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'归类',   log:'按五类导数项归拢，一阶项系数是四 a 加三与负四 b 加三', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'令零',   log:'两个一阶系数同时为零，得到两个独立方程', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'求解',   log:'解得 a 等于负四分之三，b 等于四分之三', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'完成',   log:'结论：回代后方程化为二 v 双导 x 减二 v 双导 y 等于零', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: "$a=-\\dfrac34,\\qquad b=\\dfrac34$",
    html: "记忆锚点：<b>对 $x$ 每求导一次掉出一个 $a$、对 $y$ 掉出 $b$；二阶导必成三件套 $v_{xx}+2av_x+a^2v$</b>。易错：漏掉 $2av_x$ 交叉项；误令 $v$ 的系数也为零；忘约去 $\\mathrm{e}^{ax+by}$。",
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
