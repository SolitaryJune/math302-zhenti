<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·15 泰勒展开求 a 与同阶常数 k</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  '<p><b>审题</b>：$f(x)=\\dfrac{1+x}{\\sin x}-\\dfrac{1}{x}$，$a=\\lim_{x\\to 0}f(x)$。两项各自趋于无穷，属 $\\infty-\\infty$ 型，不能拆成两个极限相减，先通分聚成一只分式。</p>',
  '<p><b>通分</b>：$$f(x)=\\frac{(1+x)x-\\sin x}{x\\sin x}=\\frac{x+x^2-\\sin x}{x\\sin x}.$$</p>',
  '<p><b>泰勒展开</b>：$\\sin x=x-\\dfrac{x^3}{6}+o(x^3)$，故分子 $x+x^2-\\sin x=x^2+\\dfrac{x^3}{6}+o(x^3)$，分母 $x\\sin x=x^2+o(x^2)$。</p>',
  '<p><b>求 $a$</b>：$$a=\\lim_{x\\to 0}\\frac{x^2+\\frac{x^3}{6}+o(x^3)}{x^2+o(x^2)}=\\lim_{x\\to 0}\\frac{1+\\frac{x}{6}+o(x)}{1+o(1)}=1.$$</p>',
  '<p><b>转向 (2)</b>：同阶常数 = 找 $f(x)-a$ 的最低次幂。$$f(x)-1=\\frac{x+x^2-\\sin x-x\\sin x}{x\\sin x}.$$</p>',
  '<p><b>分子再展一层</b>：$x\\sin x=x^2-\\dfrac{x^4}{6}+o(x^4)$，于是分子 $=x+x^2-\\Big(x-\\dfrac{x^3}{6}+o(x^3)\\Big)-\\Big(x^2-\\dfrac{x^4}{6}+o(x^4)\\Big)=\\dfrac{x^3}{6}+o(x^3)$。</p>',
  '<p><b>相除定阶</b>：$$f(x)-1=\\frac{\\frac{x^3}{6}+o(x^3)}{x^2+o(x^2)}=\\frac{x}{6}+o(x),$$即 $f(x)-a\\sim\\dfrac{x}{6}$（$x\\to 0$）。</p>',
  '<p><b>定 $k$</b>：与 $x^k$ 同阶，即 $\\lim_{x\\to 0}\\dfrac{f(x)-a}{x^k}=c\\neq 0$ 存在。首项是 $\\dfrac{x}{6}$，一次幂，故 $k=1$。</p>',
  '<p><b>结论</b>：$$a=1,\\qquad k=1.$$</p>',
];

AW.init({
  title: '$f(x)=\\dfrac{1+x}{\\sin x}-\\dfrac{1}{x}$：求 $a$，再定同阶常数 $k$',
  subtitle: '考点：$\\infty-\\infty$ 型极限 · 泰勒展开比阶 · 同阶无穷小定幂次',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示通分、展开、比阶的全过程。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',   log:'无穷减无穷型，两项不能各自拆，先通分合并', show:1, count:0 },
    { cls:'step',  tag:'通分',   log:'通分后分子是 x 加 x 平方减 sin x，分母是 x sin x', show:2, count:1 },
    { cls:'step',  tag:'展开',   log:'sin x 展开到三次项，分子分母同除 x 平方比阶', show:3, count:2 },
    { cls:'ok',    tag:'求 a',   log:'一次项留痕、高阶归零，极限为 1，得 a=1', show:4, count:3 },
    { cls:'shift', tag:'转向',   log:'第二问改为挖 f(x) 减 a 的最低次幂，先写成通分形式', show:5, count:4 },
    { cls:'step',  tag:'细展',   log:'x sin x 里的四次项这次要留着，分子首项是 x 的三次方系数六分之一', show:6, count:5 },
    { cls:'ok',    tag:'比阶',   log:'分子除以分母，得到 x/6 加高阶小量，首项是一次幂', show:7, count:6 },
    { cls:'ok',    tag:'定 k',   log:'同阶只要求比值极限存在且非零，一次幂对应 k=1', show:8, count:7 },
    { cls:'done',  tag:'完成',   log:'结论：a=1，k=1', show:9, count:8, done:true },
  ],

  result: {
    big: '$a=1,\\qquad k=1$',
    html: '记忆锚点：<b>求同阶常数 = 求最低次幂</b>：通分后把 $\\sin x$ 展开到足够阶，$f(x)-a$ 的首项是 $\\dfrac{x}{6}$，即 $k=1$。易错：$\\infty-\\infty$ 必须先通分；(2) 中 $x\\sin x$ 的 $-\\dfrac{x^4}{6}$ 不能省，否则首项恰好被抹掉。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
