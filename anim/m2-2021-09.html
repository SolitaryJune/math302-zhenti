<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2021·09 线性表出与齐次方程解集的包含关系</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：把「可表出」翻译成矩阵等式',
    cls: 'key',
    log: '阿尔法组能由贝塔组表出，等价于存在方阵 C 使 A 等于 B 乘 C',
    body: '<p>$\\alpha_1,\\alpha_2,\\alpha_3$ 可由 $\\beta_1,\\beta_2,\\beta_3$ 线性表出 $\\iff$ 每列 $\\alpha_i=Bc_i$ $\\iff$ 存在 3 阶方阵 $C$ 使 $$A=BC.$$</p>' },
  { title: '转置出关键恒等式',
    cls: 'key',
    log: '对 A 等于 B C 取转置，得到 A 转置等于 C 转置乘 B 转置',
    body: '<p>$$A^{\\mathrm T}=(BC)^{\\mathrm T}=C^{\\mathrm T}B^{\\mathrm T}.$$</p><p>于是若 $B^{\\mathrm T}X=\\mathbf{0}$，则 $A^{\\mathrm T}X=C^{\\mathrm T}\\left(B^{\\mathrm T}X\\right)=\\mathbf{0}$：<b>$B^{\\mathrm T}X=\\mathbf{0}$ 的解全是 $A^{\\mathrm T}X=\\mathbf{0}$ 的解</b>——这就是选项 D。</p>' },
  { title: '用秩解释方向为什么对',
    cls: 'good',
    log: '被表出的一组秩更小，转置齐次方程的解空间反而更大',
    body: '<p>$A=BC$ 保证列空间被包含：$r(A)\\le r(B)$。解空间维数 $3-r(A)\\ \\ge\\ 3-r(B)$——$A^{\\mathrm T}X=\\mathbf{0}$ 的解<b>更多</b>，「小解集装进大解集」正是 D 的方向。</p>' },
  { title: '为什么 $AX=0$ 与 $BX=0$ 不可比',
    cls: 'bad',
    log: '行方向的解集由行向量决定，列关系 A 等于 B C 管不到',
    body: '<p>$AX=\\mathbf{0}$、$BX=\\mathbf{0}$ 关心的是<b>行</b>方向，$A=BC$ 是列关系，推不出 A、C 的包含方向。</p>' },
  { title: '反例封口 A 与 B',
    cls: 'bad',
    log: '取 B 为单位阵、A 为降秩对角阵，A 与 B 两个方向当场失效',
    body: '<p>取 $B=E$（此时任何 $A$ 都可表出，$C=A$），再取 $A=\\mathrm{diag}(1,0,0)$：$B^{\\mathrm T}X=\\mathbf{0}$ 只有零解，而 $A^{\\mathrm T}X=\\mathbf{0}$ 有非零解——零解集合装不下非零解，A、B 均不成立。</p>' },
  { title: '结论',
    cls: 'good',
    log: '结论：B 转置的零解必然是 A 转置的零解，选 D',
    body: '<p>答案选 <b>D</b>。记忆锚点：<b>$A=BC\\Rightarrow A^{\\mathrm T}=C^{\\mathrm T}B^{\\mathrm T}$，解从 $B^{\\mathrm T}$ 流向 $A^{\\mathrm T}$（小解集 $\\subseteq$ 大解集）</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log || s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2021·09　$\\alpha$ 组可由 $\\beta$ 组表出，谁是谁的解？',
  subtitle: '考点：线性表出 $\\Leftrightarrow A=BC$ · 转置恒等式 · 齐次解集包含与秩',
  intro: '点击「▶ 播放」逐步展开推理链，最后用反例封口干扰项。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 D　$B^{\\mathrm T}X=\\mathbf{0}$ 的解均为 $A^{\\mathrm T}X=\\mathbf{0}$ 的解',
    html: '推理主线：<b>$A=BC \\Rightarrow A^{\\mathrm T}=C^{\\mathrm T}B^{\\mathrm T} \\Rightarrow B^{\\mathrm T}X=0 \\Rightarrow A^{\\mathrm T}X=0$</b>。易错：把包含方向背反（秩小的解空间更大，解往大处流）；忘记 $AX=0$ 是行方向、$A=BC$ 管不到。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
