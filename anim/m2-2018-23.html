<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018·23 列等价定参数并求可逆矩阵 P</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2018·23　$A$ 可经初等列变换化为 $B$：求 $a$ 与可逆矩阵 $P$（$AP=B$）',
  subtitle: '考点：矩阵的初等变换与方程组 · 方法：列等价定参数 → 对 $(A\\mid B)$ 消元 → 通解拼 $P$ → 行列式定可逆',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看条件如何一步步翻译成方程组的解。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      "<p><b>翻译条件：</b>初等<b>列</b>变换 = 右乘可逆阵，故「$A$ 可列变换成 $B$」$\\iff$ 存在可逆 $P$ 使 $AP=B$ $\\iff$ $r(A)=r(B)$ 且 $B$ 的列可由 $A$ 的列表示。</p>",
      "<b>① $r(A)$ 恒为 2：</b>$R_2-R_1,\\ R_3-2R_1$ 后 $\\begin{pmatrix}1&2&a\\\\0&1&-a\\\\0&3&-3a\\end{pmatrix}$，末两行成比例 $\\Rightarrow\\det A\\equiv0$；前两列线性无关 $\\Rightarrow\\ r(A)=2$（对一切 $a$）",
      "<b>② $\\det B=2-a$：</b>按第一列展开 $1\\cdot\\begin{vmatrix}1&1\\\\1&1\\end{vmatrix}+(-1)\\cdot\\begin{vmatrix}a&2\\\\1&1\\end{vmatrix}=-(a-2)=2-a$，故 $r(B)=2\\iff a=2$",
      "<b>③ 取 $a=2$ 列增广：</b>$\\left(\\begin{array}{ccc|ccc}1&2&2&1&2&2\\\\1&3&0&0&1&1\\\\2&7&-2&-1&1&1\\end{array}\\right)$，按列拆即 $A\\xi_i=\\beta_i\\ (i=1,2,3)$",
      "<b>④ 消元：</b>$R_2-R_1,\\ R_3-2R_1$：$\\left(\\begin{array}{ccc|ccc}1&2&2&1&2&2\\\\0&1&-2&-1&-1&-1\\\\0&3&-6&-3&-3&-3\\end{array}\\right)$；再 $R_3-3R_2$：第三行全零（有解 ✓）",
      "<b>⑤ 行最简：</b>$R_1-2R_2$：$$\\left(\\begin{array}{ccc|ccc}1&0&6&3&4&4\\\\0&1&-2&-1&-1&-1\\\\0&0&0&0&0&0\\end{array}\\right)$$",
      "<b>⑥ 读通解：</b>基础解系 $\\eta=(-6,2,1)^{\\mathrm T}$；特解 $(3,-1,0)^{\\mathrm T},\\ (4,-1,0)^{\\mathrm T},\\ (4,-1,0)^{\\mathrm T}$（注意 $\\beta_2=\\beta_3$）：$$\\xi_1=\\begin{pmatrix}3\\\\-1\\\\0\\end{pmatrix}+k_1\\eta,\\quad\\xi_2=\\begin{pmatrix}4\\\\-1\\\\0\\end{pmatrix}+k_2\\eta,\\quad\\xi_3=\\begin{pmatrix}4\\\\-1\\\\0\\end{pmatrix}+k_3\\eta$$",
      "<b>⑦ 拼成 $P$：</b>$$P=\\begin{pmatrix}-6k_1+3&-6k_2+4&-6k_3+4\\\\2k_1-1&2k_2-1&2k_3-1\\\\k_1&k_2&k_3\\end{pmatrix}$$",
      "<b>⑧ 定可逆：</b>$R_1+6R_3,\\ R_2-2R_3$ 后 $\\det P=\\begin{vmatrix}3&4&4\\\\-1&-1&-1\\\\k_1&k_2&k_3\\end{vmatrix}$，列消元展开得 $\\det P=k_3-k_2$ $\\Rightarrow$ 可逆 $\\iff k_2\\neq k_3$",
      "<b>⑨ 结论：</b>(1) $a=2$；(2) $P$ 如上（$k_1,k_2,k_3$ 任意，$k_2\\neq k_3$）"
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题', log:'列变换对应右乘可逆矩阵，问题等价于 A 与 B 列等价', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'定 A 秩', log:'A 的行列式恒为零，但前两列无关，秩固定为二', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'定参数', log:'B 的行列式等于二减 a，要求秩相同就得 a 等于二', count:2, ribbon:{k:3, ok:true} },
    { cls:'step',  tag:'列增广', log:'把 B 整个接到 A 右边，一次消元同时解三个方程组', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'消元', log:'三步行变换后左边第三行全为零，右边也全为零，说明都有解', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'行最简', log:'主元上方也清零，读解只差一步', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'通解', log:'自由变量是第三个分量，特解加基础解系的倍数，后两列形状相同但参数独立', count:6, ribbon:{k:7, ok:true} },
    { cls:'ok',    tag:'拼矩阵', log:'三列通解按列拼成 P，带三个自由参数', count:7, ribbon:{k:8, ok:true} },
    { cls:'ok',    tag:'定可逆', log:'行列式化简后等于 k3 减 k2，要求不等于零即 k2 与 k3 不等', count:8, ribbon:{k:9, ok:true} },
    { cls:'done',  tag:'完成', log:'结论：a 等于二；P 为三列通解拼成，k2 不等于 k3', count:9, ribbon:{k:10, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '(1) $a=2$　(2) $P$ 如推导板，需 $k_2\\neq k_3$',
    html: '记忆锚点：<b>列变换 = 右乘可逆阵（$AP=B$）；$\\det P=k_3-k_2$，可逆靠参数不等</b>。易错：行/列变换方向搞反；拼完 $P$ 忘加 $k_2\\neq k_3$；把 $\\beta_2=\\beta_3$ 误解为参数可合并。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
