<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：三个解定出微分方程的解（2013 年第 13 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '解之差 = 齐次解',
    body: '<p>$y_1=\\mathrm e^{3x}-x\\mathrm e^{2x}$，$y_2=\\mathrm e^{x}-x\\mathrm e^{2x}$，$y_3=-x\\mathrm e^{2x}$。非齐次解作差可"洗掉"特解成分：</p>' +
          '<p>$$y_1-y_3=\\mathrm e^{3x},\\qquad y_2-y_3=\\mathrm e^{x}.$$</p>' +
          '<p>比值 $\\frac{\\mathrm e^{3x}}{\\mathrm e^{x}}=\\mathrm e^{2x}$ 非常数 → 线性无关，构成二阶齐次的基础解系。</p>' },
  { cls: '', title: '写通解',
    body: '<p>$y_3=-x\\mathrm e^{2x}$ 本身是非齐次特解，故</p>' +
          '<p>$$y=C_1\\mathrm e^{3x}+C_2\\mathrm e^{x}-x\\mathrm e^{2x}.$$</p>' },
  { cls: '', title: '条件 y(0)=0',
    body: '<p>代入 $x=0$：</p>' +
          '<p>$$C_1+C_2=0.$$</p>' },
  { cls: 'key', title: '求导并代入 y′(0)=1',
    body: '<p>$$y\'=3C_1\\mathrm e^{3x}+C_2\\mathrm e^{x}-\\mathrm e^{2x}-2x\\mathrm e^{2x},$$</p>' +
          '<p>代入 $x=0$：$3C_1+C_2-1=1$，即</p>' +
          '<p>$$3C_1+C_2=2.$$</p>' },
  { cls: 'good', title: '解出常数',
    body: '<p>$3C_1+C_2=2$ 与 $C_1+C_2=0$ 相减得 $2C_1=2$：</p>' +
          '<p>$$C_1=1,\\qquad C_2=-1.$$</p>' },
  { cls: 'good', title: '回代并验算',
    body: '<p>$$y=\\mathrm e^{3x}-\\mathrm e^{x}-x\\mathrm e^{2x}.$$</p>' +
          '<p>验算：$y(0)=1-1-0=0$ ✓，$y\'(0)=3-1-1=1$ ✓。</p>' },
];

AW.init({
  title: '由三个解定出满足初值的特解',
  subtitle: '考点：线性微分方程解的结构 · 方法：解之差 → 通解 → 定常数',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示推导。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一行'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'作差', log:'两个解作差洗掉非齐次成分，得齐次解' },
    { cls:'step',  tag:'通解', log:'剩下的 y3 就是特解，拼出通解' },
    { cls:'step',  tag:'条件一', log:'y(0)=0 给出 C1+C2=0' },
    { cls:'shift', tag:'条件二', log:'求导后代 x=0，注意特解求导别丢项' },
    { cls:'ok',    tag:'定常数', log:'两条方程相减解出 C1=1、C2=−1' },
    { cls:'done',  tag:'完成', log:'回代并验算初始条件，收工', done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$y=\\mathrm e^{3x}-\\mathrm e^{x}-x\\mathrm e^{2x}$',
    html: '记忆锚点：<b>"解之差 = 齐次解"</b>：$y_1-y_3$、$y_2-y_3$ 洗掉特解成分；$y_3$ 本身就是特解，直接进通解。干扰直觉：$y_1,y_2$ 不是齐次解——它们还背着 $-x\\mathrm e^{2x}$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
