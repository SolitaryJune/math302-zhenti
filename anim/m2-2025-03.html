<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：任一解都可积 ⟺ 特征根实部全负</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：把收敛条件翻译成特征根语言',
    cls: 'key',
    log: '任一解都可积 ⟺ 每个基本解都衰减 ⟺ 特征根实部全负',
    body: '<p>通解由特征根决定：$\\mathrm e^{\\lambda x}$ 型可积要求 $\\lambda<0$；$\\mathrm e^{\\alpha x}\\cos\\beta x$ 型（$\\beta\\ne0$）要求实部 $\\alpha<0$。所以「<b>任一解</b>都使 $\\int_0^{+\\infty}y\\,\\mathrm dx$ 收敛」$\\iff$ <b>两个特征根实部全负</b>。</p>' },
  { title: '写出特征方程与判别式',
    cls: 'key',
    log: 'r² − 2ar + (a+2) = 0，判别式 4(a−2)(a+1) 定复根/实根',
    body: '<p>$$r^2-2ar+(a+2)=0,\\qquad r=a\\pm\\sqrt{a^2-a-2}$$ 判别式核心 $a^2-a-2=(a-2)(a+1)$：$a\\in(-1,2)$ 时为<b>复根</b>，$a\\le-1$ 或 $a\\ge2$ 时为<b>实根</b>，两情形分开讨论。</p>' },
  { title: '复根情形：实部就是 a',
    cls: 'good',
    log: '−1<a<2 时根为 a ± iβ，实部 a<0 给出 −1<a<0',
    ribbon: {k:1, ok:true},
    body: '<p>$r=a\\pm\\mathrm i\\beta$，通解 $\\mathrm e^{ax}(C_1\\cos\\beta x+C_2\\sin\\beta x)$，实部 $=a$。要 $a<0$，且限定在 $-1<a<2$ 内，得 $$-1<a<0.$$</p>' },
  { title: '实根情形：韦达定理定符号',
    cls: 'good',
    log: '两根皆负 ⟺ 和 2a<0 且积 a+2>0，交集得 −2<a≤−1',
    ribbon: {k:2, ok:true},
    body: '<p>$r_1+r_2=2a$，$r_1r_2=a+2$。两根皆负 $\\iff$ 和为负且积为正：$2a<0\\Rightarrow a<0$，$a+2>0\\Rightarrow a>-2$。与实根前提 $a\\le-1$ 或 $a\\ge2$ 取交，$a\\ge2$ 违背 $a<0$ 舍去，得 $$-2<a\\le-1.$$</p>' },
  { title: '合并两段，端点单独验',
    cls: 'key',
    log: '并集 (−2,0)；a=0 纯振荡发散，a=−2 有零根常数解发散，都不取',
    body: '<p>$$(-2,-1]\\cup(-1,0)=(-2,0).$$ 端点验证：$a=0$ 时方程 $y\'\'+2y=0$ 的解 $\\cos\\sqrt2\\,x$ 纯振荡，积分不收敛；$a=-2$ 时 $r_1r_2=a+2=0$ 出现零根，含常数解，发散——两端都取不到。</p>' },
  { title: '结论',
    cls: 'good',
    log: 'a ∈ (−2,0)，选 C',
    body: '<p>$a$ 的取值范围为 $(-2,0)$，答案选 <b>C</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '微分方程 $y\'\'-2ay\'+(a+2)y=0$：任一解都可积的 $a$ 范围',
  subtitle: '考点：特征根与解的形态 · 反常积分收敛 · 判别式分情形讨论',
  counterLabel: '推理步',
  ribbonTitle: '情形收口（✓ 完成 / ✗ 受阻）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '$a\\in(-2,0)$（选 C）',
    html: '记忆锚点：<b>「任一解可积」= 特征根实部全负；实根看「和负积正」，复根看「实部 $a<0$」，两段并起来再验端点</b>。只讨论实根会漏掉 $(-1,0)$（错选 A）；$a\\le-2$ 时两根积 $a+2\\le0$ 出非负根（错选 B、D）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
