<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2024·13 y′=1/(x+y)² 的初值问题</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

/* 推导行工具：acc 取 key/ok/bad/blue 决定高亮色；未揭示时隐去 */
var ACC = { key:'#f59e0b', ok:'#22c55e', bad:'#ef4444', blue:'#3b82f6' };
var BGS = { key:'#fffbeb', ok:'#f6fef9', bad:'#fff8f8', blue:'#eff6ff' };
function row(accent, html){
  var d = AW.el('div', '', html);
  d.style.cssText = 'border-left:4px solid #cbd5e1;padding:7px 14px;margin:9px 0;border-radius:10px;'
    + 'opacity:0;transform:translateX(-12px);transition:all .45s ease;font-size:15px;line-height:2;';
  d.dataset.acc = accent;
  return d;
}

// 每行推导内容（html 里可写 $..$ / $$..$$ 公式）
var ROWS = [
  { acc: 'key', html: '<p><b>识别类型</b>：右端 $\\dfrac1{(x+y)^2}$ 只依赖 $x+y$，是 $y\'=f(x+y)$ 型。令 $$u=x+y,\\qquad \\frac{\\mathrm du}{\\mathrm dx}=1+\\frac{\\mathrm dy}{\\mathrm dx}=1+\\frac1{u^2}=\\frac{u^2+1}{u^2}.$$</p>' },
  { acc: 'blue', html: '<p><b>分离变量</b>：$\\dfrac{u^2}{u^2+1}\\,\\mathrm du=\\mathrm dx$，即 $$\\Big(1-\\frac{1}{u^2+1}\\Big)\\mathrm du=\\mathrm dx.$$</p>' },
  { acc: 'blue', html: '<p><b>两边积分</b>：$$u-\\arctan u=x+C.$$</p>' },
  { acc: 'blue', html: '<p><b>回代</b> $u=x+y$：$x$ 在两端相消，$$y-\\arctan(x+y)=C.$$</p>' },
  { acc: 'ok', html: '<p><b>定常数</b>：$y(1)=0$ 时 $x=1$ 且 $u=x+y=1$，$$C=0-\\arctan 1=-\\frac\\pi4.$$</p>' },
  { acc: 'ok', html: '<p><b>最终解</b>：$$y-\\arctan(x+y)+\\frac\\pi4=0.$$</p>' },
  { acc: 'blue', html: '<p><b>验算</b>：隐式求导 $y\'-\\dfrac{1+y\'}{1+(x+y)^2}=0$，两边乘 $1+(x+y)^2$ 得 $y\'(x+y)^2=1$，即 $y\'=\\dfrac1{(x+y)^2}$ ✓；$x=1,y=0$ 时 $0-\\arctan1+\\tfrac\\pi4=0$ ✓。</p>' },
];

AW.init({
  title: '求 $y\'=\\dfrac1{(x+y)^2}$ 满足 $y(1)=0$ 的解',
  subtitle: '考点：一阶微分方程 · 方法：$u=x+y$ 换元 → 可分离 → 定常数',
  counterLabel: '计算步',
  intro: '点击「▶ 播放」逐步演示推导。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>（每步揭示一行，最新一行高亮）'));
    var board = AW.el('div', '');
    this.rows = [];
    ROWS.forEach(function(r){
      var d = row(r.acc, r.html);
      board.appendChild(d);
      this.rows.push(d);
    }, this);
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },
  render: function(stage, sn, i){
    (this.rows || []).forEach(function(d, j){
      var on = j < i;
      d.style.opacity = on ? '1' : '0';
      d.style.transform = on ? 'none' : 'translateX(-12px)';
      d.style.borderLeftColor = on ? (ACC[d.dataset.acc] || ACC.blue) : '#cbd5e1';
      d.style.background = on ? (BGS[d.dataset.acc] || BGS.blue) : '#f8fafc';
    });
    renderMathAfterSnap(stage);
  },
  snaps: [
    { cls: 'key',   tag: '审题', log: '右端只含 x+y，令 u = x+y，u\' = 1 + y\'', count: 0 },
    { cls: 'shift', tag: '换元', log: '方程变成 du/dx = 1 + 1/u²，可分离', count: 1 },
    { cls: 'step',  tag: '分离', log: 'u²/(u²+1) du = dx，拆成 1 − 1/(u²+1)', count: 2 },
    { cls: 'step',  tag: '积分', log: '积分得 u − arctan u = x + C', count: 3 },
    { cls: 'step',  tag: '回代', log: 'u = x+y，两边的 x 相消：y − arctan(x+y) = C', count: 4 },
    { cls: 'ok',    tag: '定常数', log: 'x=1、y=0 时 u=1：C = −arctan1 = −π/4', count: 5 },
    { cls: 'ok',    tag: '写出', log: '解为 y − arctan(x+y) + π/4 = 0', count: 6 },
    { cls: 'done',  tag: '完成', log: '验算：求导还原原方程，初值也吻合', count: 7, done: true },
  ],
  result: {
    big: '答案：y − arctan(x+y) + π/4 = 0',
    html: '记忆锚点：<b>$y\'=f(x+y)$ 型令 $u=x+y$，别忘 $u\'=1+y\'$</b>（多出的 1 正是可分离化的关键）。积分用 $\\dfrac{u^2}{u^2+1}=1-\\dfrac1{u^2+1}$ 拆项。定常数要同时满足 $x=1$ 与 $u=x+y=1$。隐式解就是标准形态，不必强解出 $y$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
