<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：1^∞ 型极限逐步求值（2013 年第 9 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '定型与取对数',
    body: '<p>底数 $2-\\dfrac{\\ln(1+x)}x\\to1$、指数 $\\frac1x\\to\\infty$：标准 $1^\\infty$ 型。设原式为 $A$，取对数：</p>' +
          '<p>$$\\ln A=\\lim_{x\\to0}\\frac1x\\ln\\Big[2-\\frac{\\ln(1+x)}x\\Big].$$</p>' },
  { cls: '', title: '泰勒展开到底',
    body: '<p>$\\ln(1+x)=x-\\dfrac{x^2}2+o(x^2)$，除以 $x$：</p>' +
          '<p>$$\\frac{\\ln(1+x)}x=1-\\frac x2+o(x).$$</p>' +
          '<p>只展开一阶会丢主部——$\\frac x2$ 藏在 $x^2$ 项里。</p>' },
  { cls: 'key', title: '底数写成 1+u',
    body: '<p>$$2-\\frac{\\ln(1+x)}x=2-\\Big(1-\\frac x2+o(x)\\Big)=1+\\frac x2+o(x).$$</p>' },
  { cls: 'good', title: '等价无穷小线性化',
    body: '<p>记 $u=\\frac x2+o(x)\\to0$，用 $\\ln(1+u)\\sim u$：</p>' +
          '<p>$$\\ln A=\\lim_{x\\to0}\\frac1x\\Big(\\frac x2+o(x)\\Big)=\\frac12.$$</p>' },
  { cls: '', title: '回代与数值自检',
    body: '<p>$A=\\mathrm e^{1/2}=\\sqrt{\\mathrm e}\\approx1.6487$。取 $x=10^{-4}$ 验证：原式 $\\approx1.6486$，吻合。</p>' },
];

AW.init({
  title: '$\\lim_{x\\to0}\\big[2-\\frac{\\ln(1+x)}x\\big]^{1/x}$ 逐步求值',
  subtitle: '考点：泰勒展开 · 方法：取对数 → 1+u → 等价无穷小',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示推导。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一行'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'定型', log:'底数趋于 1、指数趋于无穷，取对数降维' },
    { cls:'step',  tag:'展开', log:'ln(1+x) 展到 x 平方项，除以 x' },
    { cls:'shift', tag:'化简', log:'底数整理成 1 加小量的形状' },
    { cls:'ok',    tag:'线性化', log:'小量的对数等价于小量本身，极限为 1/2' },
    { cls:'done',  tag:'完成', log:'A = e 的 1/2 次方，数值验证吻合', done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\mathrm e^{\\frac12}$（即 $\\sqrt{\\mathrm e}$）',
    html: '记忆锚点：<b>$1^\\infty$ 型三步走：取对数 → 底数写成 $1+u$ → $\\ln(1+u)\\sim u$</b>。本题主部 $\\frac x2$ 来自 $\\ln(1+x)$ 的<b>二阶</b>泰勒项——只展一阶必丢分。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
