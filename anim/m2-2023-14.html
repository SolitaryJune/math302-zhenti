<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：曲线 3x³=y⁵+2y³ 的法线斜率</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '曲线 $3x^3=y^5+2y^3$ 在 $x=1$ 对应点处的法线斜率',
  subtitle: '考点：隐函数求导 · 方法：定点 → 求 $y\'$ → 取负倒数',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示：定点、求导、代值、取负倒数。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>第一步：定点</b>：$x=1$ 代入 $3x^3=y^5+2y^3$：$$y^5+2y^3=3$$ 令 $g(y)=y^5+2y^3$，$y>0$ 时严格递增且 $g(1)=3$，故解唯一：$y=1$，对应点 $(1,1)$',
      '<b>第二步：隐函数求导</b>：两边对 $x$ 求导（$y=y(x)$，链式法则）：$$9x^2=5y^4\\,y\'+6y^2\\,y\'$$',
      '<b>第三步：解出 y′</b>：$$y\'=\\frac{9x^2}{5y^4+6y^2}$$',
      '<b>第四步：代值</b>：在 $(1,1)$ 处：$$y\'\\Big|_{(1,1)}=\\frac{9}{5+6}=\\frac9{11}$$ 这是<b>切线</b>斜率',
      '<b>第五步：取负倒数</b>：法线与切线垂直 $$k_{\\text{法}}=-\\frac1{y\'}=-\\frac{11}9$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'定点',   log:'代 x=1 得 y 的五次幂加两项三次幂等于 3，y=1 且唯一', count:0 },
    { cls:'shift', tag:'求导',   log:'两边对 x 求导，y 的每一项都带 y′（链式）', count:1 },
    { cls:'step',  tag:'解 y′',  log:'把 y′ 提出，写成两个多项式的商', count:2 },
    { cls:'ok',    tag:'代值',   log:'代入 (1,1)，切线斜率是 9/11', count:3 },
    { cls:'done',  tag:'完成',   log:'结论：法线斜率取负倒数，等于 −11/9', count:4, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$k_{\\text{法}}=-\\dfrac{11}{9}$',
    html: '记忆锚点：<b>法线斜率 $=-\\dfrac1{y\'}$，切线斜率别忘了取负倒数</b>。易错：$y^5$ 对 $x$ 求导是 $5y^4y\'$，链式不能省；定点时说明 $g(y)$ 严格递增保证根唯一，书写才严谨。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
