<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011 数二第 13 题 · 圆与直线围域的二重积分</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（与模板一致，勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var LINES = [
  '<p><b>题面：</b>$D$ 由直线 $y=x$、圆 $x^2+y^2=2y$ 及 $y$ 轴围成，求 $\\iint_Dxy\\,\\mathrm d\\sigma$。</p>',
  '<p><b>认圆：</b>$x^2+y^2=2y\\iff x^2+(y-1)^2=1$：圆心 $(0,1)$、半径 1，过原点、与 $y$ 轴相切。极坐标下圆变为 $$r=2\\sin\\theta.$$</p>',
  '<p><b>定角度：</b>$y=x$ 是射线 $\\theta=\\dfrac\\pi4$，$y$ 轴正半轴是 $\\theta=\\dfrac\\pi2$，区域夹在两者之间：$$D:\\ \\frac\\pi4\\le\\theta\\le\\frac\\pi2,\\quad 0\\le r\\le 2\\sin\\theta.$$</p>',
  '<p><b>换元：</b>$x=r\\cos\\theta,\\ y=r\\sin\\theta$，$\\mathrm d\\sigma=r\\,\\mathrm dr\\,\\mathrm d\\theta$（别漏雅可比 $r$）：$$\\iint_Dxy\\,\\mathrm d\\sigma=\\int_{\\frac\\pi4}^{\\frac\\pi2}\\!\\mathrm d\\theta\\int_0^{2\\sin\\theta}r^3\\sin\\theta\\cos\\theta\\,\\mathrm dr.$$</p>',
  '<p><b>内层（对 r）：</b>$$\\int_0^{2\\sin\\theta}r^3\\,\\mathrm dr=\\frac{(2\\sin\\theta)^4}{4}=4\\sin^4\\theta.$$</p>',
  '<p><b>外层（对 θ）：</b>$$\\int_{\\frac\\pi4}^{\\frac\\pi2}4\\sin^5\\theta\\cos\\theta\\,\\mathrm d\\theta=4\\Bigl[\\frac{\\sin^6\\theta}{6}\\Bigr]_{\\frac\\pi4}^{\\frac\\pi2}.$$</p>',
  '<p><b>代入数值：</b>$\\sin\\dfrac\\pi4=\\dfrac{\\sqrt2}{2}$，其六次方为 $\\dfrac18$：$$4\\cdot\\frac16\\Bigl(1-\\frac18\\Bigr)=\\frac23\\cdot\\frac78=\\frac{7}{12}.$$</p>',
  '<p><b>结论：</b>$\\iint_Dxy\\,\\mathrm d\\sigma=\\dfrac{7}{12}$。</p>'
];

var lineEls = [];

AW.init({
  title: '第 13 题 · $\\iint\\limits_D xy\\,\\mathrm d\\sigma$（圆 + 直线 + $y$ 轴围域）',
  subtitle: '考点：二重积分 · 方法：极坐标分层积分',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示：认圆 → 定角度范围 → 换元 → 先 r 后 θ。',
  ribbonTitle: '推导进度（✓ 完成）',
  build: function(stage){
    stage.innerHTML = '';
    lineEls = [];
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>（每步揭示一行，公式由 KaTeX 渲染）'));
    LINES.forEach(function(h){
      var d = AW.el('div', 'aw-stepcard', h);
      d.style.display = 'none';
      wrap.appendChild(d);
      lineEls.push(d);
    });
    stage.appendChild(wrap);
  },
  snaps: [
    { cls:'step',  tag:'审题', count:0, reveal:1 },
    { cls:'shift', tag:'认圆', log:'配方得圆心 (0,1)、半径 1，极坐标下圆是 r = 2sinθ', count:1, reveal:2, hl:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'定角度', log:'y=x 给下限 π/4，y 轴给上限 π/2，r 从 0 到 2sinθ', count:2, reveal:3, hl:2, ribbon:{k:2, ok:true} },
    { cls:'step',  tag:'换元', log:'xy 变成 r²sinθcosθ，面积元多乘一个 r，共 r³', count:3, reveal:4, hl:3, ribbon:{k:3, ok:true} },
    { cls:'step',  tag:'内层', log:'对 r 积分得 (2sinθ)⁴/4 = 4sin⁴θ', count:4, reveal:5, hl:4, ribbon:{k:4, ok:true} },
    { cls:'step',  tag:'外层', log:'sin⁵θcosθ 正好是 sin⁶θ/6 的导数形状，直接凑微分', count:5, reveal:6, hl:5, ribbon:{k:5, ok:true} },
    { cls:'step',  tag:'代数值', log:'sin(π/4) 的六次方是 1/8，算出 2/3 × 7/8', count:6, reveal:7, hl:6, ribbon:{k:6, ok:true} },
    { cls:'done',  tag:'结论', log:'结论：二重积分 = 7/12', count:7, reveal:8, hl:7, good:true, done:true, ribbon:{k:7, ok:true} },
  ],
  render: function(stage, sn){
    for(var j = 0; j < lineEls.length; j++){
      lineEls[j].style.display = (j < (sn.reveal || 0)) ? '' : 'none';
      lineEls[j].className = 'aw-stepcard' + (sn.hl === j ? (sn.good ? ' good' : ' key') : '');
    }
    renderMathAfterSnap(stage);
  },
  result: {
    big: '填 7/12',
    html: '关键三件事：<b>$r=2\\sin\\theta$（圆心在 $y$ 轴上）、$\\theta\\in\\left[\\frac\\pi4,\\frac\\pi2\\right]$、别漏雅可比 $r$</b>。内层 $\\frac{(2\\sin\\theta)^4}{4}$，外层凑 $\\mathrm d(\\sin^6\\theta)$，得 $\\frac{7}{12}$。易错：圆心在 $y$ 轴上是 $2\\sin\\theta$，在 $x$ 轴上才是 $2\\cos\\theta$。',
  },
});
</script>
</body>
</html>
