<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·07 恒线性相关的向量组</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：任意常数 = 行列式恒为零',
    cls: 'key',
    body: '<p>$c_1,c_2,c_3,c_4$ 是<b>任意</b>常数，要找对一切取值都相关的组——三个向量按<b>列</b>排成的 $3\\times3$ 行列式必须<b>恒为 0</b>。突破口：$\\alpha_3=(1,-1,c_3)^{\\mathrm T}$ 与 $\\alpha_4=(-1,1,c_4)^{\\mathrm T}$ 的前两个分量互为相反数。</p>',
    log: '任意常数都相关 ⇔ 行列式恒为 0；看 α₃ 与 α₄ 的对峙结构' },
  { title: '算 C 组行列式（$\\alpha_1,\\alpha_3,\\alpha_4$）',
    cls: 'good',
    body: '<p>$$\\begin{vmatrix}0&1&-1\\\\0&-1&1\\\\c_1&c_3&c_4\\end{vmatrix}\\xrightarrow{\\text{按第 1 列展开}}c_1\\begin{vmatrix}1&-1\\\\-1&1\\end{vmatrix}=c_1(1-1)=0.$$与常数无关，<b>恒线性相关</b>。</p>',
    log: 'C 组：行列式恒等于 0，与任何常数取值无关' },
  { title: 'C 组的结构解释',
    cls: 'good',
    body: '<p>$\\alpha_3+\\alpha_4=(0,0,c_3+c_4)^{\\mathrm T}$，与 $\\alpha_1=(0,0,c_1)^{\\mathrm T}$ 同在 $e_3$ 方向：$c_1\\neq0$ 时 $\\alpha_3+\\alpha_4$ 是 $\\alpha_1$ 的倍数，三向量必相关；$c_1=0$ 时 $\\alpha_1$ 是零向量，更平凡。</p>',
    log: 'α₃+α₄ 只剩第三分量，与 α₁ 同向，必相关' },
  { title: 'A 组（$\\alpha_1,\\alpha_2,\\alpha_3$）',
    cls: 'bad',
    body: '<p>$$\\begin{vmatrix}0&0&1\\\\0&1&-1\\\\c_1&c_2&c_3\\end{vmatrix}=-c_1.$$含未消去的 $c_1$：$c_1\\neq0$ 时行列式非零、线性无关，不恒相关。</p>',
    ribbon: {k:1, ok:false},
    log: 'A 组：行列式 = −c₁，c₁≠0 时无关' },
  { title: 'B 组（$\\alpha_1,\\alpha_2,\\alpha_4$）',
    cls: 'bad',
    body: '<p>$$\\begin{vmatrix}0&0&-1\\\\0&1&1\\\\c_1&c_2&c_4\\end{vmatrix}=c_1.$$同样含 $c_1$，一般非零，不恒相关。</p>',
    ribbon: {k:2, ok:false},
    log: 'B 组：行列式 = c₁，不恒为零' },
  { title: 'D 组（$\\alpha_2,\\alpha_3,\\alpha_4$）',
    cls: 'bad',
    body: '<p>$$\\begin{vmatrix}0&1&-1\\\\1&-1&1\\\\c_2&c_3&c_4\\end{vmatrix}=-(c_3+c_4).$$含 $c_3+c_4$，一般非零，不恒相关。</p>',
    ribbon: {k:3, ok:false},
    log: 'D 组：行列式 = −(c₃+c₄)，不恒为零' },
  { title: '结论',
    cls: 'good',
    body: '<p>只有 C 组对<b>任意</b>常数线性相关，答案选 <b>C</b>。</p>',
    ribbon: {k:4, ok:true},
    log: '选 C' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log || s.title,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '谁恒线性相关？$\\alpha_1,\\alpha_2,\\alpha_3,\\alpha_4$ 的四选一',
  subtitle: '考点：向量组线性相关 · 方法：按列排行列式，找"恒为 0"的那组',
  counterLabel: '推理步',
  ribbonTitle: '选项检查（✓ 恒相关 / ✗ 不恒相关）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C（α₁, α₃, α₄）',
    html: '记忆锚点：<b>前两分量互为相反数的两个向量相加后只剩第三分量</b>——$\\alpha_3+\\alpha_4=(0,0,c_3+c_4)^{\\mathrm T}$ 落进 $\\alpha_1$ 所在的 $e_3$ 方向，三个向量必相关。题眼是「任意常数」：行列式必须恒为 0，含未消去常数的组（A、B、D）直接出局。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
