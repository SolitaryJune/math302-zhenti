<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·12 一阶方程的特解</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];   // 推导板的持久 DOM 行

var LINES = [
  "<p><b>原方程</b>：$y\\,\\mathrm{d}x+(x-3y^{2})\\,\\mathrm{d}y=0$，初始条件 $y\\big|_{x=1}=1$。按 $y(x)$ 看不是线性型——<b>换个视角</b>。</p>",
  "<p><b>反客为主</b>：把 $x$ 看作 $y$ 的函数，$y\\dfrac{\\mathrm{d}x}{\\mathrm{d}y}+x-3y^{2}=0$，即 $$\\frac{\\mathrm{d}x}{\\mathrm{d}y}+\\frac{1}{y}\\,x=3y\\qquad(y\\neq0).$$这是一阶<b>线性</b>方程。</p>",
  "<p><b>积分因子</b>：$\\mu(y)=\\mathrm{e}^{\\int\\frac{1}{y}\\mathrm{d}y}=y$。</p>",
  "<p><b>乘因子凑全导数</b>：两边乘 $y$，$$\\frac{\\mathrm{d}(xy)}{\\mathrm{d}y}=3y^{2}.$$</p>",
  "<p><b>积分</b>：$$xy=y^{3}+C.$$</p>",
  "<p><b>定常数</b>：代初始点 $(1,1)$：$1=1+C\\Longrightarrow C=0$，故 $xy=y^{3}$。</p>",
  "<p><b>还原 $y(x)$</b>：$xy=y^{3}\\Rightarrow x=y^{2}\\Rightarrow y=\\pm\\sqrt{x}$；由 $y(1)=1>0$ 取正支 $y=\\sqrt{x}$。</p>",
  "<p><b>验证</b>：$\\mathrm{d}y=\\dfrac{\\mathrm{d}x}{2\\sqrt{x}}$，代回 $\\sqrt{x}\\,\\mathrm{d}x+(x-3x)\\cdot\\dfrac{\\mathrm{d}x}{2\\sqrt{x}}=\\sqrt{x}\\,\\mathrm{d}x-\\sqrt{x}\\,\\mathrm{d}x=0$ ✓</p>",
  "<p><b>结论</b>：所求解为 $y=\\sqrt{x}$。</p>"
];

AW.init({
  title: '一阶方程求解：$y\\,\\mathrm{d}x+(x-3y^{2})\\,\\mathrm{d}y=0$',
  subtitle: '考点：一阶线性微分方程 · 方法：反客为主（x 看作 y 的函数）+ 积分因子',
  counterLabel: '已推演',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',   log:'微分形式方程，按 y(x) 看非线性；初始条件给在点 (1,1)', show:1, count:0 },
    { cls:'step',  tag:'换视角', log:'把 x 当 y 的函数：dx/dy + x/y = 3y，变成一阶线性方程', show:2, count:1 },
    { cls:'step',  tag:'找因子', log:'对 1/y 积分取指数，积分因子 μ = y', show:3, count:2 },
    { cls:'ok',    tag:'凑导数', log:'两边乘 y：左边凑成 (xy) 对 y 的导数，右边是 3y²', show:4, count:3 },
    { cls:'ok',    tag:'积分',   log:'xy = y³ + C', show:5, count:4 },
    { cls:'ok',    tag:'定 C',   log:'代初始点 (1,1)：1 = 1 + C，得 C = 0', show:6, count:5 },
    { cls:'step',  tag:'还原',   log:'x = y²，开方得 ±√x；初始条件 y(1)=1>0 只取 y = √x', show:7, count:6 },
    { cls:'step',  tag:'验证',   log:'代回方程：√x·dx − √x·dx = 0，成立', show:8, count:7 },
    { cls:'done',  tag:'完成',   log:'结论：解为 y = √x', show:9, count:8, done:true },
  ],

  result: {
    big: 'y = √x',
    html: '记忆锚点：<b>微分方程里 x、y 角色可以互换</b>——方程对 $y(x)$ 不是线性型时，把 $x$ 当 $y$ 的函数立刻变成 $\\frac{\\mathrm{d}x}{\\mathrm{d}y}+\\frac{1}{y}x=3y$。积分因子 $\\mu=y$，通解 $xy=y^{3}+C$，初始条件只留正支 $y=\\sqrt{x}$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
