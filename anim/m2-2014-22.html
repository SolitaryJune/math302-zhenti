<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2014·22 基础解系与 AB=E</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>审题</b>：$\\boldsymbol A$ 是 $3\\times4$ 矩阵。(1) 求 $\\boldsymbol A\\boldsymbol x=\\boldsymbol0$ 的基础解系；(2) 求所有 $\\boldsymbol B$ 使 $\\boldsymbol A\\boldsymbol B=\\boldsymbol E$（$\\boldsymbol E$ 为 $3$ 阶单位阵，故 $\\boldsymbol B$ 必须 $4\\times3$）。</p>",
  "<p><b>行化简</b>：$r_3-r_1$ 得 $(0,4,-3,1)$，再 $r_3-4r_2$ 得 $(0,0,1,-3)$：$$\\begin{pmatrix}1&-2&3&-4\\\\0&1&-1&1\\\\0&0&1&-3\\end{pmatrix}$$ 秩 $=3$，$n-r=4-3=1$，自由变量取 $x_4$。</p>",
  "<p><b>解齐次 (1)</b>：自下而上回代：$x_3=3x_4$，$x_2=x_3-x_4=2x_4$，$x_1=2x_2-3x_3+4x_4=-x_4$。取 $x_4=1$：$$\\boldsymbol\\xi=(-1,2,3,1)^{\\mathrm T}.$$ 基础解系就这一个向量。</p>",
  "<p><b>(2) 按列拆</b>：$\\boldsymbol A\\boldsymbol B=\\boldsymbol E$ 等价于 $\\boldsymbol A\\boldsymbol b_i=\\boldsymbol e_i$（$i=1,2,3$），$\\boldsymbol e_i$ 是 $\\boldsymbol E$ 的第 $i$ 列。先解一般的 $\\boldsymbol A\\boldsymbol x=\\boldsymbol d$，$\\boldsymbol d=(a,b,c)^{\\mathrm T}$。</p>",
  "<p><b>一般解</b>：对增广矩阵做同样的行变换后回代，得特解 $$\\bigl(2a+6b-c,\\ -a-3b+c,\\ c-a-4b,\\ 0\\bigr)^{\\mathrm T},$$ 通解 = 特解 $+\\,k\\boldsymbol\\xi$。</p>",
  "<p><b>第 1 列</b>（$\\boldsymbol d=\\boldsymbol e_1=(1,0,0)^{\\mathrm T}$）：特解 $(2,-1,-1,0)^{\\mathrm T}$，$$\\boldsymbol b_1=(2-k_1,\\ 2k_1-1,\\ 3k_1-1,\\ k_1)^{\\mathrm T}.$$</p>",
  "<p><b>第 2 列</b>（$\\boldsymbol d=\\boldsymbol e_2=(0,1,0)^{\\mathrm T}$）：特解 $(6,-3,-4,0)^{\\mathrm T}$，$$\\boldsymbol b_2=(6-k_2,\\ 2k_2-3,\\ 3k_2-4,\\ k_2)^{\\mathrm T}.$$</p>",
  "<p><b>第 3 列</b>（$\\boldsymbol d=\\boldsymbol e_3=(0,0,1)^{\\mathrm T}$）：特解 $(-1,1,1,0)^{\\mathrm T}$，$$\\boldsymbol b_3=(-k_3-1,\\ 2k_3+1,\\ 3k_3+1,\\ k_3)^{\\mathrm T}.$$</p>",
  "<p><b>拼成 $\\boldsymbol B$</b>（三列参数 $k_1,k_2,k_3$ 互相独立）：$$\\boldsymbol B=\\begin{pmatrix}2-k_1&6-k_2&-k_3-1\\\\2k_1-1&2k_2-3&2k_3+1\\\\3k_1-1&3k_2-4&3k_3+1\\\\k_1&k_2&k_3\\end{pmatrix}.$$</p>",
  "<p><b>验证</b>：$\\boldsymbol A\\boldsymbol b_1$ 的第一分量 $(2-k_1)-2(2k_1-1)+3(3k_1-1)-4k_1=1$ ✓，第二、三分量为 $0$，即 $\\boldsymbol A\\boldsymbol b_1=\\boldsymbol e_1$；另两列同理，$\\boldsymbol A\\boldsymbol B=\\boldsymbol E$。</p>"
];

AW.init({
  title: "从 $Ax=0$ 的基础解系到 $AB=E$ 的全部解",
  subtitle: "考点：线性方程组 · 基础解系 · 矩阵方程按列拆（2014 年数学二第 22 题）",
  counterLabel: "推导步",
  ribbonTitle: "两问关键节点（✓ 已完成）",
  intro: "点击「▶ 播放」逐步演示行化简、基础解系与按列求解。",

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:"shift", tag:"审题",   log:"三行四列的矩阵，先求齐次基础解系，再解矩阵方程", show:1, count:0 },
    { cls:"step",  tag:"行化简", log:"第三行减第一行再减四倍第二行，秩为 3，自由变量只有一个", show:2, count:1 },
    { cls:"ok",    tag:"基础解系", log:"自下而上回代，取自由变量为 1，解向量为负 1、2、3、1", show:3, count:2, ribbon:{k:1, ok:true} },
    { cls:"step",  tag:"按列拆", log:"矩阵方程等于三组方程组，先解一般的右端项", show:4, count:3 },
    { cls:"step",  tag:"一般解", log:"同样行化简后回代，通解是特解加上齐次通解", show:5, count:4 },
    { cls:"ok",    tag:"第一列", log:"右端取单位向量一，特解加参数得第一列", show:6, count:5, ribbon:{k:2, ok:true} },
    { cls:"ok",    tag:"第二列", log:"右端取单位向量二，特解是 6、负 3、负 4、0", show:7, count:6, ribbon:{k:3, ok:true} },
    { cls:"ok",    tag:"第三列", log:"右端取单位向量三，特解是负 1、1、1、0", show:8, count:7, ribbon:{k:4, ok:true} },
    { cls:"ok",    tag:"拼矩阵", log:"三列拼成四乘三矩阵，三个参数互相独立", show:9, count:8, ribbon:{k:5, ok:true} },
    { cls:"done",  tag:"完成",   log:"代入验算第一列，三行结果正好是单位向量一", show:10, count:9, done:true },
  ],

  result: {
    big: "$\\boldsymbol\\xi=(-1,2,3,1)^{\\mathrm T}$；$\\boldsymbol B$ 按列 = 特解 $+\\,k_i\\boldsymbol\\xi$",
    html: "结论：(1) 基础解系 $\\boldsymbol\\xi=(-1,2,3,1)^{\\mathrm T}$（秩 3、自由变量 $x_4$）。(2) $\\boldsymbol B$ 的第 $i$ 列 $=\\boldsymbol A\\boldsymbol x=\\boldsymbol e_i$ 的特解 $+\\,k_i\\boldsymbol\\xi$：$$\\boldsymbol B=\\begin{pmatrix}2-k_1&6-k_2&-k_3-1\\\\2k_1-1&2k_2-3&2k_3+1\\\\3k_1-1&3k_2-4&3k_3+1\\\\k_1&k_2&k_3\\end{pmatrix}.$$ 记忆锚点：<b>$\\boldsymbol A\\boldsymbol B=\\boldsymbol E$ 按列拆成三组非齐次方程</b>；$\\boldsymbol B$ 是 $4\\times3$，三列参数 $k_1,k_2,k_3$ 独立。",
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
