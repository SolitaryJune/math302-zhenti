<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2017·03 收敛数列的复合式极限反解</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：统一成"解方程验根"',
    cls: 'key',
    body: '<p>设 $\\lim_{n\\to\\infty}x_n=a$（题设收敛）。由连续性，$\\lim_{n\\to\\infty}g(x_n)=g(a)$。每个选项都在问：由 $g(a)=0$ 能否<b>强制</b> $a=0$？——看方程 $g(a)=0$ 是否只有零根，有非零根就构造常值反例。</p>',
    log: '设极限为 a，各选项化为 g(a)=0' },
  { title: 'A：$\\sin a=0$ 根太多',
    cls: 'bad',
    body: '<p>$\\sin$ 连续，得 $\\sin a=0$，解为 $a=k\\pi$，不止 $a=0$。反例：$x_n\\equiv\\pi$，则 $\\sin x_n\\to0$ 但 $x_n\\to\\pi\\neq0$。A 否。</p>',
    ribbon: {k:1, ok:false},
    log: 'a=kπ，反例 xₙ≡π，A 错' },
  { title: 'B：$a+\\sqrt{\\lvert a\\rvert}=0$ 有负根',
    cls: 'bad',
    body: '<p>$\\sqrt{\\lvert\\cdot\\rvert}$ 连续，得 $a+\\sqrt{\\lvert a\\rvert}=0$。$a=-1$ 时 $-1+\\sqrt{1}=0$，是根。反例：$x_n\\equiv-1$，复合式 $\\to0$ 但 $x_n\\to-1$。B 否。</p>',
    ribbon: {k:2, ok:false},
    log: 'a=−1 也是根，反例 xₙ≡−1，B 错' },
  { title: 'C：$a+a^2=0$ 有非零根',
    cls: 'bad',
    body: '<p>$x^2$ 连续，得 $a+a^2=a(a+1)=0$，根为 $a=0$ 或 $a=-1$。反例：$x_n\\equiv-1$，则 $x_n+x_n^2\\to0$ 但极限为 $-1$。C 否。</p>',
    ribbon: {k:3, ok:false},
    log: 'a=−1 使 a+a²=0，C 错' },
  { title: 'D：$a+\\sin a=0$ 只有零根',
    cls: 'good',
    body: '<p>方程 $\\sin a=-a$，取绝对值：$\\lvert\\sin a\\rvert=\\lvert a\\rvert$。而 $\\lvert\\sin a\\rvert\\le\\lvert a\\rvert$ 且<b>等号仅在 $a=0$</b>（$a\\neq0$ 时 $\\lvert\\sin a\\rvert<\\lvert a\\rvert$）。故唯一根 $a=0$，即 $\\lim_{n\\to\\infty}x_n=0$，D 成立。</p>',
    ribbon: {k:4, ok:true},
    log: '|sin a|<|a|（a≠0），唯一根 a=0' },
  { title: '结论',
    cls: 'good',
    body: '<p>A、B、C 各有非零反例，D 的方程只有 $a=0$ 一个根——答案选 <b>D</b>。</p>',
    log: '选 D' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log || s.title,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '收敛数列 $\\{x_n\\}$：哪个条件能强制 $\\lim x_n=0$？',
  subtitle: '考点：数列极限 + 连续函数复合 · 方法：解 g(a)=0 验根，非零根即反例',
  counterLabel: '推理步',
  ribbonTitle: '选项判定（✓ 成立 / ✗ 反例否定）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：<b>$\\lvert\\sin a\\rvert<\\lvert a\\rvert$（$a\\neq0$）</b>是 $a+\\sin a=0$ 只有零根的关键；A/B/C 的套路是"<b>方程有非零根 ⟹ 常值数列 $x_n\\equiv$ 非零根 就是反例</b>"（$\\pi$、$-1$、$-1$）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
