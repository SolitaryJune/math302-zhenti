<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：置换矩阵的性质逐项裁决</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：结构与两个事实',
    cls: 'key',
    body: '<p>置换矩阵 = 单位阵换行而来：每行每列恰一个 $1$。两个事实：<b>正交</b> $A^TA=E\\Rightarrow A^{-1}=A^T$；换行 $k$ 次则 $\\det A=(-1)^k=\\pm1$（两种符号都要讨论）。</p>' },
  { title: 'B 分析：恒成立',
    cls: 'good',
    body: '<p>$A^{-1}=A^T$，而转置把"第 $i$ 行的 $1$ 在第 $j$ 列"换成"第 $j$ 行的 $1$ 在第 $i$ 列"，每行每列仍恰有一个 $1$——<b>转置仍是置换矩阵</b>。B 一定成立。</p>' },
  { title: 'A 分析：不一定',
    cls: 'bad',
    body: '<p>$A^*=\\det(A)A^{-1}=\\pm A^{-1}$。当 $\\det A=-1$（奇数次换行）时 $A^*=-A^{-1}$，非零元是 $-1$，不是 $0,1$ 矩阵。反例：$A=\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$，$A^*=\\begin{pmatrix}0&-1\\\\-1&0\\end{pmatrix}$ 不是置换矩阵。</p>' },
  { title: 'C 分析：不一定',
    cls: 'bad',
    body: '<p>$A^{-1}=A^*\\iff\\det(A)A^{-1}=A^{-1}\\iff\\det A=1$，只对<b>偶数</b>次换行成立；上面的反例里 $A^{-1}=A\\ne A^*$。</p>' },
  { title: 'D 分析：不一定',
    cls: 'bad',
    body: '<p>$A^{-1}=-A^*\\iff-\\det(A)A^{-1}=A^{-1}\\iff\\det A=-1$，只对<b>奇数</b>次换行成立；取 $\\det A=1$ 的置换矩阵（如 $A=E$）即反例。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>B</b>。记忆锚点：<b>置换矩阵正交，逆 = 转置仍是置换矩阵；伴随带符号 $A^*=\\pm A^{-1}$，符号随换行次数奇偶摇摆，只有 $A^{-1}$ 与符号无关</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '置换矩阵 $A$：$A^*$、$A^{-1}$ 谁一定是置换矩阵',
  subtitle: '考点：正交矩阵 · 行列式 $\\pm1$ · 伴随矩阵公式 $A^*=\\det(A)A^{-1}$',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐项裁决 A、B、C、D。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B（$A^{-1}$ 必为置换矩阵）',
    html: '记忆锚点：<b>$A^{-1}=A^T$ 且转置保持"每行每列恰一个 1"</b>；$A^*=\\pm A^{-1}$ 的符号由换行次数奇偶决定，奇数次时 $A^*$ 含 $-1$ 元（如 $\\begin{pmatrix}0&1\\\\1&0\\end{pmatrix}$ 的伴随），故 A、C、D 都只是"有时成立"。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
