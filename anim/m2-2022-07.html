<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画：三个定积分比大小</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：同区间，比被积函数',
    cls: 'key',
    log: '三个积分同在 [0,1]，逐对比较被积函数即可定序',
    body: '<p>$I_1=\\displaystyle\\int_0^1\\frac{x}{2(1+\\cos x)}\\mathrm{d}x$，$I_2=\\displaystyle\\int_0^1\\frac{\\ln(1+x)}{1+\\cos x}\\mathrm{d}x$，$I_3=\\displaystyle\\int_0^1\\frac{2x}{1+\\sin x}\\mathrm{d}x$。区间相同 ⟹ <b>统一分母、逐对比分子</b>，用保号性传递。</p>' },
  { title: 'I₁ vs I₂：比分子 x 与 2ln(1+x)',
    cls: 'good',
    log: 'φ=2ln(1+x)−x 递增且 φ(0)=0 ⟹ 2ln(1+x)>x ⟹ I₁<I₂',
    body: '<p>统一分母 $2(1+\\cos x)$，比 $x$ 与 $2\\ln(1+x)$。令 $\\varphi=2\\ln(1+x)-x$：$\\varphi(0)=0$，$\\varphi\'=\\dfrac{1-x}{1+x}\\ge0$ 于 $[0,1]$，故 $2\\ln(1+x)>x$，得 $$I_1<I_2.$$</p>' },
  { title: 'I₂ vs I₃ 之一：先用 ln(1+x)≤x 放缩',
    cls: 'step',
    log: 'ln(1+x)≤x ⟹ I₂ ≤ ∫ x/(1+cos x) dx',
    body: '<p>经典不等式 $\\ln(1+x)\\le x$ 给出 $$\\frac{\\ln(1+x)}{1+\\cos x}\\le\\frac{x}{1+\\cos x}.$$ 只需再比 $\\dfrac{x}{1+\\cos x}$ 与 $I_3$ 的被积函数 $\\dfrac{2x}{1+\\sin x}$。</p>' },
  { title: 'I₂ vs I₃ 之二：比分母 1+sin x 与 2(1+cos x)',
    cls: 'good',
    log: 'cos x > cos1 > 1/2 ⟹ 2(1+cos x) > 3 > 1+sin x ⟹ I₂<I₃',
    body: '<p>交叉相乘（分母皆正）。由 $x\\le1<\\frac{\\pi}{3}$ 与 $\\cos$ 递减：$\\cos x>\\cos\\frac{\\pi}{3}=\\frac12$，故 $2(1+\\cos x)>3$；而 $1+\\sin x\\le2<3$。于是 $$\\frac{x}{1+\\cos x}<\\frac{2x}{1+\\sin x},\\qquad I_2<I_3.$$</p>' },
  { title: '串联定序：I₁ < I₂ < I₃',
    cls: 'good',
    log: '两段不等式串联：I₁ < I₂ < I₃，选 A',
    body: '<p>$$I_1<I_2<I_3.$$ 答案选 <b>A</b>。B 把 $I_1,I_2$ 关系弄反；C、D 把 $I_3$ 排在中间或最小，都与被积函数比较矛盾。</p>' },
  { title: '结论与记忆点',
    cls: 'done',
    log: '比大小三板斧：统一分母、经典不等式、单调性估分母',
    body: '<p>答案 <b>A</b>。三个工具：$\\varphi=2\\ln(1+x)-x$ 的单调性；$\\ln(1+x)\\le x$；$\\cos$ 在 $[0,\\frac{\\pi}{2}]$ 递减估 $\\cos x>\\frac12$。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$I_1,\\ I_2,\\ I_3$ 三个定积分比大小',
  subtitle: '考点：定积分保号性 · 方法：统一分母 + 经典不等式 + 单调性估计',
  counterLabel: '比较步',
  intro: '点击「▶ 播放」逐步展开比较链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 A（$I_1<I_2<I_3$）',
    html: '记忆锚点：<b>$2\\ln(1+x)>x$（系数 2 让不等式反向）</b>与 <b>$1+\\sin x\\le2<3<2(1+\\cos x)$</b>。易错：把 $\\ln(1+x)\\le x$ 直接搬到 $2\\ln(1+x)$ 上，方向就错了。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
