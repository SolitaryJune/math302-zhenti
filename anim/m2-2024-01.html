<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2024·01 幂指函数第一类间断点个数</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：幂指函数先取对数降维',
    cls: 'key',
    tag: '方法',
    body: '<p>$f(x)=|x|^{\\frac{1}{(1-x)(x-2)}}$ 的可疑点只有两类：<b>底数为零</b>的 $x=0$，<b>指数分母为零</b>的 $x=1$、$x=2$。幂指型统一取对数：$$\\ln f(x)=\\frac{\\ln\\lvert x\\rvert}{(1-x)(x-2)}=g(x),$$ 先判 $g$ 的极限，再用 $f=\\mathrm e^{g}$ 还原。判类标准：<b>左右极限都存在且有限，才是第一类</b>。</p>',
    log: '可疑点 x=0、x=1、x=2，逐个求左右极限' },
  { title: '可疑点 x=0：极限无穷 → 第二类',
    cls: 'bad',
    tag: 'x=0',
    ribbon: {k:1, ok:false},
    body: '<p>$x=0$ 处指数取值 $\\dfrac{1}{(1-0)(0-2)}=-\\dfrac12$，于是 $f(x)=|x|^{-\\frac12}=\\dfrac{1}{\\sqrt{\\lvert x\\rvert}}\\to+\\infty$。极限为无穷，<b>第二类间断点</b>，不计入。</p>',
    log: 'x=0：f→+∞，第二类，不算' },
  { title: '可疑点 x=1：左右极限同为 e → 第一类',
    cls: 'good',
    tag: 'x=1',
    ribbon: {k:2, ok:true},
    body: '<p>$x\\to1$ 时用等价无穷小 $\\ln\\lvert x\\rvert=\\ln\\big(1+(x-1)\\big)\\sim x-1=-(1-x)$：$$g(x)\\sim\\frac{-(1-x)}{(1-x)(x-2)}=\\frac{-1}{x-2}\\xrightarrow{\\;x\\to1\\;}\\frac{-1}{-1}=1,$$ 故 $f\\to\\mathrm e^{1}=\\mathrm e$。左右极限存在、相等、有限，但 $f(1)$ 无定义——<b>可去间断点，第一类</b>。</p>',
    log: 'x=1：左右极限同为 e，第一类（可去）✓' },
  { title: '可疑点 x=2：一侧无穷 → 第二类',
    cls: 'bad',
    tag: 'x=2',
    ribbon: {k:3, ok:false},
    body: '<p>$x\\to2^-$：$(1-x)(x-2)\\to0^+$，指数 $\\to+\\infty$，$f\\to+\\infty$；$x\\to2^+$：指数 $\\to-\\infty$，$f\\to0$。虽有一侧极限存在，但<b>另一侧为无穷就是第二类</b>，不计入。</p>',
    log: 'x=2：左极限 +∞，第二类，不算' },
  { title: '计数：第一类只有 x=1',
    cls: 'good',
    tag: '计数',
    body: '<p>三个可疑点中，$x=0$、$x=2$ 极限出现 $\\infty$ 均为第二类；$x=1$ 左右极限同为 $\\mathrm e$，是第一类（可去）。<b>第一类间断点个数 $=1$</b>。</p>',
    log: '第一类间断点只有 x=1，个数为 1' },
  { title: '干扰项复盘',
    cls: 'bad',
    tag: '防坑',
    body: '<p><b>A（3 个）</b>：把 $x=0,2$ 也计入——它们的极限是 $\\infty$，属第二类。<b>B（2 个）</b>：多算了 $x=2$，其左极限 $+\\infty$ 一票否决。<b>D（0 个）</b>：见 $\\ln\\lvert x\\rvert\\to0$ 就以为极限不存在，漏掉了极限恰为 $\\mathrm e$ 的可去间断点 $x=1$。</p>',
    log: 'A/B 多算第二类点，D 漏掉 x=1' },
  { title: '结论',
    cls: 'good',
    tag: '完成',
    body: '<p>答案选 <b>C</b>。记忆锚点：幂指函数<b>先取对数降维</b>；判第一类只看<b>左右极限是否都有限</b>——一侧为无穷即第二类，一票否决。</p>',
    log: '选 C：第一类间断点仅 x=1 一个' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: s.tag || ('第 ' + (i + 1) + ' 步'),
    log: s.log || s.title,
    count: i,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$f(x)=|x|^{\\frac{1}{(1-x)(x-2)}}$ 的第一类间断点判别',
  subtitle: '考点：连续与间断 · 方法：取对数降维 → 可疑点 0、1、2 逐个求左右极限',
  counterLabel: '判别点',
  ribbonTitle: '可疑点判别（✓ 第一类 / ✗ 第二类）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C（第一类间断点 1 个）',
    html: '记忆锚点：<b>幂指型先取对数降维</b>。$x=0$：$f\\approx|x|^{-\\frac12}\\to+\\infty$；$x=2$：左侧 $f\\to+\\infty$——都是第二类。$x=1$：$\\ln f\\sim\\dfrac{-1}{x-2}\\to1$，$f\\to\\mathrm e$，可去间断点。口诀：<b>左右极限都有限才谈第一类，无穷一票否决</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
