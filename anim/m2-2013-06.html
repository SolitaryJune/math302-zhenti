<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念动画：四个象限上二重积分的符号（2013 年第 6 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>$I_k=\\iint_{D_k}(y-x)\\,\\mathrm dx\\,\\mathrm dy$，$D_k$ 是单位圆在第 $k$ 象限的四分之一扇形。不硬算——先看<b>对称性</b>与<b>被积函数符号</b>。</p>' },
  { title: '一、三象限：关于 y=x 对称', cls: '',
    body: '<p>$D_1$、$D_3$ 都关于直线 $y=x$ 对称。作代换 $(x,y)\\mapsto(y,x)$ 区域不变，而被积函数变号：</p>' +
          '<p>$$I_k=\\iint_{D_k}(x-y)\\,\\mathrm dx\\,\\mathrm dy=-I_k\\;\\Rightarrow\\;I_1=I_3=0.$$</p>' },
  { title: '排除 A：I1 = 0', cls: 'bad',
    body: '<p>$I_1=0$，不满足"$&gt;0$"。<b>排除 A</b>。</p>' },
  { title: '排除 C：I3 = 0', cls: 'bad',
    body: '<p>$I_3=0$，同理不满足。<b>排除 C</b>。</p>' },
  { title: '第二象限：y−x 恒正', cls: 'good',
    body: '<p>第二象限内 $x&lt;0$、$y&gt;0$，两个加项都非负且不同时为零，于是区域内恒有</p>' +
          '<p>$$y-x=y+(-x)&gt;0.$$</p>' +
          '<p>正函数的积分必为正：<b>$I_2&gt;0$ ✓</b>。</p>' },
  { title: '第四象限：y−x 恒负', cls: 'bad',
    body: '<p>第四象限内 $x&gt;0$、$y&lt;0$，故 $y-x&lt;0$ 恒成立，$I_4&lt;0$。不满足。<b>排除 D</b>。</p>' },
  { title: '结论：唯一正的是 I2 ✓', cls: 'good',
    body: '<p>四个象限盘完：$I_1=I_3=0$，$I_2&gt;0$，$I_4&lt;0$。唯一成立的选项是 <b>B</b>。</p>' },
];

var RIBBONS = [null, null, {k:1, ok:false}, {k:3, ok:false},
  {k:2, ok:true}, {k:4, ok:false}, null];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step')),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    count: i + 1,
    ribbon: RIBBONS[i],
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$I_k=\\iint_{D_k}(y-x)\\,\\mathrm dx\\,\\mathrm dy$ 的符号判定',
  subtitle: '考点：二重积分对称性 · 方法：对称归零 → 定号区间',
  ribbonTitle: '选项判定（A=1 · B=2 · C=3 · D=4）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B：$I_2&gt;0$',
    html: '记忆锚点：<b>区域关于 $y=x$ 对称 + 被积函数对换 $x,y$ 变号 ⇒ 积分为 0</b>；一、三象限正中这一条。第二象限 $y-x$ 恒正、第四象限恒负。别硬算，符号与对称性先走。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
