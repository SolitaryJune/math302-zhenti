<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念动画：AB=C 的列视角与行视角（2013 年第 7 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>$AB=C$，$B$ 可逆。问哪两组向量等价。工具：<b>列视角</b>与<b>行视角</b>看矩阵乘法——"左乘动行，右乘动列"。</p>' },
  { title: '列视角：C 的列 ← A 的列', cls: 'key',
    body: '<p>$C$ 的第 $j$ 列 $=$ $A$ 的各列以 $B$ 的第 $j$ 列元素为系数的线性组合：</p>' +
          '<p>$$\\gamma_j=\\sum_k b_{kj}\\,\\alpha_k.$$</p>' +
          '<p>所以 $C$ 的列向量组可由 $A$ 的列向量组线性表示。</p>' },
  { title: '反方向：A = C·B⁻¹', cls: 'good',
    body: '<p>$B$ 可逆给出 $A=CB^{-1}$，同理 $A$ 的列可由 $C$ 的列表示。两个方向都通，两组列向量<b>互相可表示</b>——列向量组等价！</p>' },
  { title: '行视角：C 的行 ← B 的行', cls: '',
    body: '<p>从行看 $C=AB$：$C$ 的第 $i$ 行是 $\\sum_k a_{ik}\\,(B$ 的第 $k$ 行$)$——被组合的是 <b>$B$ 的行</b>，不是 $A$ 的行。</p>' },
  { title: '排除 A：C 行与 A 行', cls: 'bad',
    body: '<p>$C$ 的行由 $B$ 的行组合而成，$A$ 的行只是"系数"；要谈 $C$ 行与 $A$ 行互相表示，题目没有任何工具。<b>排除 A</b>。</p>' },
  { title: '排除 C：C 行与 B 行只有单向', cls: 'bad',
    body: '<p>"$C$ 的行可由 $B$ 的行表示"是单向的；反向需要 $A$ 可逆（$B=A^{-1}C$），题目只说 $B$ 可逆。<b>排除 C</b>。</p>' },
  { title: '排除 D：B 是系数不是对象', cls: 'bad',
    body: '<p>$C$ 的列是 $A$ 的列的组合（$B$ 提供系数），与 $B$ 自己的列向量组无互相表示关系。<b>排除 D</b>。</p>' },
  { title: '结论：B 的列向量组等价 ✓', cls: 'good',
    body: '<p>右乘可逆矩阵 $=$ 对列做<b>可逆</b>线性变换，列空间不变。$A$ 与 $C$ 的列向量组等价，答案选 <b>B</b>。</p>' },
];

var RIBBONS = [null, null, null, null,
  {k:1, ok:false}, {k:3, ok:false}, {k:4, ok:false}, {k:2, ok:true}];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step')),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    count: i + 1,
    ribbon: RIBBONS[i],
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$AB=C$（$B$ 可逆）与向量组等价',
  subtitle: '考点：向量组的等价 · 方法：列视角 / 行视角 + 乘法的可逆性',
  ribbonTitle: '选项判定（A=1 · B=2 · C=3 · D=4）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：<b>左乘动行，右乘动列</b>。右乘可逆矩阵 $B$ 相当于对 $A$ 的列做可逆线性变换，列空间不变 ⇒ $A$、$C$ 的列向量组等价；行向量组没有这种保证（表示者是 $B$ 的行，且只有单向）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
