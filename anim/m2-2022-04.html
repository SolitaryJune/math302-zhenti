<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：变限积分函数的偏导关系</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$F(x,y)=\\displaystyle\\int_0^{x-y}(x-y-t)f(t)\\,\\mathrm{d}t$ 的偏导关系',
  subtitle: '考点：变限积分求导 · 方法：拆出 $u=x-y$ → 对 $u$ 求导 → 链式回代',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示求导链。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：被积因子 $(x-y-t)f(t)$ 含上限变量，不能直接套公式 —— 令 $u=x-y$，拆成 $$F=u\\int_0^u f(t)\\,\\mathrm{d}t-\\int_0^u t f(t)\\,\\mathrm{d}t$$',
      '<b>对 $u$ 求导</b>（乘积法则，$uf(u)$ 两项抵消）：$$F\'(u)=\\int_0^u f\\,\\mathrm{d}t+u f(u)-u f(u)=\\int_0^u f(t)\\,\\mathrm{d}t$$',
      '<b>回代求 $F_x$</b>（$u_x=1$）：$$F_x=F\'(u)\\cdot1=\\int_0^{x-y}f(t)\\,\\mathrm{d}t$$',
      '<b>回代求 $F_y$</b>（$u_y=-1$）：$$F_y=F\'(u)\\cdot(-1)=-\\int_0^{x-y}f(t)\\,\\mathrm{d}t\\ \\Longrightarrow\\ F_x=-F_y$$',
      '<b>二阶：$F_{xx}$</b>：$$F_{xx}=\\frac{\\partial}{\\partial x}\\int_0^{x-y}f\\,\\mathrm{d}t=f(x-y)\\cdot1=f(x-y)$$',
      '<b>二阶：$F_{yy}$</b>（外层负号 $\\times$ $u_y=-1$，负负得正）：$$F_{yy}=\\frac{\\partial}{\\partial y}\\Bigl(-\\int_0^{x-y}f\\,\\mathrm{d}t\\Bigr)=-f(x-y)\\cdot(-1)=f(x-y)$$',
      '<b>结论</b>：$F_x=-F_y$ 且 $F_{xx}=F_{yy}$，<b>选 C</b>',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'拆变量',   log:'令 u=x−y，把含 x,y 的因子提出积分号外', count:0 },
    { cls:'shift', tag:'对u求导',  log:'乘积法则展开后 u f(u) 两项恰好抵消', count:1 },
    { cls:'step',  tag:'求F_x',    log:'u 对 x 的导数是 1，F_x 就是 ∫f', count:2 },
    { cls:'ok',    tag:'一阶关系', log:'u 对 y 的导数是 −1，F_y 带负号，F_x = −F_y', count:3 },
    { cls:'step',  tag:'求F_xx',   log:'再求导，上限 x−y 对 x 导为 1，得 f(x−y)', count:4 },
    { cls:'ok',    tag:'二阶关系', log:'F_yy 链上两个负号相乘得正，F_xx = F_yy = f(x−y)', count:5 },
    { cls:'done',  tag:'完成',     log:'结论：一阶反号、二阶相等，选 C', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$F_x=-F_y,\\ \\ F_{xx}=F_{yy}$（选 C）',
    html: '记忆锚点：<b>含参变限积分先拆出组合变量</b>：$F\'(u)=\\int_0^u f$（$uf(u)$ 抵消）。一阶差个 $u_y=-1$ 的符号；二阶时外层负号与 $u_y=-1$ 负负得正，$F_{xx}=F_{yy}=f(x-y)$。易错：把一阶写成 $F_x=F_y$、或把二阶写成相反数。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
