<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>m2-2025-21 · 差商递增 ⟺ 导函数严格递增</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：两个方向，两件工具',
    cls: 'key',
    body: '<p>要证：<b>$f\\prime$ 严格增 $\\iff$ 任意 $x_1<x_2<x_3$ 的两个差商严格递增</b>。</p>'
      + '<p>$$\\frac{f(x_2)-f(x_1)}{x_2-x_1}<\\frac{f(x_3)-f(x_2)}{x_3-x_2}\\qquad(\\ast)$$</p>'
      + '<p>「$\\Rightarrow$」把差商<b>变成</b>导数值：拉格朗日中值定理；「$\\Leftarrow$」把差商<b>挤成</b>导数：导数定义取极限。全程只假设 $f$ 可导，$f\\prime$ 不必连续。</p>' },
  { title: '必要性：中值定理一步到位',
    cls: 'good',
    body: '<p>对 $f$ 分别在 $[x_1,x_2]$、$[x_2,x_3]$ 用拉格朗日中值定理：存在 $\\xi_1\\in(x_1,x_2)$、$\\xi_2\\in(x_2,x_3)$，</p>'
      + '<p>$$\\frac{f(x_2)-f(x_1)}{x_2-x_1}=f\\prime(\\xi_1),\\qquad \\frac{f(x_3)-f(x_2)}{x_3-x_2}=f\\prime(\\xi_2)$$</p>'
      + '<p>由 $\\xi_1<x_2<\\xi_2$ 知 $\\xi_1<\\xi_2$；$f\\prime$ 严格增 $\\Rightarrow$ 两差商严格小于 ✓。</p>' },
  { title: '充分性·架设：插入中间点 c',
    cls: 'key',
    body: '<p>设 $(\\ast)$ 成立。任取 $s<t$，取 $c\\in(s,t)$。$(\\ast)$ 只连接<b>相邻三点</b>，所以把 $[s,t]$ 拆成 $[s,c]$、$[c,t]$ 两段处理：</p>'
      + '<p>$$s<x<c<t\\ \\text{与}\\ s<c<y<t$$</p>' },
  { title: '充分性·左端夹逼',
    cls: 'step',
    body: '<p>对三点 $s<x<c$ 用 $(\\ast)$：$\\dfrac{f(x)-f(s)}{x-s}<\\dfrac{f(c)-f(x)}{c-x}$。令 $x\\to s^+$，左端 $\\to f\\prime(s)$，右端 $\\to \\dfrac{f(c)-f(s)}{c-s}$，取极限只能保不严格：</p>'
      + '<p>$$f\\prime(s)\\le\\frac{f(c)-f(s)}{c-s}\\qquad(1)$$</p>' },
  { title: '充分性·右端夹逼',
    cls: 'step',
    body: '<p>对三点 $c<y<t$ 用 $(\\ast)$：$\\dfrac{f(y)-f(c)}{y-c}<\\dfrac{f(t)-f(y)}{t-y}$。令 $y\\to t^-$，得</p>'
      + '<p>$$\\frac{f(t)-f(c)}{t-c}\\le f\\prime(t)\\qquad(2)$$</p>' },
  { title: '中间的严格式是灵魂',
    cls: 'bad',
    body: '<p>三次取极限都只能得 $\\le$，严格号哪来？——对三点 $s<c<t$ <b>直接</b>用 $(\\ast)$，不经任何极限：</p>'
      + '<p>$$\\frac{f(c)-f(s)}{c-s}<\\frac{f(t)-f(c)}{t-c}\\qquad(3)$$</p>' },
  { title: '串链收尾',
    cls: 'good',
    body: '<p>把 $(1)(3)(2)$ 串起来：</p>'
      + '<p>$$f\\prime(s)\\le\\frac{f(c)-f(s)}{c-s}\\ \\overset{(3)}{<}\\ \\frac{f(t)-f(c)}{t-c}\\le f\\prime(t)$$</p>'
      + '<p>故 $f\\prime(s)<f\\prime(t)$；由 $s<t$ 任意，$f\\prime$ 在 $(a,b)$ 内严格增。两个方向合起来，充要条件得证 ✓。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '证明：$f\\prime$ 严格增 $\\iff$ 差商递增（2025 年解答压轴证明）',
  subtitle: '考点：拉格朗日中值定理 + 导数定义夹逼 · 双向证明',
  intro: '点击「▶ 播放」逐步展开证明推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '充要条件成立（f′ 严格增 ⟺ 差商递增）',
    html: '记忆锚点：<b>「$\\Rightarrow$」中值定理变差商为导数值；「$\\Leftarrow$」中间点 $c$ 两侧取极限夹出 $\\le$，再用三点严格式 $(3)$ 保住严格号</b>。'
      + '易错：取极限后仍写 $<$（只能 $\\le$）；必要性忘记说明 $\\xi_1<x_2<\\xi_2$；误对 $f\\prime$ 再用中值定理（$f\\prime$ 未必连续）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
