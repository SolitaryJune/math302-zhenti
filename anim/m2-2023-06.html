<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：含参反常积分 f(α) 的最小值点</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$f(\\alpha)=\\displaystyle\\int_2^{+\\infty}\\frac{\\mathrm dx}{x(\\ln x)^{\\alpha+1}}$ 的最小值点',
  subtitle: '考点：含参反常积分 + 最值 · 方法：换元 $u=\\ln x$ → 取对数求导',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示：先算出 f(α)，再求最小值点。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题换元</b>：被积函数自带 $\\dfrac1x$，令 $u=\\ln x$（$\\mathrm du=\\dfrac{\\mathrm dx}x$，$u:\\ln2\\to+\\infty$）$$f(\\alpha)=\\int_{\\ln2}^{+\\infty}\\frac{\\mathrm du}{u^{\\alpha+1}}$$',
      '<b>收敛域</b>：$p$ 型积分收敛 $\\iff p=\\alpha+1>1\\iff\\alpha>0$——这是 $f(\\alpha)$ 的定义域',
      '<b>算出显函数</b>：$$f(\\alpha)=\\Bigl[\\frac{u^{-\\alpha}}{-\\alpha}\\Bigr]_{\\ln2}^{+\\infty}=\\frac{(\\ln2)^{-\\alpha}}{\\alpha}\\quad(\\alpha>0)$$',
      '<b>取对数求导</b>：$$\\ln f=-\\alpha\\ln(\\ln2)-\\ln\\alpha\\quad\\Rightarrow\\quad\\bigl(\\ln f\\bigr)\'=-\\ln(\\ln2)-\\frac1\\alpha$$',
      '<b>解驻点</b>：$-\\ln(\\ln2)-\\dfrac1\\alpha=0\\Rightarrow\\alpha_0=-\\dfrac1{\\ln(\\ln2)}$；因 $0<\\ln2<1$，$\\ln(\\ln2)<0$，故 $\\alpha_0>0$ 落在定义域内',
      '<b>判最小</b>：$\\bigl(\\ln f\\bigr)\'\'=\\dfrac1{\\alpha^2}>0$，凸函数唯一驻点即全局最小值点 $$\\alpha_0=-\\frac1{\\ln(\\ln2)}\\qquad\\Rightarrow\\qquad \\text{选 A}$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'换元',   log:'看到 1/x 配 dx，就令 u=ln x，积分下限变成 ln2', count:0 },
    { cls:'step',  tag:'收敛域', log:'p 型积分收敛要求指数大于 1，即 α 大于 0', count:1 },
    { cls:'shift', tag:'求值',   log:'上限处指数衰减到 0，只剩代入下限的项', count:2 },
    { cls:'shift', tag:'取对数', log:'对 f 取对数再求导，比直接求导省事', count:3 },
    { cls:'step',  tag:'驻点',   log:'令导数为零解出 α，注意取倒数；ln(ln2) 是负的，驻点为正', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：二阶导恒正，唯一驻点即最小值点，选 A', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\alpha_0=-\\dfrac{1}{\\ln(\\ln 2)}$（选 A）',
    html: '记忆锚点：<b>含参反常积分先「算成显函数」再谈最值</b>；$\\dfrac1x\\,\\mathrm dx=\\mathrm d(\\ln x)$ 是天然换元信号。易错：$-\\ln(\\ln2)-\\dfrac1\\alpha=0$ 解出的是 $-\\dfrac1{\\ln(\\ln2)}$（要取倒数），不是 $-\\ln(\\ln2)$；$\\alpha\\le0$ 时积分发散，驻点必须在定义域内才有效。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
