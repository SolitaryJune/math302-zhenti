<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画：水压力微元法</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '等腰直角三角形平板的水压力：$F=?$',
  subtitle: '考点：定积分应用（物理） · 方法：微元法——压强 × 该深度的板宽',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步搭建微元并积分。几何说明：斜边长 $2a$ 与水面齐平，直角顶点朝下，板呈上宽下尖状。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>几何翻译</b>：等腰直角三角形斜边 $2a$ 在水面、直角顶点朝下；斜边上的高 $=\\dfrac{2a}{2}=a$，板的最深处在水下 $a$',
      '<b>建立坐标与宽度函数</b>：水面 $y=0$、向下为正；宽度线性递减：$y=0$ 宽 $2a$、$y=a$ 宽 $0$：$$\\ell(y)=2a\\left(1-\\frac{y}{a}\\right)=2(a-y),\\quad 0\\le y\\le a$$',
      '<b>压力微元</b>：深度 $y$ 处压强 $\\rho gy$，窄条面积 $\\ell(y)\\,\\mathrm{d}y$：$$\\mathrm{d}F=\\rho g\\,y\\cdot2(a-y)\\,\\mathrm{d}y$$',
      '<b>积分</b>：$$F=\\int_0^{a}2\\rho g\\,(ay-y^2)\\,\\mathrm{d}y=2\\rho g\\left[\\frac{ay^2}{2}-\\frac{y^3}{3}\\right]_0^{a}$$',
      '<b>代入上限</b>：$F=2\\rho g\\left(\\dfrac{a^3}{2}-\\dfrac{a^3}{3}\\right)=2\\rho g\\cdot\\dfrac{a^3}{6}$',
      '<b>答案：$F=\\dfrac{1}{3}a^3\\rho g$</b>',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'几何',   log:'斜边 2a 在水面，顶点朝下；斜边上的高是斜边的一半，最深 a', count:0 },
    { cls:'step',  tag:'宽度',   log:'上宽下尖、线性变窄：深度 y 处宽 2(a−y)', count:1 },
    { cls:'step',  tag:'微元',   log:'压强 ρg 乘深度 y，再乘窄条面积，得压力微元', count:2 },
    { cls:'step',  tag:'积分',   log:'从 0 到 a 积 ay − y²，写出原函数', count:3 },
    { cls:'ok',    tag:'求值',   log:'代入上限：2ρg × (a³/2 − a³/3) = 2ρg × a³/6', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：水压力 F = a³ρg/3', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$F=\\dfrac{1}{3}a^3\\rho g$',
    html: '记忆锚点：<b>压力微元 $\\mathrm{d}F=\\rho g\\,y\\,\\ell(y)\\,\\mathrm{d}y$</b>：压强 $\\rho gy$ 随深度线性长、板宽 $\\ell(y)=2(a-y)$ 随深度线性缩，两条直线相乘积分出 $\\frac13a^3\\rho g$。易错：三角形最深处是水下 $a$（斜边上的高 = 斜边的一半），不是 $2a$；漏掉深度 $y$ 积出来的是面积。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
