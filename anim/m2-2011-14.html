<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2011 数二第 14 题 · 二次型的正惯性指数</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（与模板一致，勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var LINES = [
  '<p><b>题面：</b>$f=x_1^2+3x_2^2+x_3^2+2x_1x_2+2x_1x_3+2x_2x_3$，求 $f$ 的正惯性指数。</p>',
  '<p><b>写矩阵、取免费信息：</b>$$A=\\begin{pmatrix}1&1&1\\\\1&3&1\\\\1&1&1\\end{pmatrix}.$$第 1 行与第 3 行相同 $\\Rightarrow\\det A=0$、$r(A)=2$，必有零特征值。</p>',
  '<p><b>配方（集中含 $x_1$ 的项）：</b>$$x_1^2+2x_1(x_2+x_3)=\\bigl(x_1+x_2+x_3\\bigr)^2-\\bigl(x_2+x_3\\bigr)^2.$$</p>',
  '<p><b>整理余项：</b>$$3x_2^2+x_3^2+2x_2x_3-\\bigl(x_2+x_3\\bigr)^2=2x_2^2.$$</p>',
  '<p><b>标准形：</b>$$f=\\bigl(x_1+x_2+x_3\\bigr)^2+2x_2^2.$$两个正平方项、无负项。</p>',
  '<p><b>特征值口径核对：</b>$\\lambda_1+\\lambda_2=\\operatorname{tr}A=5>0$，$\\lambda_1\\lambda_2=$ 全体二阶主子式之和 $=2+0+2=4>0$，两个非零特征值同正。</p>',
  '<p><b>结论：</b>正惯性指数 $=2$。</p>'
];

var lineEls = [];

AW.init({
  title: '第 14 题 · 二次型 $f$ 的正惯性指数',
  subtitle: '考点：二次型标准形 · 方法：配方法（辅以特征值符号核对）',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示：写矩阵 → 配方 → 数正项 → 特征值核对。',
  ribbonTitle: '推导进度（✓ 完成）',
  build: function(stage){
    stage.innerHTML = '';
    lineEls = [];
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>（每步揭示一行，公式由 KaTeX 渲染）'));
    LINES.forEach(function(h){
      var d = AW.el('div', 'aw-stepcard', h);
      d.style.display = 'none';
      wrap.appendChild(d);
      lineEls.push(d);
    });
    stage.appendChild(wrap);
  },
  snaps: [
    { cls:'step',  tag:'审题', count:0, reveal:1 },
    { cls:'shift', tag:'写矩阵', log:'第 1、3 行相同，行列式为 0，秩为 2，必有零特征值', count:1, reveal:2, hl:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'配方', log:'把含 x₁ 的项集中，配成 (x₁+x₂+x₃)² 再减去多余部分', count:2, reveal:3, hl:2, ribbon:{k:2, ok:true} },
    { cls:'step',  tag:'整理', log:'余项相消后只剩 2x₂²', count:3, reveal:4, hl:3, ribbon:{k:3, ok:true} },
    { cls:'step',  tag:'标准形', log:'标准形只有两个正平方项，没有负项', count:4, reveal:5, hl:4, ribbon:{k:4, ok:true} },
    { cls:'step',  tag:'核对', log:'换个口径：非零特征值之和 5>0、之积 4>0，同正', count:5, reveal:6, hl:5, ribbon:{k:5, ok:true} },
    { cls:'done',  tag:'结论', log:'结论：正惯性指数 = 2', count:6, reveal:7, hl:6, good:true, done:true, ribbon:{k:6, ok:true} },
  ],
  render: function(stage, sn){
    for(var j = 0; j < lineEls.length; j++){
      lineEls[j].style.display = (j < (sn.reveal || 0)) ? '' : 'none';
      lineEls[j].className = 'aw-stepcard' + (sn.hl === j ? (sn.good ? ' good' : ' key') : '');
    }
    renderMathAfterSnap(stage);
  },
  result: {
    big: '正惯性指数 = 2',
    html: '配方法：<b>$f=(x_1+x_2+x_3)^2+2x_2^2$</b>，两个正平方项、无负项 ⇒ 正惯性指数 $2$。特征值口径：$r(A)=2$、非零特征值和 $\\operatorname{tr}A=5>0$、积 $4>0$，同正。易错：秩 $=2$ 不等于惯性指数 $=2$，正负性要另判；交叉项 $2x_ix_j$ 必须进入配方。',
  },
});
</script>
</body>
</html>
