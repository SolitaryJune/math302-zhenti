<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2015·09 参数方程求二阶导数</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 推导板各行：与 snaps 一一对应（build 建立、render 按 i 点亮）
var ROWS = [
  { label: '第 0 步 · 审题与流程',
    h: '<p>$x=\\arctan t,\\ y=3t+t^3$，求 $\\left.\\dfrac{\\mathrm{d}^2y}{\\mathrm{d}x^2}\\right|_{t=1}$。流程：先算 $\\dfrac{\\mathrm{d}y}{\\mathrm{d}x}$，再对 $t$ 求导，最后<b>再除一次</b> $\\dfrac{\\mathrm{d}x}{\\mathrm{d}t}$。</p>' },
  { label: '第 1 步 · 备好两个一阶导',
    h: '<p>$\\dfrac{\\mathrm{d}x}{\\mathrm{d}t}=\\dfrac{1}{1+t^2},\\qquad \\dfrac{\\mathrm{d}y}{\\mathrm{d}t}=3+3t^2=3(1+t^2).$</p>' },
  { label: '第 2 步 · 相除得一阶导 dy/dx',
    h: '<p>$\\dfrac{\\mathrm{d}y}{\\mathrm{d}x}=\\dfrac{3(1+t^2)}{1/(1+t^2)}=3(1+t^2)^2.$</p>' },
  { label: '第 3 步 · 一阶导对 t 求导',
    h: '<p>$\\dfrac{\\mathrm{d}}{\\mathrm{d}t}\\Big[3(1+t^2)^2\\Big]=3\\cdot 2(1+t^2)\\cdot 2t=12t(1+t^2).$（链式：内层导数 $2t$ 别丢）</p>' },
  { label: '第 4 步 · 再除一次 x′(t)',
    h: '<p>$\\dfrac{\\mathrm{d}^2y}{\\mathrm{d}x^2}=\\dfrac{12t(1+t^2)}{1/(1+t^2)}=12t(1+t^2)^2.$</p>' },
  { label: '第 5 步 · 代入 t=1',
    h: '<p>$\\left.\\dfrac{\\mathrm{d}^2y}{\\mathrm{d}x^2}\\right|_{t=1}=12\\cdot1\\cdot(1+1)^2=12\\cdot4=\\boxed{48}.$</p>' },
];

var rowEls = [];

AW.init({
  title: '$x=\\arctan t,\\ y=3t+t^3$ 的二阶导数',
  subtitle: '考点：参数方程求导 · 方法：dy/dx → 对 t 求导 → 再除以 dx/dt',
  counterLabel: '步骤',
  intro: '点击「▶ 播放」逐步演示推导板上的六步计算。',

  build: function(stage){
    stage.innerHTML = '';
    rowEls = [];
    var wrap = AW.el('div', 'aw-scroll');
    ROWS.forEach(function(r){
      var d = AW.el('div', '');
      d.style.cssText = 'padding:9px 14px;margin:8px 0;border-left:4px solid transparent;border-radius:10px;opacity:.15;transition:opacity .35s,background .35s,border-color .35s;';
      d.innerHTML = '<div style="font-size:12.5px;color:#64748b;font-weight:700;margin-bottom:2px">' + r.label + '</div>' + r.h;
      wrap.appendChild(d);
      rowEls.push(d);
    });
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',     log:'流程三步走：一阶导 → 对 t 求导 → 再除 x′', count:0 },
    { cls:'ok',    tag:'备料',    log:'dx/dt=1/(1+t²)，dy/dt=3(1+t²)', count:1 },
    { cls:'ok',    tag:'一阶导',  log:'相除约去 (1+t²)，得 dy/dx=3(1+t²)²', count:2 },
    { cls:'shift', tag:'再求导',  log:'一阶导对 t 求导（链式带内层 2t）得 12t(1+t²)', count:3 },
    { cls:'ok',    tag:'再除一次', log:'除以 dx/dt=1/(1+t²)，得 12t(1+t²)²', count:4 },
    { cls:'done',  tag:'完成',    log:'代 t=1：12·1·4=48', count:5, done:true },
  ],

  render: function(stage, sn, i){
    rowEls.forEach(function(d, j){
      d.style.opacity = j <= i ? '1' : '.15';
      d.style.borderLeftColor = j < i ? '#16a34a' : (j === i ? '#d97706' : 'transparent');
      d.style.background = j === i ? '#fffbeb' : (j < i ? '#f6fef9' : 'transparent');
    });
    renderMathAfterSnap(stage);
  },

  result: {
    big: '48',
    html: '记忆锚点：<b>二阶导 = 「一阶导对 $t$ 的导数」再除以 $\\dfrac{\\mathrm{d}x}{\\mathrm{d}t}$</b>——漏掉最后这次相除会得到 24（最常见错答）。链式求导的内层因子 $2t$ 也不能丢。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
