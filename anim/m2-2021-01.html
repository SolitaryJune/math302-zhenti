<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2021·01 变限积分无穷小的阶</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [
  "<b>① 审题：</b>比较 $\\displaystyle\\int_0^{x^2}\\left(\\mathrm{e}^{t^3}-1\\right)\\mathrm{d}t$ 与 $x^7$ 的阶——四选一只看 $\\lim\\dfrac{F(x)}{x^7}$ 是 $\\infty$、非零常数、$1$ 还是 $0$",
  "<b>② 等价替换：</b>$x\\to0$ 时上限 $x^2\\to0$，故 $t\\to0$，$\\mathrm{e}^{t^3}-1\\sim t^3$，被积主部是 $t^3$",
  "<b>③ 积一次升一阶：</b>$\\displaystyle\\int_0^{x^2}t^3\\,\\mathrm{d}t=\\frac{\\left(x^2\\right)^4}{4}=\\frac{x^8}{4}$——$3+1=4$ 阶，上限再乘 $2$ 阶",
  "<b>④ 读出阶数：</b>$F(x)\\sim\\dfrac{x^8}{4}$，是 $x$ 的 $8$ 阶无穷小",
  "<b>⑤ 比阶：</b>$\\displaystyle\\lim_{x\\to0}\\frac{F(x)}{x^7}=\\lim_{x\\to0}\\frac{x^8/4}{x^7}=\\lim_{x\\to0}\\frac{x}{4}=0$",
  "<b>⑥ 洛必达交叉验证：</b>$F'(x)=\\left(\\mathrm{e}^{x^6}-1\\right)\\cdot2x\\sim2x^7$，与 $7x^6$ 相除得 $\\dfrac{2x}{7}\\to0$，结论一致",
  "<b>⑦ 结论：</b>比值为 $0$，$F(x)$ 趋零比 $x^7$ 更快——是 $x^7$ 的<b>高阶无穷小</b>，选 C"
];

AW.init({
  title: '2021·01　变限积分是 $x^7$ 的什么无穷小',
  subtitle: '考点：变限积分估阶 · 等价无穷小 $\\mathrm{e}^{u}-1\\sim u$ · 阶 = 被积阶 $+1$ 再乘上限阶',
  counterLabel: '已推导',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，逐步估出积分的阶并与 $x^7$ 比阶。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    this._rows = [];
    for (var i = 0; i < ROWS.length; i++){
      var r = AW.el('div', 'aw-stepcard', ROWS[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'四选一的阶关系题，只看积分与 x 七次方比值的极限落在哪一档', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'等价',   log:'被积函数用等价无穷小换成 t 的三次方', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'积分',   log:'积一次从三阶升到四阶，上限平方再乘二，得到八分之 x 八次方', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'定阶',   log:'整个积分是八阶无穷小', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'比阶',   log:'除以 x 七次方后剩四分之 x，趋于零', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'验证',   log:'换洛必达再算一遍，分子导数等价于二倍 x 七次方，比值同样趋零', count:5, ribbon:{k:6, ok:true} },
    { cls:'done',  tag:'完成',   log:'结论：比值趋零，积分是 x 七次方的高阶无穷小，选 C', count:6, ribbon:{k:7, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '选 C　$\\int_0^{x^2}\\left(\\mathrm{e}^{t^3}-1\\right)\\mathrm{d}t\\sim\\dfrac{x^8}{4}$ 是 $x^7$ 的高阶无穷小',
    html: '记忆锚点：<b>被积函数 $t^k$ 阶 → 积分升 1 阶 → 再乘上限的阶</b>（$3+1$ 后 $\\times2=8$）。易错：比阶方向记反（趋 0 是高阶不是低阶）；上限 $x^2$ 忘乘它的阶。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
