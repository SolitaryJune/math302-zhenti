<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2024·16 线性相关且两两无关定参</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

/* 推导行工具：acc 取 key/ok/bad/blue 决定高亮色；未揭示时隐去 */
var ACC = { key:'#f59e0b', ok:'#22c55e', bad:'#ef4444', blue:'#3b82f6' };
var BGS = { key:'#fffbeb', ok:'#f6fef9', bad:'#fff8f8', blue:'#eff6ff' };
function row(accent, html){
  var d = AW.el('div', '', html);
  d.style.cssText = 'border-left:4px solid #cbd5e1;padding:7px 14px;margin:9px 0;border-radius:10px;'
    + 'opacity:0;transform:translateX(-12px);transition:all .45s ease;font-size:15px;line-height:2;';
  d.dataset.acc = accent;
  return d;
}

// 每行推导内容（html 里可写 $..$ / $$..$$ 公式）
var ROWS = [
  { acc: 'key', html: '<p><b>翻译成秩</b>：整体线性相关 $\\Rightarrow r(\\alpha_1,\\alpha_2,\\alpha_3)\\le2$；任意两个线性无关 $\\Rightarrow r\\ge2$。夹出 $$r(\\alpha_1,\\alpha_2,\\alpha_3)=2.$$ 以三向量为列作 $4\\times3$ 矩阵 $\\boldsymbol A$，秩为 2 等价于<b>所有 3 阶子式全为零</b>。</p>' },
  { acc: 'blue', html: '<p><b>子式①（取 1、2、4 行）</b>：$$\\begin{vmatrix}a&1&1\\\\1&1&a\\\\1&a&1\\end{vmatrix}=-a^3+3a-2=-(a-1)^2(a+2)=0\\ \\Longrightarrow\\ a=1\\ \\text{或}\\ a=-2.$$</p>' },
  { acc: 'blue', html: '<p><b>子式②（取 1、3、4 行）</b>：$$\\begin{vmatrix}a&1&1\\\\-1&b&-1\\\\1&a&1\\end{vmatrix}=a^2+ab-a-b=0.$$</p>' },
  { acc: 'bad', html: '<p><b>情形 $a=1$（舍）</b>：子式②化为 $1+b-1-b=0$，恒成立、对 $b$ 无约束——但此时 $$\\alpha_1=(1,1,-1,1)^{\\mathrm T}=\\alpha_3,$$ 第 1、3 列完全相同，违反"任意两个线性无关"，整组舍去。</p>' },
  { acc: 'ok', html: '<p><b>情形 $a=-2$</b>：代入子式②，$4-2b+2-b=6-3b=0$，得 $$b=2.$$</p>' },
  { acc: 'ok', html: '<p><b>回验</b>：$\\alpha_1=(-2,1,-1,1)^{\\mathrm T}$，$\\alpha_2=(1,1,2,-2)^{\\mathrm T}$，$\\alpha_3=(1,-2,-1,1)^{\\mathrm T}$。三者两两不成比例，且 $$\\alpha_1+\\alpha_2+\\alpha_3=(0,0,0,0)^{\\mathrm T},$$ 整体相关 ✓、两两无关 ✓。</p>' },
  { acc: 'ok', html: '<p><b>作答</b>：$$ab=(-2)\\times2=-4.$$</p>' },
];

AW.init({
  title: '$\\alpha_1,\\alpha_2,\\alpha_3$ 线性相关且两两无关，求 $ab$',
  subtitle: '考点：向量组的秩 · 方法：秩夹逼 = 2 → 3 阶子式全零 → 剔增根',
  counterLabel: '计算步',
  intro: '点击「▶ 播放」逐步演示推导。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>（每步揭示一行，最新一行高亮）'));
    var board = AW.el('div', '');
    this.rows = [];
    ROWS.forEach(function(r){
      var d = row(r.acc, r.html);
      board.appendChild(d);
      this.rows.push(d);
    }, this);
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },
  render: function(stage, sn, i){
    (this.rows || []).forEach(function(d, j){
      var on = j < i;
      d.style.opacity = on ? '1' : '0';
      d.style.transform = on ? 'none' : 'translateX(-12px)';
      d.style.borderLeftColor = on ? (ACC[d.dataset.acc] || ACC.blue) : '#cbd5e1';
      d.style.background = on ? (BGS[d.dataset.acc] || BGS.blue) : '#f8fafc';
    });
    renderMathAfterSnap(stage);
  },
  snaps: [
    { cls: 'key',  tag: '审题', log: '相关 ⟹ r≤2，两两无关 ⟹ r≥2：秩恰为 2', count: 0 },
    { cls: 'step', tag: '子式①', log: '1,2,4 行子式为零：a=1 或 a=−2', count: 1 },
    { cls: 'step', tag: '子式②', log: '1,3,4 行子式为零：a²+ab−a−b=0', count: 2 },
    { cls: 'miss', tag: '剔根', log: 'a=1 时 α₁=α₃，两两无关被破坏，舍', count: 3 },
    { cls: 'ok',   tag: '定 b', log: 'a=−2 代入：6−3b=0，b=2', count: 4 },
    { cls: 'ok',   tag: '回验', log: 'α₁+α₂+α₃=0 且两两不成比例，条件全满足', count: 5 },
    { cls: 'done', tag: '完成', log: '结论：ab = (−2)×2 = −4', count: 6, done: true },
  ],
  result: {
    big: '答案：ab = −4',
    html: '记忆锚点：<b>整体相关 + 两两无关 ⟺ 秩恰为 2</b>（相关压上限、两两无关抬下限）。$a=1$ 是子式方程的<b>增根</b>——它让 $\\alpha_1=\\alpha_3$，必须用"任意两个线性无关"剔除；$a=-2$ 配 $b=2$，且 $\\alpha_1+\\alpha_2+\\alpha_3=\\boldsymbol 0$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
