<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：核心定理「能表示则秩不增」',
    cls: 'key',
    body: '<p>(I) 可由 (II) 线性表示 $\\Rightarrow$ $r(\\boldsymbol\\alpha_1,\\cdots,\\boldsymbol\\alpha_r)\\le r(\\boldsymbol\\beta_1,\\cdots,\\boldsymbol\\beta_s)$。理由：(I) 的极大无关组可由 (II) 的极大无关组表示，「被表示」的秩不超过「表示者」的秩。</p>' },
  { title: '补一条常识：无关组的秩等于个数',
    cls: 'key',
    body: '<p>向量组线性无关 $\\iff$ 秩 $=$ 向量个数；线性相关 $\\iff$ 秩 $\\lt$ 向量个数。另外恒有 $r(\\mathrm{II})\\le s$（秩不超过组内向量个数）。两条合起来，链条是 $r(\\mathrm I)\\le r(\\mathrm{II})\\le s$。</p>' },
  { title: '选项 A：无关组被表示，个数被卡死',
    cls: 'good',
    ribbon: {k: 1, ok: true},
    body: '<p>(I) 无关 $\\Rightarrow r(\\mathrm I)=r$；代入链条 $r(\\mathrm I)\\le r(\\mathrm{II})\\le s$ 得 $r\\le s$。<b>推理闭合，A 正确</b>。</p>' },
  { title: '选项 B：相关组给不出 $r$ 与 $s$ 的大小',
    cls: 'bad',
    ribbon: {k: 2, ok: false},
    body: '<p>(I) 相关只给 $r(\\mathrm I)\\lt r$，对 $r$ 与 $s$ 的大小毫无约束。反例：$r=2$ 个相关向量（如 $\\boldsymbol\\alpha_2=2\\boldsymbol\\alpha_1$）可由 $s=3$ 个向量表示，此时 $r\\lt s$，推不出 $r\\gt s$。</p>' },
  { title: '选项 C：少数无关向量能表示多数相关向量',
    cls: 'bad',
    ribbon: {k: 3, ok: false},
    body: '<p>(II) 无关只给 $r(\\mathrm I)\\le s$；若 (I) 自身相关，$r$ 可以超过 $s$。反例：$\\boldsymbol\\beta_1\\neq\\boldsymbol0$（$s=1$，无关），取 $\\boldsymbol\\alpha_1=\\boldsymbol\\beta_1,\\ \\boldsymbol\\alpha_2=2\\boldsymbol\\beta_1$（$r=2$，相关），可表示但 $r=2\\gt s=1$。</p>' },
  { title: '选项 D：(II) 相关同样约束不了 $r$',
    cls: 'bad',
    ribbon: {k: 4, ok: false},
    body: '<p>(II) 相关只给 $r(\\mathrm{II})\\lt s$，与结论 $r\\gt s$ 无逻辑联系；反例同 B：相关组被更大的组表示，$r\\lt s$ 完全可能。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>「能表示 $\\Rightarrow$ 秩不增」+「无关组秩等于个数」共同推出：$r\\le s$。答案选 <b>A</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    ribbon: s.ribbon || undefined,
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2010 数学二 第7题 · 向量组 (I) 可由 (II) 线性表示，哪个推论成立',
  subtitle: '考点：线性表示与秩 · 方法：秩的传递链 $r(\\mathrm I)\\le r(\\mathrm{II})\\le s$ + 反例',
  intro: '点击「▶ 播放」逐步展开推理链：先立定理，再逐项用反例排除。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  ribbonTitle: '选项核对（✓ 正确 / ✗ 淘汰）',
  snaps: snaps,
  result: {
    big: '答案 A（(I) 无关 $\\Rightarrow r\\le s$）',
    html: '记忆锚点：<b>被表示的秩 $\\le$ 表示者的秩 $\\le$ 表示者的个数</b>；(I) 无关时 $r(\\mathrm I)=r$，链条闭合。B/C/D 的通病：相关、(II) 无关这些条件控制不了<b>个数</b> $r$ 与 $s$ 的大小——「一个向量可表示一串相关向量」是万能反例。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
