<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016 数二第 17 题 · 隐函数求极值（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2016·17　隐函数极值：$(x^{2}+y^{2})z+\\ln z+2(x+y+1)=0$',
  subtitle: '考点：隐函数求偏导 · 驻点 · <b>$AC-B^{2}$ 判别法</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看隐函数极值三步走如何落地。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '<b>题式：</b>$(x^{2}+y^{2})z+\\ln z+2(x+y+1)=0$ 确定 $z=z(x,y)$；注意 $\\ln z$ 隐含 $z>0$',
      '<b>① 一阶偏导：</b>$z_{x}\\Bigl(x^{2}+y^{2}+\\frac{1}{z}\\Bigr)=-(2xz+2)$；对 $y$ 同理 $z_{y}\\Bigl(x^{2}+y^{2}+\\frac{1}{z}\\Bigr)=-(2yz+2)$',
      '<b>② 驻点条件：</b>令 $z_{x}=z_{y}=0$：$2xz+2=0$ 且 $2yz+2=0\\ \\Rightarrow\\ x=y,\\ z=-\\frac{1}{x}$',
      '<b>③ 回代定驻点：</b>$2x+2+\\ln\\Bigl(-\\frac{1}{x}\\Bigr)=0\\ \\Rightarrow\\ x=-1$，此时 $z=1$，驻点 $(-1,-1)$',
      '<b>④ 二阶偏导（驻点处 $z_{x}=z_{y}=0$ 先化简）：</b>$z_{xx}\\cdot\\Bigl(x^{2}+y^{2}+\\frac1z\\Bigr)=-2z$，此处因子 $=3$，得 $A=z_{xx}=-\\frac{2}{3}$，对称 $C=-\\frac{2}{3}$，$B=z_{xy}=0$',
      '<b>⑤ 判别：</b>$AC-B^{2}=\\frac{4}{9}>0$ 且 $A=-\\frac{2}{3}<0\\ \\Rightarrow$ 极大值点',
      '<b>⑥ 结论：</b>极大值 $z(-1,-1)=1$'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'z 由方程隐式确定还带对数，要求 z 大于零，这是后面试根的紧箍咒', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'一阶',   log:'方程两边对 x 求偏导，把 z 的偏导数归拢到左端同一个因子上，对 y 同理', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'驻点',   log:'令两个一阶偏导同时为零，推出 x 等于 y 且 z 等于负 x 分之一', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'回代',   log:'代回原方程解出 x 等于负一、z 等于一，驻点是负一负一', count:3, ribbon:{k:4, ok:true} },
    { cls:'shift', tag:'二阶',   log:'再求一次导，驻点处一阶偏导为零的项全消失，三个二阶系数全部到手', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'判别',   log:'判别式九分之四大于零且 A 是负的，确认是极大值点', count:5, ribbon:{k:6, ok:true} },
    { cls:'done',  tag:'完成',   log:'极大值等于一', count:6, ribbon:{k:7, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '极大值 $z(-1,-1)=1$',
    html: '记忆锚点：<b>隐函数极值三步走：一阶偏导 → 驻点回代 → $AC-B^{2}$</b>。易错：$\\ln z$ 隐含 $z>0$，$z=-\\frac1x$ 只能在 $x<0$ 找根；二阶偏导先在驻点处用 $z_{x}=z_{y}=0$ 化简再算。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
