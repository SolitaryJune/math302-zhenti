<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2016·02 分段函数原函数的衔接</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 推导板各行：与 snaps 一一对应（build 建立、render 按 i 点亮）
var ROWS = [
  { label: '第 0 步 · 审题',
    h: '<p>$f(x)=\\begin{cases}2(x-1), & x<1\\\\ \\ln x, & x\\ge1\\end{cases}$。原函数 $F$ 要满足两条：<b>处处连续</b> + $F\'=f$。策略：分段积分 → 用 $x=1$ 处连续性定常数 → 回头验导。</p>' },
  { label: '第 1 步 · 左段积分',
    h: '<p>$x<1$：$\\displaystyle\\int 2(x-1)\\,\\mathrm dx=(x-1)^2+C_1$。四个选项左段都取了 $C_1=0$，分歧全在右段常数。</p>' },
  { label: '第 2 步 · 右段分部积分',
    h: '<p>$x\\ge1$：$$\\int\\ln x\\,\\mathrm dx=x\\ln x-\\int 1\\,\\mathrm dx=x(\\ln x-1)+C_2.$$</p>' },
  { label: '第 3 步 · 连续性定 C₂（成败在此）',
    h: '<p>左极限 $(1-1)^2=0$，右值 $\\ln 1-1+C_2=-1+C_2$。令 $-1+C_2=0$ 得 $\\boxed{C_2=1}$——右段应为 $x(\\ln x-1)+1$。</p>' },
  { label: '第 4 步 · 回头验导',
    h: '<p>$\\big[x(\\ln x-1)+1\\big]\'=\\ln x-1+1=\\ln x=f(x)$（$x>1$），且 $F(1)=0$ 与左段接上：导数、连续两关全过。</p>' },
  { label: '第 5 步 · 结论',
    h: '<p>$$F(x)=\\begin{cases}(x-1)^2, & x<1\\\\ x(\\ln x-1)+1, & x\\ge1\\end{cases}\\quad\\Rightarrow\\quad \\textbf{选 D}$$</p>' },
];

var rowEls = [];

AW.init({
  title: '分段函数 $f$ 的一个原函数（连续性定常数）',
  subtitle: '考点：原函数存在与分段衔接 · 方法：分段积分 → 连续性定 $C_2$ → 验导',
  counterLabel: '步骤',
  intro: '点击「▶ 播放」逐步演示推导板上的六步计算。',

  build: function(stage){
    stage.innerHTML = '';
    rowEls = [];
    var wrap = AW.el('div', 'aw-scroll');
    ROWS.forEach(function(r){
      var d = AW.el('div', '');
      d.style.cssText = 'padding:9px 14px;margin:8px 0;border-left:4px solid transparent;border-radius:10px;opacity:.15;transition:opacity .35s,background .35s,border-color .35s;';
      d.innerHTML = '<div style="font-size:12.5px;color:#64748b;font-weight:700;margin-bottom:2px">' + r.label + '</div>' + r.h;
      wrap.appendChild(d);
      rowEls.push(d);
    });
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'审题',   log:'原函数两条硬要求：连续 + 导数恒等于 f', count:0 },
    { cls:'step', tag:'左段',   log:'2(x−1) 积分得 (x−1)²，四选项此处一致', count:1 },
    { cls:'step', tag:'右段',   log:'ln x 分部积分得 x(ln x−1)+C₂', count:2 },
    { cls:'ok',   tag:'定常数', log:'左极限 0 = 右值 −1+C₂，解出 C₂=1', count:3 },
    { cls:'ok',   tag:'验导',   log:'求导回到 ln x，且 F(1)=0 与左段接上', count:4 },
    { cls:'done', tag:'完成',   log:'右段 x(ln x−1)+1，选 D', count:5, done:true },
  ],

  render: function(stage, sn, i){
    rowEls.forEach(function(d, j){
      d.style.opacity = j <= i ? '1' : '.15';
      d.style.borderLeftColor = j < i ? '#16a34a' : (j === i ? '#d97706' : 'transparent');
      d.style.background = j === i ? '#fffbeb' : (j < i ? '#f6fef9' : 'transparent');
    });
    renderMathAfterSnap(stage);
  },

  result: {
    big: '选 D：x(ln x − 1) + 1',
    html: '记忆锚点：<b>分段原函数，分段点靠连续性定常数</b>——左极限 $(1-1)^2=0$ 钉死 $C_2=1$。干扰项 A 差一个常数不连续，B/C 的 $\\int\\ln x$ 本身就积错了（应为 $x\\ln x-x$）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
