<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016 数二第 20 题 · 月牙区域旋转体体积与表面积（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2016·20　月牙区域绕 $x$ 轴旋转：体积与表面积',
  subtitle: '考点：定积分应用 · 方法：<b>垫圈法体积 + $2\\pi\\int y\\,\\mathrm{d}s$ 侧面积</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看外减内的体积与两段侧面积如何拼出来。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '<b>区域（文字描述）：</b>圆弧 $y=\\sqrt{1-x^{2}}$ 与星形线 $x=\\cos^{3}t,\\ y=\\sin^{3}t$ 都连 $(1,0)$ 与 $(0,1)$；星形线在圆弧<b>内侧</b>，$D$ 为月牙形',
      '<b>① 体积=外减内：</b>$V=\\pi\\int_{0}^{1}\\bigl(y_{\\text{圆}}^{2}-y_{\\text{星}}^{2}\\bigr)\\,\\mathrm{d}x$',
      '<b>② 外圆盘：</b>$\\pi\\int_{0}^{1}(1-x^{2})\\,\\mathrm{d}x=\\pi\\Bigl(1-\\frac{1}{3}\\Bigr)=\\frac{2\\pi}{3}$',
      '<b>③ 内星形线（参数式）：</b>$\\mathrm{d}x=-3\\cos^{2}t\\sin t\\,\\mathrm{d}t$，$\\pi\\int_{0}^{1}y^{2}\\mathrm{d}x=3\\pi\\int_{0}^{\\pi/2}\\sin^{7}t\\cos^{2}t\\,\\mathrm{d}t=3\\pi\\cdot\\frac{6!!\\cdot1!!}{9!!}=\\frac{16\\pi}{105}$',
      '<b>④ 体积：</b>$V=\\frac{2\\pi}{3}-\\frac{16\\pi}{105}=\\frac{54\\pi}{105}=\\frac{18\\pi}{35}$',
      '<b>⑤ 圆弧旋转面：</b>半径 $1$ 的半球面，$S_{1}=2\\pi\\cdot1^{2}=2\\pi$',
      '<b>⑥ 星形线侧面积：</b>$x^{\\prime}=-3\\cos^{2}t\\sin t,\\ y^{\\prime}=3\\sin^{2}t\\cos t\\ \\Rightarrow\\ \\mathrm{d}s=3\\sin t\\cos t\\,\\mathrm{d}t$，$S_{2}=6\\pi\\int_{0}^{\\pi/2}\\sin^{4}t\\cos t\\,\\mathrm{d}t=\\frac{6\\pi}{5}$',
      '<b>⑦ 结论：</b>$S=S_{1}+S_{2}=2\\pi+\\frac{6\\pi}{5}=\\frac{16\\pi}{5}$'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'认区域', log:'两条曲线都从 (1,0) 走到 (0,1)，星形线更贴近 x 轴、在圆弧内侧，围出月牙形', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'垫圈法', log:'旋转体体积用垫圈法：大圆盘减小圆盘', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'外圈',   log:'外圈是四分之一圆盘旋转，直接积分得三分之二π', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'内圈',   log:'内圈没有显式函数，走参数式换元再用点火公式，得一百零五分之十六π', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'体积',   log:'两者相减通分：体积十八个π除以三十五', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'球面',   log:'圆弧部分转出半径为一的半球面，面积直接是二π', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'侧面积', log:'星形线的弧微分按参数式先平方和再开方，凑微分收尾得五分之六π', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'完成',  log:'两段侧面积相加：表面积十六个π除以五', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$V=\\dfrac{18\\pi}{35}$，$\\quad S=\\dfrac{16\\pi}{5}$',
    html: '记忆锚点：<b>体积垫圈法外减内；表面积两段分别 $2\\pi\\int y\\,\\mathrm{d}s$ 再相加</b>。易错：星形线在内侧（体积要挖掉它）；点火公式 $\\int_{0}^{\\pi/2}\\sin^{7}t\\cos^{2}t\\,\\mathrm{d}t=\\frac{6!!\\cdot1!!}{9!!}$（含奇数次幂时不带 $\\frac{\\pi}{2}$ 因子）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
