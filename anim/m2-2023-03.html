<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念类动画：两个递推数列的无穷小阶比较</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：两个数列都趋 0，比谁快',
    cls: 'key',
    log: 'y 可精确解出通项，x 只能估阶；先各算各的',
    body: '<p>$x_{n+1}=\\sin x_n$ 与 $y_{n+1}=y_n^2$，$x_1=y_1=\\dfrac12$。两个数列都趋于 0，问谁更「小」——即比较衰减速度。</p>' },
  { title: 'y_n 精确解：双指数衰减',
    cls: 'good',
    log: '迭代平方，指数每步翻倍：1/2、1/4、1/16、1/256、1/65536',
    body: '<p>取对数：$\\ln y_{n+1}=2\\ln y_n\\Rightarrow\\ln y_n=2^{n-1}\\ln\\frac12$，即 $$y_n=\\Bigl(\\frac12\\Bigr)^{2^{n-1}}$$ 数值：$\\frac12,\\frac14,\\frac1{16},\\frac1{256},\\frac1{65536}$——<b>双指数</b>速度趋于 0。</p>' },
  { title: 'x_n 趋 0，但很慢',
    cls: 'step',
    log: '单调递减有下界，极限满足 L=sinL，故为 0；数值收缩缓慢',
    body: '<p>$x\\in(0,1)$ 时 $0<\\sin x<x$，$\\{x_n\\}$ 单调递减有下界 0；设极限 $L$，由 $L=\\sin L$ 得 $L=0$。数值：$0.5,\\ 0.4794,\\ 0.4613,\\ 0.4447\\cdots$ 收缩<b>非常缓慢</b>。</p>' },
  { title: '定阶：x_n ~ √(3/n)',
    cls: 'key',
    log: '泰勒展开证 1/x² 差分趋于 1/3，Stolz 定理给出 1/x_n² ~ n/3',
    body: '<p>用 $\\sin x=x-\\dfrac{x^3}6+o(x^3)$ 可证 $\\dfrac1{x_{n+1}^2}-\\dfrac1{x_n^2}\\to\\dfrac13$；由 Stolz 定理 $\\dfrac1{x_n^2}\\sim\\dfrac n3$，即 $$x_n\\sim\\sqrt{\\frac3n}$$ 只是 $\\dfrac1{\\sqrt n}$ 量级。</p>' },
  { title: '比较：y_n/x_n → 0',
    cls: 'good',
    log: '双指数远快于幂级衰减，y_n 比 x_n 高阶',
    body: '<p>$\\lim\\limits_{n\\to\\infty}\\dfrac{y_n}{x_n}=\\lim\\dfrac{(1/2)^{2^{n-1}}}{\\sqrt{3/n}}=0$：双指数趋零<b>远快</b>于幂级趋零。</p>' },
  { title: '选项 A：方向反了',
    cls: 'bad',
    log: '说 x_n 是 y_n 的高阶——搞反了，快的是 y_n',
    ribbon: {k:1, ok:false},
    body: '<p>「$x_n$ 是 $y_n$ 的高阶无穷小」意为 $\\dfrac{x_n}{y_n}\\to0$，即 $x_n$ 更小——但更小的是 $y_n$。<b>A 错</b>。</p>' },
  { title: '选项 B：正确',
    cls: 'good',
    log: 'y_n 是 x_n 的高阶无穷小，与比较结果一致',
    ribbon: {k:2, ok:true},
    body: '<p>$\\dfrac{y_n}{x_n}\\to0$，即 $y_n$ 是 $x_n$ 的<b>高阶无穷小</b>。<b>B 对</b>。</p>' },
  { title: '选项 C：比值是 0 不是 1',
    cls: 'bad',
    log: '等价要求比值趋于 1，这里趋于 0',
    ribbon: {k:3, ok:false},
    body: '<p>等价无穷小要求 $\\dfrac{y_n}{x_n}\\to1$，实际 $\\to0$。<b>C 错</b>。</p>' },
  { title: '选项 D：比值是 0 不是非零常数',
    cls: 'bad',
    log: '同阶要求比值趋于有限非零常数，这里是 0',
    ribbon: {k:4, ok:false},
    body: '<p>同阶非等价要求 $\\dfrac{y_n}{x_n}$ 趋于<b>有限非零常数</b>，实际趋于 0。<b>D 错</b>。综上选 <b>B</b>。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$x_{n+1}=\\sin x_n$ 与 $y_{n+1}=y_n^2$：谁趋 0 更快',
  subtitle: '考点：无穷小阶的比较 · 方法：精确解 + 定阶 + 逐项排除',
  counterLabel: '推理步',
  ribbonTitle: '选项判定（✓ 对 / ✗ 错）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B（$y_n$ 是 $x_n$ 的高阶无穷小）',
    html: '记忆锚点：<b>$y_{n+1}=y_n^2$ 双指数趋零，$x_{n+1}=\\sin x_n$ 只是 $\\sqrt{3/n}$ 量级</b>——迭代平方极快、正弦迭代极慢。易错：方向搞反选 A；比值 $\\to0$ 不是等价（C）也不是同阶（D）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
