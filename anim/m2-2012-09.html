<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·09 隐函数的二阶导 y″(0)</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];   // 推导板的持久 DOM 行

var LINES = [
  "<p><b>策略</b>：方程 $x^{2}-y+1=\\mathrm{e}^{y}$ 解不出 $y(x)$，走<b>先定值、逐阶求导、逐阶代入</b>的路线，目标 $y''\\big|_{x=0}$。</p>",
  "<p><b>定初值</b>：代 $x=0$ 得 $1-y=\\mathrm{e}^{y}$，$y=0$ 成立（$h(y)=1-y-\\mathrm{e}^{y}$ 严格递减，解唯一）$\\Longrightarrow y(0)=0$。</p>",
  "<p><b>一阶导</b>：两边对 $x$ 求导，$$2x-y'=\\mathrm{e}^{y}\\,y'\\ \\Longrightarrow\\ 2x=y'(1+\\mathrm{e}^{y}).$$</p>",
  "<p><b>代入</b>：$x=0,\\ y=0$：$0=y'(1+1)\\Longrightarrow y'(0)=0$。</p>",
  "<p><b>二阶导</b>：对 $2x=y'(1+\\mathrm{e}^{y})$ 再求导（乘积法则，$y'$ 仍是 $x$ 的函数），$$2=y''(1+\\mathrm{e}^{y})+\\mathrm{e}^{y}(y')^{2}.$$</p>",
  "<p><b>代入</b>：$y=0,\\ y'=0$：$2=2y''\\Longrightarrow y''(0)=1$。</p>",
  "<p><b>结论</b>：$\\left.\\dfrac{\\mathrm{d}^{2}y}{\\mathrm{d}x^{2}}\\right|_{x=0}=1$。</p>"
];

AW.init({
  title: '隐函数求二阶导：$x^{2}-y+1=\\mathrm{e}^{y}$ 在 $x=0$ 处',
  subtitle: '考点：隐函数求导 · 方法：先定 y(0) → 逐阶求导 → 逐阶代入',
  counterLabel: '已推演',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',   log:'方程解不出 y(x)，改走"定值 + 逐阶代入"路线', show:1, count:0 },
    { cls:'ok',    tag:'定初值', log:'x=0 时 1−y = e^y，y=0 成立且解唯一：y(0)=0', show:2, count:1 },
    { cls:'step',  tag:'一阶导', log:'两边求导：2x − y′ = e^y·y′，整理出 2x = y′(1+e^y)', show:3, count:2 },
    { cls:'ok',    tag:'代值',   log:'代 x=0, y=0：0 = 2y′，得 y′(0)=0', show:4, count:3 },
    { cls:'step',  tag:'二阶导', log:'再求导（乘积法则）：2 = y″(1+e^y) + e^y(y′)²', show:5, count:4 },
    { cls:'ok',    tag:'代值',   log:'代 y=0, y′=0：交叉项归零，2 = 2y″，得 y″(0)=1', show:6, count:5 },
    { cls:'done',  tag:'完成',   log:'结论：二阶导在 x=0 处等于 1', show:7, count:6, done:true },
  ],

  result: {
    big: 'y″|x=0 = 1',
    html: '记忆锚点：<b>隐函数定点求导三步走——先定 $y(0)$、逐阶求导、逐阶代入</b>。一阶导整理成 $2x=y\'(1+\\mathrm{e}^{y})$ 形式可少抄一遍；二阶导里的 $\\mathrm{e}^{y}(y\')^{2}$ 交叉项因 $y\'(0)=0$ 自动归零。漏掉交叉项或不先定 $y(0)$ 是两大高频错误。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
