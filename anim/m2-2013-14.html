<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念动画：代数余子式条件定行列式（2013 年第 14 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼', cls: 'key',
    body: '<p>$a_{ij}+A_{ij}=0$ 即 $A_{ij}=-a_{ij}$：每个元素的代数余子式是其相反数。$A$ 是 3 阶<b>非零</b>矩阵，求 $|A|$。两条工具链：按行展开、伴随矩阵。</p>' },
  { title: '按行展开：先排除 |A|=0', cls: 'key',
    body: '<p>任取第 $i$ 行展开：</p>' +
          '<p>$$|A|=\\sum_{j=1}^3a_{ij}A_{ij}=-\\sum_{j=1}^3a_{ij}^2\\le0.$$</p>' +
          '<p>$A\\ne O$ 保证某一行含非零元，取该行展开得 $|A|&lt;0$，特别地 $|A|\\ne0$。</p>' },
  { title: '伴随矩阵的形状', cls: '',
    body: '<p>$A^*=(A_{ij})^{\\mathrm T}$，代 $A_{ij}=-a_{ij}$ 得</p>' +
          '<p>$$A^*=-A^{\\mathrm T}.$$</p>' +
          '<p>先转置再添负号——直接写 $-A$ 是错的。</p>' },
  { title: '两条 |A*| 公式联立', cls: 'key',
    body: '<p>其一，直接取行列式（3 阶，负号提出因子 $(-1)^3$）：</p>' +
          '<p>$$|A^*|=\\big|-A^{\\mathrm T}\\big|=-|A|.$$</p>' +
          '<p>其二，伴随矩阵行列式公式：$|A^*|=|A|^{n-1}=|A|^2$。</p>' },
  { title: '解方程并舍根', cls: 'good',
    body: '<p>$$|A|^2=-|A|\\;\\Rightarrow\\;|A|\\big(|A|+1\\big)=0.$$</p>' +
          '<p>$|A|=0$ 或 $-1$；由第 2 步 $|A|\\ne0$，故 $|A|=-1$。验算：$|A^*|=|A|^2=1=-|A|$ ✓。</p>' },
  { title: '结论', cls: 'good',
    body: '<p>答案：<b>$|A|=-1$</b>。核心链条：行展开定 $|A|&lt;0$ → 伴随公式出方程 → 舍掉零根。</p>' },
];

var RIBBONS = [null, {k:1, ok:true}, {k:2, ok:true}, {k:3, ok:true}, {k:4, ok:true}, {k:5, ok:true}];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : (s.cls === 'good' ? 'ok' : 'step')),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    count: i + 1,
    ribbon: RIBBONS[i],
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '由 $A_{ij}=-a_{ij}$ 求 $|A|$',
  subtitle: '考点：伴随矩阵与行列式 · 方法：行展开排除零根 + $|A^*|=|A|^{n-1}$',
  ribbonTitle: '关键节点',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '$|A|=-1$',
    html: '记忆锚点：<b>$|A^*|=|A|^{n-1}$ 与 $A^*=-A^{\\mathrm T}$ 联立出方程 $|A|^2=-|A|$</b>；"按行展开 $-\\sum a_{ij}^2$，非零行使其为负"这一步负责把 $|A|=0$ 挤掉——<b>非零矩阵条件就是干这个用的</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
