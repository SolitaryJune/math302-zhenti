<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2018·05 对称区间上三个定积分比大小</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '策略：先造标尺，只比大小不硬算',
    cls: 'key',
    body: '<p>三个积分都在同一对称区间 $\\left[-\\tfrac\\pi2,\\tfrac\\pi2\\right]$ 上。挑最好算的 $M$ 用<b>奇偶性</b>得出精确值当标尺，$K$、$N$ 分别与标尺比，全程不做数值积分。</p>',
    log: '对称区间：先算 M 当标尺' },
  { title: '标尺 $M$：拆出奇函数，得精确值',
    cls: 'step',
    body: '<p>$$\\frac{(1+x)^2}{1+x^2}=\\frac{1+2x+x^2}{1+x^2}=1+\\frac{2x}{1+x^2}$$ 第二项是奇函数，对称区间上积分为 $0$：$$M=\\int_{-\\frac\\pi2}^{\\frac\\pi2}1\\,dx=\\pi.$$</p>',
    ribbon: {k:1, ok:true},
    log: 'M = π，标尺就位' },
  { title: '$K$ 与标尺比：被积函数大于 1',
    cls: 'step',
    body: '<p>区间内部 $\\cos x>0$，故 $1+\\sqrt{\\cos x}>1$ 且不恒等于 $1$：$$K=\\pi+\\int_{-\\frac\\pi2}^{\\frac\\pi2}\\sqrt{\\cos x}\\,dx>\\pi=M.$$</p>',
    ribbon: {k:2, ok:true},
    log: 'K > π = M，K 是最大的' },
  { title: '$N$ 与标尺比：配对后看单调',
    cls: 'step',
    body: '<p>把左半区间用 $x\\mapsto-x$ 翻到右半轴（记 $a=\\tfrac\\pi2$）：$$N=\\int_0^a h(x)\\,dx,\\qquad h(x)=(1+x)e^{-x}+(1-x)e^{x}$$ $h(0)=2$，且 $h\'(x)=-x\\left(e^{x}+e^{-x}\\right)<0\\ (0<x<a)$ ⇒ $h(x)<2$：$$N<\\int_0^a2\\,dx=2a=\\pi=M.$$</p>',
    ribbon: {k:3, ok:true},
    log: 'h(x)<2 ⇒ N < π = M' },
  { title: '排错 A / B / D',
    cls: 'bad',
    body: '<p>A 把 $K$ 判成最小——错，$1+\\sqrt{\\cos x}\\ge1$ 保证 $K>\\pi$，$K$ 反而最大。B 把 $M$、$K$ 颠倒。D 把 $N$ 排在 $M$ 之前——配对估计已证 $N<\\pi=M$。</p>',
    log: 'A 低估 K，B 颠倒 M/K，D 颠倒 N/M' },
  { title: '结论',
    cls: 'good',
    body: '<p>三块拼起来：$K>M=\\pi>N$，答案选 <b>C</b>。核心记忆点：<b>对称区间先找能出精确值的标尺</b>（奇偶性），其余积分只放缩、不求值。</p>',
    log: 'K > M > N，选 C' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log || s.title,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$M=\\int_{-\\frac\\pi2}^{\\frac\\pi2}\\frac{(1+x)^2}{1+x^2}dx$，$N=\\int_{-\\frac\\pi2}^{\\frac\\pi2}\\frac{1+x}{e^x}dx$，$K=\\int_{-\\frac\\pi2}^{\\frac\\pi2}(1+\\sqrt{\\cos x})dx$ 排序',
  subtitle: '考点：定积分性质（奇偶性 · 保序性）· 方法：精确标尺 + 放缩',
  counterLabel: '推理步',
  ribbonTitle: '比较环节（✓ 完成）',
  intro: '点击「▶ 播放」：造标尺 → 比 K → 比 N → 排错。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C：$K>M>N$',
    html: '记忆锚点：<b>$M=\\pi$ 是标尺</b>（$\\dfrac{2x}{1+x^2}$ 为奇函数）；$1+\\sqrt{\\cos x}\\ge1$ ⇒ $K>\\pi$；$N$ 配对成 $\\int_0^ah\\,dx$ 后 $h\'=-x(e^x+e^{-x})<0$、$h<2$ ⇒ $N<\\pi$。不硬算是本题最快的路。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
