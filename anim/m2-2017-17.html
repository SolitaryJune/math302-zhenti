<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2017·17 n项和极限化定积分</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2017·17　求 $\\lim\\limits_{n\\to\\infty}\\sum\\limits_{k=1}^{n}\\dfrac{k}{n^{2}}\\ln\\!\\left(1+\\dfrac{k}{n}\\right)$',
  subtitle: '考点：定积分定义（黎曼和）· 方法：凑 $\\dfrac1n\\sum g(k/n)$ → 定积分 → 分部积分',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看和式如何一步步变成积分。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      "$$\\sum_{k=1}^{n}\\frac{k}{n^{2}}\\ln\\!\\left(1+\\frac{k}{n}\\right)\\qquad(\\text{n 项和，先找}\\ \\tfrac1n)$$",
      "<b>① 拆通项：</b>$\\dfrac{k}{n^{2}}=\\dfrac1n\\cdot\\dfrac{k}{n}$——宽度 $\\tfrac1n$ ＋ 采样点 $\\tfrac{k}{n}$",
      "<b>② 凑黎曼和：</b>$\\dfrac1n\\sum\\limits_{k=1}^{n}\\dfrac{k}{n}\\ln\\!\\left(1+\\dfrac{k}{n}\\right)$，识别 $g(x)=x\\ln(1+x)$",
      "<b>③ 化积分：</b>分点 $x_k=\\dfrac{k}{n}\\in[0,1]$，$g$ 连续 $\\Rightarrow\\ \\displaystyle\\lim=\\int_0^{1}x\\ln(1+x)\\,\\mathrm{d}x$",
      "<b>④ 分部：</b>取 $u=\\ln(1+x),\\ \\mathrm{d}v=x\\,\\mathrm{d}x$：$\\displaystyle\\int_0^1 x\\ln(1+x)\\,\\mathrm{d}x=\\frac12\\ln2-\\frac12\\int_0^1\\frac{x^{2}}{1+x}\\,\\mathrm{d}x$",
      "<b>⑤ 拆假分式：</b>$\\dfrac{x^{2}}{1+x}=x-1+\\dfrac{1}{1+x}$",
      "<b>⑥ 逐段积：</b>$\\int_0^1(x-1)\\,\\mathrm{d}x=-\\dfrac12$，$\\int_0^1\\dfrac{\\mathrm{d}x}{1+x}=\\ln2\\ \\Rightarrow\\ \\displaystyle\\int_0^1\\dfrac{x^{2}}{1+x}\\,\\mathrm{d}x=\\ln2-\\dfrac12$",
      "<b>⑦ 合并：</b>$$\\frac12\\ln2-\\frac12\\left(\\ln2-\\frac12\\right)=\\frac14$$"
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题', log:'n 项和求极限，标准动作：找出一 n 分之一当宽度', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'拆项', log:'k 比上 n 的平方拆成一 n 乘 k 比 n，宽度和采样点分开', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'凑形', log:'认出被积函数：x 乘 ln 一加 x，分点是 k 比 n', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'化积', log:'分点落在一到零区间上，和式收敛为该函数在零一上的积分', count:3, ribbon:{k:4, ok:true} },
    { cls:'step',  tag:'分部', log:'对数留作 u，x 方留作 v，积分变成对数项减去一个新积分', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'拆式', log:'分子比分母次数高，先做多项式除法拆成三块', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'积分', log:'三块分别积分，合起来是 ln2 减二分之一', count:6, ribbon:{k:7, ok:true} },
    { cls:'ok',    tag:'合并', log:'对数项恰好抵消，剩下四分之一', count:7, ribbon:{k:8, ok:true} },
    { cls:'done',  tag:'完成', log:'结论：原极限等于四分之一', count:8, ribbon:{k:9, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '极限 $=\\dfrac{1}{4}$',
    html: '核心链条：<b>$\\dfrac{k}{n^{2}}=\\dfrac1n\\cdot\\dfrac{k}{n}\\ \\Rightarrow\\ \\dfrac1n\\sum g\\!\\left(\\dfrac{k}{n}\\right)\\to\\int_0^1g(x)\\,\\mathrm{d}x$</b>，此处 $g(x)=x\\ln(1+x)$，积分值 $\\dfrac14$。易错：区间不看分点取值范围乱写；分部后 $\\dfrac{x^{2}}{1+x}$ 不拆假分式硬积。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
