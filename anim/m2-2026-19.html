<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2026 数二第 19 题 · 二元函数极值：驻点与 AC−B² 判别（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2026·19　求 $f(x,y)=(2x^2-y^2)e^x$ 的极值',
  subtitle: '考点：无条件极值 · 流程：一阶偏导 → 驻点 → 二阶偏导 → <b>$AC-B^2$ 判别</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，按标准流程逐点判别。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      "<b>题目：</b>求 $f(x,y)=(2x^2-y^2)e^x$ 的极值。流程：一阶偏导 → 驻点 → 二阶偏导 → $AC-B^2$ 判别",
      "<b>一阶偏导：</b>$e^x$ 是公因子，乘积法则展开：$$f_x=4xe^x+(2x^2-y^2)e^x=(2x^2+4x-y^2)e^x,\\qquad f_y=-2ye^x$$",
      "<b>解驻点：</b>$f_y=0\\Rightarrow y=0$；代回 $f_x=0$ 得 $2x^2+4x=0$，即 $2x(x+2)=0$：$x=0$ 或 $x=-2$，驻点 $(0,0)$、$(-2,0)$",
      "<b>二阶偏导：</b>$$f_{xx}=(2x^2+8x+4-y^2)e^x,\\qquad f_{xy}=-2ye^x,\\qquad f_{yy}=-2e^x$$",
      "<b>判 $(0,0)$：</b>$A=4$，$B=0$，$C=-2$：$$AC-B^2=4\\times(-2)-0=-8<0$$　鞍点，<b>不是极值点</b>",
      "<b>判 $(-2,0)$：</b>$A=-4e^{-2}$，$B=0$，$C=-2e^{-2}$：$$AC-B^2=(-4e^{-2})(-2e^{-2})-0=8e^{-4}>0,\\quad A<0$$　<b>极大值点</b>",
      "<b>算极值：</b>$$f(-2,0)=\\big(2\\times(-2)^2-0^2\\big)e^{-2}=8e^{-2}$$",
      "<b>结论：</b>$f$ 在 $(-2,0)$ 取<b>极大值</b> $8e^{-2}$；$(0,0)$ 处 $AC-B^2=-8<0$ 是鞍点，无极值"
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'无条件极值的标准流程先背下来：求驻点，再逐点算 AC−B² 判别', count:0, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'一阶导', log:'eˣ 求导不变，按乘积法则展开：f_x 里多出一项 4x·eˣ', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'驻点',   log:'f_y=0 先锁定 y=0，再解 2x(x+2)=0，得到两个驻点 (0,0) 和 (−2,0)', count:2, ribbon:{k:3, ok:true} },
    { cls:'step',  tag:'二阶导', log:'把三个二阶偏导全部算好备用，A、B、C 逐点代入', count:3, ribbon:{k:4, ok:true} },
    { cls:'miss',  tag:'鞍点',   log:'(0,0) 处 AC−B² = 4×(−2) = −8 < 0，判别式为负，这个点是鞍点不是极值', count:4, ribbon:{k:5, ok:false} },
    { cls:'ok',    tag:'极大',   log:'(−2,0) 处 AC−B² = 8e⁻⁴ > 0，且 A = −4e⁻² < 0，判定为极大值点', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'算值',   log:'代入 (−2,0)：括号里 2×4=8，再乘 e⁻²，极大值等于 8e⁻²', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'完成',   log:'结论：(−2,0) 取极大值 8e⁻²，(0,0) 是鞍点无极值', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '极大值 $f(-2,0)=8e^{-2}$；$(0,0)$ 非极值',
    html: '判别准则：<b>$AC-B^2>0$ 且 $A<0$ → 极大值；$AC-B^2<0$ → 鞍点</b>。本题 $(0,0)$：$AC-B^2=-8$ 直接淘汰；$(-2,0)$：$AC-B^2=8e^{-4}>0$、$A=-4e^{-2}<0$。记忆锚点：$e^x$ 是公因子，$f_x$ 务必用乘积法则，漏了 $4x$ 项驻点全错。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
