<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：等价无穷小定参数 a、b</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '等价无穷小定参数：$ax^2+bx+\\arcsin x\\sim\\sqrt[3]{1+x^2}-1$（$x\\to0$）',
  subtitle: '考点：无穷小比较 · 泰勒展开 · 方法：主部对齐',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示主部对齐的全过程。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：等价 $\\Longleftrightarrow$ 最低阶主部完全相同。右端是纯 $x^2$ 阶 $\\Rightarrow$ 左端一次项必须消失、二次项系数必须恰为 $\\dfrac13$。',
      '<b>展开右端</b>：用 $(1+u)^{\\alpha}-1\\sim\\alpha u$，取 $u=x^2,\\ \\alpha=\\dfrac13$ $$\\sqrt[3]{1+x^2}-1\\sim \\frac13 x^2$$',
      '<b>展开左端</b>：$\\arcsin x=x+\\dfrac{x^3}{6}+o(x^3)$，按幂排列 $$ax^2+bx+\\arcsin x=(b+1)x+ax^2+o(x^2)$$',
      '<b>定 b</b>：一次项必须消失，否则左端是一阶无穷小、阶数不符 $$(b+1)x=0\\ \\Longrightarrow\\ b=-1$$',
      '<b>定 a</b>：二次项系数对齐主部 $$a=\\dfrac13$$',
      '<b>回代验证</b>：左端 $=\\dfrac13x^2+o(x^2)\\sim\\dfrac13x^2$，与右端主部相同 ✓',
      '<b>排错</b>：B、D 的 $b=1$ 使左端 $\\sim 2x$（一阶，阶数不符）；C 的 $a=\\dfrac23$ 主部系数不对。',
      '<b>结论</b>：$$a=\\dfrac13,\\qquad b=-1\\qquad\\Longrightarrow\\qquad \\text{选 A}$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'等价就是主部相同：右端是二阶，左端一次项必须消掉', count:0 },
    { cls:'step',  tag:'右端',   log:'用 (1+u)^α−1 ~ αu，右端主部是 x²/3', count:1 },
    { cls:'step',  tag:'左端',   log:'arcsin x 一次项起步，左端按幂排列成 (b+1)x + a x²', count:2 },
    { cls:'shift', tag:'定 b',   log:'一次项系数 b+1 必须为 0，得 b = −1', count:3 },
    { cls:'ok',    tag:'定 a',   log:'二次项系数 a 必须等于 1/3', count:4 },
    { cls:'ok',    tag:'验证',   log:'左端主部恰为 x²/3，两端等价成立', count:5 },
    { cls:'miss',  tag:'排错',   log:'B、D 一次项没消掉（阶数不符），C 的二次系数不对', count:6 },
    { cls:'done',  tag:'完成',   log:'结论：a = 1/3，b = −1，选 A', count:7, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$a=\\dfrac13,\\quad b=-1$（选 A）',
    html: '记忆锚点：<b>等价 = 主部相同</b>——右端 $(1+x^2)^{1/3}-1\\sim\\dfrac13x^2$；左端靠 $\\arcsin x=x+\\dfrac{x^3}{6}+\\cdots$ 的一次项逼出 $b=-1$，再对齐系数得 $a=\\dfrac13$。易错：$b=1$ 时左端成一阶无穷小，阶数先就错了。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
