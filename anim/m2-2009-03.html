<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2009·03 由全微分判极值</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题：从全微分读偏导',
    cls: 'key',
    body: '<p>可微时 $\\mathrm dz=f_x\\,\\mathrm dx+f_y\\,\\mathrm dy$，对照 $\\mathrm dz=x\\,\\mathrm dx+y\\,\\mathrm dy$ 得 $f_x=x,\\ f_y=y$。可微 $\\Rightarrow$ 连续，选项 A 先排除。</p>',
    log: '读出 f_x = x、f_y = y；可微必连续' },
  { title: '确认驻点',
    cls: 'step',
    body: '<p>$f_x(0,0)=f_y(0,0)=0$：$(0,0)$ 是驻点，但驻点未必是极值点。</p>',
    log: '两个偏导同时为零，是驻点' },
  { title: '二阶系数 A、B、C',
    cls: 'step',
    body: '<p>$A=f_{xx}=1,\\qquad B=f_{xy}=0,\\qquad C=f_{yy}=1$。</p>',
    log: '二阶偏导都是常数' },
  { title: '判别式裁决',
    cls: 'good',
    body: '<p>$AC-B^2=1\\cdot1-0=1>0$ 且 $A=1>0$：由二元极值充分条件，$(0,0)$ 是<b>极小值点</b>。</p>',
    log: 'AC−B² = 1 > 0 且 A > 0，极小值点' },
  { title: '直观印证',
    cls: 'good',
    body: '<p>积分还原：$f(x,y)=\\dfrac{x^2+y^2}{2}+C$，开口向上的旋转抛物面，原点处最小，与判别结果一致。</p>',
    log: '还原出抛物面，原点最小' },
  { title: '排除干扰项',
    cls: 'bad',
    body: '<p>B 错：判别式通过，$(0,0)$ 确实是极值点；C 错：$A>0$ 是碗口向上，是极小不是极大。</p>',
    log: 'B、C 都与判别式矛盾' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>D</b>：$(0,0)$ 是 $f$ 的极小值点。</p>',
    log: '选 D' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log || s.title,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '全微分 $\\mathrm dz=x\\,\\mathrm dx+y\\,\\mathrm dy$ 时，$(0,0)$ 是什么点',
  subtitle: '考点：二元极值充分条件 · 方法：读偏导 → 驻点 → $AC-B^2$ 判别',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 D',
    html: '记忆锚点：<b>读偏导 → 验驻点 → $AC-B^2>0$ 且 $A>0$ ⇒ 极小值点</b>。可微必连续（排除 A）；$A$ 的符号定极大极小：$A>0$ 碗口向上是极小。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
