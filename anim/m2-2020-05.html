<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画：分段函数在原点的四条结论</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：偏导回定义，极限分两种',
    cls: 'key',
    log: '偏导一律用差商定义；二重极限看路径，累次极限看顺序',
    body: '<p>$f$ 在三段上分别是 $xy$（$xy\\ne0$）、$x$（$y=0$）、$y$（$x=0$），且 $f(0,0)=0$。规矩：<b>凡「在某点的偏导数」一律退回定义算差商极限</b>；二重极限看任意路径，累次极限按先后顺序算。有用的估计：$\\lvert f(x,y)\\rvert\\le\\lvert x\\rvert+\\lvert y\\rvert$。</p>' },
  { title: '结论 (1)：$f_x(0,0)=1$',
    cls: 'good',
    log: '沿 x 轴 f = x，差商恒为 1，(1) 对',
    ribbon: {k:1, ok:true},
    body: '<p>沿 $x$ 轴 $f(x,0)=x$，由定义 $$\\left.\\frac{\\partial f}{\\partial x}\\right|_{(0,0)}=\\lim_{x\\to0}\\frac{f(x,0)-f(0,0)}{x-0}=\\lim_{x\\to0}\\frac{x}{x}=1.$$ <b>(1) 正确</b>。</p>' },
  { title: '结论 (3)：二重极限为 0',
    cls: 'good',
    log: '夹住 |f| ≤ |x|+|y| → 0，(3) 对',
    ribbon: {k:2, ok:true},
    body: '<p>任意路径上三段表达式 $xy$、$x$、$y$ 都趋于 0；用估计 $\\lvert f(x,y)\\rvert\\le\\lvert x\\rvert+\\lvert y\\rvert\\to0$ 一步夹住：$$\\lim_{(x,y)\\to(0,0)}f(x,y)=0.$$ <b>(3) 正确</b>。</p>' },
  { title: '结论 (4)：累次极限为 0',
    cls: 'good',
    log: '内层极限恒为 0，外层也是 0，(4) 对',
    ribbon: {k:3, ok:true},
    body: '<p>先固定 $y$ 求内层 $\\lim_{x\\to0}f(x,y)$：$y\\ne0$ 时 $f=xy\\to0$；$y=0$ 时 $f=x\\to0$——内层恒为 $0$，再令 $y\\to0$ 仍是 $0$：$$\\lim_{y\\to0}\\lim_{x\\to0}f(x,y)=0.$$ <b>(4) 正确</b>。</p>' },
  { title: '结论 (2)：混合偏导根本无定义',
    cls: 'bad',
    log: 'fy 在 x≠0 处不存在，(2) 无从成立',
    ribbon: {k:4, ok:false},
    body: '<p>$\\dfrac{\\partial^2f}{\\partial x\\,\\partial y}\\Big|_{(0,0)}$ 要求先有 $f_y(x,0)$ 这条 $x$ 的函数再对 $x$ 求导。当 $x\\ne0$：$$f_y(x,0)=\\lim_{k\\to0}\\frac{f(x,k)-f(x,0)}{k}=\\lim_{k\\to0}\\frac{xk-x}{k}=\\lim_{k\\to0}x\\left(1-\\frac{1}{k}\\right)$$ 发散——$f_y$ 在整条 $x$ 轴上除原点外都<b>不存在</b>，一个只在单点有定义的函数谈不上对 $x$ 求导，<b>(2) 错误</b>。</p>' },
  { title: '统计：3 对 1 错',
    cls: 'good',
    log: '(1)(3)(4) 对、(2) 错 → 选 B',
    body: '<p>(1)(3)(4) 正确、(2) 错误，正确的个数是 $3$，选 <b>B</b>。</p>' },
  { title: '结论',
    cls: 'good',
    log: '选 B：混合偏导卡在 fy 不存在',
    body: '<p>答案 <b>B</b>。记忆锚点：$f_y(0,0)=1$ 是对的（沿 $y$ 轴 $f(0,y)=y$），但混合偏导 $f_{xy}(0,0)$ 需要 $f_y(x,0)$ 在原点<b>邻域</b>内有定义——本题它只在原点一个点存在。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$f(x,y)=\\begin{cases}xy,&xy\\ne0\\\\x,&y=0\\\\y,&x=0\\end{cases}$：四条结论逐条核验',
  subtitle: '考点：多元函数微分 · 方法：偏导数定义 + 二重极限与累次极限',
  counterLabel: '推理步',
  ribbonTitle: '四条结论（✓ 成立 / ✗ 不成立）',
  intro: '点击「▶ 播放」逐条核验结论 (1)–(4)。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B（正确的有 3 个）',
    html: '记忆锚点：<b>(1)(3)(4) 成立，(2) 不成立</b>。(2) 的死穴：$f_y(x,0)=\\lim_{k\\to0}x\\left(1-\\frac1k\\right)$ 在 $x\\ne0$ 处发散，$f_y$ 只在原点一个点有值，混合偏导无从谈起。对比：$f_x(0,0)=1$、二重极限与累次极限恰好都为 $0$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
