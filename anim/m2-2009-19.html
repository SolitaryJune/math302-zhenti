<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009 数二第 19 题 · 半圆盘上二重积分：平移 + 极坐标（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2009·19　计算 $\\iint_D(x-y)\\,\\mathrm{d}x\\mathrm{d}y$，$D:(x-1)^2+(y-1)^2\\le2$ 且 $y\\ge x$',
  subtitle: '考点：平移圆心 + 极坐标 · 半圆盘定限 · 被积函数变量分离',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看半圆盘如何被平移和极坐标逐步消化。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      "<b>① 看区域：</b>$D$ 是圆 $(x-1)^2+(y-1)^2\\le2$（圆心 $(1,1)$、半径 $\\sqrt2$）与 $y\\ge x$ 的交集；直线 $y=x$ <b>恰过圆心</b>，所以 $D$ 是<b>半圆盘</b>",
      "<b>② 平移：</b>令 $u=x-1,\\ v=y-1$，则 $x-y=u-v$，$\\mathrm{d}x\\,\\mathrm{d}y=\\mathrm{d}u\\,\\mathrm{d}v$，区域变为 $D':u^2+v^2\\le2,\\ v\\ge u$",
      "<b>③ 极坐标定限：</b>$u=r\\cos\\theta,\\ v=r\\sin\\theta$；$v\\ge u\\iff\\sin\\theta\\ge\\cos\\theta\\iff\\theta\\in\\Big[\\dfrac{\\pi}{4},\\dfrac{5\\pi}{4}\\Big]$，$r\\in[0,\\sqrt2]$",
      "<b>④ 变量分离：</b>$$I=\\int_{\\pi/4}^{5\\pi/4}(\\cos\\theta-\\sin\\theta)\\,\\mathrm{d}\\theta\\cdot\\int_0^{\\sqrt2}r^2\\,\\mathrm{d}r$$",
      "<b>⑤ 径向：</b>$\\displaystyle\\int_0^{\\sqrt2}r^2\\,\\mathrm{d}r=\\frac{(\\sqrt2)^3}{3}=\\frac{2\\sqrt2}{3}$",
      "<b>⑥ 角向：</b>原函数为 $\\sin\\theta+\\cos\\theta$，$\\big[\\sin\\theta+\\cos\\theta\\big]_{\\pi/4}^{5\\pi/4}=-\\sqrt2-\\sqrt2=-2\\sqrt2$",
      "<b>⑦ 相乘：</b>$$I=\\frac{2\\sqrt2}{3}\\times(-2\\sqrt2)=-\\frac{8}{3}$$"
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'看区域', log:'圆心恰好落在切线上，圆被直径切成半圆盘', count:0, ribbon:{k:1, ok:true} },
    { cls:'shift', tag:'平移',   log:'把圆心平移到原点，被积函数简化成 u 减 v', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'定限',   log:'纵坐标不小于横坐标给出极角范围：四分之派到四分之五派', count:2, ribbon:{k:3, ok:true} },
    { cls:'step',  tag:'分离',   log:'被积函数拆成角度部分乘半径部分，两个积分独立进行', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'径向',   log:'半径部分：r 平方从零积到根号二，得二倍根号二除以三', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'角向',   log:'角度部分原函数是正弦加余弦，两端作差得负二倍根号二', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'相乘',   log:'相乘时根号二互相约去，得到负三分之八', count:6, ribbon:{k:7, ok:true} },
    { cls:'done',  tag:'自检',   log:'自检：区域内 y 大于等于 x，被积函数非正，负号结果合理', count:7, ribbon:{k:8, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\iint_D(x-y)\\,\\mathrm{d}x\\mathrm{d}y=-\\dfrac{8}{3}$',
    html: '记忆锚点：<b>直线过圆心 $\\Rightarrow$ 半圆盘</b>；先平移圆心到原点再上极坐标。极角由 $v\\ge u$ 译成 $\\Big[\\frac{\\pi}{4},\\frac{5\\pi}{4}\\Big]$。自检习惯：区域内 $x-y\\le0$，结果必为负——符号对上了才敢写答案。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
