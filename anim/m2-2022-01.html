<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画：等价无穷小命题判定</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：把「等价」翻译成比值',
    cls: 'key',
    log: '等价 = 比值为 1；差刻画 α−β=o(α) 是充要条件',
    body: '<p>定义：$\\alpha\\sim\\beta\\iff\\lim\\dfrac{\\alpha}{\\beta}=1$。核心工具（充要）：对非零无穷小 $\\alpha$，$\\alpha\\sim\\beta\\iff\\alpha-\\beta=o(\\alpha)$。下面逐条判定四个命题。</p>' },
  { title: '命题 (1)：平方保等价 —— 真',
    cls: 'good',
    log: '(1)：比值取平方还是 1，真',
    ribbon: {k:1, ok:true},
    body: '<p>$\\alpha\\sim\\beta\\Rightarrow\\lim\\dfrac{\\alpha^2}{\\beta^2}=\\Bigl(\\lim\\dfrac{\\alpha}{\\beta}\\Bigr)^{\\!2}=1$，故 $\\alpha^2\\sim\\beta^2$。<b>(1) 真</b>。</p>' },
  { title: '命题 (2)：由平方反推 —— 假（反例）',
    cls: 'bad',
    log: '(2)：取 α=x、β=−x，平方相等但比值恒为 −1，假',
    ribbon: {k:2, ok:false},
    body: '<p>$\\alpha^2\\sim\\beta^2$ 只给 $\\dfrac{\\alpha}{\\beta}\\to\\pm1$，符号不保证 $+1$。反例：$\\alpha=x,\\ \\beta=-x$，则 $\\alpha^2=\\beta^2=x^2$ 平方等价，但 $\\dfrac{\\alpha}{\\beta}\\equiv-1$，不等价。<b>(2) 假</b>。</p>' },
  { title: '命题 (3)：等价 ⟹ 差是高阶 —— 真',
    cls: 'good',
    log: '(3)：lim (α−β)/α = 1−1 = 0，真',
    ribbon: {k:3, ok:true},
    body: '<p>$\\lim\\dfrac{\\alpha-\\beta}{\\alpha}=1-\\lim\\dfrac{\\beta}{\\alpha}=1-1=0$，即 $\\alpha-\\beta=o(\\alpha)$（$x\\to0$）。<b>(3) 真</b>。</p>' },
  { title: '命题 (4)：差是高阶 ⟹ 等价 —— 真',
    cls: 'good',
    log: '(4)：由 lim (α−β)/α=0 反解出 lim β/α=1，真；(3)(4) 互为充要',
    ribbon: {k:4, ok:true},
    body: '<p>$\\lim\\dfrac{\\alpha-\\beta}{\\alpha}=0\\Rightarrow\\lim\\dfrac{\\beta}{\\alpha}=1-0=1$，即 $\\alpha\\sim\\beta$。<b>(4) 真</b>——差刻画是双向的，(3)(4) 必须同选。</p>' },
  { title: '结论：真命题 (1)(3)(4)',
    cls: 'good',
    log: '(1)(3)(4) 全真、(2) 假，选 C',
    body: '<p>真命题为 <b>(1)(3)(4)</b>，选 <b>C</b>。A 漏 (4)，B 漏 (3)，D 多收了假命题 (2)。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '等价无穷小的乘方与「差刻画」：四个命题逐条判定',
  subtitle: '考点：无穷小比较 · 方法：比值定义 + 充要差刻画 + 反例',
  counterLabel: '判定步',
  ribbonTitle: '命题判定（✓ 真 / ✗ 假）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C（真命题 (1)(3)(4)）',
    html: '记忆锚点：<b>平方保持等价；差刻画 $\\alpha\\sim\\beta\\iff\\alpha-\\beta=o(\\alpha)$ 是充要条件</b>。唯一不成立的是「由 $\\alpha^2\\sim\\beta^2$ 反推 $\\alpha\\sim\\beta$」：平方抹掉符号，反例 $\\alpha=x,\\ \\beta=-x$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
