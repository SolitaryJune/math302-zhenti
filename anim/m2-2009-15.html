<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2009 数二第 15 题 · 等价无穷小配阶求极限（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2009·15　求 $\\lim\\limits_{x\\to0}\\dfrac{(1-\\cos x)\\,[x-\\ln(1+\\tan x)]}{\\sin^4x}$',
  subtitle: '考点：等价无穷小的<b>阶数匹配</b> · 方法：把每个因子展开到需要的阶',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看分子两个因子如何各自凑出二阶。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '$$\\lim_{x\\to0}\\frac{(1-\\cos x)\\,[x-\\ln(1+\\tan x)]}{\\sin^4x}\\qquad\\left(\\tfrac00\\ \\text{型}\\right)$$',
      '<b>① 分母降阶：</b>$\\sin^4x\\sim x^4$（四阶无穷小）',
      '<b>② 第一个因子：</b>$1-\\cos x\\sim\\dfrac{x^2}{2}$（二阶）',
      '<b>③ 配阶要求：</b>二阶 × 二阶 = 四阶 $\\Rightarrow$ 另一因子 $x-\\ln(1+\\tan x)$ 必须精确到<b>二阶</b>',
      '<b>④ 展开准备：</b>$\\tan x=x+o(x^2)$；$\\ln(1+u)=u-\\dfrac{u^2}{2}+o(u^2)$，取 $u=\\tan x$',
      '<b>⑤ 代入展开：</b>$\\ln(1+\\tan x)=\\tan x-\\dfrac{\\tan^2x}{2}+o(x^2)=x-\\dfrac{x^2}{2}+o(x^2)$',
      '<b>⑥ 作差：</b>$x-\\ln(1+\\tan x)=\\dfrac{x^2}{2}+o(x^2)\\sim\\dfrac{x^2}{2}$（恰好二阶）',
      '<b>⑦ 合并：</b>$$\\lim_{x\\to0}\\frac{\\dfrac{x^2}{2}\\cdot\\dfrac{x^2}{2}}{x^4}=\\lim_{x\\to0}\\frac{\\tfrac14\\,x^4}{x^4}=\\dfrac14$$'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'认清型：零比零型，分母是四阶无穷小，分子是两个因子相乘', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'分母',   log:'分母整体等价替换：正弦的四次方直接换成 x 的四次方', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'分子一', log:'第一个因子：一减余弦等价于 x 平方的一半，二阶到手', count:2, ribbon:{k:3, ok:true} },
    { cls:'shift', tag:'配阶',   log:'二阶乘二阶才够四阶：另一个因子必须精确到二阶，只到一阶会错成零', count:3, ribbon:{k:4, ok:true} },
    { cls:'step',  tag:'准备',   log:'备好两件工具：正切的一阶展开、对数公式的二阶截断', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'代入',   log:'把正切代入对数公式：得到 x 减去二分之 x 平方，精确到二阶', count:5, ribbon:{k:6, ok:true} },
    { cls:'ok',    tag:'作差',   log:'相减后一阶项抵消，剩下二阶主部，等价于 x 平方的一半', count:6, ribbon:{k:7, ok:true} },
    { cls:'ok',    tag:'合并',   log:'三个替换一起代入：分子恰是四分之一个 x 的四次方', count:7, ribbon:{k:8, ok:true} },
    { cls:'done',  tag:'完成',   log:'结论：原极限等于四分之一', count:8, ribbon:{k:9, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '极限 $=\\dfrac14$',
    html: '记忆锚点：<b>乘积因子要「配阶」</b>——分母四阶，$1-\\cos x$ 出二阶，$x-\\ln(1+\\tan x)$ 也必须展开到二阶。易错：把 $\\ln(1+\\tan x)$ 直接换成 $x$，分子相减只剩高阶量，答案错成 $0$；<b>加减运算中不能随意用等价无穷小</b>。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
