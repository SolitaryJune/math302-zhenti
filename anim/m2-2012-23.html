<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·23 AᵀA 的秩定参数与正交变换化标准形</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  '<p><b>审题</b>：$f$ 的矩阵是 $B=A^{\\mathrm T}A$（实对称），且 $r(B)=r(A)=2<3$ $\\Rightarrow$ $A$ 的三个列向量线性相关，由此定 $a$；再对 $B$ 求特征值与单位正交特征向量，拼 $Q$ 写标准形。</p>',
  '<p><b>列向量</b>：$$\\boldsymbol\\alpha_1=(1,0,-1,0)^{\\mathrm T},\\quad \\boldsymbol\\alpha_2=(0,1,0,a)^{\\mathrm T},\\quad \\boldsymbol\\alpha_3=(1,1,a,-1)^{\\mathrm T}.$$前两列显然无关，故 $\\boldsymbol\\alpha_3=k_1\\boldsymbol\\alpha_1+k_2\\boldsymbol\\alpha_2$。</p>',
  '<p><b>定 $a$</b>：比较前两个分量得 $k_1=k_2=1$；于是第 3 分量给 $a=-1$，第 4 分量给 $-1=a$——两处一致，$a=-1$。</p>',
  '<p><b>算 $B$</b>：元素 $B_{ij}=\\boldsymbol\\alpha_i\\cdot\\boldsymbol\\alpha_j$：$$B=A^{\\mathrm T}A=\\begin{pmatrix}2&0&2\\\\0&2&2\\\\2&2&4\\end{pmatrix}.$$</p>',
  '<p><b>特征值</b>：迹 $=8$，二阶主子式之和 $=12$，$|B|=0$：$$\\lambda^3-8\\lambda^2+12\\lambda=\\lambda(\\lambda-2)(\\lambda-6)\\ \\Rightarrow\\ \\lambda=0,\\,2,\\,6.$$（恰一个零特征值，与 $r(B)=2$ 相符。）</p>',
  '<p><b>$\\lambda=0$</b>：$B\\boldsymbol x=\\boldsymbol 0$ 给 $x_1=-x_3,\\ x_2=-x_3$：$$\\boldsymbol\\xi_1=\\frac{1}{\\sqrt3}(-1,-1,1)^{\\mathrm T}.$$</p>',
  '<p><b>$\\lambda=2$</b>：$(B-2E)\\boldsymbol x=\\boldsymbol 0$ 给 $x_3=0,\\ x_1+x_2=0$：$$\\boldsymbol\\xi_2=\\frac{1}{\\sqrt2}(1,-1,0)^{\\mathrm T}.$$</p>',
  '<p><b>$\\lambda=6$</b>：$(B-6E)\\boldsymbol x=\\boldsymbol 0$ 给 $x_1=x_2,\\ x_3=2x_1$：$$\\boldsymbol\\xi_3=\\frac{1}{\\sqrt6}(1,1,2)^{\\mathrm T}.$$</p>',
  '<p><b>拼 $Q$</b>：特征值互异，特征向量自动正交，单位化后按 $0,2,6$ 的次序拼列：$$Q=\\begin{pmatrix}-\\frac{1}{\\sqrt3}&\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt6}\\\\-\\frac{1}{\\sqrt3}&-\\frac{1}{\\sqrt2}&\\frac{1}{\\sqrt6}\\\\\\frac{1}{\\sqrt3}&0&\\frac{2}{\\sqrt6}\\end{pmatrix}.$$</p>',
  '<p><b>标准形</b>：正交变换 $\\boldsymbol x=Q\\boldsymbol y$ 下：$$f=0\\cdot y_1^2+2y_2^2+6y_3^2=2y_2^2+6y_3^2.$$</p>',
  '<p><b>结论</b>：(1) $a=-1$；(2) 如上 $Q$，标准形 $f=2y_2^2+6y_3^2$。</p>',
];

AW.init({
  title: '二次型 $f=\\boldsymbol x^{\\mathrm T}(A^{\\mathrm T}A)\\boldsymbol x$：定 $a$，正交变换化标准形',
  subtitle: '考点：$r(A^{\\mathrm T}A)=r(A)$ · 特征值特征向量 · 正交变换',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示定参、求特征值与拼正交矩阵。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var strip = AW.el('div', '');
    strip.style.cssText = 'display:flex;gap:10px;margin:2px 0 12px;flex-wrap:wrap;';
    this._chips = [];
    this._labels = ['$a=\\,?$', '特征值 $=\\,?$', '标准形 $=\\,?$'];
    for(var k = 0; k < this._labels.length; k++){
      var c = AW.el('div', '', this._labels[k]);
      c.style.cssText = 'padding:6px 12px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;background:#f8fafc;color:#94a3b8;';
      strip.appendChild(c);
      this._chips.push(c);
    }
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(strip);
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    var chips = this._chips, labels = this._labels;
    var known = [sn.show >= 3, sn.show >= 5, sn.show >= 10];
    var vals = ['$a=-1$', '$0,\\ 2,\\ 6$', '$f=2y_2^2+6y_3^2$'];
    for(var k = 0; k < chips.length; k++){
      if(known[k]){
        chips[k].style.border = '2px solid #16a34a';
        chips[k].style.background = '#f6fef9';
        chips[k].style.color = '#14532d';
        chips[k].innerHTML = '<b>' + vals[k] + '</b>';
      } else {
        chips[k].style.border = '2px solid #e2e8f0';
        chips[k].style.background = '#f8fafc';
        chips[k].style.color = '#94a3b8';
        chips[k].innerHTML = labels[k];
      }
    }
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',    log:'二次型矩阵是 A 转置乘 A，秩相等是定 a 的钥匙', show:1, count:0 },
    { cls:'step',  tag:'列相关',  log:'秩 2 小于 3，三列必相关，前两列无关可作基底', show:2, count:1 },
    { cls:'ok',    tag:'定 a',   log:'第三列写成前两列之和，第 3、4 分量都指向 a=−1', show:3, count:2 },
    { cls:'step',  tag:'算 B',   log:'逐对点乘列向量，得到三阶实对称矩阵', show:4, count:3 },
    { cls:'ok',    tag:'特征值', log:'迹、主子式和、行列式三件套，分解出 0、2、6', show:5, count:4 },
    { cls:'step',  tag:'λ=0',   log:'解齐次方程组得零特征值的单位特征向量', show:6, count:5 },
    { cls:'step',  tag:'λ=2',   log:'第三个分量归零、前两个互为相反数', show:7, count:6 },
    { cls:'step',  tag:'λ=6',   log:'前两个相等、第三个是它们的两倍', show:8, count:7 },
    { cls:'ok',    tag:'拼 Q',   log:'特征值互异故自动正交，单位化后按 0,2,6 顺序拼列', show:9, count:8 },
    { cls:'ok',    tag:'标准形', log:'第 1 列对应特征值 0，标准形只剩 2y₂² 与 6y₃²', show:10, count:9 },
    { cls:'done',  tag:'完成',   log:'结论：a=−1，标准形 f=2y₂²+6y₃²', show:11, count:10, done:true },
  ],

  result: {
    big: '$a=-1$，标准形 $f=2y_2^2+6y_3^2$',
    html: '记忆锚点：<b>$r(A^{\\mathrm T}A)=r(A)$（$A$ 实矩阵）逼出列相关定 $a$</b>；特征值 $0,2,6$ 恰一个零，与秩 $2$ 相符。$Q$ 的列必须单位化且与特征值顺序对应——第 1 列对应 $0$，$y_1^2$ 项消失。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
