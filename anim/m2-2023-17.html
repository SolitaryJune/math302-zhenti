<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2023·17 切线截距条件建微分方程与最小三角形面积</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [
  "<b>① 审题：</b>点 $P(x,y)$ 到 $y$ 轴的距离 $=x$（$x>\\mathrm e>0$）；过 $P$ 的切线 $Y-y=y'(X-x)$，令 $X=0$ 得 $y$ 轴截距 $Y_0=y-xy'$",
  "<b>② 列方程：</b>距离 $=$ 截距 $\\Rightarrow y-xy'=x$，整理成一阶线性方程 $y'-\\frac{1}{x}\\,y=-1$",
  "<b>③ 积分因子：</b>$\\mu=\\mathrm e^{-\\int\\frac{1}{x}\\mathrm dx}=\\frac1x$，两边乘 $\\frac1x$ 得 $\\Big(\\frac{y}{x}\\Big)'=-\\frac1x$",
  "<b>④ 积分：</b>$\\frac{y}{x}=-\\ln x+C\\ \\Rightarrow\\ y=x(C-\\ln x)$",
  "<b>⑤ 定常数（(1) 完成）：</b>过 $(\\mathrm e^2,0)$：$0=\\mathrm e^2(C-2)\\Rightarrow C=2$，故 $\\boxed{\\,y=x(2-\\ln x)\\,}\\ (x>\\mathrm e)$",
  "<b>⑥ (2) 求导：</b>$y'=2-\\ln x-1=1-\\ln x<0$（$x>\\mathrm e$ 时 $L$ 单调下降）",
  "<b>⑦ $y$ 轴截距：</b>条件本身说明 $Y_0=y-xy'=x$，不必重算",
  "<b>⑧ $x$ 轴截距：</b>令 $Y=0$：$X_0=x-\\frac{y}{y'}=\\frac{x}{\\ln x-1}>0$",
  "<b>⑨ 面积函数：</b>$S(x)=\\frac12\\,X_0Y_0=\\frac{x^2}{2(\\ln x-1)}$",
  "<b>⑩ 对数求导：</b>$\\frac{S'}{S}=\\frac2x-\\frac{1}{x(\\ln x-1)}=0\\ \\Rightarrow\\ 2(\\ln x-1)=1\\ \\Rightarrow\\ \\ln x=\\frac32$",
  "<b>⑪ 收尾：</b>$x<\\mathrm e^{3/2}$ 时 $S'<0$，其后 $S'>0$（最小）；$S\\big(\\mathrm e^{3/2}\\big)=\\mathrm e^3$，切点 $\\Big(\\mathrm e^{3/2},\\ \\frac{\\mathrm e^{3/2}}{2}\\Big)$"
];
var rowEls = [];

AW.init({
  title: '2023·17　切线截距条件建微分方程 + 最小三角形面积',
  subtitle: '考点：一阶线性微分方程 · 切线截距 · 对数求导求最值',
  counterLabel: '已推进',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」：(1) 由距离等于截距解出曲线，(2) 求面积最小值。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    rowEls = [];
    for (var i = 0; i < ROWS.length; i++){
      var r = AW.el('div', 'aw-stepcard', ROWS[i]);
      inner.appendChild(r);
      rowEls.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step', tag:'审题',   log:'第①步：点到 y 轴的距离就是横坐标本身；切线的 y 轴截距，把切线方程里的横坐标取零就得到', count:0,  ribbon:{k:1,  ok:true} },
    { cls:'ok',   tag:'列方程', log:'第②步：距离等于截距，移项整理成一阶线性微分方程', count:1,  ribbon:{k:2,  ok:true} },
    { cls:'ok',   tag:'积分因子', log:'第③步：积分因子取 1 除以 x，乘上去左端凑成 y 除以 x 的导数', count:2,  ribbon:{k:3,  ok:true} },
    { cls:'ok',   tag:'积分',   log:'第④步：两边积分，y 与 x 的商等于负的对数加常数', count:3,  ribbon:{k:4,  ok:true} },
    { cls:'ok',   tag:'定常数', log:'第⑤步：把已知点代入定出常数是 2，第一问解出曲线', count:4,  ribbon:{k:5,  ok:true} },
    { cls:'ok',   tag:'求导',   log:'第⑥步：第二问先求导，导数恒为负，曲线单调下降', count:5,  ribbon:{k:6,  ok:true} },
    { cls:'ok',   tag:'y 轴截距', log:'第⑦步：y 轴截距就是题目条件本身，等于横坐标，不用重算', count:6,  ribbon:{k:7,  ok:true} },
    { cls:'ok',   tag:'x 轴截距', log:'第⑧步：令切线上的纵坐标为零，解出 x 轴截距', count:7,  ribbon:{k:8,  ok:true} },
    { cls:'ok',   tag:'面积函数', log:'第⑨步：直角三角形面积等于两条截距乘积的一半', count:8,  ribbon:{k:9,  ok:true} },
    { cls:'ok',   tag:'求驻点', log:'第⑩步：面积取对数再求导，令导数为零，解出对数等于 1.5', count:9,  ribbon:{k:10, ok:true} },
    { cls:'done', tag:'完成',   log:'第⑪步：驻点两侧导数先负后正，是最小值；最小面积 e 的三次方，切点横坐标为 e 的 1.5 次幂', count:10, ribbon:{k:11, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for (var j = 0; j < rowEls.length; j++){
      rowEls[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: "$y=x(2-\\ln x),\\qquad S_{\\min}=\\mathrm e^3$",
    html: "按问结论：<b>(1) $y=x(2-\\ln x)$（$x>\\mathrm e$）；(2) 切点 $\\Big(\\mathrm e^{3/2},\\ \\dfrac{\\mathrm e^{3/2}}{2}\\Big)$，最小面积 $S=\\mathrm e^3$</b>。记忆锚点：切线的 $y$ 轴截距 $=y-xy'$，本题条件恰好使 $Y_0=x$；面积 $S=\\dfrac{x^2}{2(\\ln x-1)}$ 取对数求导最快。易错：距离写成 $y$；移项丢负号；忘用 (1) 的截距结论。",
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
