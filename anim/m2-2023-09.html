<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：二次型 f=(x₁+x₂)²+(x₁+x₃)²−4(x₂−x₃)² 的规范形</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '$f=(x_1+x_2)^2+(x_1+x_3)^2-4(x_2-x_3)^2$ 的规范形',
  subtitle: '考点：二次型规范形 · 方法：发现线性相关 → 换元降秩 → 配方读惯性指数',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示：降秩、展开、配方、读出正负惯性指数。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题眼</b>：三个线性形式不独立——$$x_2-x_3=(x_1+x_2)-(x_1+x_3)$$ 独立的只有 2 个，秩 $r=2$，「三个平方」形状的选项 C、D 直接出局。令 $u=x_1+x_2,\\ v=x_1+x_3$',
      '<b>换元降元</b>：$x_2-x_3=u-v$，于是 $$f=u^2+v^2-4(u-v)^2$$',
      '<b>展开</b>：$$f=u^2+v^2-4u^2+8uv-4v^2=-3u^2+8uv-3v^2$$',
      '<b>配方</b>：$$f=-3\\Bigl(u-\\frac43v\\Bigr)^2+\\frac73v^2$$（变换 $y_1=u-\\frac43v,\\ y_2=v$ 可逆）',
      '<b>读惯性指数</b>：正惯性 $p=1$（$\\frac73v^2$）、负惯性 $q=1$（$-3(\\cdots)^2$）、$r=2$；复核：$u,v$ 系数矩阵 $\\Bigl(\\begin{smallmatrix}-3&4\\\\4&-3\\end{smallmatrix}\\Bigr)$ 行列式 $9-16=-7<0$，两特征值异号，$p=q=1$ 无误',
      '<b>结论</b>：规范形 $$y_1^2-y_2^2\\qquad\\Rightarrow\\qquad \\text{选 B}$$（A 正定 $p=2$ ✗；C 带系数 4 且秩 3 ✗；D 负惯性 2 ✗）',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题眼', log:'第三个平方的线性形式是前两个之差，秩只有 2', count:0 },
    { cls:'shift', tag:'换元',   log:'设两个和式为新变量，第三个平方变成新变量的差', count:1 },
    { cls:'shift', tag:'展开',   log:'完全平方展开合并，得到二元二次型', count:2 },
    { cls:'step',  tag:'配方',   log:'对 u 配方，消交叉项，剩一正一负两个平方', count:3 },
    { cls:'ok',    tag:'惯性指数', log:'正负各一个，秩 2；系数矩阵行列式为负，特征值异号验证一致', count:4 },
    { cls:'done',  tag:'完成',   log:'结论：规范形 y₁²−y₂²，选 B', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$y_1^2-y_2^2$（选 B）',
    html: '记忆锚点：<b>规范形只由正负惯性指数 $p,q$ 决定</b>；看到多个平方项先找线性相关（本题 $x_2-x_3$ 是前两个之差，秩 2）。易错：把三个平方当独立会误选 D（负惯性 2）；规范形系数只能是 $1,-1,0$，带 4 的 C 不是规范形。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
