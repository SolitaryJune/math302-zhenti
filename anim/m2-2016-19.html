<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016 数二第 19 题 · 代已知解降阶求 u 与通解（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2016·19　$(2x-1)y^{\\prime\\prime}-(2x+1)y^{\\prime}+2y=0$，代 $y=u\\,\\mathrm{e}^{x}$ 降阶',
  subtitle: '考点：二阶方程降阶 · 方法：<b>已知一解 ⇒ $u$ 项自动消去</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看 $\\mathrm{e}^{x}$ 这把钥匙如何把二阶方程降成一阶。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '<b>题式：</b>$(2x-1)y^{\\prime\\prime}-(2x+1)y^{\\prime}+2y=0$，$y_{1}=\\mathrm{e}^{x}$、$y_{2}=u\\,\\mathrm{e}^{x}$ 是两个解；条件 $u(-1)=\\mathrm{e},\\ u(0)=-1$',
      '<b>① 代入：</b>$y^{\\prime}=(u^{\\prime}+u)\\mathrm{e}^{x},\\ y^{\\prime\\prime}=(u^{\\prime\\prime}+2u^{\\prime}+u)\\mathrm{e}^{x}$，约去 $\\mathrm{e}^{x}$ 得 $(2x-1)(u^{\\prime\\prime}+2u^{\\prime}+u)-(2x+1)(u^{\\prime}+u)+2u=0$',
      '<b>② 整理：</b>$u$ 的系数 $(2x-1)-(2x+1)+2=0$（$\\mathrm{e}^{x}$ 已是解的必然回报），得 $(2x-1)u^{\\prime\\prime}+(2x-3)u^{\\prime}=0$ —— 降为一阶',
      '<b>③ 令 $p=u^{\\prime}$ 分离变量：</b>$\\frac{p^{\\prime}}{p}=-1+\\frac{2}{2x-1}\\ \\Rightarrow\\ p=u^{\\prime}=C(2x-1)\\mathrm{e}^{-x}$',
      '<b>④ 再积分：</b>$\\int(2x-1)\\mathrm{e}^{-x}\\,\\mathrm{d}x=-(2x+1)\\mathrm{e}^{-x}$，故 $u=-C(2x+1)\\mathrm{e}^{-x}+D$',
      '<b>⑤ 定常数：</b>$u(0)=-C+D=-1,\\ u(-1)=C\\mathrm{e}+D=\\mathrm{e}\\ \\Rightarrow\\ C=1,\\ D=0$，故 $u=-(2x+1)\\mathrm{e}^{-x}$',
      '<b>⑥ 通解：</b>$y_{2}=u\\mathrm{e}^{x}=-(2x+1)$，即 $2x+1$ 是解；$y_{1},y_{2}$ 线性无关，$y=C_{1}\\mathrm{e}^{x}+C_{2}(2x+1)$'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'已知 e 的 x 次方是一个解，另一个解是它乘 u，这把钥匙能降阶', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'代入',   log:'把 u 乘 e 的 x 次方连同导数代进方程，公共因子约掉', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'整理',   log:'逐项并系数：u 那一项恰好消失，方程降到只含 u 的二阶与一阶导', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'降阶',   log:'换元 p 等于 u 的一阶导，分离变量积分出 p', count:3, ribbon:{k:4, ok:true} },
    { cls:'ok',    tag:'再积分', log:'再积一次分出现常数 C 与 D，注意负号和加一来自分部积分', count:4, ribbon:{k:5, ok:true} },
    { cls:'shift', tag:'定常数', log:'两个条件代进去：零处负 C 加 D 等于负一，负一处 C 乘 e 加 D 等于 e，解得 C 等于一、D 等于零', count:5, ribbon:{k:6, ok:true} },
    { cls:'done',  tag:'完成',   log:'u 乘回 e 的 x 次方得第二个解二 x 加一，通解随之写出', count:6, ribbon:{k:7, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$u(x)=-(2x+1)\\,\\mathrm{e}^{-x}$，通解 $y=C_{1}\\mathrm{e}^{x}+C_{2}(2x+1)$',
    html: '记忆锚点：<b>已知一个解 ⇒ 代 $y=u\\cdot$（已知解），$u$ 项必消、方程降一阶</b>。易错：$u(-1)=\\mathrm e$ 是在 $x=-1$ 处取值；$\\int(2x-1)\\mathrm e^{-x}\\mathrm dx=-(2x+1)\\mathrm e^{-x}$ 别丢负号。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
