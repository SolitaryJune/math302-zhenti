<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画：构造 g=f/e^x 用单调性定选项</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：见 $f^\\prime-f$ 就构造 $g=\\dfrac{f}{e^x}$',
    cls: 'key',
    log: '条件同时含 f′ 与 f，选项全在比 f(b)/f(a) 与 e^(b-a)',
    body: '<p>条件 $f^\\prime(x)>f(x)>0$ 同时出现 $f^\\prime$ 与 $f$，四个选项都是 $\\dfrac{f(b)}{f(a)}$ 与 $e^{b-a}$ 比较——构造 $$g(x)=\\frac{f(x)}{e^x},\\qquad g^\\prime(x)=\\frac{f^\\prime(x)-f(x)}{e^x}>0.$$ 故 $g$ 在 $[-2,2]$ 上<b>严格递增</b>；$f^\\prime>0$ 还说明 $f$ 本身递增且恒正。</p>' },
  { title: '翻译器：$g(b)>g(a)$ 意味着什么',
    cls: 'step',
    log: 'g(b)>g(a) 等价于 f(b)/f(a) > e^(b-a)',
    body: '<p>对 $b>a$：$$g(b)>g(a)\\iff\\frac{f(b)}{e^b}>\\frac{f(a)}{e^a}\\iff\\frac{f(b)}{f(a)}>e^{b-a}$$（$f>0$，除法不变号）。每个选项都对应 $g$ 在两点的一次大小比较。</p>' },
  { title: '选项 B：$\\dfrac{f(0)}{f(-1)}>e$',
    cls: 'good',
    log: 'g(0) > g(-1) → f(0)/f(-1) > e，B 成立',
    ribbon: {k:1, ok:true},
    body: '<p>$g(0)>g(-1)$：$$\\frac{f(0)}{1}>\\frac{f(-1)}{e^{-1}}\\Rightarrow f(0)>e\\,f(-1)\\Rightarrow\\frac{f(0)}{f(-1)}>e.$$ <b>B 成立</b>。</p>' },
  { title: '选项 A：$\\dfrac{f(-2)}{f(-1)}>1$',
    cls: 'bad',
    log: 'f 递增直接否掉 A：比值小于 1',
    ribbon: {k:2, ok:false},
    body: '<p>$f^\\prime>0$ 说明 $f$ 严格递增，故 $f(-2)<f(-1)$，比值 $\\dfrac{f(-2)}{f(-1)}<1$，不可能大于 $1$。<b>A 错</b>。</p>' },
  { title: '选项 C：$\\dfrac{f(1)}{f(-1)}<e^2$',
    cls: 'bad',
    log: 'g(1) > g(-1) 给出 f(1)/f(-1) > e²，方向反',
    ribbon: {k:3, ok:false},
    body: '<p>$g(1)>g(-1)$：$$\\frac{f(1)}{e}>\\frac{f(-1)}{e^{-1}}\\Rightarrow f(1)>e^2f(-1)\\Rightarrow\\frac{f(1)}{f(-1)}>e^2.$$ 选项写 $<e^2$，方向恰好相反。<b>C 错</b>。</p>' },
  { title: '选项 D：$\\dfrac{f(2)}{f(-1)}<e^3$',
    cls: 'bad',
    log: 'g(2) > g(-1) 给出 f(2)/f(-1) > e³，方向也反',
    ribbon: {k:4, ok:false},
    body: '<p>$g(2)>g(-1)$：$$\\frac{f(2)}{e^2}>\\frac{f(-1)}{e^{-1}}\\Rightarrow f(2)>e^3f(-1)\\Rightarrow\\frac{f(2)}{f(-1)}>e^3.$$ 选项写 $<e^3$，同样方向反了。<b>D 错</b>。</p>' },
  { title: '结论',
    cls: 'good',
    log: '只有 B 成立，选 B',
    body: '<p>答案 <b>B</b>。记忆锚点：<b>见 $f^\\prime\\pm f$ 就除以 $e^x$</b>——$\\left(\\frac{f}{e^x}\\right)^\\prime$ 的符号由 $f^\\prime-f$ 决定，单调性把抽象条件翻译成两点的比值不等式。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '$f^\\prime(x)>f(x)>0$（$[-2,2]$）：四个比值不等式谁成立',
  subtitle: '考点：辅助函数构造与单调性 · 方法：$g=f/e^x$，$g^\\prime$ 符号由 $f^\\prime-f$ 决定',
  counterLabel: '推理步',
  ribbonTitle: '选项判定（✓ 成立 / ✗ 不成立）',
  intro: '点击「▶ 播放」逐步构造并逐项判定。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B：$\\dfrac{f(0)}{f(-1)}>e$',
    html: '记忆锚点：<b>$g=\\dfrac{f}{e^x}$ 严格增，$g(b)>g(a)\\iff\\dfrac{f(b)}{f(a)}>e^{b-a}$</b>。A 被 $f$ 递增直接否掉（比值 $<1$）；C、D 的不等号方向恰好都写反：真结论是 $\\frac{f(1)}{f(-1)}>e^2$、$\\frac{f(2)}{f(-1)}>e^3$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
