<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2011·19 中值定理证不等式 + 单调有界证收敛</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：两问的分工',
    cls: 'key',
    body: '<p>第 (1) 问的不等式 $\\dfrac{1}{n+1}<\\ln\\left(1+\\dfrac1n\\right)<\\dfrac1n$ 是第 (2) 问的<b>弹药库</b>。观察：$\\ln\\left(1+\\dfrac1n\\right)=\\ln(n+1)-\\ln n$ 正是 $f(x)=\\ln x$ 在区间 $[n,n+1]$ 上的增量——这指向<b>拉格朗日中值定理</b>。第 (2) 问的目标是证收敛，路线是<b>单调有界准则</b>。</p>',
    log: '把对数差看成 ln x 的增量，第(1)问用中值定理，第(2)问用单调有界' },
  { title: '第 (1) 问：中值定理一击',
    cls: 'key',
    body: '<p>$f(x)=\\ln x$ 在 $[n,n+1]$ 上连续、内可导，存在 $\\xi\\in(n,n+1)$ 使 $$\\ln(n+1)-\\ln n=\\frac{1}{\\xi}.$$ 中值定理把「对数差」换成了「一个倒数」，而倒数的范围一目了然。</p>',
    log: '中值定理：对数差 = 1/ξ，ξ 落在 n 与 n+1 之间' },
  { title: '夹逼收网：两半各管一头',
    cls: 'good',
    body: '<p>由 $n<\\xi<n+1$ 得 $\\dfrac{1}{n+1}<\\dfrac{1}{\\xi}<\\dfrac1n$，即 $$\\boxed{\\dfrac{1}{n+1}<\\ln\\left(1+\\dfrac1n\\right)<\\dfrac1n}.$$ <b>左半是下界、右半是上界</b>，第 (2) 问里正好各用一次。</p>',
    log: 'ξ 夹在 n 与 n+1 之间，取倒数即得双侧不等式' },
  { title: '第 (2) 问·单调递减',
    cls: 'good',
    body: '<p>相邻两项相减，用<b>左半</b>不等式：$$a_{n+1}-a_n=\\frac{1}{n+1}-\\big(\\ln(n+1)-\\ln n\\big)=\\frac{1}{n+1}-\\ln\\left(1+\\frac1n\\right)<0,$$ 故 $\\{a_n\\}$ 严格递减。</p>',
    log: '相邻项差 = 1/(n+1) − ln(1+1/n)，由左半不等式知它小于零' },
  { title: '第 (2) 问·有下界 0',
    cls: 'good',
    body: '<p>把<b>右半</b> $\\ln\\left(1+\\dfrac1k\\right)<\\dfrac1k$ 改写为 $\\dfrac1k>\\ln(k+1)-\\ln k$，对 $k=1,\\dots,n$ 累加，右边裂项相消：$$\\sum_{k=1}^n\\frac1k>\\sum_{k=1}^n\\big(\\ln(k+1)-\\ln k\\big)=\\ln(n+1)>\\ln n,$$ 故 $a_n=\\displaystyle\\sum_{k=1}^n\\frac1k-\\ln n>0$。</p>',
    log: '右半不等式累加：调和和压住 ln(n+1)，所以 aₙ 恒正' },
  { title: '结论',
    cls: 'good',
    body: '<p>$\\{a_n\\}$ <b>单调递减</b>且<b>有下界 $0$</b>，由单调有界准则知 $\\{a_n\\}$ <b>收敛</b>。(1)(2) 全部得证。（其极限即欧拉常数，本题只要求证收敛，不必求出。）</p>',
    log: '递减 + 下界 0，单调有界准则收官：数列收敛' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log || s.title,
    count: i + 1,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '证明 $\\dfrac{1}{n+1}<\\ln\\left(1+\\dfrac1n\\right)<\\dfrac1n$ 与 $\\{a_n\\}$ 收敛',
  subtitle: '考点：拉格朗日中值定理 + 单调有界准则 · 两问接力：不等式当弹药',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开证明推理链。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '(1) 不等式成立；(2) $\\{a_n\\}$ 收敛',
    html: '记忆锚点：<b>看到 $\\ln(n+1)-\\ln n$ 就想到 $\\ln x$ 在 $[n,n+1]$ 上的中值定理</b>；(2) 的套路是「单调 + 有界」：单调性用左半不等式，下界用右半不等式累加裂项。只证收敛，不必求极限。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
