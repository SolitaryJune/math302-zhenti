<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·10 和式极限化定积分</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];   // 推导板的持久 DOM 行

var LINES = [
  "<p><b>原式</b>：$$n\\left(\\frac{1}{1+n^{2}}+\\frac{1}{2^{2}+n^{2}}+\\cdots+\\frac{1}{n^{2}+n^{2}}\\right)=n\\sum_{k=1}^{n}\\frac{1}{k^{2}+n^{2}}$$和式极限——目标是把它套装成黎曼和。</p>",
  "<p><b>通项改造</b>：分子分母同除 $n^{2}$，$$\\frac{n}{k^{2}+n^{2}}=\\frac{1}{n}\\cdot\\frac{1}{\\left(\\frac{k}{n}\\right)^{2}+1}.$$</p>",
  "<p><b>认三要素</b>：取样点 $x_k=\\dfrac{k}{n}$，步长 $\\Delta x=\\dfrac{1}{n}$，被积函数 $f(x)=\\dfrac{1}{1+x^{2}}$；$k=1..n$（右端点）对应区间 $[0,1]$。</p>",
  "<p><b>取极限</b>：$$\\lim_{n\\to\\infty}\\sum_{k=1}^{n}\\frac{1}{n}\\,f\\!\\left(\\frac{k}{n}\\right)=\\int_{0}^{1}\\frac{\\mathrm{d}x}{1+x^{2}}.$$</p>",
  "<p><b>算积分</b>：$\\arctan x\\Big|_{0}^{1}=\\dfrac{\\pi}{4}-0=\\dfrac{\\pi}{4}$。</p>",
  "<p><b>数值旁证</b>：$n=10^{5}$ 时和式 $\\approx0.785396\\approx\\dfrac{\\pi}{4}$ ✓</p>",
  "<p><b>结论</b>：原式 $=\\dfrac{\\pi}{4}$。</p>"
];

AW.init({
  title: '和式极限：$n\\displaystyle\\sum_{k=1}^{n}\\frac{1}{k^{2}+n^{2}}$',
  subtitle: '考点：定积分定义（黎曼和） · 方法：凑 1/n·f(k/n) → 认区间 → 化积分',
  counterLabel: '已推演',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',   log:'n 倍的 n 项和，典型"和式极限"，找黎曼和结构', show:1, count:0 },
    { cls:'step',  tag:'改造',   log:'通项分子分母同除 n²，变成 (1/n) × 1/((k/n)²+1)', show:2, count:1 },
    { cls:'ok',    tag:'认要素', log:'取样点 k/n、步长 1/n、f(x)=1/(1+x²)，区间 [0,1]', show:3, count:2 },
    { cls:'ok',    tag:'化积分', log:'n→∞ 时和变积分：∫₀¹ dx/(1+x²)', show:4, count:3 },
    { cls:'ok',    tag:'算积分', log:'原函数 arctan x，代上下限得 π/4', show:5, count:4 },
    { cls:'step',  tag:'旁证',   log:'n 取十万时和式约 0.785396，与 π/4 吻合', show:6, count:5 },
    { cls:'done',  tag:'完成',   log:'结论：极限值 = π/4', show:7, count:6, done:true },
  ],

  result: {
    big: '极限 = π/4',
    html: '记忆锚点：<b>和式极限 = 凑 $\\frac{1}{n}f(k/n)$</b>：把外面的 $n$ 摊成步长 $\\tfrac{1}{n}$，把 $\\frac{1}{k^{2}+n^{2}}$ 提 $n^{2}$ 出来露出 $f(x)=\\frac{1}{1+x^{2}}$，右端点取样对应 $[0,1]$。区间认错（写成 $[0,n]$）是最高频错误。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
