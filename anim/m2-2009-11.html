<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2009·11 高频振荡积分的极限</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];

var LINES = [
  "<p><b>记</b> $I_n=\\displaystyle\\int_0^1\\mathrm e^{-x}\\sin nx\\,\\mathrm dx$：高频振荡积分，先算出显式表达式再取极限。</p>",
  "<p><b>两次分部积分</b>（对 $\\sin nx$ 求导、$\\mathrm e^{-x}$ 积分，循环一轮后解出）：$$\\int \\mathrm e^{-x}\\sin nx\\,\\mathrm dx=\\frac{\\mathrm e^{-x}\\big(-\\sin nx-n\\cos nx\\big)}{1+n^2}+C$$</p>",
  "<p><b>代上下限</b>（$x=0$ 处原函数值为 $-\\dfrac{n}{1+n^2}$）：$$I_n=\\frac{n-\\mathrm e^{-1}\\big(\\sin n+n\\cos n\\big)}{1+n^2}$$</p>",
  "<p><b>阶数估计</b>：$|\\sin n|\\le1$、$|\\cos n|\\le1$，分子 $O(n)$、分母 $O(n^2)$：$$|I_n|\\le\\frac{n+\\mathrm e^{-1}(n+1)}{1+n^2}\\xrightarrow[n\\to\\infty]{}0$$</p>",
  "<p><b>本质</b>：黎曼–勒贝格思想——$\\sin nx$ 高频正负抵消，$n\\to\\infty$ 时积分被振荡抹平为 $0$。</p>",
  "<p><b>结论</b>：$$\\lim_{n\\to\\infty}\\int_0^1\\mathrm e^{-x}\\sin nx\\,\\mathrm dx=0$$</p>"
];

AW.init({
  title: '求 $\\lim_{n\\to\\infty}\\int_0^1\\mathrm e^{-x}\\sin nx\\,\\mathrm dx$',
  subtitle: '考点：分部积分 + 数列极限 · 方法：显式化 → 阶数估计',
  counterLabel: '步数',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'审题',     log:'先分部积分把积分算成 n 的显式表达式，再取极限', show:1, count:0 },
    { cls:'step',  tag:'分部积分', log:'两次分部循环一轮，解出标准公式', show:2, count:1 },
    { cls:'step',  tag:'代上下限', log:'x=0 处的值是 −n/(1+n²)，整理出 I_n', show:3, count:2 },
    { cls:'ok',    tag:'阶数估计', log:'分子 O(n)、分母 O(n²)，夹逼趋于 0', show:4, count:3 },
    { cls:'step',  tag:'本质',     log:'高频振荡正负抵消，黎曼–勒贝格思想', show:5, count:4 },
    { cls:'done',  tag:'完成',     log:'极限为 0，填 0', show:6, count:5, done:true },
  ],

  result: {
    big: '极限 = 0',
    html: '记忆锚点：<b>分子 $O(n)$、分母 $O(n^2)$，极限为 $0$</b>。$\\sin n$、$\\cos n$ 单看没有极限，但被 $n^2$ 压住后整体极限存在；别被「$\pm\\sin n$ 无极限」迷惑。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
