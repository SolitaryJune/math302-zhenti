<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2012·11 复合函数的偏导组合</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
var ROWS = [];   // 推导板的持久 DOM 行

var LINES = [
  "<p><b>设中间变量</b>：$z=f(u)$，$u=\\ln x+\\dfrac{1}{y}$。$f$ 是一元函数，链式系数只有两条：$\\dfrac{\\partial u}{\\partial x}=\\dfrac{1}{x}$ 与 $\\dfrac{\\partial u}{\\partial y}=-\\dfrac{1}{y^{2}}$。</p>",
  "<p><b>对 $x$ 求偏导</b>：$$\\frac{\\partial z}{\\partial x}=f'(u)\\cdot\\frac{1}{x}.$$</p>",
  "<p><b>对 $y$ 求偏导</b>：$$\\frac{\\partial z}{\\partial y}=f'(u)\\cdot\\Big(-\\frac{1}{y^{2}}\\Big).$$</p>",
  "<p><b>代入组合</b>：$$x\\frac{\\partial z}{\\partial x}=f'(u),\\qquad y^{2}\\frac{\\partial z}{\\partial y}=-f'(u).$$组合系数 $x$、$y^{2}$ 恰好是链式系数的倒数。</p>",
  "<p><b>相加</b>：$$f'(u)-f'(u)=0.$$</p>",
  "<p><b>结论</b>：$x\\dfrac{\\partial z}{\\partial x}+y^{2}\\dfrac{\\partial z}{\\partial y}=0$，与 $f$ 的具体形式无关。</p>"
];

AW.init({
  title: '偏导组合：$x\\dfrac{\\partial z}{\\partial x}+y^{2}\\dfrac{\\partial z}{\\partial y}=\\,?$',
  subtitle: '考点：多元复合函数求导（链式法则） · 方法：设 u → 两条链 → 精确抵消',
  counterLabel: '已推演',
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  build: function(stage){
    stage.innerHTML = '';
    ROWS.length = 0;
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    for(var k = 0; k < LINES.length; k++){
      var d = AW.el('div', '', LINES[k]);
      d.style.cssText = 'margin:8px 0;padding:9px 14px;border-left:3px solid #e2e8f0;background:#f8fafc;border-radius:0 12px 12px 0;font-size:14.5px;line-height:1.9;display:none;';
      board.appendChild(d);
      ROWS.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  render: function(stage, sn){
    for(var k = 0; k < ROWS.length; k++){
      var r = ROWS[k];
      if(k >= sn.show){ r.style.display = 'none'; continue; }
      r.style.display = 'block';
      if(k === sn.show - 1 && !sn.done){
        r.style.borderLeftColor = '#d97706';
        r.style.background = '#fffbeb';
      } else {
        r.style.borderLeftColor = '#16a34a';
        r.style.background = '#f8fafc';
      }
    }
    renderMathAfterSnap(stage);
  },

  snaps: [
    { cls:'shift', tag:'设 u',    log:'z = f(u)，u = ln x + 1/y；f 是一元函数，链式系数只有两条', show:1, count:0 },
    { cls:'ok',    tag:'z 对 x',  log:'∂z/∂x = f′(u) × 1/x，链式因子是 1/x', show:2, count:1 },
    { cls:'ok',    tag:'z 对 y',  log:'∂z/∂y = f′(u) × (−1/y²)，注意负号', show:3, count:2 },
    { cls:'step',  tag:'代入',    log:'组合系数 x 与 y² 恰好除掉链式系数：得 f′(u) 与 −f′(u)', show:4, count:3 },
    { cls:'ok',    tag:'抵消',    log:'f′(u) − f′(u) = 0', show:5, count:4 },
    { cls:'done',  tag:'完成',    log:'结论：组合等于 0，与 f 无关', show:6, count:5, done:true },
  ],

  result: {
    big: '结果 = 0',
    html: '记忆锚点：<b>组合系数是链式系数的"消去设计"</b>——$x$ 除掉 $\\tfrac1x$，$y^{2}$ 除掉 $-\\tfrac{1}{y^{2}}$，$f\'(u)$ 精确抵消。两大易错：漏乘 $f\'(u)$、丢掉 $y$ 方向的负号（丢了负号会算成 $2f\'(u)$）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
