<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2019·05 同一区域上三个二重积分的大小</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：区域相同、函数同为 r 的函数 → 保序性',
    cls: 'key',
    body: '<p>三个积分共用区域 $D=\\left\\{|x|+|y|\\le\\frac{\\pi}{2}\\right\\}$，被积函数分别是 $r$、$\\sin r$、$1-\\cos r$（$r=\\sqrt{x^2+y^2}$）。<b>不必算积分值</b>，只需比较三个函数的大小。先定范围：$D$ 是以 $\\left(\\pm\\frac{\\pi}{2},0\\right)$、$\\left(0,\\pm\\frac{\\pi}{2}\\right)$ 为顶点的正方形，区域内 $0\\le r\\le\\frac{\\pi}{2}$。</p>',
    log: '区域把 r 锁在 0 到二分之 π 之间' },
  { title: '第一条不等式：$\\sin r<r$',
    cls: 'step',
    body: '<p>$r>0$ 时 $\\sin r<r$ 是熟知不等式（弧长大于正弦线）。它直接给出 $I_2<I_1$。</p>',
    log: 'sin r 小于 r，得到 I2 < I1' },
  { title: '第二条不等式：$1-\\cos r<\\sin r$',
    cls: 'step',
    body: '<p>令 $g(r)=\\sin r-(1-\\cos r)=\\sin r+\\cos r-1$：$g(0)=g\\left(\\frac{\\pi}{2}\\right)=0$，$g\'(r)=\\cos r-\\sin r$ 在 $\\left(0,\\frac{\\pi}{4}\\right)$ 正、$\\left(\\frac{\\pi}{4},\\frac{\\pi}{2}\\right)$ 负，故 $g$ 先升后降、内部恒正，即 $1-\\cos r<\\sin r$。直观核对：$r$ 很小时 $1-\\cos r\\approx\\frac{r^2}{2}$ 是二阶小量，远小于 $r$。</p>',
    log: '1−cos r 是二阶小量，比 sin r 更小' },
  { title: '函数链排序',
    cls: 'good',
    body: '<p>在 $D$ 上除个别零测度点外恒有 $$1-\\cos r<\\sin r<r.$$</p>',
    log: '三条函数按大小排成一串' },
  { title: '保序性收口：$I_3<I_2<I_1$',
    cls: 'good',
    body: '<p>二重积分保序性：被积函数几乎处处严格小，积分就严格小。故 $$\\iint_D(1-\\cos r)<\\iint_D\\sin r<\\iint_D r,\\quad 即\\ I_3<I_2<I_1.$$</p>',
    log: '保序性给出 I3 < I2 < I1', ribbon: {k:1, ok:true} },
  { title: '逐项排错 B / C / D',
    cls: 'bad',
    body: '<p>B（$I_2<I_1<I_3$）：把 $I_3$ 排到最大，误判了 $1-\\cos r$ 与 $\\sin r$ 的大小。C（$I_1<I_2<I_3$）：整个颠倒，违背 $\\sin r<r$。D（$I_2<I_3<I_1$）：$I_2$ 与 $I_3$ 次序弄反——实际上 $1-\\cos r<\\sin r$。</p>',
    log: 'B 排错 I3、C 全颠倒、D 次序反' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>A</b>（$I_3<I_2<I_1$）。核心：同区域比函数、不积分。</p>',
    log: '选 A：I3 < I2 < I1' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : (s.cls === 'bad' ? 'miss' : 'step'),
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log || s.title,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '比较 $I_1=\\iint_D r$、$I_2=\\iint_D\\sin r$、$I_3=\\iint_D(1-\\cos r)$',
  subtitle: '考点：二重积分保序性 · 方法：同区域只比函数大小，不算积分值',
  counterLabel: '推理步',
  ribbonTitle: '关键结论（✓ 达成）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 A：$I_3<I_2<I_1$',
    html: '记忆锚点：<b>区域 $\\left\\{|x|+|y|\\le\\frac{\\pi}{2}\\right\\}$ 把 $r$ 锁在 $[0,\\frac{\\pi}{2}]$，函数链 $1-\\cos r<\\sin r<r$</b>。$1-\\cos r\\approx\\frac{r^2}{2}$ 是二阶小量，永远是最小的那个；保序性负责把函数大小翻译成积分大小。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
