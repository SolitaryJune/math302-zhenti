<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：变密度细棒的质心（2014 年第 13 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '公式就位',
    body: '<p>$\\rho(x)=-x^{2}+2x+1$，$x\\in[0,1]$。质心公式：</p>' +
          '<p>$$\\bar x=\\frac{\\displaystyle\\int_{0}^{1}x\\,\\rho(x)\\,\\mathrm dx}{\\displaystyle\\int_{0}^{1}\\rho(x)\\,\\mathrm dx}.$$</p>' +
          '<p>分子是<b>质量矩</b>，分母是<b>总质量</b>。</p>' },
  { cls: 'step', title: '算总质量',
    body: '<p>$$M=\\int_{0}^{1}(-x^{2}+2x+1)\\,\\mathrm dx=\\Big[-\\frac{x^{3}}{3}+x^{2}+x\\Big]_{0}^{1}=\\frac{5}{3}.$$</p>' },
  { cls: '', title: '质量矩的被积函数',
    body: '<p>$$x\\,\\rho(x)=-x^{3}+2x^{2}+x.$$</p>' },
  { cls: '', title: '算质量矩',
    body: '<p>$$\\int_{0}^{1}(-x^{3}+2x^{2}+x)\\,\\mathrm dx=\\Big[-\\frac{x^{4}}{4}+\\frac{2x^{3}}{3}+\\frac{x^{2}}{2}\\Big]_{0}^{1}=-\\frac14+\\frac23+\\frac12=\\frac{11}{12}.$$</p>' },
  { cls: 'ok', title: '相除得质心',
    body: '<p>$$\\bar x=\\frac{11/12}{5/3}=\\frac{11}{12}\\cdot\\frac{3}{5}=\\frac{11}{20}=0.55.$$</p>' },
  { cls: 'good', title: '直观校验',
    body: '<p>$\\rho(0)=1$，$\\rho(1)=2$：密度向右递增，质心 $0.55$ 略偏右，合理。答案 $\\bar x=\\dfrac{11}{20}$。</p>' },
];

AW.init({
  title: '【2014 数二·13】细棒质心 $\\bar{x}$',
  subtitle: '考点：定积分应用（质心） · 方法：质量矩 ÷ 总质量',
  counterLabel: '已执行',
  ribbonTitle: '关键节点',
  intro: '点击「▶ 播放」逐步演示计算。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一张卡'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'质心 = 质量矩 ÷ 总质量，两个积分一个比', count:0 },
    { cls:'step',  tag:'总质量', log:'分母积分 = 5/3', count:1, ribbon:{k:1, ok:true} },
    { cls:'step',  tag:'展开', log:'分子被积函数展开成 −x³+2x²+x', count:2 },
    { cls:'ok',    tag:'质量矩', log:'分子积分 = 11/12', count:3, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'相除', log:'(11/12) ÷ (5/3) = 11/20', count:4 },
    { cls:'done',  tag:'完成', log:'质心 0.55 略偏右，与密度递增一致', count:5, ribbon:{k:3, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 x̄ = 11/20',
    html: '记忆锚点：<b>$\\bar x=\\dfrac{\\int x\\rho\\,\\mathrm dx}{\\int\\rho\\,\\mathrm dx}$</b>——分子忘乘 $x$、分式颠倒（得 $\\dfrac{20}{11}$）是两大高频错误。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
