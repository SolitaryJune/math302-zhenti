<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2018·21 递推数列收敛性与极限</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题：隐式递推，走单调有界准则',
    cls: 'key',
    body: '<p>已知 $x_{1}>0$，$x_{n}\\mathrm{e}^{x_{n+1}}=\\mathrm{e}^{x_{n}}-1$。$x_{n+1}$ 被隐式给出：$$\\mathrm{e}^{x_{n+1}}=\\frac{\\mathrm{e}^{x_{n}}-1}{x_{n}}\\qquad(x_{n}\\neq0).$$证明收敛要做两件事：<b>有下界</b>与<b>单调递减</b>。</p>' },
  { title: '工具不等式一：e^t − 1 > t（保正性）',
    cls: '',
    body: '<p>对 $t>0$，$\\mathrm{e}^{t}>1+t$，故 $\\mathrm{e}^{t}-1>t$。</p>' },
  { title: '归纳证 x_n > 0：有下界 0',
    cls: 'good',
    body: '<p>$x_1>0$；设 $x_n>0$，则 $\\mathrm{e}^{x_{n+1}}=\\dfrac{\\mathrm{e}^{x_{n}}-1}{x_{n}}>1$（分子大于 $x_n$），故 $x_{n+1}>0$。归纳成立：$\\{x_n\\}$ 恒正，<b>有下界 $0$</b>。</p>' },
  { title: '工具不等式二：(e^t−1)/t < e^t（保递减）',
    cls: '',
    body: '<p>等价于 $1-\\mathrm{e}^{-t}<t$。令 $\\varphi(t)=t-1+\\mathrm{e}^{-t}$：$\\varphi(0)=0$，$\\varphi\'(t)=1-\\mathrm{e}^{-t}>0\\ (t>0)$，故 $\\varphi(t)>0$。（亦可用拉格朗日中值定理：$\\mathrm{e}^{t}-1=t\\,\\mathrm{e}^{\\xi}<t\\,\\mathrm{e}^{t}$。）</p>' },
  { title: '证 {x_n} 严格递减',
    cls: 'good',
    body: '<p>对 $x_n>0$ 用工具不等式二：$$\\mathrm{e}^{x_{n+1}}=\\frac{\\mathrm{e}^{x_{n}}-1}{x_{n}}<\\mathrm{e}^{x_{n}}\\ \\Longrightarrow\\ x_{n+1}<x_{n}.$$</p>' },
  { title: '单调有界 ⇒ 收敛',
    cls: 'good',
    body: '<p>$\\{x_n\\}$ 递减且有下界 $0$，由单调有界准则收敛；记 $\\lim\\limits_{n\\to\\infty}x_n=L\\ge0$。</p>' },
  { title: '取极限：Le^L = e^L − 1',
    cls: '',
    body: '<p>指数函数连续，递推式两边取极限：$$L\\,\\mathrm{e}^{L}=\\mathrm{e}^{L}-1\\ \\Longleftrightarrow\\ (1-L)\\,\\mathrm{e}^{L}=1.$$</p>' },
  { title: '定根：L = 0',
    cls: 'good',
    body: '<p>令 $h(L)=(1-L)\\mathrm{e}^{L}$：$h(0)=1$，$h\'(L)=-L\\,\\mathrm{e}^{L}<0\\ (L>0)$，$h$ 在 $[0,+\\infty)$ 严格递减，方程在 $L\\ge0$ 内<b>唯一解 $L=0$</b>。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>$\\{x_n\\}$ 收敛，且 $\\displaystyle\\lim_{n\\to\\infty}x_n=0$。证毕。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title.replace(/[:：].*$/, ''),
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    count: i,
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '2018·21　$x_{1}>0$，$x_{n}\\mathrm{e}^{x_{n+1}}=\\mathrm{e}^{x_{n}}-1$：证收敛并求极限',
  subtitle: '考点：递推数列 · 方法：单调有界准则 → 两个工具不等式 → 取极限定根',
  intro: '点击「▶ 播放」或「下一步」，逐步展开证明推理链。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '$\\lim\\limits_{n\\to\\infty}x_{n}=0$',
    html: '记忆锚点：<b>$\\mathrm{e}^{t}-1>t$ 保正、$\\mathrm{e}^{t}-1<t\\,\\mathrm{e}^{t}$ 保减</b>——两个不等式各管一件事，方向不能混。极限方程 $(1-L)\\mathrm{e}^{L}=1$ 用 $h\'(L)=-L\\mathrm{e}^{L}<0$ 说明唯一根 $L=0$。易错：只证一半准则；取极限后不说明根的唯一性。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
