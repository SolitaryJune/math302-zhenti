<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：∞−∞ 型极限通分 + 泰勒比阶</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '求 $\\lim_{x\\to0}\\left(\\dfrac1x-\\dfrac{\\ln(1+x)}{x\\sin x}\\right)$',
  subtitle: '考点：未定式 $\\infty-\\infty$ · 通分 · 泰勒展开比阶',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示通分与比阶。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：两项分别 $\\to\\infty$，是 $\\infty-\\infty$ 型——第一步永远先<b>通分</b>。',
      '<b>通分</b>：$$\\frac1x-\\frac{\\ln(1+x)}{x\\sin x}=\\frac{\\sin x-\\ln(1+x)}{x\\sin x}$$',
      '<b>分母定阶</b>：$x\\sin x\\sim x\\cdot x=x^2$（二阶）$\\Rightarrow$ 分子必须展到 $x^2$（多展一项 $x^3$ 保险）。',
      '<b>分子泰勒</b>：$$\\sin x=x-\\frac{x^3}{6}+o(x^3),\\qquad \\ln(1+x)=x-\\frac{x^2}{2}+\\frac{x^3}{3}+o(x^3)$$',
      '<b>相减</b>：一次项抵消，$$\\sin x-\\ln(1+x)=\\frac{x^2}{2}-\\frac{x^3}{2}+o(x^3)=\\frac{x^2}{2}+o(x^2)$$',
      '<b>比阶</b>：$$\\lim_{x\\to0}\\frac{\\frac{x^2}{2}+o(x^2)}{x\\sin x}=\\lim_{x\\to0}\\frac{\\frac{x^2}{2}}{x^2}=\\frac12$$',
      '<b>结论</b>：原极限 $=\\dfrac12$。',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'两项都趋于无穷：∞−∞ 型，先通分', count:0 },
    { cls:'step',  tag:'通分',   log:'通分成 (sin x − ln(1+x))/(x·sin x)', count:1 },
    { cls:'shift', tag:'定阶',   log:'分母 x·sin x ~ x²，是二阶——分子也要展到 x²', count:2 },
    { cls:'step',  tag:'泰勒',   log:'sin x 与 ln(1+x) 各展到 x³ 保险', count:3 },
    { cls:'ok',    tag:'相减',   log:'一次项抵消，分子主部是 x²/2', count:4 },
    { cls:'ok',    tag:'比阶',   log:'(x²/2) ÷ x² = 1/2', count:5 },
    { cls:'done',  tag:'完成',   log:'结论：极限 = 1/2', count:6, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\lim_{x\\to0}\\left(\\dfrac1x-\\dfrac{\\ln(1+x)}{x\\sin x}\\right)=\\dfrac12$',
    html: '记忆锚点：<b>$\\infty-\\infty$ 先通分；$x\\sin x\\sim x^2$ 定下二阶，分子 $\\sin x-\\ln(1+x)=\\dfrac{x^2}{2}+o(x^2)$</b>。易错：对加减项直接用等价替换会把分子做没，必须用泰勒展开保留主部。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
