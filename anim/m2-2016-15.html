<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2016 数二第 15 题 · 1^∞ 型幂指极限（交互动画）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染；结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发） */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '2016·15　$\\lim_{x\\to0}\\bigl(\\cos 2x+2x\\sin x\\bigr)^{\\frac{1}{x^{4}}}$ 逐步求值',
  subtitle: '考点：$1^{\\infty}$ 型幂指极限 · 方法：<b>取对数 + 泰勒展开到 $x^{4}$</b>',
  counterLabel: '已完成',
  ribbonTitle: '推导进度（✓ 完成）',
  intro: '点击「▶ 播放」或「下一步」，看底数如何在 $x^{4}$ 精度上现出真身。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    inner.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：当前行亮琥珀色，已完成的行变绿'));
    var LINES = [
      '$$L=\\lim_{x\\to0}\\bigl(\\cos 2x+2x\\sin x\\bigr)^{\\frac{1}{x^{4}}}$$',
      '<b>① 定型取对数：</b>底数 $\\to1$、指数 $\\to\\infty$，属 $1^{\\infty}$ 型。$L=\\exp\\Bigl(\\lim_{x\\to0}\\frac{\\ln u(x)}{x^{4}}\\Bigr)$，其中 $u(x)=\\cos 2x+2x\\sin x$',
      '<b>② 展开 $\\cos 2x$ 到 $x^{4}$：</b>$\\cos 2x=1-\\frac{(2x)^{2}}{2}+\\frac{(2x)^{4}}{24}+o(x^{4})=1-2x^{2}+\\frac{2}{3}x^{4}+o(x^{4})$',
      '<b>③ 展开 $2x\\sin x$：</b>$\\sin x=x-\\frac{x^{3}}{6}+o(x^{3})\\ \\Rightarrow\\ 2x\\sin x=2x^{2}-\\frac{1}{3}x^{4}+o(x^{4})$',
      '<b>④ 合并：</b>$x^{2}$ 项恰好相消，$u(x)=1+\\Bigl(\\frac{2}{3}-\\frac{1}{3}\\Bigr)x^{4}+o(x^{4})=1+\\frac{1}{3}x^{4}+o(x^{4})$',
      '<b>⑤ $\\ln(1+t)\\sim t$：</b>$\\lim_{x\\to0}\\frac{\\ln u}{x^{4}}=\\lim_{x\\to0}\\frac{u-1}{x^{4}}=\\lim_{x\\to0}\\frac{\\frac{1}{3}x^{4}+o(x^{4})}{x^{4}}=\\frac{1}{3}$',
      '<b>⑥ 指数还原：</b>$L=e^{\\frac{1}{3}}$'
    ];
    this._rows = [];
    for (var i = 0; i < LINES.length; i++){
      var r = AW.el('div', 'aw-stepcard', LINES[i]);
      inner.appendChild(r);
      this._rows.push(r);
    }
    wrap.appendChild(inner);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题',   log:'识别型：底数趋近一、指数趋于无穷，取对数化成四阶分式再算', count:0, ribbon:{k:1, ok:true} },
    { cls:'ok',    tag:'取对数', log:'幂指极限取自然对数，问题变成对数式除以 x 四次方的极限', count:1, ribbon:{k:2, ok:true} },
    { cls:'ok',    tag:'展余弦', log:'余弦展开必须到 x 四次方：负二 x 平方加三分之二 x 四次方', count:2, ribbon:{k:3, ok:true} },
    { cls:'ok',    tag:'展正弦', log:'正弦先展到三次再乘二 x：二 x 平方减三分之一 x 四次方', count:3, ribbon:{k:4, ok:true} },
    { cls:'shift', tag:'合并',   log:'合并同类项：两个 x 平方项恰好抵消，只剩三分之一个 x 四次方', count:4, ribbon:{k:5, ok:true} },
    { cls:'ok',    tag:'等价',   log:'对数换成底数减一，除以 x 四次方取极限得三分之一', count:5, ribbon:{k:6, ok:true} },
    { cls:'done',  tag:'完成',   log:'还原回指数：原极限等于 e 的三分之一', count:6, ribbon:{k:7, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    var rows = this._rows;
    for (var j = 0; j < rows.length; j++){
      rows[j].className = 'aw-stepcard' + (j < i ? ' good' : (j === i ? ' key' : ''));
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$e^{\\frac{1}{3}}$',
    html: '记忆锚点：<b>指数是 $x^{4}$，展开就必须到 $x^{4}$</b>；$\\cos 2x$ 与 $2x\\sin x$ 的 $x^{2}$ 项恰好相消，底数 $=1+\\frac13x^{4}+o(x^{4})$。易错：只展到 $x^{2}$ 会把极限错算成 $1$。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
