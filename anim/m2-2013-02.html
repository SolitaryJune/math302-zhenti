<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·过程动画：导数定义伪装 + 隐函数求导（2013 年第 2 题）</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

var CARDS = [
  { cls: 'key', title: '审题与定型',
    body: '<p>方程 $\\cos(xy)+\\ln y-x=1$ 确定 $y=f(x)$。求 $\\lim_{n\\to\\infty}n\\big[f\\big(\\tfrac2n\\big)-1\\big]$——这是<b>导数定义的伪装</b>。第一步先定 $f(0)$。</p>' },
  { cls: '', title: '定 f(0)',
    body: '<p>令 $x=0$：$\\cos0+\\ln y-0=1\\Rightarrow\\ln y=0\\Rightarrow y=1$，即</p>' +
          '<p>$$f(0)=1.$$</p>' },
  { cls: 'key', title: '改写成差商',
    body: '<p>令 $x=\\dfrac2n$，则</p>' +
          '<p>$$n\\Big[f\\Big(\\frac2n\\Big)-1\\Big]=2\\cdot\\frac{f(x)-f(0)}{x-0}\\;\\longrightarrow\\;2f\'(0).$$</p>' +
          '<p>步长是 $\\frac2n$，要<b>补乘因子 2</b>。</p>' },
  { cls: '', title: '隐函数求导',
    body: '<p>方程两边对 $x$ 求导（$y=y(x)$）：</p>' +
          '<p>$$-\\sin(xy)\\,(y+xy\')+\\frac{y\'}{y}-1=0.$$</p>' },
  { cls: 'good', title: '代入 x=0, y=1',
    body: '<p>$\\sin0=0$ 使第一项<b>整体消失</b>，只剩 $y\'-1=0$，故</p>' +
          '<p>$$f\'(0)=1.$$</p>' },
  { cls: 'good', title: '合成并对照选项',
    body: '<p>$$\\lim_{n\\to\\infty}n\\Big[f\\Big(\\frac2n\\Big)-1\\Big]=2f\'(0)=2.$$</p>' +
          '<p>四个选项中只有 <b>A</b> 给出 $2$；B 是漏乘 2 的结果，C/D 是符号出错的结果。</p>' },
];

AW.init({
  title: '$\\lim_{n\\to\\infty}n\\big[f\\big(\\tfrac2n\\big)-1\\big]$ 逐步推演',
  subtitle: '考点：隐函数求导 · 方法：导数定义改写 + 特殊点代入消项',
  counterLabel: '步数',
  ribbonTitle: '选项判定（A=1 · B=2 · C=3 · D=4）',
  intro: '点击「▶ 播放」逐步演示推导。',

  build: function(stage){
    stage.innerHTML = '';
    stage.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>：每步点亮一行'));
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    this._cards = [];
    for(var k = 0; k < CARDS.length; k++){
      var d = AW.el('div', 'aw-stepcard ' + (CARDS[k].cls || ''),
        '<h4><span class="n">' + (k + 1) + '</span>' + CARDS[k].title + '</h4>' + CARDS[k].body);
      d.style.display = 'none';
      board.appendChild(d);
      this._cards.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'shift', tag:'审题', log:'数列极限是导数定义的伪装，先定 f(0)' },
    { cls:'step',  tag:'定值', log:'x=0 代入方程，解出 f(0)=1' },
    { cls:'shift', tag:'改写', log:'步长是 2/n，差商补乘因子 2' },
    { cls:'step',  tag:'求导', log:'方程两边对 x 求导，保留含 sin 的项' },
    { cls:'ok',    tag:'代入', log:'x=0、y=1 代入：sin 项消失，导数为 1' },
    { cls:'done',  tag:'完成', log:'原极限 = 2，答案 A', ribbon:{k:1, ok:true}, done:true },
  ],

  render: function(stage, sn, i){
    for(var k = 0; k < this._cards.length; k++){
      this._cards[k].style.display = (k <= i) ? '' : 'none';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '答案 A（极限 = 2）',
    html: '记忆锚点：<b>$n\\big[f\\big(\\tfrac2n\\big)-1\\big]=2f\'(0)$</b>——自变量增量是 $\\frac2n$，差商要乘回 2；隐函数方程在特殊点代入常能整块消项（$\\sin0=0$）。干扰项：B 漏乘 2，C/D 符号翻车。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
