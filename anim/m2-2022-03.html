<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画：点处导数信息与邻域性态</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

var STEPS = [
  { title: '审题眼：「有二阶导数」给出什么',
    cls: 'key',
    log: 'f 在 x₀ 有二阶导 ⟹ f′ 在 x₀ 连续（邻域内存在）',
    body: '<p>「$f$ 在 $x_0$ 有二阶导数」$\\Rightarrow$ $f\'$ 在 $x_0$ 某邻域内存在，且 $f\'$ 在 $x_0$ 处<b>连续</b>。这是「点信息」通向「邻域性态」的唯一桥梁。</p>' },
  { title: 'A 项：邻域单调增 ⟹ f′(x₀)>0',
    cls: 'bad',
    log: 'A：反例 f=x³，邻域单调增但 f′(0)=0，错',
    ribbon: {k:1, ok:false},
    body: '<p>反例 $f(x)=x^3$，$x_0=0$：在全直线单调增加，但 $f\'(0)=0$。邻域单调增只能保证 $f\'(x_0)\\ge0$。<b>A 错</b>。</p>' },
  { title: 'B 项：f′(x₀)>0 ⟹ 邻域单调增',
    cls: 'good',
    log: 'B：f′ 在 x₀ 连续 + 局部保号 ⟹ 邻域内 f′>0，对',
    ribbon: {k:2, ok:true},
    body: '<p>$f\'(x_0)>0$ 且 $f\'$ 在 $x_0$ <b>连续</b>，由局部保号性，存在 $\\delta>0$ 使邻域内 $f\'(x)>0$，故 $f$ 在 $(x_0-\\delta,\\,x_0+\\delta)$ 单调增加。<b>B 对</b>。</p>' },
  { title: 'C 项：邻域凹 ⟹ f″(x₀)>0',
    cls: 'bad',
    log: 'C：反例 f=x⁴，邻域凹但 f″(0)=0，错',
    ribbon: {k:3, ok:false},
    body: '<p>反例 $f(x)=x^4$：$f\'\'(x)=12x^2\\ge0$，在 $0$ 的邻域内是凹函数，但 $f\'\'(0)=0$。邻域凹只能保证 $f\'\'(x_0)\\ge0$。<b>C 错</b>。</p>' },
  { title: 'D 项：f″(x₀)>0 ⟹ 邻域凹',
    cls: 'bad',
    log: 'D：f″(x₀)>0 只是点信息，反例在 0 附近剧烈振荡变号，错',
    ribbon: {k:4, ok:false},
    body: '<p>$f\'\'(x_0)>0$ 不保证 $f\'\'$ 在邻域内存在或为正。反例 $f(x)=x^2\\left(2+\\sin\\dfrac{1}{x}\\right)$（$f(0)=0$）：可算得 $f\'\'(0)=4>0$，但 $f\'\'$ 在 $0$ 附近剧烈变号，任何含 $0$ 的邻域内都不凹。<b>D 错</b>。</p>' },
  { title: '结论：只有 B 成立',
    cls: 'good',
    log: '点 → 邻域靠连续性（B 对），邻域 → 点与凹性方向全被反例否定',
    body: '<p>答案 <b>B</b>。核心逻辑：由点处 $f\'>0$ 推邻域性态，靠的是 $f\'$ 在 $x_0$ 连续；其余三个方向都没有这种连续性支撑。</p>' },
];

var snaps = STEPS.map(function(s, i){
  var cls;
  if(i === STEPS.length - 1){ cls = 'done'; }
  else if(s.ribbon){ cls = s.ribbon.ok ? 'ok' : 'miss'; }
  else { cls = 'step'; }
  return {
    cls: cls,
    tag: '第 ' + (i + 1) + ' 步',
    log: s.log,
    count: i + 1,
    ribbon: s.ribbon,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '一点处的导数信息能否控制邻域性态（单调 / 凹凸）',
  subtitle: '考点：导数与单调性、凹凸性的逻辑方向 · 方法：连续性保号 + 反例',
  counterLabel: '推理步',
  ribbonTitle: '选项判定（✓ 对 / ✗ 错）',
  intro: '点击「▶ 播放」逐步展开推理链。',
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 B',
    html: '记忆锚点：<b>「有二阶导数」⟹ $f\'$ 在 $x_0$ 连续</b>，于是 $f\'(x_0)>0$ 可推邻域增。反向不成立：邻域增只给 $f\'(x_0)\\ge0$（$x^3$）；凹性方向两头都不行（$x^4$ 与振荡反例 $x^2(2+\\sin\\frac1x)$）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
