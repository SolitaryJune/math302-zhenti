<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：隐函数+变限积分求 z_x+z_y</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '隐函数 $z+\\ln z-\\int_y^x \\mathrm e^{-t^2}\\mathrm dt=0$：求 $z_x+z_y$',
  subtitle: '考点：隐函数求偏导 · 变限积分求导 · 方法：两端分别对 $x$、$y$ 求偏导',
  counterLabel: '推导步',
  intro: '点击「▶ 播放」逐步演示两个偏导的完整推导。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题</b>：$z=z(x,\\,y)$ 由方程隐式确定，左边三项都可导 $$z+\\ln z-\\int_y^x \\mathrm e^{-t^2}\\,\\mathrm dt=0$$ 对 $x$、$y$ 各求一次偏导，最后相加。',
      '<b>对 $x$ 求偏导</b>（$y$ 不动）：$\\ln z$ 出链式 $\\dfrac{z_x}{z}$；变上限积分直接出 $\\mathrm e^{-x^2}$ $$z_x+\\frac{1}{z}z_x-\\mathrm e^{-x^2}=0\\ \\Longrightarrow\\ z_x=\\frac{z}{z+1}\\,\\mathrm e^{-x^2}$$',
      '<b>对 $y$ 求偏导</b>（$x$ 不动）：变下限求导自带一层负号，前面整体减号再一层，负负得正 $$\\frac{\\partial}{\\partial y}\\Bigl[-\\int_y^x \\mathrm e^{-t^2}\\mathrm dt\\Bigr]=+\\mathrm e^{-y^2}$$ 于是 $$z_y\\Bigl(1+\\frac1z\\Bigr)=-\\mathrm e^{-y^2}\\ \\Longrightarrow\\ z_y=-\\frac{z}{z+1}\\,\\mathrm e^{-y^2}$$',
      '<b>相加</b>：两项都含公因子 $\\dfrac{z}{z+1}$，括号内一正一负 $$z_x+z_y=\\frac{z}{z+1}\\Bigl(\\mathrm e^{-x^2}-\\mathrm e^{-y^2}\\Bigr)$$',
      '<b>对照选项</b>：A 一正一负相减 ✓；B 把 $z_y$ 的符号取成正号（漏掉变下限的负号）；C、D 整体多乘了 $-1$，符号全反。',
      '<b>结论</b>：$$\\frac{\\partial z}{\\partial x}+\\frac{\\partial z}{\\partial y}=\\frac{z}{z+1}\\Bigl(\\mathrm e^{-x^2}-\\mathrm e^{-y^2}\\Bigr)\\qquad\\Longrightarrow\\qquad \\text{选 A}$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'审题', log:'隐函数方程，左边三项分别对 x、y 求偏导，最后相加', count:0 },
    { cls:'step',  tag:'求 z_x', log:'变上限求导直接得 e^(−x²)，除以公因子 1+1/z', count:1 },
    { cls:'shift', tag:'求 z_y', log:'变下限多一层负号，和整体减号叠成负负得正，z_y 带负号', count:2 },
    { cls:'step',  tag:'相加', log:'提出公因子 z/(z+1)，括号内 e^(−x²) − e^(−y²)', count:3 },
    { cls:'ok',    tag:'辨析', log:'B 错在漏变下限负号，C、D 错在整体多乘 −1', count:4 },
    { cls:'done',  tag:'完成', log:'结论：z_x+z_y = z/(z+1)·(e^(−x²)−e^(−y²))，选 A', count:5, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$z_x+z_y=\\dfrac{z}{z+1}\\bigl(\\mathrm e^{-x^2}-\\mathrm e^{-y^2}\\bigr)$（选 A）',
    html: '记忆锚点：<b>变上限求导 $\\to\\mathrm e^{-x^2}$；变下限求导 $\\to-\\mathrm e^{-y^2}$，外面再挂一个整体负号，负负得正</b>。易错：漏掉变下限那层负号会选 B；整体再反一次号会掉进 C、D。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
