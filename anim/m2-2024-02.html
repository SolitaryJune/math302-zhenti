<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2024·02 参数方程求导 + 导数定义式极限</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_algo_template.html，只改题目专属区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

/* 推导行工具：acc 取 key/ok/bad/blue 决定高亮色；未揭示时隐去 */
var ACC = { key:'#f59e0b', ok:'#22c55e', bad:'#ef4444', blue:'#3b82f6' };
var BGS = { key:'#fffbeb', ok:'#f6fef9', bad:'#fff8f8', blue:'#eff6ff' };
function row(accent, html){
  var d = AW.el('div', '', html);
  d.style.cssText = 'border-left:4px solid #cbd5e1;padding:7px 14px;margin:9px 0;border-radius:10px;'
    + 'opacity:0;transform:translateX(-12px);transition:all .45s ease;font-size:15px;line-height:2;';
  d.dataset.acc = accent;
  return d;
}

// 每行推导内容（html 里可写 $..$ / $$..$$ 公式）
var ROWS = [
  { acc: 'blue', html: '<p><b>目标</b>：$L=\\lim\\limits_{x\\to+\\infty}x\\Big[f\\big(2+\\tfrac2x\\big)-f(2)\\Big]$。增量 $\\tfrac2x\\to0$（$x\\to+\\infty$），指向<b>导数定义</b>的变式。</p>' },
  { acc: 'blue', html: '<p><b>参数方程求导</b>：$x=1+t^3,\\ y=\\mathrm e^{t^2}$，$$\\frac{\\mathrm dy}{\\mathrm dx}=\\frac{2t\\,\\mathrm e^{t^2}}{3t^2}=\\frac{2\\,\\mathrm e^{t^2}}{3t}.$$</p>' },
  { acc: 'ok', html: '<p><b>定参数</b>：$x=2\\Rightarrow1+t^3=2\\Rightarrow t=1$，代入得 $f\'(2)=\\dfrac{2\\,\\mathrm e^{1}}{3\\cdot1}=\\dfrac{2\\mathrm e}{3}$。</p>' },
  { acc: 'key', html: '<p><b>换元凑定义</b>：令 $\\Delta=\\tfrac2x$（$\\Delta\\to0^+$），则 $x=\\tfrac2\\Delta$，$$L=\\frac2\\Delta\\,\\big[f(2+\\Delta)-f(2)\\big]=2\\cdot\\frac{f(2+\\Delta)-f(2)}{\\Delta}.$$</p>' },
  { acc: 'ok', html: '<p><b>取极限</b>：$\\Delta\\to0^+$ 时差商趋于 $f\'(2)$，$$L=2f\'(2)=2\\cdot\\frac{2\\mathrm e}{3}=\\frac{4\\mathrm e}{3}.$$</p>' },
  { acc: 'bad', html: '<p><b>对照选项</b>：$\\dfrac{4\\mathrm e}{3}$ 为 <b>B</b>。C 是漏乘系数 2 的 $f\'(2)$；A 把 $f\'(2)$ 误算成 $\\mathrm e$；D 系数与求导双错。</p>' },
];

AW.init({
  title: '$\\lim\\limits_{x\\to+\\infty}x\\big[f(2+\\frac2x)-f(2)\\big]$ 的逐步求值',
  subtitle: '考点：导数定义 + 参数方程求导 · 方法：换元 $\\Delta=\\frac2x$ 凑差商',
  counterLabel: '计算步',
  intro: '点击「▶ 播放」逐步演示推导。',
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    wrap.appendChild(AW.el('div', 'aw-row-label', '<b>推导板</b>（每步揭示一行，最新一行高亮）'));
    var board = AW.el('div', '');
    this.rows = [];
    ROWS.forEach(function(r){
      var d = row(r.acc, r.html);
      board.appendChild(d);
      this.rows.push(d);
    }, this);
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },
  render: function(stage, sn, i){
    (this.rows || []).forEach(function(d, j){
      var on = j < i;
      d.style.opacity = on ? '1' : '0';
      d.style.transform = on ? 'none' : 'translateX(-12px)';
      d.style.borderLeftColor = on ? (ACC[d.dataset.acc] || ACC.blue) : '#cbd5e1';
      d.style.background = on ? (BGS[d.dataset.acc] || BGS.blue) : '#f8fafc';
    });
    renderMathAfterSnap(stage);
  },
  snaps: [
    { cls: 'step',  tag: '审题', log: '识别型：f(2+2/x)−f(2) 配外因子 x，往导数定义上凑', count: 0 },
    { cls: 'shift', tag: '求导', log: '参数方程求导：dy/dx = 2e^(t²)/(3t)', count: 1 },
    { cls: 'ok',    tag: '代入', log: 'x=2 定出 t=1，f\'(2) = 2e/3', count: 2 },
    { cls: 'shift', tag: '换元', log: '令 Δ=2/x，原式改写成 2 倍差商', count: 3 },
    { cls: 'ok',    tag: '极限', log: '差商趋于 f\'(2)，L = 2 × 2e/3 = 4e/3', count: 4 },
    { cls: 'step',  tag: '对照', log: '4e/3 是选项 B；C 漏乘 2，A 的 f\'(2) 算错', count: 5 },
    { cls: 'done',  tag: '完成', log: '结论：原极限 = 4e/3，选 B', count: 6, done: true },
  ],
  result: {
    big: '答案 B：4e/3',
    html: '记忆锚点：<b>$x\\big[f(2+\\tfrac2x)-f(2)\\big]\\to2f\'(2)$</b>——外因子与增量配对（$x=\\tfrac2\\Delta$ 多出系数 2）。参数求导先解 $1+t^3=2$ 定 $t=1$，得 $f\'(2)=\\dfrac{2\\mathrm e}{3}$。易错：系数 2 别丢（C 的坑）。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
