<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法类动画：差分关系求 ∫₁³ f(x)dx</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '已知 $f(x+2)-f(x)=x$、$\\displaystyle\\int_0^2f=0$，求 $\\displaystyle\\int_1^3f$',
  subtitle: '考点：定积分区间变换 · 方法：拆区间 → 平移换元 → 差分降元 → 拼接',
  counterLabel: '变换步',
  intro: '点击「▶ 播放」逐步演示把未知区间搬回已知区间的过程。',

  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var board = AW.el('div', '');
    var lines = [
      '<b>审题拆区间</b>：所求 $[1,3]$、已知 $[0,2]$，错开一段——$$\\int_1^3f=\\int_1^2f+\\int_2^3f$$ 把 $[2,3]$ 那段「搬」回已知区域',
      '<b>平移换元</b>：令 $x=t+2$（$x:2\\to3$ 对应 $t:0\\to1$）：$$\\int_2^3f(x)\\,\\mathrm dx=\\int_0^1f(t+2)\\,\\mathrm dt$$',
      '<b>差分降元</b>：由 $f(x+2)-f(x)=x$ 知 $f(t+2)=f(t)+t$：$$\\int_0^1f(t+2)\\,\\mathrm dt=\\int_0^1f(t)\\,\\mathrm dt+\\int_0^1t\\,\\mathrm dt=\\int_0^1f(t)\\,\\mathrm dt+\\frac12$$',
      '<b>拼接</b>：$$\\int_1^3f=\\int_1^2f+\\int_0^1f+\\frac12$$ 注意 $\\displaystyle\\int_0^1f+\\int_1^2f=\\int_0^2f=0$',
      '<b>结算</b>：$$\\int_1^3f=\\int_0^2f+\\frac12=\\frac12$$',
    ];
    this._lines = [];
    for(var i=0;i<lines.length;i++){
      var d = AW.el('div', '', lines[i]);
      d.style.cssText = 'padding:9px 14px;margin:7px 0;border-left:3px solid transparent;border-radius:10px;transition:all .35s;opacity:.28;font-size:15px;line-height:1.9;';
      board.appendChild(d);
      this._lines.push(d);
    }
    wrap.appendChild(board);
    stage.appendChild(wrap);
  },

  snaps: [
    { cls:'step',  tag:'拆区间', log:'[1,3] 拆成 [1,2] 和 [2,3]，难点在右边这段', count:0 },
    { cls:'shift', tag:'平移',   log:'令 x = t+2，区间整体左移两格变成 [0,1]', count:1 },
    { cls:'shift', tag:'差分',   log:'用题目给的差分关系，f(t+2) 拆成 f(t) 加 t', count:2 },
    { cls:'ok',    tag:'拼接',   log:'∫₀¹f 与 ∫₁²f 恰好拼成 ∫₀²f，正是已知的 0', count:3 },
    { cls:'done',  tag:'完成',   log:'结论：∫₁³f = 0 + 1/2 = 1/2', count:4, done:true },
  ],

  render: function(stage, sn, i){
    for(var j=0;j<this._lines.length;j++){
      var L = this._lines[j];
      L.style.opacity = j<=i ? '1' : '0.28';
      L.style.borderLeftColor = (j===i) ? '#d97706' : (j<i ? '#16a34a' : 'transparent');
      L.style.background = (j===i) ? '#fef3c7' : 'transparent';
    }
    renderMathAfterSnap(stage);
  },

  result: {
    big: '$\\displaystyle\\int_1^3f(x)\\,\\mathrm dx=\\frac12$',
    html: '记忆锚点：<b>区间错位就「平移换元 + 差分降元」</b>：$f(x+2)=f(x)+x$ 右端是自变量本身，不是常数 2。易错：换元后上下限要同步改；$\\int_0^1f$ 与 $\\int_1^2f$ 能拼成 $\\int_0^2f$ 是本题的点睛之处。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
