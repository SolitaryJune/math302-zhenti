<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学二 2014·19 积分不等式证明</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- 复制自 tools/anim_math_concept_template.html，只改 AW.init 区域 -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼：条件清单与两问',
    cls: 'key',
    body: '<p>条件：<b>$f(x)$ 在 $[a,b]$ 连续且单调增加</b>；<b>$0\\le g(x)\\le1$</b>。要证：(I) $\\int_a^xg$ 被夹在 $0$ 与 $x-a$ 之间；(II) 积分上限取到 $a+\\int_a^bg$ 时不超过 $\\int_a^bfg$。</p>' },
  { title: '(I) 夹逼，一步到位',
    cls: 'good',
    body: '<p>$0\\le g(t)\\le1$ 两边同时在 $[a,x]$ 上积分：$$0\\le\\int_a^xg(t)\\,\\mathrm dt\\le\\int_a^x1\\,\\mathrm dt=x-a.$$ (I) 得证，还顺手给出 $c=\\int_a^bg\\le b-a$。</p>' },
  { title: '(II) 准备：上限合法',
    cls: 'key',
    body: '<p>记 $c=\\int_a^bg(t)\\,\\mathrm dt$。由 (I) 取 $x=b$ 得 $0\\le c\\le b-a$，所以 $a\\le a+c\\le b$：<b>积分上限 $a+c$ 落在 $f$ 的连续区间内</b>，后面才能用 $f(a+c)$。</p>' },
  { title: '作差并在分点处拆分',
    cls: 'step',
    body: '<p>考察差 $$\\Delta=\\int_a^bf(x)g(x)\\,\\mathrm dx-\\int_a^{a+c}f(x)\\,\\mathrm dx,$$ 把第一个积分在 $a+c$ 处拆开：$$\\Delta=-\\int_a^{a+c}f(x)\\bigl[1-g(x)\\bigr]\\,\\mathrm dx+\\int_{a+c}^bf(x)g(x)\\,\\mathrm dx.$$</p>' },
  { title: '左段放缩（函数值小于分点值）',
    cls: 'step',
    body: '<p>$f$ 单调增：在 $[a,a+c]$ 上 $f(x)\\le f(a+c)$，且 $1-g\\ge0$，故 $$\\int_a^{a+c}f\\bigl(1-g\\bigr)\\,\\mathrm dx\\le f(a+c)\\int_a^{a+c}\\bigl(1-g\\bigr)\\,\\mathrm dx.$$ 带负号走：这一段<b>至少</b>贡献 $-f(a+c)\\int_a^{a+c}(1-g)$。</p>' },
  { title: '右段放缩（函数值大于分点值）',
    cls: 'step',
    body: '<p>在 $[a+c,b]$ 上 $f(x)\\ge f(a+c)$ 且 $g\\ge0$：$$\\int_{a+c}^bfg\\,\\mathrm dx\\ge f(a+c)\\int_{a+c}^bg\\,\\mathrm dx.$$ 合并：$$\\Delta\\ge f(a+c)\\left[-\\int_a^{a+c}(1-g)\\,\\mathrm dx+\\int_{a+c}^bg\\,\\mathrm dx\\right].$$</p>' },
  { title: '面积守恒：方括号恒为零',
    cls: 'key',
    body: '<p>由 $c=\\int_a^{a+c}g+\\int_{a+c}^bg$ 得 $$\\int_{a+c}^bg\\,\\mathrm dx=c-\\int_a^{a+c}g\\,\\mathrm dx=\\int_a^{a+c}\\bigl(1-g\\bigr)\\,\\mathrm dx.$$ 方括号 $=0$，故 $\\Delta\\ge f(a+c)\\cdot0=0$。</p>' },
  { title: '收尾：两问全部证毕',
    cls: 'good',
    body: '<p>$\\Delta\\ge0$ 即 $\\int_a^{a+\\int_a^bg}f\\,\\mathrm dx\\le\\int_a^bfg\\,\\mathrm dx$，与 (I) 一起<b>证毕</b>。直观：把左段「欠下」的权重 $1-g$ 搬到右段的 $g$ 上，而 $f$ 在右边更大，总积分不会变小。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '积分不等式：拆分点 + 单调性放缩 + 面积守恒',
  subtitle: '考点：定积分性质与积分不等式证明（2014 年数学二第 19 题）',
  counterLabel: '推理步',
  intro: '点击「▶ 播放」逐步展开两问的证明推理链。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染 */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '(I) $0\\le\\int_a^xg\\,\\mathrm dt\\le x-a$；(II) $\\int_a^{a+c}f\\,\\mathrm dx\\le\\int_a^bfg\\,\\mathrm dx$',
    html: '记忆锚点：<b>分点 $a+c$ 拆开 + 单调增把 $f$ 换成边界值 $f(a+c)$ + 面积守恒式 $\\int_{a+c}^bg=\\int_a^{a+c}(1-g)$ 收尾</b>。易错：不交代上限 $a+c\\in[a,b]$（由 (I) 保证）；左段带负号、右段带正号，放缩方向写反。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
