<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·算法/过程类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css?v=20261115a">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- ============================================================
     模板：数学二 算法 / 过程演示类题目动画（求极限/积分计算/泰勒展开、
     微分方程求解、矩阵运算/对角化、定积分应用（面积/旋转体/弧长）、
     中值定理辅助函数构造、递推数列、二重积分化为累次积分……）
     外壳与控件全部由 assets/anim-engine.js 提供，公式由本地 KaTeX 渲染。
     只改下方 AW.init 区域（含 build/render/snaps/result）。

     路径说明：本模板放在 tools/ 与生成页 anim/{id}.html 同为站点一级目录，
     ../assets/ 在两处都指向站点根的 assets/（可直接预览）。
     勿写成 ../../assets/…——那会逃出站点根导致 404。

     KaTeX 约定：每个 snap 渲染后对 stage 执行一次 renderMathInElement
     （delimiters 含 $ 与 $$，throwOnError:false）——模板已提供
     renderMathAfterSnap(stage)，在你的 render 函数末尾调用它即可；
     自绘持久 DOM 的节点内、snap.html 与 result.html 里都可写 $..$ / $$..$$。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js?v=20261115a"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染（此时本步 stage DOM 已写完）；
     结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发）。
     刻意不用 requestAnimationFrame：后台/隐藏标签页 rAF 可能永不触发 */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */
AW.init({
  title: '【例】$\\lim_{x\\to 0}\\frac{\\sin x}{x}$ 逐步求值演示（写题时替换为真实标题）',
  subtitle: '考点：重要极限 · 方法：等价无穷小 / 泰勒展开',
  counterLabel: '已执行',                       // 计数 chip 文案
  intro: '点击「▶ 播放」逐步演示每一步推导。',

  /* 可选：建立持久 DOM（推荐，可享受 CSS 过渡）。stage 是舞台容器 */
  build: function(stage){
    stage.innerHTML = '';
    var wrap = AW.el('div', 'aw-scroll');
    var inner = AW.el('div', '');
    var row = AW.el('div', 'aw-row-label',
      '<b>推导板</b>（单个美元符对内 = 行内公式；成对双美元符 = 独立公式行）');
    inner.appendChild(row);
    // 示例：舞台内写公式（每个 snap 渲染后由 renderMathAfterSync 自动渲染）
    inner.appendChild(AW.el('div', '',
      '<p>$$\\lim_{x\\to 0}\\frac{\\sin x}{x} = 1$$</p>'));
    // 例如：AW.cellRow(['0','x','sin x',...], ['','','ok']) 摆格子/数列/系数带
    wrap.appendChild(inner);
    stage.appendChild(wrap);
    this._inner = inner;   // 存到 AW.init 对象上供 render 用
  },

  /* 每个 snap 描述一步：cls/tag/log/count/done 见引擎注释 */
  /* 注意：log/status/序号带由引擎直接注入纯文本，公式写在这里不会被渲染——用大白话 */
  snaps: [
    { cls:'shift', tag:'审题', log:'识别型：零比零型未定式，联想重要极限', count:0 },
    { cls:'step',  tag:'变形', log:'等价无穷小：sin x 与 x 等价（x 趋于 0）', count:1 },
    { cls:'ok',    tag:'化简', log:'代入化简：分子分母同除 x，比值为 1', count:2 },
    { cls:'done',  tag:'完成', log:'结论：原极限 = 1', count:3, done:true },
  ],

  /* 每步更新持久 DOM。i=当前步；末尾必须调用 renderMathAfterSnap(stage)，
     它会同步渲染 stage、并兜底渲染结论卡与标题/副标题里的公式 */
  render: function(stage, sn, i){
    var inner = this._inner;
    // 依据 i 重画/高亮推导内容；AW.cellRow / AW.shiftTo / AW.el 可直接用
    renderMathAfterSnap(stage);
  },

  /* 末步弹出的结论卡（html 里同样可写 $..$ / $$..$$，会被渲染） */
  result: {
    big: '极限 = 1',
    html: '核心记忆点：<b>$\\sin x \\sim x$（$x\\to 0$）</b>；易错：不能对加减项随意用等价无穷小。',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
