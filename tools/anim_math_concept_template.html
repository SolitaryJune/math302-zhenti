<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数学·概念/分析类动画模板</title>
<link rel="stylesheet" href="../assets/anim.css">
<link rel="stylesheet" href="../assets/katex/katex.min.css">
</head>
<body>
<!-- ============================================================
     模板：数学二 概念 / 记忆 / 分析推理类题目动画
     （概念辨析、可导/可微/连续关系、极值拐点判定、反常积分敛散、
     特征值性质、二次型正定、纯计算推理链……）
     形态：逐步揭示推理链卡片，每步一张 .aw-stepcard。
     只改下方 AW.init 区域（STEPS 数组与 result）。

     路径说明：本模板放在 tools/ 与生成页 anim/{id}.html 同为站点一级目录，
     ../assets/ 在两处都指向站点根的 assets/（可直接预览）。
     勿写成 ../../assets/…——那会逃出站点根导致 404。

     KaTeX 约定：每个 snap 渲染后对 stage 执行一次 renderMathInElement
     （delimiters 含 $ 与 $$，throwOnError:false）——模板已注入统一 render：
     先按引擎默认行为写入 sn.html，再调用 renderMathAfterSnap(stage)，
     STEPS 的 body 与 result.html 里可直接写 $..$ / $$..$$。
============================================================= -->
<div class="aw"></div>
<script src="../assets/anim-engine.js"></script>
<script src="../assets/katex/katex.min.js"></script>
<script src="../assets/katex/contrib/auto-render.min.js"></script>
<script>
/* ================== KaTeX 逐步渲染（勿改） ================== */
function renderMath(el){
  if(window.renderMathInElement && el){
    renderMathInElement(el, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$',  right: '$',  display: false}
      ],
      throwOnError: false
    });
  }
}
function renderMathAfterSnap(stage){
  /* stage 同步渲染（此时本步 stage DOM 已写完）；
     结论卡/标题/副标题由引擎在 render 返回后才写入或只写一次，
     用 setTimeout(0) 兜底渲染（后台标签页 setTimeout 仍会触发）。
     刻意不用 requestAnimationFrame：后台/隐藏标签页 rAF 可能永不触发 */
  renderMath(stage);
  setTimeout(function(){
    var root = document.querySelector('.aw');
    renderMath(document.getElementById('awResult'));
    renderMath(root.querySelector('h1'));
    renderMath(root.querySelector('.sub'));
  }, 0);
}
/* ================== 题目专属区域（只改这里） ================== */

// 一张推理卡片（body 里可写 $..$ / $$..$$ 公式）
function card(n, cls, title, body){
  return '<div class="aw-stepcard ' + (cls || '') + '"><h4><span class="n">' + n +
         '</span>' + title + '</h4>' + body + '</div>';
}

// 推理链：每一步的完整内容（引擎按步数截取显示）
var STEPS = [
  { title: '审题眼',
    cls: 'key',
    body: '<p>题干关键条件：$f(x)$ 在 $x=0$ 处……。这指向考点：<b>……</b>。</p>' },
  { title: '逐项分析 A',
    cls: 'bad',
    body: '<p>A（$x^2$ 型）：错。理由……，反例……。</p>' },
  { title: '逐项分析 B',
    cls: 'bad',
    body: '<p>B（……）：错。理由……。</p>' },
  { title: '逐项分析 C',
    cls: 'good',
    body: '<p>C（……）：<b>对</b>。因为 $\\lim_{x\\to 0}\\cdots=\\cdots$。</p>' },
  { title: '结论',
    cls: 'good',
    body: '<p>答案选 <b>C</b>。核心记忆点：……。</p>' },
];

var snaps = STEPS.map(function(s, i){
  return {
    cls: i === STEPS.length - 1 ? 'done' : 'step',
    tag: '第 ' + (i + 1) + ' 步',
    log: s.title,
    html: STEPS.slice(0, i + 1).map(function(x, j){
      return card(j + 1, x.cls, x.title, x.body);
    }).join(''),
    done: i === STEPS.length - 1,
  };
});

AW.init({
  title: '【例】概念辨析演示（写题时替换为真实标题）',
  subtitle: '考点：…… · 选项逐项推演',
  intro: '点击「▶ 播放」逐步展开推理链。',
  /* 统一 render：复刻引擎默认的 sn.html 行为，再对舞台做公式渲染
     （renderMathAfterSnap 会同步渲染 stage，并兜底渲染结论卡与标题/副标题） */
  render: function(stage, sn){
    if(sn.html != null) stage.innerHTML = sn.html;
    renderMathAfterSnap(stage);
  },
  snaps: snaps,
  result: {
    big: '答案 C',
    html: '记忆锚点：<b>……</b>。干扰项 A/B 的常见误区是……',
  },
});
/* ================== 题目专属区域结束 ================== */
</script>
</body>
</html>
